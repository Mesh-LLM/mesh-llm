[package]
name = "skippy-analytics"
edition.workspace = true
# `version_state` locks the state directory with `std::fs::File::try_lock`,
# stable since 1.89.
rust-version = "1.89"
license.workspace = true
publish = false
version.workspace = true
description = "Anonymous, opt-out product analytics for Skippy"
repository = "https://github.com/general-inference/skippy"
build = "build.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
skippy-hardware-profile = { path = "../skippy-hardware-profile", version = "0.80.0" }
skippy-native-runtime = { path = "../skippy-native-runtime", version = "0.80.0" }
skippy-runtime = { path = "../skippy-runtime", version = "0.80.0" }
skippy-serving = { path = "../skippy-serving", version = "0.80.0" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
