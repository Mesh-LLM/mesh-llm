[package]
name = "skippy-receipts"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Verifiable inference receipts for Skippy: commitments, openings, and client-side weight-row audits"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[lib]
name = "skippy_receipts"
path = "src/lib.rs"

[features]
# A toy model and an honest turn of it (`toy_turn`), for tests of the crates
# that audit receipts.
test-support = []

[dependencies]
anyhow.workspace = true
base64 = "0.22"
blake3.workspace = true
curve25519-dalek = "5"
ed25519-dalek = "=3.0.0"
half = "2"
hex = "0.4"
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
