[package]
name = "skippy-model-package"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Model package manifest and materialization helpers for mesh-llm"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[build-dependencies]
sha2.workspace = true

[dependencies]
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
base64 = "0.22.1"
clap.workspace = true
anyhow.workspace = true
bytes = "1"
chrono = "0.4"
hf_hub = { package = "skippy-hf-hub", path = "../skippy-hf-hub", version = "0.78.0", default-features = false, features = ["blocking"] }
skippy-model-hf = { path = "../skippy-model-hf", version = "0.78.0"  }
skippy-model-ref = { path = "../skippy-model-ref", version = "0.78.0"  }
skippy-package-format = { path = "../skippy-package-format", version = "0.78.0" }
mesh-llm-events = { path = "../../../mesh/crates/mesh-llm-events", version = "0.78.0" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt", "time", "signal"] }
futures = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1.4.8"

[[bin]]
name = "model-package-mtp-checkpoint"
path = "src/bin/model-package-mtp-checkpoint.rs"

[[bin]]
name = "model-package-generic-jobs"
path = "src/bin/model-package-generic-jobs.rs"
