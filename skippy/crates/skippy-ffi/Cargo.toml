[package]
name = "skippy-ffi"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"
description = "Rust FFI bindings for the Skippy native runtime ABI"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"

[features]
default = ["dynamic-runtime"]
dynamic-runtime = ["dep:libloading"]

[dependencies]
libloading = { version = "0.9", optional = true }

[build-dependencies]
# Bindings generator for the committed `src/bindings/` files. Compilation does
# not require libclang; generation does (see bindgen/README.md and the
# SKIPPY_FFI_BINDGEN modes in build.rs).
bindgen = "0.71"
