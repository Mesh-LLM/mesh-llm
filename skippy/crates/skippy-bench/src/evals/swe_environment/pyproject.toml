[project]
name = "skippy-swe-bench-pro-sdk"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=1.5.0",
  "tqdm>=4.64.0",
  "datasets>=2.14.0",
  "modal>=0.50.0",
  "docker>=6.0.0",
  "huggingface_hub>=0.16.0",
  "PyYAML",
  "sweagent",
  "swe-rex[modal]==1.4.0",
]

[tool.uv]
package = false
build-constraint-dependencies = ["setuptools==84.0.0"]
override-dependencies = ["swe-rex[modal]==1.4.0"]

[tool.uv.sources]
sweagent = { workspace = true }

[tool.uv.workspace]
members = ["source/swe-bench-pro/SWE-agent"]
