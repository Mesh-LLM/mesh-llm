[package]
name = "skippy-receipt-audit"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Audits a Skippy inference receipt against a claimed GGUF: the claimed file, native layer loading, the checks of an opening, and the report"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[lib]
name = "skippy_receipt_audit"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skippy-model-artifact = { path = "../skippy-model-artifact", version = "0.79.0" }
skippy-model-hf = { path = "../skippy-model-hf", version = "0.79.0" }
skippy-model-ref = { path = "../skippy-model-ref", version = "0.79.0" }
skippy-receipts = { path = "../skippy-receipts", version = "0.79.0" }
skippy-runtime = { path = "../skippy-runtime", version = "0.79.0" }

[dev-dependencies]
# The toy model and honest turn the audit's tests run on.
skippy-receipts = { path = "../skippy-receipts", version = "0.79.0", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
