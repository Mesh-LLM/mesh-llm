# Repository-owned Jianyang templates. See README.md beside this file for cutover.
# Source migrated from general-inference/jianyang; unrelated jobs are preserved.
# AgentX replaces the old agentic-replay entry with no compatibility alias.


version: 1

# Getting a release host AND the right backend, which no single recipe gives.
#
# `just build` refuses a release profile outright — "development product profile must
# be debug or dev" — and a decode number from a debug host is wrong by a large factor
# while looking exactly like a real one.
#
# `just release-build` builds release but its runtime step has no backend detection:
#
#     if [[ -z "$selected_backend" ]]; then
#         if [[ "$(uname -s)" == Darwin ]]; then selected_backend=metal
#         else selected_backend=cpu; fi
#     fi
#
# On a GB10 that silently produces a CPU runtime, which serves and reports entirely
# plausible throughput for the wrong backend. The dev path has the full nvcc/rocm/
# vulkan detection; the release path never got it.
#
# So: the two release recipes, with the backend decided here. It cannot be a launch
# input because this template pins no node — the scheduler chooses the machine, so the
# only place that knows what to build for is the machine.
#
# Not `just llama-build`: that builds the CPU stage while cargo links Metal.
build: |
  # KEEP THE MACHINE AWAKE FOR THE BUILD, not just for the command.
  #
  # Every command in this file already starts with `caffeinate -dimsu -w $$`. The build
  # runs BEFORE any of them and takes fifteen to twenty minutes, with nothing holding
  # the machine up — so gis-Mac-mini slept seven minutes into its first successful
  # build and the run died on "no heartbeat for 300s; presumed dead". The agent had
  # stopped reporting because the box was asleep.
  #
  # `$$` is the top-level script's PID even inside this subshell, so one caffeinate
  # here covers the build AND the command that follows. The per-command ones become
  # redundant rather than wrong, and are left alone: they also protect a command run
  # without a build.
  #
  # Darwin only, and tested for, because caffeinate does not exist on Linux and the
  # Spark does not need it.
  if [ "$(uname -s)" = Darwin ] && command -v caffeinate >/dev/null 2>&1; then
    caffeinate -dimsu -w $$ &
    echo "holding this Mac awake for the build (caffeinate pid $!)"
  fi

  # Existence-tested, because `|| true` does NOT save you here and looked like it did.
  #
  # Sourcing a file that does not exist EXITS the shell on macOS's /bin/bash 3.2, which
  # is what `#!/bin/bash` gets you on every Mac in the lab. It is not errexit doing it,
  # so guarding the exit status guards nothing:
  #
  #   $ /bin/bash -c 'set -euo pipefail; . /nope 2>/dev/null || true; echo SURVIVED'
  #   $ echo $?
  #   1                      # SURVIVED never printed
  #
  # Neither mini has ~/.cargo/env — their rustup is Homebrew's, which keeps the
  # toolchain under ~/.rustup and never creates ~/.cargo. So this line killed the build
  # on line 6, before a single echo, leaving a zero-byte log and a retained workspace
  # with nothing in it. Both minis, every run, since this template was written. The
  # Spark has the file, so it never noticed.
  #
  # That is also what killed both members of every split, and it fired long before the
  # nvm assignment and the toolchain check that were fixed earlier for the same
  # symptom.
  if [ -f "$HOME/.cargo/env" ]; then
    . "$HOME/.cargo/env"
  fi

  # Sourcing cargo's env is NOT enough, and that is worth stating because it looks
  # like it should be. The agent appends `~/.cargo/bin` to a job's PATH —
  # deliberately, so adding it can never change which `python3` or `git` a job has
  # been getting — and cargo's env script only prepends the directory when it is
  # absent. It is not absent, so the script does nothing, and a system binary keeps
  # winning.
  #
  # Fine until the system binary is too old. spark-db08 carries `just 1.21` from
  # apt; mesh-llm's Justfile calls `read()`, which arrived in 1.39, so the build died
  # on Justfile line 17 having compiled nothing. Getting past apt needs root, which
  # an unprivileged agent does not have — so `cargo install just` puts a current one
  # in the single directory a job can write to, and this line is what lets the job
  # see it ahead of /usr/bin.
  export PATH="$HOME/.cargo/bin:$PATH"

  # And ask rustup where cargo is, rather than assuming one layout.
  #
  # `$HOME/.cargo/bin` is rustup's own default and is what a rustup.rs install gives
  # you. It is NOT what Homebrew's rustup gives you: that formula links only `rustup`
  # into /opt/homebrew/bin and leaves the cargo shims in the keg, with the toolchain's
  # real binaries under `~/.rustup/toolchains/<name>/bin`. Both minis are set up that
  # way, so `~/.cargo/bin` does not exist on either — and the build concluded there was
  # no Rust at all on machines carrying a working rustc 1.98.0.
  #
  # `rustup which cargo` answers it for any layout, which is better than a second
  # hardcoded path that is right on two machines and wrong on the third.
  if ! command -v cargo >/dev/null 2>&1 && command -v rustup >/dev/null 2>&1; then
    CARGO_BIN="$(rustup which cargo 2>/dev/null || true)"
    if [ -n "$CARGO_BIN" ] && [ -x "$CARGO_BIN" ]; then
      export PATH="$(dirname "$CARGO_BIN"):$PATH"
      echo "cargo found through rustup: $CARGO_BIN"
    fi
  fi

  # mesh-llm's .cargo/config.toml names sccache as the rustc-wrapper unconditionally,
  # so cargo fails outright on a machine that does not have it — the build dies before
  # it compiles anything, and the obvious-looking fix (clearing RUSTC_WRAPPER) also
  # throws away the cache on every machine that DOES have it. Decide per machine.
  #
  # SIZED TO THE MACHINE, because a fixed 8 GiB was the wrong number on both kinds.
  #
  # The cap exists for a real reason: an unbounded cache on a lab box is how the minis
  # ran down to 5.8 GiB free. But 8 GiB is smaller than one build of this repository, so
  # on the Spark the cache sat exactly at its ceiling and evicted continuously — the run
  # of 2026-09-23 reported `Cache hits rate (Rust) 0.00 %` against 243 misses while
  # C/C++ and Assembler both hit 100%. A cache that never hits is disk and latency spent
  # to achieve nothing, and it looked healthy: the summary line said 62% overall,
  # carried entirely by the cheap half.
  #
  # A quarter of what is free, between 8 and 48 GiB. Proportional rather than fixed
  # because the same template runs on a mini with a small SSD and on a DGX, and the
  # number that protects one starves the other.
  #
  # THE FLOOR MUST NOT EXCEED WHAT IS FREE, which it did. `mac` has 4 GiB left and the
  # 8 GiB floor set it a cache ceiling twice the size of its remaining disk:
  #
  #   sccache ceiling 8G (4G free)
  #
  # sccache would have filled that and taken the machine to 100%, which is the failure
  # this cap exists to prevent — the comment above even names it as how the minis got
  # to 5.8 GiB. A floor is the right idea and an unconditional one is not: it protects
  # the machine with room and endangers the one without.
  #
  # So the floor applies only where there is room for it, and the ceiling is never
  # more than half of what is free.
  export SCCACHE_DIR="${SCCACHE_DIR:-$HOME/.cache/sccache}"
  if [ -z "${SCCACHE_CACHE_SIZE:-}" ]; then
    FREE_GB=$(df -Pk "$HOME" 2>/dev/null | awk 'NR==2 {print int($4/1048576)}' || true)
    QUARTER=$(( ${FREE_GB:-0} / 4 ))
    if [ "$QUARTER" -lt 8 ]; then QUARTER=8; fi
    if [ "$QUARTER" -gt 48 ]; then QUARTER=48; fi
    HALF_FREE=$(( ${FREE_GB:-0} / 2 ))
    if [ "$QUARTER" -gt "$HALF_FREE" ]; then QUARTER="$HALF_FREE"; fi
    # Never 0: sccache reads a zero size as no limit, so a machine with nothing left
    # would get an unbounded cache — the opposite of what this block is for.
    if [ "$QUARTER" -lt 1 ]; then QUARTER=1; fi
    export SCCACHE_CACHE_SIZE="${QUARTER}G"
  fi
  echo "sccache ceiling ${SCCACHE_CACHE_SIZE} (${FREE_GB:-?}G free)"

  # Same problem, second toolchain: mesh-llm's host embeds the console UI, so the build
  # shells out to pnpm, and nvm installs under ~/.nvm which JOB_PATH does not carry
  # either. Globbed rather than pinned to a version — a hardcoded path works today and
  # is wrong after the next `nvm install`. Silent when there is no nvm, because a node
  # with system node is not broken.
  # `|| true` is load-bearing and was missing, which killed every build on a node
  # without nvm. The agent wraps the whole script in `set -euo pipefail`; `ls` of a
  # missing directory fails, `pipefail` carries that through the pipeline, and the exit
  # status of `VAR=$(cmd)` is the command substitution's — so this line aborted the
  # build subshell on its own.
  #
  # It cost a silent failure of exactly the shape this file already warns about two
  # comments above. Both minis died in about a second with no output, before even the
  # line that says which backend is being built, because the build had not reached
  # `mkdir -p "$CARGO_TARGET_DIR"` — which is why that directory did not exist on
  # gis-Mac-mini at all.
  #
  # The guard below is safe as written: a failing `[` inside an `&&` list is exempt
  # from errexit. Only the assignment was fatal.
  NODE_BIN=$(ls -d "$HOME"/.nvm/versions/node/*/bin 2>/dev/null | sort -V | tail -1 || true)
  [ -n "$NODE_BIN" ] && export PATH="$NODE_BIN:$PATH"

  # BUILD OUTPUT LIVES OUTSIDE THE WORKSPACE, because the workspace does not survive.
  #
  # The agent materialises each run under `work/<run id>/workspace` and removes it on
  # success — `retain: on_failure` — so `target/` was new on every run and there was
  # never anything to reuse. The ceiling check below, which speaks of keeping it, has
  # been measuring a directory about to be deleted.
  #
  # Pointing cargo at a stable directory is what makes an incremental build possible at
  # all. Per machine rather than per run, which is the only scope where it helps.
  #
  # One consequence worth knowing: cargo locks its target directory, so two mesh-llm
  # builds on one machine now queue instead of running at once. That is a real change
  # and the right trade — they were previously two cold builds competing for the same
  # cores and twice the disk, and waiting for a warm one beats racing a cold one.
  export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$HOME/.cache/mesh-llm-target}"
  mkdir -p "$CARGO_TARGET_DIR"

  # The same trick for llama.cpp, and it is the larger half.
  #
  # `.deps/llama.cpp` and `.deps/llama-build` default to inside the workspace, which the
  # agent deletes after every run — so CMake started from nothing each time and
  # recompiled all 144 CUDA translation units, every run, on every machine.
  #
  # Both move together, and that is not optional: CMake records its source directory in
  # CMakeCache.txt, so a stable build dir with a per-run source dir would reconfigure
  # and rebuild anyway. Moving one without the other buys nothing.
  #
  # Safe to share across runs because `package-native-runtime.sh` runs
  # `prepare-llama.sh` on every build, and prepare compares four stamps before reusing a
  # checkout — upstream sha, patched sha, patch digest and prepare schema — plus a clean
  # worktree. Change the pin or the patch queue and it re-prepares. The script calls the
  # patched checkout "an artifact identity shared across CI jobs"; this is that, per
  # machine.
  #
  # Measured on spark-db08, 2026-09-24, same build block twice:
  #   cold  16m38s, 144 "Building CUDA object"
  #   warm   9m01s,   0                          "llama.cpp already prepared"
  export LLAMA_WORKDIR="${LLAMA_WORKDIR:-$HOME/.cache/mesh-llm-llama-src}"
  export MESH_LLM_LLAMA_BUILD_ROOT="${MESH_LLM_LLAMA_BUILD_ROOT:-$HOME/.cache/mesh-llm-llama-build}"
  mkdir -p "$LLAMA_WORKDIR" "$MESH_LLM_LLAMA_BUILD_ROOT"
  cd ${repo_dir}
  if [ "$(uname -s)" = Darwin ]; then BACKEND=metal
  elif command -v nvcc >/dev/null 2>&1 || command -v nvidia-smi >/dev/null 2>&1; then BACKEND=cuda
  else BACKEND=cpu; fi
  # THE LLAMA.CPP STAGE BUILDS WITHOUT SCCACHE, AND THAT IS DELIBERATE.
  #
  # The claim this block used to make — "sccache gained nvcc support in 0.8, and
  # spark-db08 runs 0.18.0 ... measured on the machine rather than assumed" — was not
  # measured. What had been measured was the sccache summary AFTER a build in which
  # nvcc never went through sccache at all, so it showed no CUDA entries and no CUDA
  # failures, and that absence was read as success.
  #
  # The cost of leaving it off is real and is not in dispute: llama.cpp is hundreds of
  # translation units and every one is recompiled on every run, while the Rust link
  # that follows takes ninety seconds. That is the reason to want this. It is not a
  # reason to believe it works.
  #
  SCV="$(sccache --version 2>/dev/null | awk '{print $2}' || true)"

  # sccache CANNOT wrap nvcc on this fleet. Measured on spark-db08 on 2026-09-24,
  # sccache 0.18.0, CUDA 13, aarch64:
  #
  #   sccache: caused by: Missing "cubin" file output
  #   sccache: Compiler killed by signal 126
  #   gmake[3]: *** [.../ggml-cuda.dir/allreduce.cu.o] Error 254
  #
  # Every .cu fails and the build dies. This killed the daily coder sweep
  # (job_scxh3hk7fy1p9qq).
  #
  # A version check is not protection. 0.18.0 is ten minor
  # versions past the 0.8 that added nvcc support, and it still breaks here. Enabling
  # on the strength of "sccache >= 0.8 supports nvcc" is exactly what broke it — the
  # release notes were believed over the machine.
  #
  # Why this looked safe to change: the gate used to also require $RUSTC_WRAPPER, which
  # nothing in a job sets, so the else branch fired every time and the llama stage never
  # used sccache on any backend. That was accidental, and it was load-bearing. Removing
  # it to "fix" the CUDA cache removed the only thing keeping the build alive.
  #
  # So: off, explicitly, on every backend. mesh-llm defaults the flag to 1
  # (`USE_SCCACHE="${LLAMA_STAGE_USE_SCCACHE:-${SKIPPY_USE_SCCACHE:-1}}"`), so leaving
  # it unset is not the same as turning it off, and unset is what would break CUDA.
  #
  # Re-enabling needs a green build on the target machine first, not a version number.
  # Metal is untested here too and stays off for the same reason: the minis cannot
  # currently build at all, so there is nowhere to prove it.
  export LLAMA_STAGE_USE_SCCACHE=0
  echo "llama stage builds without sccache (nvcc wrapping is broken on this fleet)"
  echo "  sccache ${SCV:-absent} still caches the Rust half through cargo's own wrapper"

  # Named before the toolchain is used, because the failure otherwise arrives from
  # inside `just` as a missing-binary error that reads like a repository problem. A
  # machine that has never been set up for this build should say so in one line.
  MISSING=""
  for tool in cargo just; do
    command -v "$tool" >/dev/null 2>&1 || MISSING="$MISSING $tool"
  done
  if [ -n "$MISSING" ]; then
    echo "this node cannot build mesh-llm: no$MISSING on PATH for $(whoami)" >&2
    echo "PATH=$PATH" >&2
    command -v rustup >/dev/null 2>&1 && \
      echo "rustup is installed; 'rustup which cargo' says: $(rustup which cargo 2>&1)" >&2
    exit 1
  fi

  echo "building release host and $BACKEND runtime"
  just release-host-build
  just release-runtime-build "$BACKEND"

  # The ceiling, now that there is something for it to bound. It used to measure
  # `target/` inside the workspace — a directory the agent removes moments later — so it
  # printed a reassuring line about keeping something that was already doomed. It
  # measures `$CARGO_TARGET_DIR` instead, which is the thing that actually persists.
  #
  # `du -sk`, not `-sg`. `-g` is BSD only, so on Linux this whole line failed — and it
  # failed in the worst possible way: the exit status of `VAR=$(cmd)` is the command's,
  # the executor applies `-e`, and the `2>/dev/null` that was meant to be harmless ate
  # the one message that would have explained it. The job died silently immediately
  # after "packaged native runtime", having built everything successfully.
  TARGET_CEILING_GB="${TARGET_CEILING_GB:-40}"
  TARGET_KB=$(du -sk "$CARGO_TARGET_DIR" 2>/dev/null | cut -f1 || true)
  TARGET_GB=$(( ${TARGET_KB:-0} / 1048576 ))
  if [ "$TARGET_GB" -gt "$TARGET_CEILING_GB" ]; then
    echo "target ${TARGET_GB}G over ${TARGET_CEILING_GB}G ceiling — resetting"
    rm -rf "$CARGO_TARGET_DIR"
    mkdir -p "$CARGO_TARGET_DIR"
  else
    echo "target ${TARGET_GB}G within ${TARGET_CEILING_GB}G ceiling — kept"
  fi

  # The llama build root gets its own ceiling, for the same reason and with the same
  # trade: going over costs one slow build, not a broken one. The source checkout is
  # left alone — it is small, and deleting it only forces a re-patch.
  LLAMA_CEILING_GB="${LLAMA_CEILING_GB:-25}"
  LLAMA_KB=$(du -sk "$MESH_LLM_LLAMA_BUILD_ROOT" 2>/dev/null | cut -f1 || true)
  LLAMA_GB=$(( ${LLAMA_KB:-0} / 1048576 ))
  if [ "$LLAMA_GB" -gt "$LLAMA_CEILING_GB" ]; then
    echo "llama build ${LLAMA_GB}G over ${LLAMA_CEILING_GB}G ceiling — resetting"
    rm -rf "$MESH_LLM_LLAMA_BUILD_ROOT"
    mkdir -p "$MESH_LLM_LLAMA_BUILD_ROOT"
  else
    echo "llama build ${LLAMA_GB}G within ${LLAMA_CEILING_GB}G ceiling — kept"
  fi

  # The whole summary, not a grep for three words. `Cache hits rate (Rust)` is the line
  # that mattered and the old filter dropped it, which is how a cache at 0% on the
  # expensive half went unnoticed behind a 62% headline.
  command -v sccache >/dev/null 2>&1 && sccache -s 2>/dev/null || true

templates:
  # The key stays `decode-10m` although it no longer measures ten minutes of one
  # stream. It is the identity every recorded result is filed under — `jobs.repo_template`
  # — so renaming it would orphan the history rather than relabel it. The name and the
  # description are what people read, and those are accurate again.
  - key: decode-10m
    name: DGX Spark decode throughput (concurrency sweep)
    group: Benchmarks
    description: >
      Output throughput on the DGX Spark (spark-db08, GB10) across a ladder of
      concurrency levels, measured on one server in one run so the levels share a build,
      a machine and a thermal state. Every level is its own arm, so each one has its own
      history and the ladder shows where the Spark saturates. Runs nowhere else.
    #
    # Why ten windows and not one
    # ---------------------------
    # Window standard deviation on this hardware is around 8%, so a single 60-second
    # window resolves a large regression and nothing finer — the pipeline-saturation
    # campaign learned that the expensive way, when 60-second windows credited two
    # changes separately and the real effect was an interaction between them.
    #
    # Ten windows cut that to roughly 2.5%, which makes a 5% move readable, and they
    # expose the shape a single mean hides: a run that decays from 300 to 200 tok/s has
    # the same mean as one that held 250 and is not the same machine.
    #
    # Still not a split measurement, and still not the saturation harness — that runs
    # 55 windows for an hour and is what decides anything.

    # The safe default. The build stage decides the real value once it knows the
    # backend and the sccache version, and exports over this — see "The CUDA half"
    # there. Left at 0 so that a path which somehow skips that decision builds cold
    # rather than building broken.
    env:
      LLAMA_STAGE_USE_SCCACHE: "0"

    target:
      executor: lab
      # Pinned, and the pin is enforced: a launch may narrow `nodes`, never widen it
      # (`nodes_outside_template`). This benchmark's history is the Spark's. Unpinned,
      # it once landed on a Mac mini, and the M1's numbers drew a second set of lines
      # beside the GB10's that read as a collapse. The minis' split campaigns no longer
      # matter here: they cannot hold a machine this never runs on.
      nodes: [spark-db08]

    # Below every campaign, so this can never jump a queued measurement.
    priority: 20

    inputs:
      - key: window_s
        label: Measured seconds per level
        kind: number
        default: 60
        min: 20
        max: 600
        description: >
          How long each concurrency level is measured for, after it has settled. Sixty
          seconds is enough to average away most of the per-window noise at low
          concurrency; a level that saturates needs no longer, because the queue is the
          thing being measured and it is stable.
      - key: settle_s
        label: Settle seconds per level
        kind: number
        default: 20
        min: 0
        max: 300
        description: >
          Discarded before each level is measured. Raising the load does not take effect
          instantly — new lanes have to fill and the queue has to reach its depth — and
          folding that ramp into the number reports a level slower than it is.
      - key: max_tokens
        label: Tokens per request
        kind: number
        default: 128
        min: 16
        max: 2048
        description: >
          Longer requests amortise prefill and read higher. Changes the number, so two
          runs only compare at the same value.
      - key: ctx_size
        label: Context size
        kind: number
        default: 4096
        min: 256
        max: 32768

      # A ladder, swept in one run.
      #
      # One run per level was the earlier shape and it was wrong for the question this
      # answers. Where a machine saturates is a property of the machine, and reading it
      # off eight runs taken on eight different days means eight different thermal
      # states, eight different commits, and no way to tell a knee in the curve from a
      # warm afternoon. Swept together, every level shares one build, one server and one
      # hour.
      #
      # Each level is still its own arm downstream — `concurrency` is part of a metric
      # point's identity — so a 1-lane number and a 128-lane number are never one line.
      # What the sweep gives is the shape across levels; what the arms give is each
      # level's own history over time.
      - key: levels
        label: Concurrency ladder
        kind: text
        default: "1,2,4,8,16,32,64,128"
        description: >
          Comma-separated requests-in-flight. Measured lowest first so a level that
          destabilises the server does not poison the levels below it. Doubling is the
          useful spacing: saturation shows as a knee, and a knee between 64 and 128 is
          invisible if you only ran 1 and 128.

      - key: model
        label: Model
        kind: choice
        default: hf:Qwen/Qwen2.5-0.5B-Instruct-GGUF@main#*q4_k_m*
        choices:
          # The default stays the small instruct model: it is the tripwire, it is what
          # a smoke run wants, and it does not make a first run on a fresh node wait on
          # a 17 GB transfer.
          - value: hf:Qwen/Qwen2.5-0.5B-Instruct-GGUF@main#*q4_k_m*
            label: Qwen2.5 0.5B Instruct (Q4_K_M, 0.5 GB)
          # 17.3 GB. mesh-llm's own catalog carries this one as "agentic coding, tool
          # use", which makes it the coding model a regression here would actually be
          # felt in. MoE, A3B active, so it decodes far faster than its size suggests —
          # but it needs a machine that can hold it, which today means the Spark.
          - value: hf:unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF@main#*Q4_K_M*
            label: Qwen3-Coder 30B-A3B Instruct (Q4_K_M, 17 GB)
        description: >
          Weights are part of a result's identity, so changing this starts a new series
          rather than adding a point to the existing one.

    # The agent resolves the chosen ref to a path on whichever machine it lands on and
    # exports $MODEL — which is the point: the spec carries no path, so it runs anywhere.
    models:
      - ref: ${model}
        env: MODEL

    # 60 s of measurement, but the job also builds mesh-llm first. The budget covers
    # both; the harness below describes only the measured minute.
    budget: { max_usd: 0, max_duration_s: 10800 }

    # PROMPT TOKENS. `tokens.input` was a hardcoded 0 from the moment this harness
    # started streaming — #97 replaced a non-streaming one that read llama.cpp's
    # `timings.prompt_n` off a complete response. A streamed response carries no
    # timings, so the server has to be asked: mesh-llm honours
    # `stream_options.include_usage` (StreamOptions::include_usage in
    # crates/openai-frontend) and answers with a final chunk carrying `usage` and NO
    # choices, so it passes through the token-timing loop without touching it. Summed
    # over the requests that completed inside the window, which is the population every
    # other per-request number is drawn from. Absent rather than zero when the server
    # says nothing — zero reads as "this benchmark sent no prompts", which is precisely
    # what the hardcoded value has been claiming.
    #
    # THROTTLING. Asked of the GPU first. `nvidia-smi` needs no privileges, so a
    # sampler reads SM clock, temperature, power, utilisation and the active clock-event
    # reasons every two seconds, and each level reports their medians, its peak
    # temperature, and the reasons that held for at least a fifth of the level.
    # `throttled` is then the GPU's own answer: HW slowdown, SW or HW thermal slowdown,
    # or HW power brake. A SW power cap is reported but is not throttling — it is where
    # a loaded GPU normally runs. The regression alarm reads this to tell a slower
    # program from a hotter machine.
    #
    # First reading, spark-db08 2026-09-27 (run_fcr8s6rvpvaq2c4, 30B, c=1..64): SM clock
    # 2385-2405 MHz, 50-57 C, no clock-event reason at any level. The "throttled" flags
    # the sweep-1 nightlies carried were the harness's own low last bucket, not heat.
    #
    # Without telemetry (a Mac) the old heuristic stands: a throttled run has a
    # signature that is: it decays. The first three buckets against
    # the last three averages away most of the per-window noise — around 8% sd on this
    # hardware, so ~4.6% across three — and a ten-percent decline is well outside it.
    # Reported, never corrected: a throttled mean blends a fast machine with a hot one
    # and describes neither, so the number stands and the run says so. Omitted rather
    # than guessed when the run is too short to judge.
    #
    # ---------------------------------------------------------------- the command
    #
    # Comments below this point are INSIDE the command string: they are stored in
    # `jobs.spec_json` for every job, shipped to the node, and counted against the 16 KB
    # command cap. The long rationale lives here instead, where it costs nothing at
    # runtime and is still the first thing a maintainer reads.
    #
    # READINESS. Ready means the server has PUBLISHED A MODEL, not that it answers:
    # `/v1/models` returns 200 with an empty `data[]` while nothing is loaded, so a plain
    # curl check passes and every request afterwards 404s. The id it yields is what
    # requests must name — a made-up model name is rejected. This is what mesh-llm's own
    # scripts/ci-smoke-test.sh checks.
    #
    # The timeout is fifteen minutes and was three. Qwen3-Coder-30B at 128 lanes did not
    # publish inside three: the serve log reached "Opening native model 100%" one second
    # before the loop gave up, and the job died with "server published no model" having
    # built everything successfully. The 0.5B publishes in seconds, so the limit only
    # showed up on the model anybody actually cares about. Loading scales with weights
    # AND with lanes, because the KV pool is sized per slot, so a flat number has to
    # cover the worst case. Waiting longer costs nothing when the server is quick — the
    # loop breaks the moment a model appears — and the budget and the reaper bound a
    # genuinely hung one.
    #
    # STREAMING. The harness counts tokens as they arrive rather than from completed
    # responses. Counting completions is exact at one lane and reports ZERO at a hundred:
    # with a deep queue a request outlives the measurement window, so the window holds no
    # completions and the level reads as 0 tok/s. Timestamping each token counts the work
    # done inside the window wherever request boundaries fall — the basis the saturation
    # campaign used, and therefore the one these numbers compare against.
    #
    # Each token goes into the shared list the moment it arrives. Until sweep-2 a
    # request's tokens were added only when it FINISHED, so everything still streaming
    # when a window closed was dropped: every level under-read by about half a response
    # per lane in flight, the last bucket always read low, and that low bucket tripped
    # the decay heuristic into calling healthy levels "throttled". At c=1 on the 30B the
    # last bucket read 55 against 62 — half of one 126-token response missing.
    #
    # SERVING. No `--device`: the platform default is right, and the CI smoke test pins
    # CPU, so copying it would measure the wrong backend. `--parallel` is sized to the
    # top of the ladder — the planner's default of four would measure the queue in front
    # of a four-lane server rather than the engine, flattening the curve at four — and it
    # is a runtime-surface flag, so it belongs BEFORE `serve` or normalisation drops it
    # silently. Context is left at the template's value rather than sized per lane: an
    # explicit large `--ctx-size` beside a high lane count is a known way to make this
    # server never report ready (spark-db08, 2026-09-21).
    #
    # PROVENANCE. mesh-llm publishes a content-addressed id, `local-gguf/sha256-<64 hex>`,
    # which is the digest of the bytes it actually loaded. A result cannot be recorded
    # without `model_package_sha256`, the registry does not hold one, and hashing the file
    # per run costs minutes at 30 GB. The served id is free and is better provenance than
    # either: it describes what was served, not what somebody believes is on disk.
    #
    # THE BINARY. Not simply `target/` any more. The build stage points cargo at a
    # directory outside the workspace so objects survive a run — the workspace does not,
    # the agent removes it on success. A shell export there does not reach this stage, so
    # the same default is spelled out again rather than inherited; the two have to agree,
    # and the assertion is what catches it if they stop. Both places are checked, because
    # a machine that has not yet run the new build still has its binary in the old one,
    # and a template that knew only the new path would refuse a perfectly good tree.
    #
    # LOAD GENERATOR. The Python below carries no comments, because every byte of the
    # command counts against the 16 KB cap. What it does, and why:
    #   * each request gets a distinct prompt — identical prompts share a cacheable
    #     prefix, and a server with prefix caching would answer lane 2 from lane 1's KV;
    #   * greedy (temperature 0, fixed seed), so the token count is not a coin flip;
    #   * levels run lowest first — a level that destabilises the server must not poison
    #     the ones below it — and each settles for `settle_s` before it is measured,
    #     because a new level's lanes take time to fill and the ramp reads slow;
    #   * the result file is rewritten after EVERY level, so a sweep that dies at its top
    #     rung still reports the rest; the progress file is one compact line
    #     (`{"lv": [[c, tok/s], ...]}`, under the agent's 200-character cut) that the
    #     dashboard shows as tentative, with no fingerprint or custody;
    #   * a level that completed nothing inside its window says so in `notes` rather than
    #     reporting empty latency distributions that would read as fast.
    #
    # SUB-WINDOWS. The single-level harness took ten sixty-second windows and reported
    # their standard deviation, which is what decides whether a difference between two
    # runs is a result or noise. A sweep cannot afford ten windows per level and does not
    # need to: each level's window is cut into six buckets and the spread across those
    # answers the same question. Short enough that a level which decays still shows it.
    command: |
      set -euo pipefail
      cd "$JIANYANG_REPO_DIR"

      # Two places, new and old — see "The binary" above the command.
      TARGET_DIR="${CARGO_TARGET_DIR:-$HOME/.cache/mesh-llm-target}"
      BIN=""
      for candidate in "$TARGET_DIR/release/mesh-llm" "target/release/mesh-llm"; do
        [ -x "$candidate" ] && { BIN="$candidate"; break; }
      done
      if [ -z "$BIN" ]; then
        echo "no release host in $TARGET_DIR/release or target/release. built:" >&2
        ls -1 "$TARGET_DIR"/*/mesh-llm target/*/mesh-llm dist/mesh-llm 2>/dev/null >&2 \
          || echo "  (none found)" >&2
        exit 1
      fi
      echo "host: $BIN"

      # Derived from the run id, not fixed: two jobs can land on one machine, and a
      # fixed port makes the second one fail against the first one's server.
      RUN_HASH=$(printf '%s' "$JIANYANG_RUN_ID" | cksum | cut -d' ' -f1 || true)
      PORT=$(( 9400 + ${RUN_HASH:-0} % 500 ))
      LOG="$JIANYANG_ARTIFACT_DIR/mesh-llm-serve.log"

      # A globbed ref usually resolves to one file, but the registry hands back whatever
      # matched — a repository with several Q4_K_M shards gives a directory. Kept as a
      # guard rather than an assumption, and it says which file it picked.
      if [ -d "$MODEL" ]; then
        MODEL="$(find "$MODEL" -name '*.gguf' -type f | sort | head -1)"
        [ -n "$MODEL" ] || { echo "no .gguf under the resolved model path" >&2; exit 1; }
      fi
      echo "model: $MODEL"

      # The host finds its stage runtime through this, not through an install step —
      # `just build` packages it next to the binary.
      # `dist/`, not beside $BIN: the release runtime step packages there while the
      # release host lands in target/release. Explicit because that is what this
      # variable is for.
      export MESH_LLM_NATIVE_RUNTIME_BUNDLE_DIR="$PWD/dist/native-runtimes"
      [ -d "$MESH_LLM_NATIVE_RUNTIME_BUNDLE_DIR" ] || {
        echo "no packaged runtime beside $BIN — did the build stage run?" >&2
        exit 1
      }

      # No --device, `--parallel` before `serve`, ctx left alone — see "Serving".
      LANES=$(printf '%s' "${levels}" | tr ',' '\n' | sort -n | tail -1 || true)
      echo "serving with $LANES lanes for a ladder of ${levels}"
      "$BIN" --log-format json --parallel "$LANES" serve \
        --model "$MODEL" \
        --no-draft \
        --ctx-size "${ctx_size}" \
        --port "$PORT" >"$LOG" 2>&1 &
      SERVER=$!
      # `kill ${VAR:-}` with an empty VAR becomes `kill 0` and signals the job's own
      # process group. Guarded.
      # Dump the server's log on ANY failure, not just a readiness one. After readiness
      # it is the only thing that explains what went wrong, and it is inside the run
      # rather than in an artifact somebody has to go and fetch.
      trap 'rc=$?; [ $rc -ne 0 ] && { echo "--- mesh-llm serve log ---" >&2; tail -120 "$LOG" >&2; }; kill "${SERVER:-0}" 2>/dev/null || true' EXIT

      # Ready means a model is PUBLISHED, not that the server answers — see above.
      # Fifteen minutes, not three — see "Readiness" above the command.
      READY_TIMEOUT_S="${READY_TIMEOUT_S:-900}"
      READY_STARTED=$(date +%s)
      MODEL_ID=""
      while [ $(( $(date +%s) - READY_STARTED )) -lt "$READY_TIMEOUT_S" ]; do
        MODEL_ID=$(curl -sf "http://127.0.0.1:$PORT/v1/models" 2>/dev/null \
          | python3 -c 'import json,sys; d=(json.load(sys.stdin).get("data") or []); print(d[0].get("id","") if d else "")' \
          2>/dev/null || true)
        [ -n "$MODEL_ID" ] && break
        # The server dying is not something to keep waiting out.
        kill -0 "$SERVER" 2>/dev/null || break
        WAITED=$(( $(date +%s) - READY_STARTED ))
        # Said out loud every thirty seconds, and pushed to the progress line the control
        # plane reads. A fifteen-minute silence looks identical to a wedged job, and the
        # whole point of the tentative panel is that it should not.
        if [ $(( WAITED % 30 )) -eq 0 ] && [ "$WAITED" -gt 0 ]; then
          echo "waiting for the model to publish — ${WAITED}s of ${READY_TIMEOUT_S}s"
          [ -n "${JIANYANG_PROGRESS_PATH:-}" ] && \
            printf '{"lv":[],"n":"loading model %ss"}\n' "$WAITED" > "$JIANYANG_PROGRESS_PATH"
        fi
        sleep 1
      done
      READY_TOOK=$(( $(date +%s) - READY_STARTED ))
      [ -n "$MODEL_ID" ] || {
        echo "server published no model after ${READY_TOOK}s" >&2
        tail -120 "$LOG" >&2
        exit 1
      }
      # Recorded because it is the number that decides whether the timeout above is
      # generous or lucky, and nothing else reports it.
      echo "serving model id: $MODEL_ID (ready after ${READY_TOOK}s)"

      # The served id carries the digest of the bytes loaded — see "Provenance".
      MODEL_SHA=$(printf '%s' "$MODEL_ID" | grep -oE '[a-f0-9]{64}' | head -1 || true)
      [ -n "$MODEL_SHA" ] || echo "no sha256 in the served model id; the result will not record" >&2

      PORT="$PORT" MAX_TOKENS="${max_tokens}" STACK_COMMIT="$JIANYANG_COMMIT" \
        MODEL_ID="$MODEL_ID" MODEL_SHA="$MODEL_SHA" \
        LEVELS="${levels}" WINDOW_S="${window_s}" SETTLE_S="${settle_s}" \
        python3 - <<'PY'
      import json, os, shutil, statistics, subprocess, threading, time, urllib.request

      PORT = os.environ["PORT"]
      MAX_TOKENS = int(os.environ["MAX_TOKENS"])
      MODEL_ID = os.environ["MODEL_ID"]
      MODEL_SHA = os.environ.get("MODEL_SHA") or ""
      LEVELS = [int(x) for x in os.environ["LEVELS"].split(",") if x.strip()]
      WINDOW_S = float(os.environ["WINDOW_S"])
      SETTLE_S = float(os.environ["SETTLE_S"])
      URL = f"http://127.0.0.1:{PORT}/v1/chat/completions"
      BASE = "Explain how a distributed key-value cache stays consistent under partition."

      def prompt_for(i):
          return f"[request {i:06d}] {BASE}"

      lock = threading.Lock()
      counter = [0]
      token_times = []
      requests = []
      stop = threading.Event()
      gpu = []
      gpu_stop = threading.Event()
      REASON_BITS = {0x4: "sw_power_cap", 0x8: "hw_slowdown", 0x20: "sw_thermal",
                     0x40: "hw_thermal", 0x80: "hw_power_brake"}
      THROTTLE_BITS = 0x8 | 0x20 | 0x40 | 0x80
      def gpu_sampler():
          fields = ["clocks_event_reasons.active", "clocks_throttle_reasons.active"]
          def num(x):
              try:
                  return float(x)
              except ValueError:
                  return None
          while not gpu_stop.is_set():
              t = time.monotonic()
              for f in list(fields):
                  try:
                      out = subprocess.run(
                          ["nvidia-smi", "--query-gpu=clocks.sm,temperature.gpu,power.draw,"
                           f"utilization.gpu,{f}", "--format=csv,noheader,nounits"],
                          capture_output=True, text=True, timeout=5)
                  except Exception:  # noqa: BLE001
                      return
                  if out.returncode != 0 or not out.stdout.strip():
                      fields.remove(f)
                      continue
                  cols = [c.strip() for c in out.stdout.splitlines()[0].split(",")]
                  try:
                      reasons = int(cols[4], 16)
                  except (ValueError, IndexError):
                      reasons = None
                  with lock:
                      gpu.append((t, num(cols[0]), num(cols[1]), num(cols[2]),
                                  num(cols[3]), reasons))
                  break
              if not fields:
                  return
              gpu_stop.wait(2.0)
      if shutil.which("nvidia-smi"):
          threading.Thread(target=gpu_sampler, daemon=True).start()
      def gpu_summary(w_start, w_end):
          with lock:
              xs = [g for g in gpu if w_start <= g[0] < w_end]
          if len(xs) < 3:
              return None
          out = {}
          for key, i in (("sm_clock_mhz", 1), ("power_w", 3), ("gpu_pct", 4)):
              v = [g[i] for g in xs if g[i] is not None]
              if v:
                  out[key] = round(statistics.median(v), 1)
          temps = [g[2] for g in xs if g[2] is not None]
          if temps:
              out["temp_c"] = max(temps)
          masks = [g[5] for g in xs if g[5] is not None]
          if masks:
              held = {bit for bit in REASON_BITS
                      if sum(1 for m in masks if m & bit) >= max(1, len(masks) / 5)}
              out["throttle_reasons"] = [REASON_BITS[b] for b in sorted(held)]
              out["throttled"] = any(b & THROTTLE_BITS for b in held)
          return out

      def worker():
          """Stream completions back to back until told to stop."""
          while not stop.is_set():
              with lock:
                  i = counter[0]
                  counter[0] += 1
              body = json.dumps({
                  "model": MODEL_ID,
                  "messages": [{"role": "user", "content": prompt_for(i)}],
                  "max_tokens": MAX_TOKENS,
                  "temperature": 0,
                  "seed": 1234,
                  "stream": True,
                  "stream_options": {"include_usage": True},
              }).encode()
              req = urllib.request.Request(URL, body, {"Content-Type": "application/json"})
              started = time.monotonic()
              first = None
              n_tokens = 0
              prompt_n = None
              status = "ok"
              try:
                  with urllib.request.urlopen(req, timeout=1800) as resp:
                      for raw in resp:
                          line = raw.decode("utf-8", "replace").strip()
                          if not line.startswith("data:"):
                              continue
                          data = line[5:].strip()
                          if data == "[DONE]":
                              break
                          try:
                              chunk = json.loads(data)
                          except ValueError:
                              continue
                          usage = chunk.get("usage")
                          if usage and usage.get("prompt_tokens") is not None:
                              prompt_n = int(usage["prompt_tokens"])
                          for choice in chunk.get("choices") or []:
                              delta = choice.get("delta") or {}
                              if delta.get("content") or delta.get("reasoning_content"):
                                  now = time.monotonic()
                                  if first is None:
                                      first = now
                                  n_tokens += 1
                                  with lock:
                                      token_times.append(now)
              except Exception as e:            # noqa: BLE001
                  status = "error"
                  time.sleep(0.5)
              ended = time.monotonic()
              with lock:
                  requests.append({
                      "status": status,
                      "start": started,
                      "end": ended,
                      "ttft_ms": (first - started) * 1000.0 if first else None,
                      "e2e_ms": (ended - started) * 1000.0,
                      "tokens": n_tokens,
                      "prompt_tokens": prompt_n,
                  })

      points = []
      notes = []
      threads = []
      overall_started = time.monotonic()

      def publish():
          with open(os.environ["JIANYANG_RESULT_PATH"], "w") as f:
              json.dump({
                  "points": points,
                  "notes": notes,
                  "provenance": {
                      "stack_commit": os.environ["STACK_COMMIT"],
                      **({"model_package_sha256": MODEL_SHA} if MODEL_SHA else {}),
                  },
              }, f, indent=2)

      progress_path = os.environ.get("JIANYANG_PROGRESS_PATH")

      def progress(done, note=""):
          if not progress_path:
              return
          payload = {"lv": [[p["concurrency"], p["throughput"]["output_tok_s"]] for p in done]}
          if note:
              payload["n"] = note
          line = json.dumps(payload, separators=(",", ":"))
          try:
              with open(progress_path, "w") as f:
                  f.write(line + "\n")
          except OSError:
              pass

      progress([])

      for level in sorted(LEVELS):
          while len(threads) < level:
              t = threading.Thread(target=worker, daemon=True)
              t.start()
              threads.append(t)

          time.sleep(SETTLE_S)
          w_start = time.monotonic()
          time.sleep(WINDOW_S)
          w_end = time.monotonic()

          with lock:
              in_window = [t for t in token_times if w_start <= t < w_end]
              started_in = [r for r in requests if w_start <= r["start"] < w_end]
              done_in = [r for r in requests if w_start <= r["end"] < w_end and r["status"] == "ok"]
              errors = sum(1 for r in requests if w_start <= r["end"] < w_end and r["status"] != "ok")

          def dist(xs):
              if not xs:
                  return None
              xs = sorted(xs)
              def pct(q):
                  if len(xs) == 1:
                      return xs[0]
                  k = (len(xs) - 1) * q / 100.0
                  lo, hi = int(k), min(int(k) + 1, len(xs) - 1)
                  return xs[lo] + (xs[hi] - xs[lo]) * (k - lo)
              return {"mean": round(statistics.fmean(xs), 2),
                      "p": {str(q): round(pct(q), 2) for q in (50, 90, 95, 99)}}

          bucket_s = max(5.0, (w_end - w_start) / 6.0)
          buckets = []
          edge = w_start
          while edge < w_end - 0.5:
              upper = min(edge + bucket_s, w_end)
              n = sum(1 for t in in_window if edge <= t < upper)
              buckets.append(round(n / (upper - edge), 2))
              edge = upper

          prompt_in = [r["prompt_tokens"] for r in done_in if r.get("prompt_tokens")]
          tok_in = sum(prompt_in) if prompt_in else None

          throttled = None
          if len(buckets) >= 6:
              head = sum(buckets[:3]) / 3
              tail = sum(buckets[-3:]) / 3
              throttled = bool(head) and ((head - tail) / head * 100) > 10

          point = {
              "concurrency": level,
              "requests_completed": len(done_in),
              "requests_failed": errors,
              "duration_s": round(w_end - w_start, 3),
              "throughput": {"output_tok_s": round(len(in_window) / (w_end - w_start), 2)},
              "tokens": {"input": tok_in if tok_in is not None else 0,
                         "output": len(in_window)},
              "windows": buckets,
          }
          util = gpu_summary(w_start, w_end) or {}
          if "throttled" not in util and throttled is not None:
              util["throttled"] = throttled
          if util:
              point["utilization"] = util
          ttft = dist([r["ttft_ms"] for r in done_in if r["ttft_ms"] is not None])
          e2e = dist([r["e2e_ms"] for r in done_in])
          if ttft:
              point["ttft_ms"] = ttft
          if e2e:
              point["e2e_ms"] = e2e
          points.append(point)
          print(json.dumps(point), flush=True)
          publish()
          progress(points)

          if not done_in and level > 1:
              notes.append(
                  f"concurrency {level}: no request finished inside the measured window, "
                  f"so its latency figures are absent; the throughput is still exact "
                  f"because tokens are counted as they stream"
              )

      stop.set()
      gpu_stop.set()
      for t in threads:
          t.join(timeout=120)
      elapsed = time.monotonic() - overall_started

      if any(p["requests_failed"] for p in points):
          notes.append(
              f"{sum(p['requests_failed'] for p in points)} request(s) failed across the "
              f"sweep and are excluded from the token counts"
          )
      if len(points) < len(LEVELS):
          done = ", ".join(str(p["concurrency"]) for p in points)
          notes.append(
              f"INCOMPLETE SWEEP: {len(points)} of {len(LEVELS)} levels measured ({done}); "
              f"the rest did not run"
          )

      publish()
      progress(points, note="done")
      print(f"swept {len(points)} levels in {elapsed:.0f}s")
      PY

    # Every field here changes the number, which is why it is stated rather than
    # defaulted: two results compare only when their harness fingerprints match, and the
    # results plane refuses to chart across differing ones.
    # REGRESSION ALARMS. Judged by the control plane after every default-branch run —
    # see `TemplateAlarms` and core/alarms.ts. Each watched series supplies its own
    # noise, so the band is 4 robust sd of the last 7 runs, never under 5%; a run outside
    # it re-runs the same job, and only a second miss is announced. The watch list is the
    # steady part of the ladder: c=1 decode rate and time to first token (repeatable
    # within ~3%, and where a per-request cost like the 2026-09 scheduler reserve shows
    # first), and c=8 and c=32 throughput (batching up to the knee). Not c=64/128: a
    # saturated queue moved +-10% between runs of one commit, so its band is wide enough
    # to hide most of what it would catch, and c=32 sees the same regressions.
    # Backtested against the September series: silent through the healthy week, suspect
    # on d06600e, the night the reserve landed.
    alarms:
      watch:
        - { metric: output_tok_s, concurrency: 1 }
        - { metric: ttft_ms.p50, concurrency: 1 }
        - { metric: output_tok_s, concurrency: 8 }
        - { metric: output_tok_s, concurrency: 32 }
      baseline_runs: 7
      min_baseline_runs: 3
      min_change_pct: 5
      noise_multiplier: 4
      confirm: true

    # WHAT THE REPORT OPENS ON.
    #
    # A report is about ONE configuration: one model, on one machine, at one node count,
    # under one harness. It has to be, because those are the facts that decide whether
    # two numbers may be compared — and an arm no longer carries them, so a page showing
    # two would not draw two sets of lines, it would draw one set averaged across both.
    #
    # This is the Spark's benchmark. `target.nodes` already pins where it RUNS; this
    # pins what the page opens on, which is a different question — results measured on a
    # mini before the pin went in are still recorded, and without this the report would
    # open on whichever of them happened to run last.
    #
    # Matched on the readable name first, so `nvidia-gb10` works and a weights digest
    # nobody can write by hand is not required. A value that has never run is ignored
    # rather than fatal: this is a preference about data that may not exist yet.
    #
    # Deliberately NOT pinning `model`. The ladder runs against both the 0.5B tripwire
    # and the 30B coder, and which of those the report should open on is a question
    # about what the benchmark is FOR that nobody has settled yet — until somebody does,
    # the most recent one is the honest answer and the selector is one click.
    report:
      scope:
        hardware_device: nvidia-gb10

    harness:
      name: custom
      # The version names the window count for readability, not for correctness.
      #
      # It used to be load-bearing: `harnessFingerprint` did not include `duration_s`,
      # so a ten-minute run and a one-minute one shared a fingerprint and the results
      # plane would compare them without complaint. The fingerprint now carries the
      # bounds, so changing the duration separates the series by itself — but a version
      # that says what it measures is still worth reading in a chart legend.
      version: mesh-llm-decode-sweep-2
      trace: { kind: synthetic, ref: single-prompt-explain-kv-cache }
      seed: 1234
      warmup_requests: 1
      concurrency: ["${levels}"]
      duration_s: "${window_s}"

  - key: agentx-llama-smoke
    name: AgentX — llama.cpp smoke
    group: Benchmarks
    priority: 20
    env:
      # The registered Sparks' host HF_HOME, mounted at the same container path.
      HF_HOME: /mnt/lab/huggingface
    models:
      - ref: "${model}"
        delivery: stream
    labels:
      model: "${model}"
      profile: "smoke"
    flags:
      model: "${model}"
      profile: "smoke"
      engine: llama
      context_policy: engine_default
      generation_slots_policy: matches_concurrency
      batch_tokens: 2048
      microbatch_tokens: 512
      speculation: false
    description: >
      ARM64 GPU container with pinned AgentX 1.0.7 and the published 256k Weka traces. Both engine templates use
      identical pinned GGUF weights and automatic context. Skippy plans parallelism; llama slots match offered sessions. Smoke uses
      at least four traces, increasing to match concurrency, and 60 measured seconds per cell. Both profiles sweep
