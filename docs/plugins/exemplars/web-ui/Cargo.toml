[package]
name = "web-ui-exemplar"
version = "0.1.0"
edition = "2024"
publish = false

# serde_json is used in manifest.rs, which src/main.rs includes via
# `#[path = "../manifest.rs"]`; cargo-machete does not follow that include.
[package.metadata.cargo-machete]
ignored = ["serde_json"]

[dependencies]
anyhow = "1"
mesh-llm-plugin = { path = "../../../../crates/mesh-llm-plugin" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
