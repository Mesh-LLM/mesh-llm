<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">PR 1478 fixed and adaptive Mesh throughput versus raw llama.cpp on Thoughtworks agent traces</title>
<desc id="desc">Two panels plot throughput normalized to raw llama.cpp across offered concurrency one through 256. Fixed Mesh wins 17 of 18 correctness-valid cells. Dense wins all nine, while DeepSeek MoE loses only concurrency one. Falcon H1 is excluded because its continuation parity gate failed.</desc>
<metadata>Source: artifact-full-cuda-c1-final/summary/thoughtworks.csv; benchmarked runtime source 7f8c6ab187c0ddc0ac06425d61012e0b09152436; PR evidence commit ac4beae4ccb140ba6cd639fb55d0abd9fc362372.</metadata>
