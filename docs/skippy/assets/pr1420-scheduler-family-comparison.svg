<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Old to new scheduler comparison across seven architecture and strategy workloads</title>
<desc id="desc">Two line charts compare new scheduler throughput and end-to-end p99 latency as ratios to the old scheduler across concurrency one to sixty-four. Six generation families improve broadly; the native MTP lifecycle fixture is exact but shows control-path overhead.</desc>
