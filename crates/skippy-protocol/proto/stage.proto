syntax = "proto3";

package skippy.stage.v1;

// Skippy owns these stage-control, artifact-transfer, and activation frames.
// Control and artifact streams are carried inside the mesh STREAM_SUBPROTOCOL
// envelope for skippy-stage/2. Activation transport remains on the
// skippy-stage/2 QUIC ALPN.

message StageControlRequest {
  uint32 gen = 1;
  bytes requester_id = 2;
  oneof command {
    LoadStage load_stage = 3;
    StopStage stop_stage = 4;
    GetStageStatus get_stage_status = 5;
    GetLayerInventory get_layer_inventory = 6;
    ClaimCoordinator claim_coordinator = 7;
    LoadStage load_local_stage = 8;
  }
}

message StageControlResponse {
  uint32 gen = 1;
  oneof response {
    StageReady stage_ready = 2;
    LayerInventory layer_inventory = 3;
    StageStatusList stage_statuses = 4;
    CoordinatorClaimAccepted coordinator_claim_accepted = 5;
  }
}

message StageArtifactTransferRequest {
  uint32 gen = 1;
  bytes requester_id = 2;
  string topology_id = 3;
  string run_id = 4;
  string stage_id = 5;
  string package_ref = 6;
  string manifest_sha256 = 7;
  string relative_path = 8;
  uint64 offset = 9;
  optional uint64 expected_size = 10;
  optional string expected_sha256 = 11;
}

message StageArtifactTransferResponse {
  uint32 gen = 1;
  bool accepted = 2;
  uint64 total_size = 3;
  optional string sha256 = 4;
  optional string error = 5;
}

message LoadStage {
  string topology_id = 1;
  string run_id = 2;
  string model_id = 3;
  string backend = 4;
  string package_ref = 5;
  string manifest_sha256 = 6;
  string stage_id = 7;
  uint32 stage_index = 8;
  uint32 layer_start = 9;
  uint32 layer_end = 10;
  optional string model_path = 11;
  optional StageDevice selected_device = 12;
  string bind_addr = 13;
  uint32 ctx_size = 14;
  int32 n_gpu_layers = 15;
  string cache_type_k = 16;
  string cache_type_v = 17;
  uint64 shutdown_generation = 18;
  StageLoadMode load_mode = 19;
  optional StagePeer upstream = 20;
  optional StagePeer downstream = 21;
  optional string projector_path = 22;
  uint32 lane_count = 23;
  optional uint32 n_batch = 24;
  optional uint32 n_ubatch = 25;
  StageFlashAttnType flash_attn_type = 26;
  optional uint64 source_model_bytes = 27;
  uint64 coordinator_term = 28;
  optional string coordinator_id = 29;
  uint64 lease_until_unix_ms = 30;
  optional bool native_mtp_enabled = 31;
  optional bool mmap = 32;
  optional bool mlock = 33;
  optional bool projector_use_gpu = 34;
  optional string media_marker = 35;
  optional uint32 image_min_tokens = 36;
  optional uint32 image_max_tokens = 37;
  optional uint32 batch_max_tokens = 38;
  StageGlmDsaPolicy glm_dsa_policy = 39;
  optional uint32 generation_signal_window = 40;
  optional StageLoadRuntimeSettings runtime_settings = 41;
  bool continuous_batching = 42;
  optional string source_model_sha256 = 43;
  SourceResolutionPolicy source_resolution_policy = 44;
  optional string runtime_profile = 45;
  StageAdmissionDescriptor admission = 46;
  string participant_set_hash = 47;
  string topology_hash = 48;
  StageActivationCodec activation_codec = 49;
  StageActivationCodecPolicy activation_codec_policy = 50;
  repeated StageTopologyStage topology_stages = 51;
}

message StageTopologyStage {
  string stage_id = 1;
  uint32 stage_index = 2;
  bytes node_id = 3;
  uint32 layer_start = 4;
  uint32 layer_end = 5;
  string bind_addr = 6;
}

message StageLoadRuntimeSettings {
  optional bool repack = 1;
  optional bool op_offload = 2;
  optional bool no_host_buffer = 3;
  optional bool check_tensors = 4;
  optional bool direct_io = 5;
  optional uint32 main_gpu = 6;
  optional int32 split_mode = 7;
  optional bool kv_offload = 8;
  optional bool kv_unified = 9;
  optional bool swa_full = 10;
  optional uint32 cache_idle_slots = 11;
  StageActivationCodecPolicy activation_codec_policy = 12;
}

message StopStage {
  string topology_id = 1;
  string run_id = 2;
  string stage_id = 3;
  uint64 shutdown_generation = 4;
  uint64 coordinator_term = 5;
}

message GetStageStatus {
  optional string topology_id = 1;
  optional string run_id = 2;
  optional string stage_id = 3;
}

message GetLayerInventory {
  string model_id = 1;
  string package_ref = 2;
  string manifest_sha256 = 3;
  optional string expected_source_model_sha256 = 4;
  SourceResolutionPolicy source_resolution_policy = 5;
  optional string runtime_profile = 6;
}

message ClaimCoordinator {
  string model_id = 1;
  string package_ref = 2;
  string manifest_sha256 = 3;
  string topology_id = 4;
  string run_id = 5;
  string coordinator_id = 6;
  uint64 coordinator_term = 7;
  string participant_set_hash = 8;
  string topology_hash = 9;
  uint64 lease_until_unix_ms = 10;
}

message StageReady {
  bool accepted = 1;
  StageStatus status = 2;
  optional string error = 3;
}

message CoordinatorClaimAccepted {
  bool accepted = 1;
  ClaimCoordinator claim = 2;
  optional string error = 3;
}

message ActivationBoundaryDescriptor {
  uint32 version = 1;
  uint32 ggml_type = 2;
  uint32 layout = 3;
  uint64 elements_per_token = 4;
  uint64 bytes_per_token = 5;
  uint64 required_frame_flags = 6;
  uint64 required_sidebands = 7;
}

message StageAdmissionIdle {}

message StageAdmissionAdmitted {
  StageAdmissionDescriptor descriptor = 1;
}

message StageStatus {
  string topology_id = 1;
  string run_id = 2;
  string model_id = 3;
  string backend = 4;
  string stage_id = 5;
  uint32 stage_index = 6;
  uint32 layer_start = 7;
  uint32 layer_end = 8;
  StageRuntimeState state = 9;
  string bind_addr = 10;
  optional string error = 11;
  uint64 shutdown_generation = 12;
  optional StageDevice selected_device = 13;
  uint32 ctx_size = 14;
  optional string package_ref = 15;
  optional string manifest_sha256 = 16;
  optional string source_model_path = 17;
  optional string source_model_sha256 = 18;
  optional uint64 source_model_bytes = 19;
  optional string materialized_path = 20;
  optional bool materialized_pinned = 21;
  optional string projector_path = 22;
  uint32 lane_count = 23;
  optional uint32 n_batch = 24;
  optional uint32 n_ubatch = 25;
  StageFlashAttnType flash_attn_type = 26;
  uint64 coordinator_term = 27;
  optional string coordinator_id = 28;
  uint64 lease_until_unix_ms = 29;
  optional ActivationBoundaryDescriptor input_activation_boundary = 30;
  optional ActivationBoundaryDescriptor output_activation_boundary = 31;
  StageActivationCodec activation_codec = 32;
  StageActivationCodecPolicy activation_codec_policy = 33;
  oneof admission_state {
    StageAdmissionIdle idle = 34;
    StageAdmissionAdmitted admitted = 35;
  }
}

message StageStatusList {
  repeated StageStatus statuses = 1;
}

message LayerInventory {
  string model_id = 1;
  string package_ref = 2;
  string manifest_sha256 = 3;
  uint32 layer_count = 4;
  repeated LayerRange ready_ranges = 5;
  repeated LayerRange available_ranges = 6;
  repeated LayerRange missing_ranges = 7;
  optional string source_model_path = 8;
  optional uint64 source_model_bytes = 9;
  SourceModelKind source_model_kind = 10;
  optional string source_model_sha256 = 11;
  optional bool content_addressed_local_source = 12;
}

enum SourceResolutionPolicy {
  SOURCE_RESOLUTION_POLICY_UNSPECIFIED = 0;
  SOURCE_RESOLUTION_POLICY_FALLBACK = 1;
  SOURCE_RESOLUTION_POLICY_LOCAL_REQUIRED = 2;
}

message LayerRange {
  uint32 layer_start = 1;
  uint32 layer_end = 2;
}

enum StageActivationCodec {
  STAGE_ACTIVATION_CODEC_UNSPECIFIED = 0;
  STAGE_ACTIVATION_CODEC_RAW_F32_V1 = 1;
  STAGE_ACTIVATION_CODEC_F16_RNE_V1 = 2;
  STAGE_ACTIVATION_CODEC_BF16_RNE_V1 = 3;
  STAGE_ACTIVATION_CODEC_S8_ROW_F32_RNE_V1 = 4;
}

enum StageActivationCodecPolicy {
  STAGE_ACTIVATION_CODEC_POLICY_UNSPECIFIED = 0;
  STAGE_ACTIVATION_CODEC_POLICY_FIXED_V1 = 1;
  STAGE_ACTIVATION_CODEC_POLICY_AUTO_LOSSLESS_V1 = 2;
}

message StageAdmissionDescriptor {
  uint32 version = 1;
  string package_id = 2;
  string plan_id = 3;
  uint32 layer_start = 4;
  uint32 layer_end = 5;
  repeated string resident_tensor_ids = 6;
  repeated StageAdmissionSidecar sidecars = 7;
  repeated StageAdmissionProfile profiles = 8;
}

message StageAdmissionSidecar {
  StageAdmissionSidecarKind kind = 1;
  string artifact_id = 2;
  optional string name = 3;
}

enum StageAdmissionSidecarKind {
  STAGE_ADMISSION_SIDECAR_KIND_UNSPECIFIED = 0;
  STAGE_ADMISSION_SIDECAR_KIND_MMPROJ = 1;
}

message StageAdmissionProfile {
  string profile_id = 1;
  string graph_identity = 2;
  string profile_identity = 3;
  string slice_identity = 4;
  string source_snapshot_identity = 5;
  string graph_configuration_id = 6;
  string backend_id = 7;
}

enum SourceModelKind {
  SOURCE_MODEL_KIND_UNSPECIFIED = 0;
  SOURCE_MODEL_KIND_LAYER_PACKAGE = 1;
  SOURCE_MODEL_KIND_PLAIN_GGUF = 2;
  SOURCE_MODEL_KIND_SPLIT_GGUF = 3;
}

enum StageFlashAttnType {
  STAGE_FLASH_ATTN_TYPE_UNSPECIFIED = 0;
  STAGE_FLASH_ATTN_TYPE_AUTO = 1;
  STAGE_FLASH_ATTN_TYPE_DISABLED = 2;
  STAGE_FLASH_ATTN_TYPE_ENABLED = 3;
}

enum StageGlmDsaPolicy {
  STAGE_GLM_DSA_POLICY_AUTO = 0;
  STAGE_GLM_DSA_POLICY_V1 = 1;
}

message StagePeer {
  string stage_id = 1;
  uint32 stage_index = 2;
  string endpoint = 3;
  optional bytes node_id = 4;
}

message StageDevice {
  string backend_device = 1;
  optional string stable_id = 2;
  optional uint64 index = 3;
  optional uint64 vram_bytes = 4;
}

message StageTransportOpen {
  uint32 gen = 1;
  bytes requester_id = 2;
  string topology_id = 3;
  string run_id = 4;
  string stage_id = 5;
}

enum StageLoadMode {
  STAGE_LOAD_MODE_UNSPECIFIED = 0;
  STAGE_LOAD_MODE_RUNTIME_SLICE = 1;
  STAGE_LOAD_MODE_LAYER_PACKAGE = 2;
  STAGE_LOAD_MODE_ARTIFACT_SLICE = 3;
}

enum StageRuntimeState {
  STAGE_RUNTIME_STATE_UNSPECIFIED = 0;
  STAGE_RUNTIME_STATE_STARTING = 1;
  STAGE_RUNTIME_STATE_READY = 2;
  STAGE_RUNTIME_STATE_STOPPING = 3;
  STAGE_RUNTIME_STATE_STOPPED = 4;
  STAGE_RUNTIME_STATE_FAILED = 5;
}
