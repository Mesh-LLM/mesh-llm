[package]
name = "mesh-wallet-lexe"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Lexe Lightning wallet plugin for mesh-llm (wallet.v1), served as a built-in `mesh-llm --plugin wallet-lexe` process"
repository = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
fs2 = "0.4"
lexe = { version = "=0.1.24", features = ["unstable"] }
lexe-api-core = { version = "=0.1.24" }
mesh-llm-plugin = { path = "../mesh-llm-plugin", version = "0.76.1" }
mesh-llm-wallet = { path = "../mesh-llm-wallet", version = "0.76.1", features = ["plugin-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
