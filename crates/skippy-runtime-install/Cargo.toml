[package]
name = "skippy-runtime-install"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Skippy native runtime discovery, download, installation, and cache management"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
dirs = "6.0.0"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
skippy-hardware-profile = { path = "../skippy-hardware-profile", version = "0.76.1" }
skippy-native-runtime = { path = "../skippy-native-runtime", version = "0.76.1" }
reqwest = { version = "0.13", features = ["stream", "json"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skippy-ffi = { path = "../skippy-ffi", version = "0.76.1", default-features = false }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
tracing = "0.1"
