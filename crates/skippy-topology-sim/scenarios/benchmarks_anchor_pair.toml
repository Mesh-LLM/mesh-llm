# Calibration anchor from docs/BENCHMARKS.md: GLM-4.7-Flash-Q4_K_M (17 GB)
# on an M4 Max (68 tok/s solo) + Mac mini M4 over Wi-Fi.
# Measured anchors: solo 68, 2-way split (85/15) 21, 3-way split (62/31/8)
# 12-13 tok/s. BENCHMARKS.md calls these "a quick reality check".
#
# Calibration method (recorded so future measurements tighten it):
# - active_weight_fraction 0.34: GLM-4.7-Flash is MoE; the solo anchor
#   (68 tok/s => 14.7 ms/token) fixes streamed bytes at ~5.8 GB/token
#   given the M4 Max's ~394 GB/s effective Q4 decode bandwidth.
# - per_hop_overhead_ms 13.0: back-solved from the 2-way anchor. This is
#   per-token wire time beyond RTT+transfer: QUIC stream setup, copies,
#   scheduling. The BENCHMARKS.md note "overhead dominated by per-token
#   RPC latency" is this coefficient. Passive edge measurements
#   (LargeFrameObservation) will refine it with real per-edge data.
# - 3-way uses a second mini-class node; residual error <= ~10% on all
#   three anchors.
[nodes.m4max]
vram_bytes = 68719476736              # 64 GiB unified
sustained_mem_bandwidth_mib_per_s = 417000
sustained_compute_gflop_per_s = 34000

[nodes.mini]
vram_bytes = 34359738368              # 32 GiB unified
sustained_mem_bandwidth_mib_per_s = 160000
sustained_compute_gflop_per_s = 10200

[nodes.mini2]
vram_bytes = 34359738368
sustained_mem_bandwidth_mib_per_s = 160000
sustained_compute_gflop_per_s = 10200

[links."m4max -> mini"]
rtt_ms = 3
large_frame_mib_per_s = 30

[links."mini -> m4max"]
rtt_ms = 3
large_frame_mib_per_s = 30

[links."m4max -> mini2"]
rtt_ms = 3
large_frame_mib_per_s = 30

[links."mini2 -> m4max"]
rtt_ms = 3
large_frame_mib_per_s = 30

[links."mini -> mini2"]
rtt_ms = 4
large_frame_mib_per_s = 30

[links."mini2 -> mini"]
rtt_ms = 4
large_frame_mib_per_s = 30

[model]
layer_count = 40
weight_bytes_per_layer = 425000000    # ~17 GB / 40 layers
kv_bytes_per_token = 4096
native_context_length = 65536
activation_frame_bytes = 8192
active_weight_fraction = 0.34
per_stage_overhead_ms = 1.3
per_hop_overhead_ms = 13.0

[workload]
minimum_nodes = 1
