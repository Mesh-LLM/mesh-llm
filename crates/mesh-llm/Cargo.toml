[package]
name = "mesh-llm"
version.workspace = true
edition = "2024"

[features]
default = ["web-ui", "dynamic-native-runtime", "payments", "wallet-lexe"]
# Embed the React web console into the binary. Default on so the shipped
# binary keeps shipping the console; turn off (`--no-default-features`)
# for a lean variant that drops the embedded UI assets.
web-ui = ["mesh-llm-host-runtime/web-ui"]
dynamic-native-runtime = ["mesh-llm-host-runtime/dynamic-native-runtime"]
# Paid-inference ledger, gates and the `wallet.v1` plugin adapter. Links no
# wallet SDK by itself.
payments = ["mesh-llm-host-runtime/payments", "dep:mesh-llm-payments"]
# Built-in Lexe wallet, served as `mesh-llm --plugin wallet-lexe` like
# blobstore. The only feature that links Lexe into this executable.
wallet-lexe = ["payments", "mesh-llm-host-runtime/wallet-lexe"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
clap.workspace = true
mesh-llm-cli = { path = "../mesh-llm-cli", version = "0.76.1" }
mesh-llm-commands = { path = "../mesh-llm-commands", version = "0.76.1" }
mesh-llm-events = { path = "../mesh-llm-events", version = "0.76.1" }
mesh-llm-host-runtime = { path = "../mesh-llm-host-runtime", version = "0.76.1", default-features = false }
mesh-llm-payments = { path = "../mesh-llm-payments", version = "0.76.1", features = ["plugin-server"], optional = true }
mesh-llm-plugin = { path = "../mesh-llm-plugin", version = "0.76.1" }
mesh-llm-plugin-manager = { path = "../mesh-llm-plugin-manager", version = "0.76.1" }
mesh-llm-system = { path = "../mesh-llm-system", version = "0.76.1", features = ["skippy-devices"] }
mesh-llm-tui = { path = "../mesh-llm-tui", version = "0.76.1" }
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tabwriter = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[dev-dependencies]
axum = "0.8"
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
serial_test = "4"
mesh-client = { package = "mesh-llm-client", path = "../mesh-client" }
serde_json = "1"
tempfile = "3"
