[package]
name = "mesh-llm-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust SDK facade for Mesh LLM clients and native runtime management"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"
keywords = ["llm", "mesh", "sdk", "inference"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["client", "native-runtime"]
client = ["dep:mesh-llm-api-client"]
console = ["dep:mesh-llm-console-server"]
native-runtime = ["dep:mesh-llm-runtime-install"]

[lints]
workspace = true

[dependencies]
mesh-llm-api-client = { path = "../mesh-llm-api-client", version = "0.68.0", optional = true }
mesh-llm-console-server = { path = "../mesh-llm-console-server", version = "0.68.0", optional = true }
mesh-llm-runtime-install = { path = "../mesh-llm-runtime-install", version = "0.68.0", optional = true }
