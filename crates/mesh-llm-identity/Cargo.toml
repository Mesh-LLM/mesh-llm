[package]
name = "mesh-llm-identity"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Shared owner identity, signing, and envelope crypto for Mesh LLM crates"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[features]
default = []
host-io = ["dep:dirs", "dep:keyring"]

[dependencies]
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
crypto_box = "0.9"
dirs = { version = "6.0.0", optional = true }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
hex = "0.4"
keyring = { version = "4.2", optional = true }
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "ios")'.dependencies]
# keyring v4's Apple backend requires protected-data support on iOS.
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
serial_test = "4"
