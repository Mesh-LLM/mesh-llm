<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesh</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #161a21;
        color: #f2f1ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgb(66 196 219 / 10%), transparent 34rem),
          #161a21;
      }

      main {
        width: min(32rem, calc(100vw - 3rem));
        text-align: center;
      }

      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        color: #83dce8;
        filter: drop-shadow(0 10px 24px rgb(39 161 182 / 18%));
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        letter-spacing: -0.035em;
      }

      h1 span {
        color: #83dce8;
      }

      p {
        margin: 0.75rem auto 0;
        color: #c0c5ce;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .activity {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        margin-top: 1.5rem;
      }

      .activity i {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 999px;
        background: #83dce8;
        animation: pulse 1.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .activity i:nth-child(2) {
        animation-delay: 120ms;
      }

      .activity i:nth-child(3) {
        animation-delay: 240ms;
      }

      [data-state="error"] .activity {
        display: none;
      }

      [data-state="error"] #status {
        color: #ffb4a7;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }
        45% {
          opacity: 1;
          transform: translateY(-0.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .activity i {
          animation: none;
          opacity: 0.72;
        }
      }
    </style>
  </head>
  <body>
    <main id="startup" aria-live="polite">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <g fill="currentColor">
          <path d="M32 8c-12.8 0-23 8.2-23 18.4 0 3.1.9 5.9 2.6 8.4l.2.3c2.6-2.5 6.9-4 11.8-4h16.8c4.9 0 9.2 1.5 11.8 4l.2-.3c1.7-2.5 2.6-5.3 2.6-8.4C55 16.2 44.8 8 32 8Z" />
          <path d="M11.9 35.8c1.6 2.2 3.6 4.1 6 5.6 2.6 1.6 5.4 2.4 8.3 2.4h11.6c2.9 0 5.8-.8 8.3-2.4 2.4-1.5 4.4-3.4 6-5.6-2.3-2.1-6.4-3.4-10.8-3.4H22.7c-4.4 0-8.5 1.3-10.8 3.4Z" />
          <path d="M17.5 38.8c1.3 0 2.3 1 2.3 2.3v8.4c0 1.8-.7 3.2-1.3 4.5-.6 1.2-1.1 2.1-1.1 3.3 0 .9-.8 1.6-1.6 1.6-.9 0-1.6-.8-1.6-1.6 0-2 .7-3.4 1.4-4.8.6-1.1 1-2 1-3v-8.4c0-1.3 1-2.3 2.3-2.3Zm7-1.6c1.3 0 2.4 1.1 2.4 2.4v10.8c0 2.2-.8 3.9-1.6 5.4-.8 1.5-1.5 2.8-1.5 4.7 0 .9-.8 1.6-1.6 1.6-.9 0-1.6-.8-1.6-1.6 0-2.7 1-4.5 1.9-6.2.7-1.4 1.3-2.5 1.3-3.9V39.6c0-1.3 1.1-2.4 2.4-2.4Zm7.5-1c1.7 0 3 1.3 3 3v17.6c0 2.1-.7 3.8-1.5 5.2-.5.8-1.5 1.1-2.3.6-.8-.5-1.1-1.5-.6-2.3.6-1 1.1-2 1.1-3.5V39.2c0-1.7 1.3-3 3-3Zm7.5 1c1.3 0 2.4 1.1 2.4 2.4v10.8c0 1.4.6 2.5 1.3 3.9.9 1.7 1.9 3.5 1.9 6.2 0 .9-.8 1.6-1.6 1.6-.9 0-1.6-.8-1.6-1.6 0-1.9-.7-3.2-1.5-4.7-.8-1.5-1.6-3.2-1.6-5.4V39.6c0-1.3 1.1-2.4 2.4-2.4Zm7 1.6c1.3 0 2.3 1 2.3 2.3v8.4c0 1 .4 1.9 1 3 .7 1.4 1.4 2.8 1.4 4.8 0 .9-.8 1.6-1.6 1.6-.9 0-1.6-.8-1.6-1.6 0-1.2-.5-2.2-1.1-3.3-.6-1.3-1.3-2.7-1.3-4.5v-8.4c0-1.3 1-2.3 2.3-2.3Z" />
        </g>
      </svg>
      <h1>mesh<span>llm</span></h1>
      <p id="status">Starting your private Mesh…</p>
      <div class="activity" aria-hidden="true"><i></i><i></i><i></i></div>
    </main>
    <script>
      window.meshLauncherFailure = (message) => {
        document.querySelector('#startup').dataset.state = 'error'
        document.querySelector('#status').textContent = message
      }
    </script>
  </body>
</html>
