[package]
name = "mesh-llm-system"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Host system inspection and update helpers for mesh-llm"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
hex = "0.4.3"
libc = "0.2.183"
libloading = "0.8"
mesh-llm-build-info.workspace = true
mesh-llm-gpu-bench = { path = "../mesh-llm-gpu-bench", version = "0.76.0-rc8"  }
mesh-llm-native-runtime = { path = "../mesh-llm-native-runtime", version = "0.76.0-rc8" }
mesh-llm-release-footer.workspace = true
mesh-llm-runtime-install = { path = "../mesh-llm-runtime-install", version = "0.76.0-rc8" }
reqwest = { version = "0.12", features = ["stream", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skippy-runtime = { path = "../skippy-runtime", version = "0.76.0-rc8", optional = true  }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
skippy-devices = ["dep:skippy-runtime"]
dynamic-native-runtime = ["skippy-devices", "skippy-runtime/dynamic-native-runtime"]

[dev-dependencies]
serial_test = "3"
