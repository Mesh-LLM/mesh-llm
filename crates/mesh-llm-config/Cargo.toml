[package]
name = "mesh-llm-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration parsing and validation for mesh-llm"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
mesh-llm-native-runtime = { path = "../mesh-llm-native-runtime", version = "0.78.0" }
mesh-llm-types = { path = "../mesh-llm-types", version = "0.78.0"  }
semver = "1"
serde = { workspace = true }
skippy-protocol = { path = "../skippy-protocol", version = "0.78.0"  }
toml = "1.1"
toml_edit = "0.25"
dirs = "6.0.0"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = { workspace = true }
serial_test = "4"
tempfile = "3"
