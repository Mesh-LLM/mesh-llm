{
  "schema_version": 1,
  "unknown_path_policy": "fail",
  "domains": [
    "ci-control",
    "docs",
    "tooling",
    "cli",
    "rust",
    "ui",
    "website",
    "runtime-product",
    "native-abi",
    "protocol",
    "split-serving",
    "model-download",
    "sdk-rust",
    "sdk-kotlin",
    "sdk-swift",
    "platform-macos",
    "platform-windows",
    "platform-windows-storage",
    "backend-cuda",
    "backend-rocm",
    "backend-vulkan",
    "runner-infra"
  ],
  "path_rules": [
    {
      "domain": "ci-control",
      "patterns": [
        ".github/**",
        ".omo/**",
        "ci/**",
        "scripts/affected-crates.sh",
        "scripts/plan-ci.py",
        "scripts/plan-*.sh",
        "scripts/collect-ci-metrics.py",
        "scripts/tests/test_plan_ci.py"
      ]
    },
    {
      "domain": "runner-infra",
      "patterns": [
        ".github/cache-version.txt",
        ".github/actions/select-ci-runners/**",
        ".github/actions/configure-sccache-gha/**",
        ".github/actions/capture-sccache-stats/**",
        ".github/actions/restore-sccache-seed/**",
        ".github/actions/resolve-native-toolchain-epoch/**",
        ".github/workflows/cache-warm-sccache.yml",
        "runner-images/**"
      ]
    },
    {
      "domain": "tooling",
      "patterns": [
        ".agents/**",
        ".cargo/**",
        ".dockerignore",
        ".gitignore",
        ".gitattributes",
        ".nvmrc",
        ".well-known/**",
        "LICENSE",
        "clippy.toml",
        "contrib/**",
        "dist/**",
        "evals/**",
        "mesh.png",
        "package-lock.json",
        "recipes/**",
        "schemas/**",
        "scripts/**",
        "tools/**"
      ]
    },
    {
      "domain": "docs",
      "patterns": [
        "*.md",
        "**/*.md",
        "logs-*.png",
        "docs/**",
        "AGENTS.md",
        "**/AGENTS.md"
      ]
    },
    {
      "domain": "website",
      "patterns": [
        "website/**",
        "install.sh",
        "install.ps1",
        "docs/index.html",
        "docs/CNAME",
        "docs/assets/**",
        "docs/catalog/**",
        "docs/pagefind/**",
        "docs/.well-known/**"
      ]
    },
    {
      "domain": "cli",
      "patterns": [
        "crates/mesh-llm-cli/src/parser.rs",
        "crates/mesh-llm-cli/src/models.rs",
        "crates/mesh-llm-cli/src/runtime.rs",
        "crates/mesh-llm-cli/src/benchmark.rs"
      ]
    },
    {
      "domain": "rust",
      "patterns": [
        "Cargo.toml",
        "Cargo.lock",
        "Justfile",
        "just/**",
        "rust-toolchain",
        "rust-toolchain.toml",
        "crates/**",
        "tools/xtask/**"
      ]
    },
    {
      "domain": "ui",
      "patterns": [
        "crates/mesh-llm-ui/**",
        "pnpm-lock.yaml",
        "package.json"
      ]
    },
    {
      "domain": "runtime-product",
      "patterns": [
        "scripts/build-*.sh",
        "scripts/build-*.ps1",
        "scripts/ci-*-smoke.sh",
        "scripts/ci-*-smoke.py",
        "scripts/ci-*-smoke.cjs",
        "scripts/compose-product*",
        "scripts/package-release*",
        "scripts/verify-host-dependencies.py",
        "docker/**",
        "fly/**"
      ]
    },
    {
      "domain": "native-abi",
      "patterns": [
        "third_party/llama.cpp/**",
        "scripts/prepare-llama.sh",
        "scripts/build-llama.sh",
        "scripts/package-native-runtime.sh",
        "scripts/verify-native-runtime-package.sh",
        "crates/skippy-ffi/**",
        "crates/llama-quant-ffi/**"
      ]
    },
    {
      "domain": "protocol",
      "patterns": [
        "crates/mesh-llm-protocol/**",
        "crates/mesh-llm-routing/**",
        "crates/mesh-llm-types/**",
        "crates/skippy-protocol/**"
      ]
    },
    {
      "domain": "split-serving",
      "patterns": [
        "crates/skippy-cache/**",
        "crates/skippy-coordinator/**",
        "crates/skippy-correctness/**",
        "crates/skippy-model-package/**",
        "crates/skippy-prompt/**",
        "crates/skippy-runtime/**",
        "crates/skippy-server/**",
        "crates/skippy-topology/**"
      ]
    },
    {
      "domain": "model-download",
      "patterns": [
        "crates/model-artifact/**",
        "crates/model-hf/**",
        "crates/model-package/**",
        "crates/model-ref/**",
        "crates/model-resolver/**",
        "crates/skippy-model/**",
        "scripts/ci-hf-download-smoke.sh"
      ]
    },
    {
      "domain": "sdk-rust",
      "patterns": [
        "crates/mesh-llm-sdk/**",
        "crates/mesh-llm-api-client/**",
        "crates/mesh-llm-api-server/**",
        "scripts/ci-rust-sdk-smoke.sh",
        "sdk/**"
      ]
    },
    {
      "domain": "sdk-kotlin",
      "patterns": [
        "sdk/kotlin/**",
        "scripts/ci-kotlin-sdk-smoke.sh"
      ]
    },
    {
      "domain": "sdk-swift",
      "patterns": [
        "sdk/swift/**",
        "Package.swift",
        "scripts/ci-swift-sdk-smoke.sh"
      ]
    },
    {
      "domain": "platform-macos",
      "patterns": [
        "scripts/build-mac.sh",
        "scripts/ci-swift-sdk-smoke.sh",
        ".github/workflows/swift-sdk-artifact.yml",
        "providers/apple/**"
      ]
    },
    {
      "domain": "platform-windows",
      "patterns": [
        "scripts/build-windows.ps1",
        "scripts/install-windows-sdk.ps1",
        "scripts/windows-native-runtime-deps.py",
        ".github/actions/setup-windows-short-paths/**",
        ".github/workflows/windows-warm-caches.yml"
      ]
    },
    {
      "domain": "backend-cuda",
      "patterns": [
        "scripts/detect-cuda-arch.sh",
        "scripts/build-linux.sh",
        "scripts/build-windows.ps1"
      ]
    },
    {
      "domain": "backend-rocm",
      "patterns": [
        "scripts/detect-rocm-arch.sh",
        "scripts/build-linux-rocm.sh",
        "scripts/build-windows.ps1"
      ]
    },
    {
      "domain": "backend-vulkan",
      "patterns": [
        "scripts/build-linux.sh",
        "scripts/build-windows.ps1"
      ]
    },
    {
      "domain": "tooling",
      "patterns": [
        "skippy/evals/**",
        "mesh/evals/**",
        "mesh/scripts/**",
        "skippy/scripts/**"
      ]
    },
    {
      "domain": "docs",
      "patterns": [
        "mesh/docs/**",
        "skippy/docs/**"
      ]
    },
    {
      "domain": "website",
      "patterns": [
        "mesh/website/**",
        "mesh/install.sh",
        "mesh/install.ps1",
        "mesh/docs/index.html",
        "mesh/docs/CNAME",
        "mesh/docs/assets/**",
        "mesh/docs/catalog/**",
        "mesh/docs/pagefind/**",
        "mesh/docs/.well-known/**"
      ]
    },
    {
      "domain": "cli",
      "patterns": [
        "mesh/crates/mesh-llm-cli/src/parser.rs",
        "mesh/crates/mesh-llm-cli/src/models.rs",
        "mesh/crates/mesh-llm-cli/src/runtime.rs",
        "mesh/crates/mesh-llm-cli/src/benchmark.rs"
      ]
    },
    {
      "domain": "rust",
      "patterns": [
        "mesh/crates/**",
        "skippy/crates/**"
      ]
    },
    {
      "domain": "ui",
      "patterns": [
        "mesh/crates/mesh-llm-ui/**"
      ]
    },
    {
      "domain": "runtime-product",
      "patterns": [
        "mesh/scripts/build-*.sh",
        "skippy/scripts/build-*.sh",
        "mesh/scripts/build-*.ps1",
        "skippy/scripts/build-*.ps1",
        "mesh/scripts/ci-*-smoke.sh",
        "skippy/scripts/ci-*-smoke.sh",
        "mesh/scripts/ci-*-smoke.py",
        "skippy/scripts/ci-*-smoke.py",
        "mesh/scripts/ci-*-smoke.cjs",
        "skippy/scripts/ci-*-smoke.cjs",
        "mesh/scripts/compose-product*",
        "skippy/scripts/compose-product*",
        "mesh/scripts/package-release*",
        "skippy/scripts/package-release*",
        "mesh/scripts/verify-host-dependencies.py",
        "skippy/scripts/verify-host-dependencies.py",
        "mesh/deploy/docker/**",
        "mesh/deploy/fly/**",
        "mesh/deploy/**"
      ]
    },
    {
      "domain": "native-abi",
      "patterns": [
        "skippy/third_party/llama.cpp/**",
        "skippy/scripts/prepare-llama.sh",
        "skippy/scripts/build-llama.sh",
        "skippy/scripts/package-native-runtime.sh",
        "skippy/scripts/verify-native-runtime-package.sh",
        "skippy/crates/skippy-ffi/**",
        "skippy/crates/llama-quant-ffi/**"
      ]
    },
    {
      "domain": "protocol",
      "patterns": [
        "mesh/crates/mesh-llm-protocol/**",
        "mesh/crates/mesh-llm-routing/**",
        "mesh/crates/mesh-llm-types/**",
        "skippy/crates/skippy-protocol/**"
      ]
    },
    {
      "domain": "split-serving",
      "patterns": [
        "skippy/crates/skippy-cache/**",
        "skippy/crates/skippy-coordinator/**",
        "skippy/crates/skippy-correctness/**",
        "skippy/crates/skippy-package-builder/**",
        "skippy/crates/skippy-prompt/**",
        "skippy/crates/skippy-runtime/**",
        "skippy/crates/skippy-serving/**",
        "skippy/crates/skippy-cli/**",
        "skippy/crates/skippy-commands/**",
        "skippy/crates/skippy-config/**",
        "skippy/crates/skippy-topology/**"
      ]
    },
    {
      "domain": "model-download",
      "patterns": [
        "skippy/crates/skippy-model-artifact/**",
        "skippy/crates/skippy-model-hf/**",
        "skippy/crates/skippy-model-package/**",
        "skippy/crates/skippy-model-ref/**",
        "skippy/crates/skippy-model-resolver/**",
        "skippy/crates/skippy-model/**",
        "mesh/scripts/ci-hf-download-smoke.sh",
        "skippy/scripts/ci-hf-download-smoke.sh"
      ]
    },
    {
      "domain": "sdk-rust",
      "patterns": [
        "mesh/crates/mesh-llm-sdk/**",
        "mesh/crates/mesh-llm-api-client/**",
        "mesh/crates/mesh-llm-api-server/**",
        "mesh/scripts/ci-rust-sdk-smoke.sh",
        "skippy/scripts/ci-rust-sdk-smoke.sh",
        "mesh/sdk/**"
      ]
    },
    {
      "domain": "sdk-kotlin",
      "patterns": [
        "mesh/sdk/kotlin/**",
        "mesh/scripts/ci-kotlin-sdk-smoke.sh",
        "skippy/scripts/ci-kotlin-sdk-smoke.sh"
      ]
    },
    {
      "domain": "sdk-swift",
      "patterns": [
        "mesh/sdk/swift/**",
        "mesh/scripts/ci-swift-sdk-smoke.sh",
        "skippy/scripts/ci-swift-sdk-smoke.sh"
      ]
    },
    {
      "domain": "platform-macos",
      "patterns": [
        "mesh/scripts/build-mac.sh",
        "skippy/scripts/build-mac.sh",
        "mesh/scripts/ci-swift-sdk-smoke.sh",
        "skippy/scripts/ci-swift-sdk-smoke.sh"
      ]
    },
    {
      "domain": "platform-windows",
      "patterns": [
        "mesh/scripts/build-windows.ps1",
        "skippy/scripts/build-windows.ps1",
        "mesh/scripts/install-windows-sdk.ps1",
        "skippy/scripts/install-windows-sdk.ps1",
        "mesh/scripts/windows-native-runtime-deps.py",
        "skippy/scripts/windows-native-runtime-deps.py"
      ]
    },
    {
      "domain": "backend-cuda",
      "patterns": [
        "mesh/scripts/detect-cuda-arch.sh",
        "skippy/scripts/detect-cuda-arch.sh",
        "mesh/scripts/build-linux.sh",
        "skippy/scripts/build-linux.sh",
        "mesh/scripts/build-windows.ps1",
        "skippy/scripts/build-windows.ps1"
      ]
    },
    {
      "domain": "backend-rocm",
      "patterns": [
        "mesh/scripts/detect-rocm-arch.sh",
        "skippy/scripts/detect-rocm-arch.sh",
        "mesh/scripts/build-linux-rocm.sh",
        "skippy/scripts/build-linux-rocm.sh",
        "mesh/scripts/build-windows.ps1",
        "skippy/scripts/build-windows.ps1"
      ]
    },
    {
      "domain": "backend-vulkan",
      "patterns": [
        "mesh/scripts/build-linux.sh",
        "skippy/scripts/build-linux.sh",
        "mesh/scripts/build-windows.ps1",
        "skippy/scripts/build-windows.ps1"
      ]
    },
    {
      "domain": "runtime-product",
      "patterns": [
        "crates/mesh-llm-skippy-adapter/**",
        "crates/mesh-llm-membership/**",
        "crates/mesh-llm-control-api/**",
        "crates/mesh-llm-runtime/**",
        "mesh/crates/mesh-llm-skippy-adapter/**",
        "mesh/crates/mesh-llm-membership/**",
        "mesh/crates/mesh-llm-control-api/**",
        "mesh/crates/mesh-llm-runtime/**"
      ]
    }
  ],
  "crate_rules": [
    {"domain": "rust", "crates": ["*"]},
    {
      "domain": "cli",
      "crates": ["mesh-llm-cli"]
    },
    {
      "domain": "runtime-product",
      "crates": [
        "mesh-llm",
        "mesh-llm-client",
        "mesh-llm-commands",
        "mesh-llm-console-server",
        "mesh-llm-embedded-runtime",
        "mesh-llm-host-runtime",
        "mesh-llm-node",
        "openai-frontend"
      ]
    },
    {
      "domain": "native-abi",
      "crates": ["llama-quant-ffi", "skippy-ffi"]
    },
    {
      "domain": "protocol",
      "crates": [
        "mesh-llm-protocol",
        "mesh-llm-routing",
        "mesh-llm-types",
        "skippy-protocol"
      ]
    },
    {
      "domain": "split-serving",
      "crates": [
        "skippy-cache",
        "skippy-coordinator",
        "skippy-correctness",
        "skippy-model-package",
        "skippy-prompt",
        "skippy-runtime",
        "skippy-server",
        "skippy-topology"
      ]
    },
    {
      "domain": "model-download",
      "crates": [
        "model-artifact",
        "model-hf",
        "model-package",
        "model-ref",
        "model-resolver",
        "skippy-model",
        "skippy-quantize"
      ]
    },
    {
      "domain": "sdk-rust",
      "crates": [
        "mesh-llm-api-client",
        "mesh-llm-api-server",
        "mesh-llm-ffi",
        "mesh-llm-nodejs",
        "mesh-llm-sdk"
      ]
    },
    {
      "domain": "platform-macos",
      "crates": ["mesh-llm-sdk"]
    },
    {
      "domain": "platform-windows",
      "crates": ["mesh-llm-nodejs", "skippy-ffi"]
    },
    {
      "domain": "platform-windows-storage",
      "crates": ["mesh-llm-log-store"]
    },
    {
      "domain": "backend-cuda",
      "crates": ["llama-spec-bench", "mesh-llm-gpu-bench", "skippy-bench"]
    },
    {
      "domain": "backend-rocm",
      "crates": ["llama-spec-bench", "mesh-llm-gpu-bench", "skippy-bench"]
    },
    {
      "domain": "backend-vulkan",
      "crates": ["llama-spec-bench", "mesh-llm-gpu-bench", "skippy-bench"]
    },
    {
      "domain": "runtime-product",
      "crates": [
        "mesh-llm-skippy-adapter",
        "mesh-llm-membership",
        "mesh-llm-control-api",
        "mesh-llm-runtime"
      ]
    },
    {
      "domain": "runtime-product",
      "crates": [
        "mesh-llm-transport",
        "skippy-openai-frontend"
      ]
    },
    {
      "domain": "split-serving",
      "crates": [
        "skippy-package-builder",
        "skippy-serving",
        "skippy-cli",
        "skippy-commands",
        "skippy-config"
      ]
    },
    {
      "domain": "model-download",
      "crates": [
        "skippy-model-artifact",
        "skippy-model-hf",
        "skippy-model-ref",
        "skippy-model-resolver"
      ]
    },
    {
      "domain": "backend-cuda",
      "crates": [
        "skippy-gpu-bench"
      ]
    },
    {
      "domain": "backend-rocm",
      "crates": [
        "skippy-gpu-bench"
      ]
    },
    {
      "domain": "backend-vulkan",
      "crates": [
        "skippy-gpu-bench"
      ]
    }
  ]
}
