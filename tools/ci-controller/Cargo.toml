[package]
name = "ci-controller"
version.workspace = true
edition = "2024"
publish = false
description = "Narrow CI controller: planning, lane result admission, and planner-side repository checks"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
