[package]
name = "process-supervision"
version.workspace = true
edition = "2024"
publish = false
description = "Bounded supervision of CI automation child process trees and the command interruption scope"

[dependencies]
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
