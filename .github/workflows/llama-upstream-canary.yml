name: llama.cpp Upstream Canary

on:
  schedule:
    - cron: "47 3 * * *"
  push:
    branches: [main]
    paths:
      - "third_party/llama.cpp/patches/**"
      - "third_party/llama.cpp/upstream.txt"
      - "ci/llama-canary/**"
      - "scripts/family-certify.sh"
      - "scripts/skippy-family-battery.sh"
      - "scripts/llama-canary-agent-repair.sh"
      - ".github/workflows/llama-upstream-canary.yml"
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Optional llama.cpp upstream SHA to validate instead of origin/master"
        required: false
      queue_ref:
        description: "Optional branch/ref whose patch queue is validated (default: main). Non-main refs run report-only: the credentialed pin-push step is skipped."
        required: false
      force_certify:
        description: "Run build, smoke, and the supported-families battery even when the requested upstream SHA already matches the pin."
        required: false
        type: boolean
        default: false

# This workflow checks out and executes trusted default-branch content by
# default (schedule/dispatch/main push). A maintainer may explicitly dispatch
# it against a named same-repository feature ref via `queue_ref` to validate
# that branch's patch queue before merge; those runs are report-only (no
# credentialed pin push). It must never be triggered from a PR ref: it runs on
# the persistent `family-certify` self-hosted runner.
permissions:
  contents: write
  pull-requests: write

jobs:
  latest-upstream:
    runs-on: [self-hosted, family-certify]
    # Ceiling covers the repair path: agent turns plus up to
    # CANARY_REPAIR_MAX_TURNS+1 full battery runs in the repair loop.
    timeout-minutes: 960
    env:
      LLAMA_UPSTREAM_CANARY_SMOKE: ${{ vars.LLAMA_UPSTREAM_CANARY_SMOKE || '1' }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # Models are never cached through GitHub Actions cache. The
      # family-certify runner ships a large pre-warmed HF cache exported as
      # HF_CACHE; scripts/skippy-family-battery.sh normalizes it into
      # HF_HOME/HF_HUB_CACHE so `hf download` is only a cache-miss backstop.
      CANARY_AGENT_MODEL: ${{ vars.LLAMA_CANARY_AGENT_MODEL || 'Nemotron 3 Ultra Free' }}
      # Resolved patch-queue ref: default branch unless a maintainer
      # explicitly dispatches with `queue_ref`. The pin-push step is gated on
      # this being `main`, so write credentials only ever reach runs whose
      # checked-out content is the trusted default branch.
      QUEUE_REF: ${{ inputs.queue_ref || 'main' }}
      FORCE_CERTIFY: ${{ inputs.force_certify && 'true' || 'false' }}
    steps:
      # Checkout content is normally pinned to the default branch even for a
      # manual dispatch: a dispatcher can select a feature ref, and this job
      # runs repository scripts plus the repair agent on the persistent
      # self-hosted runner. The only exception is an explicit maintainer
      # `queue_ref` dispatch, which validates a named same-repo branch
      # report-only. `persist-credentials: false` keeps the checkout token
      # away from everything executed; the pin-push step below is the only
      # place a token is injected, and it is restricted to `QUEUE_REF == main`.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUEUE_REF }}
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          set -euo pipefail
          missing=0
          for cmd in cargo just sccache jq python3 cmake ninja hf opencode gh; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "missing on family-certify image: $cmd" >&2
              missing=1
            fi
          done
          if [[ -z "${HF_CACHE:-}" ]]; then
            echo "HF_CACHE is not exported on this runner" >&2
            missing=1
          fi
          if (( missing == 1 )); then
            echo "bake the missing tools into the family-certify runner image; this job installs nothing" >&2
            exit 1
          fi

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Prepare requested llama.cpp upstream
        id: prepare
        continue-on-error: true
        env:
          UPSTREAM_SHA: ${{ github.event.inputs.upstream_sha || 'latest' }}
        run: scripts/prepare-llama.sh "$UPSTREAM_SHA"

      - name: Capture upstream SHAs
        id: sha
        if: steps.prepare.outcome == 'success'
        run: |
          old_sha="$(tr -d '[:space:]' < third_party/llama.cpp/upstream.txt)"
          new_sha="$(tr -d '[:space:]' < .deps/llama.cpp/.mesh-llm-upstream-sha)"
          echo "old_sha=$old_sha" >> "$GITHUB_OUTPUT"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          if [[ "$old_sha" == "$new_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$old_sha" != "$new_sha" || "$FORCE_CERTIFY" == "true" ]]; then
            echo "certify=true" >> "$GITHUB_OUTPUT"
          else
            echo "certify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build patched llama.cpp ABI
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        run: scripts/build-llama.sh

      - name: Build stage runtime crates
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        run: cargo build -p skippy-ffi -p skippy-runtime -p skippy-server -p skippy-model-package -p skippy-correctness -p llama-spec-bench

      - name: Skippy smoke tests
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && env.LLAMA_UPSTREAM_CANARY_SMOKE != '0' && env.LLAMA_UPSTREAM_CANARY_SMOKE != 'false'
        timeout-minutes: 45
        env:
          WORK_DIR: ${{ runner.temp }}/skippy-ci-smoke
        run: scripts/skippy-ci-smoke.sh

      - name: Supported-families certification battery (parity gate)
        id: battery
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        timeout-minutes: 300
        run: scripts/skippy-family-battery.sh --skip-build

      - name: Generate summary
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        env:
          SKIPPY_CI_SMOKE: ${{ env.LLAMA_UPSTREAM_CANARY_SMOKE }}
        run: |
          scripts/summarize-llama-upstream.sh \
            "${{ steps.sha.outputs.old_sha }}" \
            "${{ steps.sha.outputs.new_sha }}" \
            .deps/llama.cpp \
            > /tmp/llama-upstream-pr.md

      # The pin commit is gated on the full family battery passing: parity is
      # the certification, cargo check alone is not. It is further restricted
      # to trusted default-branch checkouts: a `queue_ref` feature-branch
      # dispatch never receives the write token, so its result is report-only.
      - name: Commit upstream pin to main
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.changed == 'true' && steps.battery.outcome == 'success' && env.QUEUE_REF == 'main'
        run: |
          set -euo pipefail
          # The verified SHA lives under .deps; write it into the durable pin
          # before committing so the commit step never reports a push that
          # did not happen.
          scripts/update-llama-pin.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/llama.cpp/upstream.txt
          if git diff --cached --quiet; then
            echo "No upstream pin changes to commit."
            exit 0
          fi
          git commit -m "Update llama.cpp upstream pin"
          git push "https://x-access-token:${PIN_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
        env:
          PIN_PUSH_TOKEN: ${{ github.token }}

      - name: Report upstream pin update
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.changed == 'true' && steps.battery.outcome == 'success' && env.QUEUE_REF == 'main'
        run: |
          {
            echo "## llama.cpp upstream pin update"
            echo
            echo "Pushed the validated upstream pin to \`main\` after the tiered family battery passed."
            echo
            cat /tmp/llama-upstream-pr.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report forced certification result
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.changed == 'false' && steps.sha.outputs.certify == 'true' && steps.battery.outcome == 'success' && env.QUEUE_REF == 'main'
        run: |
          {
            echo "## llama.cpp upstream canary (forced certification)"
            echo
            echo "The pinned upstream passed the requested full family battery. No pin update was needed."
            echo
            cat /tmp/llama-upstream-pr.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report report-only canary result
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && steps.battery.outcome == 'success' && env.QUEUE_REF != 'main'
        run: |
          {
            echo "## llama.cpp upstream canary (report-only, queue_ref=$QUEUE_REF)"
            echo
            echo "The patch queue on \`$QUEUE_REF\` passed the tiered family battery against the new upstream. No pin was pushed: credentialed writes are restricted to \`main\` checkouts."
            echo
            cat /tmp/llama-upstream-pr.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Patch queue failed to apply onto the new upstream: hand the queue to
      # the opencode agent (default model: Nemotron 3 Ultra Free) to rebase
      # the patches, run the family battery, and open or reuse a repair PR.
      # The repair script re-runs the battery itself and loops certify ->
      # agent fix -> recertify (CANARY_REPAIR_MAX_TURNS, default 2), so this
      # step needs headroom for multiple full battery runs. It uses the
      # runner's persistent git/gh credentials, so it is restricted to trusted
      # default-branch checkouts; a `queue_ref` branch dispatch reports the
      # apply failure instead of repairing it.
      - name: Agent repair of the patch queue
        id: agent_repair
        if: steps.prepare.outcome == 'failure' && env.QUEUE_REF == 'main'
        timeout-minutes: 900
        env:
          DISPATCH_UPSTREAM_SHA: ${{ github.event.inputs.upstream_sha }}
        run: |
          set -euo pipefail
          new_sha="$(git ls-remote https://github.com/ggml-org/llama.cpp.git master | cut -f1)"
          if [[ -n "${DISPATCH_UPSTREAM_SHA:-}" ]]; then
            new_sha="$DISPATCH_UPSTREAM_SHA"
          fi
          scripts/llama-canary-agent-repair.sh "$new_sha"

      - name: Report patch-queue failure
        if: failure() && steps.prepare.outcome == 'failure' && steps.agent_repair.outcome == 'failure'
        run: |
          {
            echo "## llama.cpp patch queue failed to apply"
            echo
            echo "The automated opencode repair (\`$CANARY_AGENT_MODEL\`) did not produce a green family battery."
            echo "Inspect the run logs and the repair PR on \`llama-canary/patch-queue-fix\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report patch-queue failure (report-only canary)
        if: steps.prepare.outcome == 'failure' && env.QUEUE_REF != 'main'
        run: |
          {
            echo "## llama.cpp patch queue failed to apply (report-only, queue_ref=$QUEUE_REF)"
            echo
            echo "The patch queue on \`$QUEUE_REF\` does not apply onto the requested upstream. Automated repair is restricted to \`main\` checkouts; rebase the queue on the branch."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Show sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats || true
