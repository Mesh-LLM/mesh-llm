name: llama.cpp Upstream Canary
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: Optional exact upstream commit (defaults to upstream master)
        type: string
        default: ''
      force_certify:
        description: Run the complete family roster even when the pin is unchanged
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: llama-upstream-canary
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'Mesh-LLM/mesh-llm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      upstream: ${{ steps.resolve.outputs.upstream }}
      changed: ${{ steps.resolve.outputs.changed }}
      certify: ${{ steps.resolve.outputs.certify }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze trusted source and requested upstream
        id: resolve
        env:
          UPSTREAM: ${{ inputs.upstream_sha }}
          FORCE: ${{ inputs.force_certify }}
        run: |
          set -euo pipefail
          old="$(tr -d '[:space:]' < third_party/llama.cpp/upstream.txt)"
          upstream="$UPSTREAM"
          if [[ -z "$upstream" || "$upstream" == latest ]]; then
            upstream="$(git ls-remote https://github.com/ggml-org/llama.cpp.git master | awk '{print $1}')"
          fi
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]]
          changed=false
          mode=pinned-build
          certify=false
          if [[ "$old" != "$upstream" ]]; then
            changed=true
            mode=repair-build
          fi
          if [[ "$changed" == true || "$FORCE" == true || "$GITHUB_EVENT_NAME" == schedule ]]; then
            certify=true
          fi
          {
            echo "source=$(git rev-parse HEAD)"
            echo "upstream=$upstream"
            echo "changed=$changed"
            echo "mode=$mode"
            echo "certify=$certify"
          } >> "$GITHUB_OUTPUT"

  repair-1:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.certify == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: repair-1
      mode: ${{ needs.resolve.outputs.mode }}

  verify-1:
    needs: [resolve, repair-1]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.repair-1.outputs.green == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: verify-1
      mode: verify-build
      previous_package: ${{ needs.repair-1.outputs.package }}
      previous_identity: ${{ needs.repair-1.outputs.identity }}
      previous_head: ${{ needs.repair-1.outputs.head }}

  repair-2:
    needs: [resolve, repair-1, verify-1]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.repair-1.outputs.head != '' && needs.verify-1.outputs.green != 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: repair-2
      mode: ${{ needs.resolve.outputs.mode }}
      previous_package: ${{ needs.repair-1.outputs.package }}
      previous_identity: ${{ needs.repair-1.outputs.identity }}
      previous_head: ${{ needs.repair-1.outputs.head }}
      feedback_pattern: llama-family-${{ github.run_id }}-${{ github.run_attempt }}-*-1-*
      feedback_build_pattern: llama-build-${{ github.run_id }}-${{ github.run_attempt }}-*-1

  verify-2:
    needs: [resolve, repair-2]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.repair-2.outputs.green == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: verify-2
      mode: verify-build
      previous_package: ${{ needs.repair-2.outputs.package }}
      previous_identity: ${{ needs.repair-2.outputs.identity }}
      previous_head: ${{ needs.repair-2.outputs.head }}

  repair-3:
    needs: [resolve, repair-2, verify-2]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.repair-2.outputs.head != '' && needs.verify-2.outputs.green != 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: repair-3
      mode: ${{ needs.resolve.outputs.mode }}
      previous_package: ${{ needs.repair-2.outputs.package }}
      previous_identity: ${{ needs.repair-2.outputs.identity }}
      previous_head: ${{ needs.repair-2.outputs.head }}
      feedback_pattern: llama-family-${{ github.run_id }}-${{ github.run_attempt }}-*-2-*
      feedback_build_pattern: llama-build-${{ github.run_id }}-${{ github.run_attempt }}-*-2

  verify-3:
    needs: [resolve, repair-3]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.repair-3.outputs.green == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: verify-3
      mode: verify-build
      previous_package: ${{ needs.repair-3.outputs.package }}
      previous_identity: ${{ needs.repair-3.outputs.identity }}
      previous_head: ${{ needs.repair-3.outputs.head }}

  result:
    needs: [resolve, repair-1, verify-1, repair-2, verify-2, repair-3, verify-3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.result.outputs.package }}
      identity: ${{ steps.result.outputs.identity }}
      head: ${{ steps.result.outputs.head }}
      branch: ${{ steps.result.outputs.branch }}
      publish: ${{ steps.result.outputs.publish }}
    steps:
      - name: Require complete certification and independent verification
        id: result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          resolve = needs['resolve']
          if resolve['result'] != 'success':
              raise SystemExit('trusted source resolution failed')
          if resolve['outputs']['certify'] != 'true':
              raise SystemExit(0)
          changed = resolve['outputs']['changed'] == 'true'
          if not changed:
              if needs['repair-1']['outputs'].get('green') != 'true':
                  raise SystemExit('unchanged-pin family certification failed')
              raise SystemExit(0)
          for attempt in range(1, 4):
              repair = needs[f'repair-{attempt}']['outputs']
              verify = needs[f'verify-{attempt}']['outputs']
              if repair.get('green') == verify.get('green') == 'true' and repair['head'] == verify['head']:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('publish=true\n')
                      for key in ('package', 'identity', 'head', 'branch'):
                          output.write(f'{key}={verify[key]}\n')
                  break
          else:
              raise SystemExit('repair or independent family verification exhausted three attempts; publication denied')
          PYCODE

  publish-certified-canary:
    needs: [resolve, result]
    if: ${{ needs.result.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.result.outputs.package }}
          path: ${{ runner.temp }}/certified-canary
      - name: Verify final handoff and write evidence summary
        env:
          IDENTITY: ${{ needs.result.outputs.identity }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py publication --package "$RUNNER_TEMP/certified-canary" --identity "$IDENTITY"
      - name: Publish ready pull request
        id: publish
        env:
          CANARY_BRANCH: ${{ needs.result.outputs.branch }}
          CANARY_CERTIFIED_SHA: ${{ needs.result.outputs.head }}
          CANARY_BUNDLE: ${{ runner.temp }}/certified-canary/candidate.bundle
          CANARY_PR_BODY: ${{ runner.temp }}/certified-canary/pr-body.md
          CANARY_REPAIR_TOKEN: ${{ secrets.CANARY_REPAIR_TOKEN }}
        run: scripts/llama-canary-publish.sh

  alert-consecutive-failures:
    name: Alert after consecutive scheduled failures
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: [resolve, result, publish-certified-canary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Reconcile consecutive-failure alert
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          REPAIR_RESULT: ${{ needs.result.result }}
          VERIFY_RESULT: ${{ needs.result.result }}
          PUBLISH_RESULT: ${{ needs.publish-certified-canary.result }}
        with:
          script: |
            const marker = '<!-- llama-upstream-canary-consecutive-failure-alert -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentResult = process.env.REPAIR_RESULT === 'success'
              && (process.env.CHANGED !== 'true'
                || (process.env.VERIFY_RESULT === 'success'
                  && process.env.PUBLISH_RESULT === 'success'))
              ? 'success'
              : 'failure';
            const currentUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'component: ci',
              per_page: 100,
            });
            const alert = issues.find((issue) => (issue.body || '').includes(marker));

            if (currentResult === 'success') {
              if (alert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `Recovered: scheduled canary ${currentUrl} completed successfully.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'closed',
                });
              }
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'llama-upstream-canary.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            if (!previous || previous.conclusion === 'success') {
              return;
            }

            const previousUrl = previous.html_url;
            const body = [
              marker,
              'The llama.cpp upstream canary has produced two consecutive non-successful scheduled runs.',
              '',
              `- Current: ${currentUrl} (${currentResult})`,
              `- Previous: ${previousUrl} (${previous.conclusion})`,
              '',
              'Inspect the persistent runner and the earliest phase without progress before dispatching another canary.',
            ].join('\n');
            if (alert) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: alert.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: '[CI] llama.cpp upstream canary failing repeatedly',
                body,
                labels: ['component: ci'],
              });
            }
