name: llama.cpp Upstream Canary

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Optional llama.cpp upstream SHA to validate instead of origin/master"
        required: false
      force_certify:
        description: "Run build, smoke, and the supported-families battery even when the requested upstream SHA already matches the pin."
        required: false
        type: boolean
        default: false

# This workflow always checks out and executes trusted default-branch content.
# It must never execute a caller-selected ref on the persistent
# `family-certify` self-hosted runner. The job token is read-only. Changed pins
# are prepared, built, certified, and published once through a wrapper-owned
# run-specific PR; unchanged nightly sentinels remain read-only.
permissions:
  contents: read

concurrency:
  group: llama-upstream-canary
  cancel-in-progress: true

jobs:
  latest-upstream:
    runs-on: [self-hosted, family-certify]
    timeout-minutes: 780
    permissions:
      contents: read
    env:
      LLAMA_UPSTREAM_CANARY_SMOKE: ${{ vars.LLAMA_UPSTREAM_CANARY_SMOKE || '1' }}
      # Certification must compile the native closure for this arm64 runner.
      # Both the former GitHub backend and the persistent runner-local cache
      # have served Intel objects for AppleClang's implicit host target.
      RUSTC_WRAPPER: ""
      LLAMA_STAGE_USE_SCCACHE: "0"
      # A persistent runner can retain a CMake cache from a different host
      # architecture. Build every canary in a run-unique directory, and feed
      # that exact native closure to all Rust, smoke, and battery commands.
      LLAMA_BUILD_DIR: ${{ github.workspace }}/.deps/llama-canary-${{ github.run_id }}-${{ github.run_attempt }}
      LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.deps/llama-canary-${{ github.run_id }}-${{ github.run_attempt }}
      LLAMA_STAGE_BACKEND: metal
      # Models are never cached through GitHub Actions cache. The
      # family-certify runner ships a large pre-warmed HF cache exported as
      # HF_CACHE; scripts/skippy-family-battery.sh normalizes it into
      # HF_HOME/HF_HUB_CACHE for read-only resolution.
      FORCE_CERTIFY: ${{ inputs.force_certify && 'true' || 'false' }}
    steps:
      # A manual dispatch can be issued from any ref, but the persistent runner
      # always executes the trusted default branch with a read-only token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          set -euo pipefail
          missing=0
          for cmd in cargo just sccache jq python3 uv cmake ninja hf git-lfs lipo brew xcrun; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "missing on family-certify image: $cmd" >&2
              missing=1
            fi
          done
          expected_hf_cache="/Users/lab/models/huggingface"
          if [[ "${HF_CACHE:-}" != "$expected_hf_cache" ]]; then
            echo "HF_CACHE must be $expected_hf_cache on this runner; got: ${HF_CACHE:-<unset>}" >&2
            missing=1
          fi
          if [[ ! -d "$expected_hf_cache/hub" ]]; then
            echo "pre-warmed Hugging Face hub cache is missing: $expected_hf_cache/hub" >&2
            missing=1
          fi
          if [[ "${HF_HUB_OFFLINE:-}" != "1" ]]; then
            echo "HF_HUB_OFFLINE must be 1 on the read-only family-certify runner" >&2
            missing=1
          fi
          {
            echo "HF_HOME=$expected_hf_cache"
            echo "HF_HUB_CACHE=$expected_hf_cache/hub"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
          # Match scripts/check-skippy-generated-family-patch.sh: prefer the
          # pinned llvm@22, but accept any Homebrew LLVM that provides Clang
          # LibTooling (bin/clang + ClangConfig.cmake) so a runner image whose
          # pinned keg was rotated out does not fail the whole canary.
          llvm_prefix="$(brew --prefix llvm@22 2>/dev/null || true)"
          llvm_ok() {
            [[ -n "$1" && -x "$1/bin/clang" && -f "$1/lib/cmake/clang/ClangConfig.cmake" ]]
          }
          if ! llvm_ok "$llvm_prefix"; then
            echo "pinned llvm@22 missing or incomplete on the family-certify image; falling back to $(brew --prefix llvm 2>/dev/null || echo 'brew llvm')" >&2
            llvm_prefix="$(brew --prefix llvm 2>/dev/null || true)"
          fi
          if ! llvm_ok "$llvm_prefix"; then
            echo "no Homebrew LLVM with Clang LibTooling is installed on the family-certify image" >&2
            missing=1
          else
            echo "SKIPPY_REWRITER_LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          fi
          git lfs install --force
          if (( missing == 1 )); then
            echo "bake the missing tools into the family-certify runner image; this job installs nothing" >&2
            exit 1
          fi

      - name: Resolve requested llama.cpp upstream
        id: sha
        env:
          UPSTREAM_SHA: ${{ github.event.inputs.upstream_sha || 'latest' }}
        run: |
          set -euo pipefail
          old_sha="$(tr -d '[:space:]' < third_party/llama.cpp/upstream.txt)"
          new_sha="$UPSTREAM_SHA"
          if [[ "$new_sha" == "latest" || -z "$new_sha" ]]; then
            new_sha="$(git ls-remote https://github.com/ggml-org/llama.cpp.git master | awk '{print $1}')"
          fi
          if [[ ! "$new_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "requested upstream must resolve to a 40-hex commit" >&2
            exit 1
          fi
          {
            echo "old_sha=$old_sha"
            echo "new_sha=$new_sha"
            if [[ "$old_sha" == "$new_sha" ]]; then
              echo "changed=false"
            else
              echo "changed=true"
            fi
            if [[ "$old_sha" != "$new_sha" ]]; then
              echo "certify=true"
              echo "cadence=llama-bump"
            elif [[ "$FORCE_CERTIFY" == "true" ]]; then
              echo "certify=true"
              echo "cadence=manual-full"
            elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              echo "certify=true"
              echo "cadence=nightly"
            else
              echo "certify=false"
              echo "cadence="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Detect existing changed-pin canary PR
        id: existing_changed_pin
        if: github.event_name == 'schedule' && steps.sha.outputs.changed == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.new_sha }}
          GH_TOKEN: ${{ secrets.CANARY_REPAIR_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$CANDIDATE_SHA in:body" \
              --limit 100 \
              --json number,headRefName,body \
              | jq -r --arg sha "$CANDIDATE_SHA" \
                  'first(
                     .[]
                     | select(.headRefName | startswith("llama-canary/repair-"))
                     | select((.body // "") | contains("- Candidate pin: `\($sha)`"))
                     | .number
                   ) // empty'
          )"
          if [[ -n "$pr" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "scheduled changed-pin certification already has open PR #${pr} for ${CANDIDATE_SHA}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changed-pin prepare, build, certify, and publish
        id: changed_canary
        if: steps.sha.outputs.changed == 'true' && steps.existing_changed_pin.outputs.found != 'true'
        timeout-minutes: 720
        continue-on-error: true
        env:
          CANARY_AGENT_MODEL: ${{ vars.LLAMA_CANARY_AGENT_MODEL || 'zai-coding-plan/glm-5.3-flash' }}
          CANARY_REPAIR_TOKEN: ${{ secrets.CANARY_REPAIR_TOKEN }}
          CANARY_REPAIR_BUDGET_SECONDS: "41400"
          CANARY_PUBLISH_RESERVE_SECONDS: "1800"
          CANARY_REPAIR_TURN_TIMEOUT_SECONDS: "3600"
          CANARY_REPAIR_TOTAL_BUDGET_SECONDS: "5400"
          FAMILY_BATTERY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          UPSTREAM_SHA_INPUT: ${{ steps.sha.outputs.new_sha }}
        run: scripts/llama-canary-agent-repair.sh

      - name: Upload changed-pin canary evidence
        if: ${{ !cancelled() && steps.sha.outputs.changed == 'true' && steps.existing_changed_pin.outputs.found != 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-canary-changed-pin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/family-battery/${{ github.run_id }}-${{ github.run_attempt }}/
            target/skippy-stage-rewriter-check/
            .deps/llama-canary-state-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop after changed-pin terminal PR
        if: ${{ !cancelled() && steps.sha.outputs.changed == 'true' }}
        env:
          CHANGED_CANARY_OUTCOME: ${{ steps.changed_canary.outcome }}
          DEDUPLICATION_OUTCOME: ${{ steps.existing_changed_pin.outcome }}
          EXISTING_CANARY_FOUND: ${{ steps.existing_changed_pin.outputs.found }}
          EXISTING_CANARY_PR: ${{ steps.existing_changed_pin.outputs.pr }}
        run: |
          {
            echo "## llama.cpp changed-pin canary"
            echo
            if [[ "$EXISTING_CANARY_FOUND" == "true" ]]; then
              echo "Skipped duplicate scheduled certification because open canary PR #${EXISTING_CANARY_PR} already records this exact candidate SHA."
            elif [[ "$DEDUPLICATION_OUTCOME" == "failure" ]]; then
              echo "The scheduled duplicate-PR lookup failed before the changed-pin state machine started. No branch or PR was created; inspect that step for the GitHub API error."
            elif [[ "$CHANGED_CANARY_OUTCOME" == "success" ]]; then
              echo "The deterministic state machine certified the candidate and published its exact terminal commit in a run-specific PR."
            else
              echo "The changed-pin state machine ended with outcome **${CHANGED_CANARY_OUTCOME}**."
              echo "If terminal publication completed, the log names the preserved draft PR. A preflight failure can stop before any branch or PR is created."
            fi
            echo "The canary remains red until a certified PR is reviewed and merged."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Prepare pinned llama.cpp upstream
        id: prepare
        if: steps.sha.outputs.changed != 'true' && steps.sha.outputs.certify == 'true'
        run: scripts/prepare-llama.sh pinned

      - name: Parity manifest validation (boundary registration gate)
        id: parity_validate
        # Fail closed when llama-parity-candidates.json is not fully
        # classified: runnable rows must register begin_block/end_block (or
        # carry an explicit unsupported_reason on a non-runnable
        # classification), and every model_pin must be immutable. A failure
        # here is a manifest defect. Keep the remaining evidence-producing
        # steps available, then fail the unchanged-pin run at the final gate.
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/skippy-llama-parity.py --llama-src .deps/llama.cpp validate

      - name: Plan and verify family certification cache
        id: family_plan
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        env:
          FAMILY_BATTERY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          plan="target/family-battery/$FAMILY_BATTERY_RUN_ID/policy-plan.json"
          python3 scripts/plan-family-battery.py \
            --manifest ci/llama-canary/family-certified.json \
            --cadence "${{ steps.sha.outputs.cadence }}" \
            --shard-count 1 \
            --check-cache \
            --cache-root "$HF_CACHE" \
            --output "$plan" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build patched llama.cpp ABI
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        # The family-certify service can itself be launched under Rosetta.
        # Select the native slice for the build shell as well as the CMake
        # target so host detection and produced archives are both arm64. Build
        # and run the complete upstream llama.cpp CTest suite in addition to
        # the private Skippy native tests.
        env:
          LLAMA_STAGE_UPSTREAM_TESTS: "ON"
        run: uv run --no-project --with jinja2==3.1.6 -- arch -arm64 bash scripts/build-llama.sh -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Verify native archive architecture
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        run: |
          set -euo pipefail
          archive="${LLAMA_STAGE_BUILD_DIR:?}/src/libllama.a"
          arches="$(lipo -archs "$archive")"
          if [[ "$arches" != "arm64" ]]; then
            echo "canary native archive must be arm64, got: $arches" >&2
            exit 1
          fi

      - name: Verify generated model-family patch
        id: family_patch
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true'
        continue-on-error: true
        env:
          SKIPPY_REWRITER_ARTIFACT_ROOT: ${{ github.workspace }}/target/skippy-stage-rewriter-check
        run: scripts/check-skippy-generated-family-patch.sh

      - name: Build stage runtime crates
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && steps.family_patch.outcome == 'success'
        # Do not select skippy-ffi directly here: its default dynamic-runtime
        # feature would be unified into the statically linked certification binaries.
        run: cargo build -p skippy-runtime -p skippy-server -p skippy-model-package -p skippy-correctness

      - name: Skippy smoke tests
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && steps.family_patch.outcome == 'success' && env.LLAMA_UPSTREAM_CANARY_SMOKE != '0' && env.LLAMA_UPSTREAM_CANARY_SMOKE != 'false'
        timeout-minutes: 45
        env:
          WORK_DIR: ${{ runner.temp }}/skippy-ci-smoke
        run: scripts/skippy-ci-smoke.sh

      - name: Live package-v2 two-node matrix (model_pin proof)
        id: live_matrix
        # Executable evidence for parity model_pin rows: pinned GGUF
        # verified, package-v2 written + independently verified, two-node
        # split smoke run per row. --prepare first builds this run's exact
        # producers (mesh-llm host binary + patched native runtime bundle
        # from this run's llama tree; backend explicit per runner) and
        # records producer-provenance.json — a cached binary/bundle cannot
        # supply false provenance. Per-row evidence lands under the family
        # battery evidence root and is uploaded with it.
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && steps.family_patch.outcome == 'success' && env.LLAMA_UPSTREAM_CANARY_SMOKE != '0' && env.LLAMA_UPSTREAM_CANARY_SMOKE != 'false'
        continue-on-error: true
        env:
          FAMILY_BATTERY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SKIPPY_CANARY_LIVE_MATRIX_BACKEND: metal
          SKIPPY_CANARY_LIVE_MATRIX_ROOT: ${{ github.workspace }}/target/family-battery/${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/skippy-canary-live-matrix.sh --prepare

      - name: Supported-families certification battery (parity gate)
        id: battery
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && steps.family_patch.outcome == 'success'
        # Continue so evidence uploads and the explicit unchanged-pin failure
        # summary still run after a red family lane.
        continue-on-error: true
        # Preflight resolves every cached model to an immutable snapshot before
        # any certification starts. Individual certifications are bounded by
        # the script; this outer ceiling leaves room for the complete manifest.
        timeout-minutes: 720
        env:
          FAMILY_BATTERY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/skippy-family-battery.sh --skip-build --plan "${{ steps.family_plan.outputs.plan_path }}"

      - name: Upload supported-families battery evidence
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-family-battery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/family-battery/${{ github.run_id }}-${{ github.run_attempt }}/
            target/skippy-stage-rewriter-check/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate summary
        if: steps.prepare.outcome == 'success' && steps.sha.outputs.certify == 'true' && steps.family_patch.outcome == 'success'
        env:
          SKIPPY_CI_SMOKE: ${{ env.LLAMA_UPSTREAM_CANARY_SMOKE }}
        run: |
          scripts/summarize-llama-upstream.sh \
            "${{ steps.sha.outputs.old_sha }}" \
            "${{ steps.sha.outputs.new_sha }}" \
            .deps/llama.cpp \
            > /tmp/llama-upstream-pr.md

      - name: Report forced certification result
        # Same truthfulness: all certification lanes green, not battery only.
        if: >-
          steps.prepare.outcome == 'success'
          && steps.sha.outputs.cadence == 'manual-full'
          && steps.battery.outcome == 'success'
          && steps.parity_validate.outcome == 'success'
          && steps.live_matrix.outcome == 'success'
          && steps.family_patch.outcome == 'success'
        run: |
          {
            echo "## llama.cpp upstream canary (forced certification)"
            echo
            echo "The pinned upstream passed the requested full family battery. No pin update was needed."
            echo
            cat /tmp/llama-upstream-pr.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report nightly family result
        # Nightly: generated patch, parity, live, and battery gates must all
        # be green.
        if: >-
          steps.prepare.outcome == 'success'
          && steps.sha.outputs.cadence == 'nightly'
          && steps.battery.outcome == 'success'
          && steps.parity_validate.outcome == 'success'
          && steps.live_matrix.outcome == 'success'
          && steps.family_patch.outcome == 'success'
        run: |
          {
            echo "## llama.cpp nightly family sentinels"
            echo
            echo "The pinned upstream passed the dense, hybrid/composite, and recurrent sentinel battery."
            echo
            echo "Certified families: ${{ steps.family_plan.outputs.family_count }}"
            cat /tmp/llama-upstream-pr.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail unsuccessful unchanged-pin certification
        if: >-
          steps.sha.outputs.changed != 'true'
          && steps.sha.outputs.certify == 'true'
          && (steps.battery.outcome == 'failure'
              || steps.parity_validate.outcome == 'failure'
              || steps.live_matrix.outcome == 'failure'
              || steps.family_patch.outcome == 'failure')
        run: |
          {
            echo "## llama.cpp unchanged-pin certification failed"
            echo
            echo "Inspect the uploaded family evidence. Agent repair is reserved for changed upstream pins; unchanged nightly and forced checks never modify or publish repository state."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  alert-consecutive-failures:
    name: Alert after consecutive scheduled failures
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: latest-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Reconcile consecutive-failure alert
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CURRENT_RESULT: ${{ needs.latest-upstream.result }}
        with:
          script: |
            const marker = '<!-- llama-upstream-canary-consecutive-failure-alert -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentResult = process.env.CURRENT_RESULT;
            const currentUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'component: ci',
              per_page: 100,
            });
            const alert = issues.find((issue) => (issue.body || '').includes(marker));

            if (currentResult === 'success') {
              if (alert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `Recovered: scheduled canary ${currentUrl} completed successfully.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'closed',
                });
              }
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'llama-upstream-canary.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            if (!previous || previous.conclusion === 'success') {
              return;
            }

            const previousUrl = previous.html_url;
            const body = [
              marker,
              'The llama.cpp upstream canary has produced two consecutive non-successful scheduled runs.',
              '',
              `- Current: ${currentUrl} (${currentResult})`,
              `- Previous: ${previousUrl} (${previous.conclusion})`,
              '',
              'Inspect the persistent runner and the earliest phase without progress before dispatching another canary.',
            ].join('\n');
            if (alert) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: alert.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: '[CI] llama.cpp upstream canary failing repeatedly',
                body,
                labels: ['component: ci'],
              });
            }
