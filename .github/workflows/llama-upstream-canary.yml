name: llama.cpp Upstream Canary
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      mesh_ref:
        description: Trusted same-repository branch or full commit to certify as-is (no repair)
        type: string
        default: ''
      upstream_sha:
        description: Optional exact upstream commit (defaults to upstream master)
        type: string
        default: ''
      force_certify:
        description: Run the complete family roster even when the pin is unchanged
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: llama-upstream-canary
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'Mesh-LLM/mesh-llm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      mesh_source: ${{ steps.resolve.outputs.mesh_source }}
      source: ${{ steps.resolve.outputs.source }}
      upstream: ${{ steps.resolve.outputs.upstream }}
      changed: ${{ steps.resolve.outputs.changed }}
      certify: ${{ steps.resolve.outputs.certify }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze trusted source and requested upstream
        id: resolve
        env:
          UPSTREAM: ${{ inputs.upstream_sha }}
          FORCE: ${{ inputs.force_certify }}
          MESH_REF: ${{ inputs.mesh_ref }}
        run: |
          set -euo pipefail
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$MESH_REF" ]]; then
            python3 scripts/llama-canary-resolve-mesh-ref.py
            exit 0
          fi
          pins=()
          for pin in third_party/llama.cpp/upstream.txt skippy/llama_cpp/upstream.txt; do
            if [[ -f "$pin" ]]; then pins+=("$pin"); fi
          done
          if [[ "${#pins[@]}" != 1 ]]; then
            echo "expected exactly one llama.cpp pin in the source checkout" >&2
            exit 1
          fi
          old="$(tr -d '[:space:]' < "${pins[0]}")"
          upstream="$UPSTREAM"
          if [[ -z "$upstream" || "$upstream" == latest ]]; then
            upstream="$(git ls-remote https://github.com/ggml-org/llama.cpp.git master | awk '{print $1}')"
          fi
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]]
          changed=false
          mode=pinned-build
          certify=false
          if [[ "$old" != "$upstream" ]]; then
            changed=true
            mode=repair-build
          fi
          if [[ "$changed" == true || "$FORCE" == true || "$GITHUB_EVENT_NAME" == schedule ]]; then
            certify=true
          fi
          {
            echo "source=$(git rev-parse HEAD)"
            echo "upstream=$upstream"
            echo "changed=$changed"
            echo "mode=$mode"
            echo "certify=$certify"
          } >> "$GITHUB_OUTPUT"

  preflight:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.certify == 'true' }}
    runs-on: [self-hosted, family-certify]
    timeout-minutes: 30
    env:
      CANARY_SOURCE_ROOT: ${{ github.workspace }}${{ needs.resolve.outputs.mesh_source != '' && '/canary-source' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - name: Check out explicitly trusted certification source
        if: needs.resolve.outputs.mesh_source != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.mesh_source }}
          path: canary-source
          persist-credentials: false
      - uses: ./.github/actions/use-canary-cache
      - name: Verify immutable family plan and pinned cache
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py preflight \
            --root "$CANARY_SOURCE_ROOT" --output "$RUNNER_TEMP/llama-canary-preflight/plan.json"
      - name: Upload environment preflight evidence
        id: upload_evidence
        if: ${{ success() || failure() || cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-canary-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llama-canary-preflight/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean environment preflight outputs
        if: ${{ success() || failure() || cancelled() }}
        timeout-minutes: 5
        env:
          EVIDENCE_UPLOADED: ${{ steps.upload_evidence.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/cleanup-self-hosted.py --job canary-preflight \
            --evidence-uploaded "$EVIDENCE_UPLOADED"

  repair_1:
    needs: [resolve, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      mesh_source: ${{ needs.resolve.outputs.mesh_source }}
      pass_id: repair-1
      mode: ${{ needs.resolve.outputs.mode }}

  verify_1:
    needs: [resolve, repair_1]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.repair_1.outputs.green == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: verify-1
      mode: verify-build
      previous_package: ${{ needs.repair_1.outputs.package }}
      previous_identity: ${{ needs.repair_1.outputs.identity }}
      previous_head: ${{ needs.repair_1.outputs.head }}

  attempt_1:
    needs: [resolve, repair_1, verify_1]
    if: ${{ !cancelled() && needs.resolve.outputs.certify == 'true' }}
    runs-on: ubuntu-24.04
    outputs: &attempt_outputs
      state: ${{ steps.select.outputs.state }}
      green: ${{ steps.select.outputs.green }}
      repairable: ${{ steps.select.outputs.repairable }}
      resume_package: ${{ steps.select.outputs.resume_package }}
      resume_identity: ${{ steps.select.outputs.resume_identity }}
      resume_head: ${{ steps.select.outputs.resume_head }}
      resume_feedback: ${{ steps.select.outputs.resume_feedback }}
      failure_class: ${{ steps.select.outputs.failure_class }}
      failure_stage: ${{ steps.select.outputs.failure_stage }}
      package: ${{ steps.select.outputs.package }}
      identity: ${{ steps.select.outputs.identity }}
      head: ${{ steps.select.outputs.head }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - name: Select distributed repair attempt 1
        id: select
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          REPAIR_JSON: ${{ toJSON(needs.repair_1) }}
          VERIFY_JSON: ${{ toJSON(needs.verify_1) }}
        run: python3 scripts/llama-canary-select-attempt.py attempt --changed "$CHANGED" --repair-json "$REPAIR_JSON" --verification-json "$VERIFY_JSON"

  repair_2:
    needs: [resolve, attempt_1]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.attempt_1.outputs.state == 'repairable' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: repair-2
      mode: repair-build
      previous_package: ${{ needs.attempt_1.outputs.resume_package }}
      previous_identity: ${{ needs.attempt_1.outputs.resume_identity }}
      previous_head: ${{ needs.attempt_1.outputs.resume_head }}
      previous_feedback: ${{ needs.attempt_1.outputs.resume_feedback }}

  verify_2:
    needs: [resolve, repair_2]
    if: ${{ !cancelled() && needs.repair_2.outputs.green == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: verify-2
      mode: verify-build
      previous_package: ${{ needs.repair_2.outputs.package }}
      previous_identity: ${{ needs.repair_2.outputs.identity }}
      previous_head: ${{ needs.repair_2.outputs.head }}

  attempt_2:
    needs: [resolve, attempt_1, repair_2, verify_2]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.attempt_1.outputs.state == 'repairable' }}
    runs-on: ubuntu-24.04
    outputs: *attempt_outputs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - name: Select distributed repair attempt 2
        id: select
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          REPAIR_JSON: ${{ toJSON(needs.repair_2) }}
          VERIFY_JSON: ${{ toJSON(needs.verify_2) }}
        run: python3 scripts/llama-canary-select-attempt.py attempt --changed "$CHANGED" --repair-json "$REPAIR_JSON" --verification-json "$VERIFY_JSON"

  repair_3:
    needs: [resolve, attempt_2]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.attempt_2.outputs.state == 'repairable' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: repair-3
      mode: repair-build
      previous_package: ${{ needs.attempt_2.outputs.resume_package }}
      previous_identity: ${{ needs.attempt_2.outputs.resume_identity }}
      previous_head: ${{ needs.attempt_2.outputs.resume_head }}
      previous_feedback: ${{ needs.attempt_2.outputs.resume_feedback }}

  verify_3:
    needs: [resolve, repair_3]
    if: ${{ !cancelled() && needs.repair_3.outputs.green == 'true' }}
    uses: ./.github/workflows/llama-canary-family-pass.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      upstream: ${{ needs.resolve.outputs.upstream }}
      pass_id: verify-3
      mode: verify-build
      previous_package: ${{ needs.repair_3.outputs.package }}
      previous_identity: ${{ needs.repair_3.outputs.identity }}
      previous_head: ${{ needs.repair_3.outputs.head }}

  attempt_3:
    needs: [resolve, attempt_2, repair_3, verify_3]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.attempt_2.outputs.state == 'repairable' }}
    runs-on: ubuntu-24.04
    outputs: *attempt_outputs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - name: Select distributed repair attempt 3
        id: select
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          REPAIR_JSON: ${{ toJSON(needs.repair_3) }}
          VERIFY_JSON: ${{ toJSON(needs.verify_3) }}
        run: python3 scripts/llama-canary-select-attempt.py attempt --changed "$CHANGED" --repair-json "$REPAIR_JSON" --verification-json "$VERIFY_JSON"

  result:
    needs: [resolve, preflight, attempt_1, attempt_2, attempt_3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.result.outputs.package }}
      identity: ${{ steps.result.outputs.identity }}
      head: ${{ steps.result.outputs.head }}
      branch: ${{ steps.result.outputs.branch }}
      publish: ${{ steps.result.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - name: Require complete certification and independent verification
        id: result
        env:
          CERTIFY: ${{ needs.resolve.outputs.certify }}
          CHANGED: ${{ needs.resolve.outputs.changed }}
          MESH_SOURCE: ${{ needs.resolve.outputs.mesh_source }}
          PREFLIGHT: ${{ needs.preflight.result }}
          ATTEMPTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-select-attempt.py final \
            --certify "$CERTIFY" --changed "$CHANGED" --mesh-source "$MESH_SOURCE" \
            --preflight "$PREFLIGHT" --attempts-json "$ATTEMPTS_JSON"

  publish-certified-canary:
    needs: [resolve, result]
    if: ${{ needs.result.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.result.outputs.package }}
          path: ${{ runner.temp }}/certified-canary
      - name: Verify final handoff and write evidence summary
        env:
          IDENTITY: ${{ needs.result.outputs.identity }}
          CANARY_CONTROLLER_SHA: ${{ needs.resolve.outputs.source }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py publication --package "$RUNNER_TEMP/certified-canary" --identity "$IDENTITY"
      - name: Publish ready pull request
        id: publish
        env:
          CANARY_BRANCH: ${{ needs.result.outputs.branch }}
          CANARY_CERTIFIED_SHA: ${{ needs.result.outputs.head }}
          CANARY_BUNDLE: ${{ runner.temp }}/certified-canary/candidate.bundle
          CANARY_PR_BODY: ${{ runner.temp }}/certified-canary/pr-body.md
          CANARY_REPAIR_TOKEN: ${{ secrets.CANARY_REPAIR_TOKEN }}
        run: scripts/llama-canary-publish.sh

  alert-consecutive-failures:
    name: Alert after consecutive scheduled failures
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: [resolve, result, publish-certified-canary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Reconcile consecutive-failure alert
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          REPAIR_RESULT: ${{ needs.result.result }}
          VERIFY_RESULT: ${{ needs.result.result }}
          PUBLISH_RESULT: ${{ needs.publish-certified-canary.result }}
        with:
          script: |
            const marker = '<!-- llama-upstream-canary-consecutive-failure-alert -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentResult = process.env.REPAIR_RESULT === 'success'
              && (process.env.CHANGED !== 'true'
                || (process.env.VERIFY_RESULT === 'success'
                  && process.env.PUBLISH_RESULT === 'success'))
              ? 'success'
              : 'failure';
            const currentUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'component: ci',
              per_page: 100,
            });
            const alert = issues.find((issue) => (issue.body || '').includes(marker));

            if (currentResult === 'success') {
              if (alert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `Recovered: scheduled canary ${currentUrl} completed successfully.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'closed',
                });
              }
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'llama-upstream-canary.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            if (!previous || previous.conclusion === 'success') {
              return;
            }

            const previousUrl = previous.html_url;
            const body = [
              marker,
              'The llama.cpp upstream canary has produced two consecutive non-successful scheduled runs.',
              '',
              `- Current: ${currentUrl} (${currentResult})`,
              `- Previous: ${previousUrl} (${previous.conclusion})`,
              '',
              'Inspect the persistent runner and the earliest phase without progress before dispatching another canary.',
            ].join('\n');
            if (alert) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: alert.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: '[CI] llama.cpp upstream canary failing repeatedly',
                body,
                labels: ['component: ci'],
              });
            }
