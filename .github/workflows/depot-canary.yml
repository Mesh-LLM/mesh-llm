name: Depot Runner Canary

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: depot-runner-canary
  cancel-in-progress: false

jobs:
  runner:
    name: ${{ matrix.runner }}
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - depot-ubuntu-24.04
          - depot-ubuntu-24.04-4
          - depot-ubuntu-24.04-8
          - depot-ubuntu-24.04-16
          - depot-ubuntu-24.04-arm
          - depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Verify ephemeral runner resources
        shell: bash
        env:
          CANARY_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail

          expected_arch=x86_64
          if [[ "$CANARY_RUNNER_LABEL" == *-arm* ]]; then
            expected_arch=aarch64
          fi
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$expected_arch" ]]; then
            echo "runner architecture mismatch: expected $expected_arch, got $actual_arch" >&2
            exit 1
          fi
          if [[ -z "${ImageOS:-}" || -z "${ImageVersion:-}" ]]; then
            echo "Depot runner image identity was not injected" >&2
            exit 1
          fi

          # Automatic Depot Cache and Registry Actions connectivity is
          # intentionally disabled. Fail closed if the runner still receives
          # any Depot cache/registry authority or transparently redirects the
          # GitHub cache service. Names are checked without printing values.
          depot_selected=true
          allow_native_github_cache=false
          allow_depot_remote_cache=false
          if [[ "$depot_selected" != "true" ||
                "$allow_native_github_cache" != "false" ||
                "$allow_depot_remote_cache" != "false" ]]; then
            echo "canary cache policy is inconsistent (cache policy)" >&2
            exit 1
          fi
          forbidden_names=(
            DEPOT_CACHE_TOKEN
            DEPOT_CACHE_URL
            DEPOT_CACHE_API_URL
            DEPOT_TOKEN
            DEPOT_REGISTRY_HOST
            DEPOT_REGISTRY_URL
            DEPOT_REGISTRY_PULL_TOKEN
            DEPOT_REGISTRY_TOKEN
            SCCACHE_WEBDAV_ENDPOINT
            SCCACHE_WEBDAV_TOKEN
            SCCACHE_WEBDAV_USERNAME
            SCCACHE_WEBDAV_PASSWORD
            SCCACHE_BUCKET
            SCCACHE_ENDPOINT
            TURBO_TOKEN
            TURBO_API
            TURBO_TEAM
            GOCACHEPROG
            REGISTRY_TOKEN
            REGISTRY_USERNAME
            REGISTRY_PASSWORD
            REGISTRY_AUTH_TOKEN
            NPM_TOKEN
            NODE_AUTH_TOKEN
            CARGO_REGISTRIES_CRATES_IO_TOKEN
          )
          for name in "${forbidden_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              echo "forbidden Depot cache/registry setting was injected ($name)" >&2
              exit 1
            fi
          done

          endpoint_host() {
            local endpoint="$1"
            local authority="${endpoint#*://}"
            authority="${authority%%[/?#]*}"
            printf '%s' "$authority"
          }

          is_github_endpoint() {
            local endpoint="$1"
            local endpoint_lower
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            local authority
            authority="$(endpoint_host "$endpoint_lower")"
            [[ "$endpoint_lower" == https://* ]] || return 1
            [[ "$authority" != *"@"* ]] || return 1
            [[ "$authority" =~ ^([a-z0-9-]+\.)*actions\.githubusercontent\.com(:[0-9]{1,5})?$ ]]
          }

          is_loopback_endpoint() {
            local endpoint="$1"
            local endpoint_lower
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            # Loopback proxies require a numeric TCP port and an explicit path.
            if [[ ! "$endpoint_lower" =~ ^https?://(localhost|127\.0\.0\.1|\[::1\]):([0-9]{1,5})/[^[:space:]]*$ ]]; then
              return 1
            fi
            local port="${BASH_REMATCH[2]}"
            (( port >= 1 && port <= 65535 ))
          }

          endpoint_scheme() {
            local endpoint="$1"
            local endpoint_lower
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            case "$endpoint_lower" in
              https://*) printf 'https' ;;
              http://*) printf 'http' ;;
              *) printf 'other' ;;
            esac
          }

          endpoint_authority_class() {
            local endpoint="$1"
            local endpoint_lower
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            local authority
            authority="$(endpoint_host "$endpoint_lower")"
            if [[ "$authority" == *"@"* ]]; then
              printf 'other'
              return
            fi
            case "$authority" in
              localhost|localhost:*) printf 'localhost'; return ;;
              127.0.0.1|127.0.0.1:*) printf '127.0.0.1'; return ;;
              "[::1]"|"[::1]:"*) printf 'ipv6-loopback'; return ;;
            esac
            if [[ "$authority" =~ ^([a-z0-9-]+\.)*actions\.githubusercontent\.com(:[0-9]{1,5})?$ ]]; then
              printf 'github'
              return
            fi
            printf 'other'
          }

          endpoint_numeric_port() {
            local endpoint="$1"
            local endpoint_lower
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            local authority
            authority="$(endpoint_host "$endpoint_lower")"
            if [[ "$authority" != *"@"* ]] && [[ "$authority" =~ :[0-9]+$ ]]; then
              printf 'present'
            else
              printf 'absent'
            fi
          }

          endpoint_explicit_path() {
            local endpoint="$1"
            local endpoint_lower
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            case "$endpoint_lower" in
              *://*) ;;
              *) printf 'absent'; return ;;
            esac
            local remainder="${endpoint_lower#*://}"
            local authority="${remainder%%[/?#]*}"
            local suffix="${remainder#"$authority"}"
            if [[ "$suffix" == /* ]]; then
              printf 'present'
            else
              printf 'absent'
            fi
          }

          report_endpoint_rejection() {
            local endpoint_name="$1"
            local endpoint="$2"
            local scheme_label
            scheme_label="$(endpoint_scheme "$endpoint")"
            local authority_label
            authority_label="$(endpoint_authority_class "$endpoint")"
            local numeric_port_label
            numeric_port_label="$(endpoint_numeric_port "$endpoint")"
            local explicit_path_label
            explicit_path_label="$(endpoint_explicit_path "$endpoint")"
            printf 'GitHub Actions endpoint rejected (variable=%s scheme=%s authority=%s numeric_port=%s explicit_path=%s)\n' \
              "$endpoint_name" "$scheme_label" "$authority_label" \
              "$numeric_port_label" "$explicit_path_label" >&2
          }

          for endpoint_name in ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_RUNTIME_URL; do
            endpoint="${!endpoint_name:-}"
            if [[ -z "$endpoint" ]]; then
              continue
            fi
            endpoint_lower="$(printf '%s' "$endpoint" | tr '[:upper:]' '[:lower:]')"
            # The endpoint may be the expected runner-local inert proxy.
            # Never accept arbitrary remote endpoints, URL userinfo, or
            # lookalike host suffixes.
            authority="$(endpoint_host "$endpoint_lower")"
            if [[ "$endpoint_lower" == *depot.dev* ]]; then
              report_endpoint_rejection "$endpoint_name" "$endpoint"
              exit 1
            fi
            if [[ "$authority" == *"@"* ]]; then
              report_endpoint_rejection "$endpoint_name" "$endpoint"
              exit 1
            fi
            if ! is_github_endpoint "$endpoint" &&
               ! is_loopback_endpoint "$endpoint"; then
              report_endpoint_rejection "$endpoint_name" "$endpoint"
              exit 1
            fi
          done
          docker_auth_config="${DOCKER_AUTH_CONFIG:-}"
          if [[ -n "$docker_auth_config" ]]; then
            echo "Docker registry authentication is configured (DOCKER_AUTH_CONFIG)" >&2
            exit 1
          fi
          docker_home="${HOME:-}"
          docker_config="${DOCKER_CONFIG:-$docker_home/.docker}/config.json"
          if [[ -f "$docker_config" ]] &&
             grep -Eiq '"(auths|credHelpers|credsStore)"[[:space:]]*:' \
               "$docker_config"; then
            echo "Docker registry authentication is configured (config.json)" >&2
            exit 1
          fi

          {
            echo "### ${{ matrix.runner }}"
            echo
            echo "| Signal | Value |"
            echo "| --- | --- |"
            printf '| architecture | %s |\n' "$(uname -m)"
            printf '| logical CPUs | %s |\n' "$(nproc)"
            printf '| memory KiB | %s |\n' "$(awk '/MemTotal/ { print $2 }' /proc/meminfo)"
            printf '| workspace free KiB | %s |\n' "$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
            printf '| runner image | %s %s |\n' "$ImageOS" "$ImageVersion"
            echo "| Depot cache credentials/endpoints injected | no |"
            echo "| Depot registry credentials/config injected | no |"
            echo "| GitHub cache transparently redirected to Depot | no |"
          } >> "$GITHUB_STEP_SUMMARY"
