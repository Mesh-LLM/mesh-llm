name: CI Platform Checks Slice

on:
  workflow_call:
    inputs:
      authority_linux_x64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_linux_arm64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_macos_arm64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_windows_x64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      platform_checks_matrix:
        description: JSON platform-check rows from the versioned CI plan.
        required: true
        type: string
      profile:
        description: Semantic profile represented by the platform rows.
        required: true
        type: string
      original_event_name:
        description: Original event used to derive isolated cache-write policy.
        required: true
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      max_parallel:
        description: Platform worker budget.
        required: false
        default: 2
        type: number
      fail_fast:
        description: Cancel sibling functional checks after the first required failure.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CACHE_NAMESPACE: mesh-llm
  LLAMA_STAGE_BACKEND: metal
  LLAMA_STAGE_BUILD_DIR: .deps/llama-build/build-stage-abi-static-metal
  MESH_LLM_SKIP_UI: "1"

jobs:
  runner_policy:
    name: Select platform-check runner
    if: ${{ inputs.platform_checks_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_macos: ${{ steps.policy.outputs.runner_macos }}
      runner_windows: ${{ steps.policy.outputs.runner_windows }}
      runner_by_platform: ${{ steps.platform_runners.outputs.runner_by_platform }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for platform checks
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}
      - name: Map platform runners explicitly
        id: platform_runners
        env:
          RUNNER_MACOS: ${{ steps.policy.outputs.runner_macos }}
          RUNNER_WINDOWS: ${{ steps.policy.outputs.runner_windows }}
        run: |
          set -euo pipefail
          printf 'runner_by_platform={"macos":"%s","windows":"%s"}\n' \
            "$RUNNER_MACOS" "$RUNNER_WINDOWS" >> "$GITHUB_OUTPUT"

  platform_checks:
    name: Platform checks (${{ matrix.check.id }})
    needs: runner_policy
    if: ${{ inputs.platform_checks_matrix != '[]' }}
    runs-on: ${{ fromJSON(needs.runner_policy.outputs.runner_by_platform)[matrix.check.platform] }}
    timeout-minutes: 75
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        check: ${{ fromJson(inputs.platform_checks_matrix) }}
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(fromJSON(needs.runner_policy.outputs.runner_by_platform)[matrix.check.platform], 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-short-paths
        if: ${{ matrix.check.platform == 'windows' }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Configure macOS linker
        if: ${{ matrix.check.platform == 'macos' }}
        uses: ./.github/actions/setup-macos-lld
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ matrix.check.platform == 'windows' }}
      - uses: ./.github/actions/configure-sccache-gha
        if: ${{ matrix.check.platform == 'windows' }}
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ matrix.check.platform == 'windows' }}
        with:
          arch: x64
      - name: Check neutral host on macOS
        if: ${{ matrix.check.platform == 'macos' && matrix.check.kind != 'unit' }}
        run: cargo check --locked -p mesh-llm --bin mesh-llm --no-default-features --features web-ui,dynamic-native-runtime
      - name: Check neutral host and Node SDK on Windows
        if: ${{ matrix.check.kind == 'portable' && matrix.check.platform == 'windows' }}
        shell: pwsh
        env:
          CI_PROFILE: ${{ inputs.profile }}
        run: |
          cargo check --locked -p mesh-llm --bin mesh-llm --no-default-features --features web-ui,dynamic-native-runtime
          cargo check --locked -p mesh-llm-nodejs
          if ($env:CI_PROFILE -eq 'main' -or $env:CI_PROFILE -eq 'manual-full') {
            cargo build --release --locked -p mesh-llm-nodejs
          }
      - name: Test Windows log artifact privacy ACL
        if: ${{ matrix.check.kind == 'log-store' }}
        shell: pwsh
        run: cargo test --locked -p mesh-llm-log-store --lib windows_artifact_paths_have_current_owner_and_exact_user_only_dacl
      - name: Test Windows log SQLite storage ACL
        if: ${{ matrix.check.kind == 'log-store' }}
        shell: pwsh
        run: cargo test --locked -p mesh-llm-log-store --lib sqlite_root_database_and_sidecars_have_only_current_user_acl
      - name: Install macOS unit-test dependencies
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' }}
        run: brew install cmake ninja jq
      - name: Resolve macOS unit-test toolchain epoch
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' }}
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          include_tool_versions: "true"
      - name: Prepare patched llama.cpp ABI checkout
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' }}
        run: scripts/prepare-llama.sh pinned
      - name: Identify patched llama.cpp for cache reuse
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' }}
        id: patched_llama
        shell: bash
        run: |
          set -euo pipefail
          patched_sha="$(tr -d '[:space:]' < .deps/llama.cpp/.mesh-llm-patched-sha)"
          [[ "$patched_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$patched_sha" >> "$GITHUB_OUTPUT"
      - name: Ensure static Metal ABI cache directory
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' }}
        run: mkdir -p "$LLAMA_STAGE_BUILD_DIR"
      - name: Restore static Metal ABI build
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' && needs.runner_policy.outputs.allow_native_github_cache == 'true' }}
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          key: ${{ env.CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-skippy-abi-static-metal-${{ steps.native_toolchain.outputs.epoch }}-${{ steps.patched_llama.outputs.sha }}-${{ hashFiles('scripts/build-mac.sh', 'mesh/scripts/build-mac.sh', 'scripts/build-llama.sh', 'skippy/scripts/build-llama.sh', 'scripts/prepare-llama.sh', 'skippy/scripts/prepare-llama.sh', 'third_party/llama.cpp/upstream.txt', 'skippy/third_party/llama.cpp/upstream.txt', 'skippy/llama_cpp/upstream.txt', 'third_party/llama.cpp/patches/**', 'skippy/third_party/llama.cpp/patches/**', 'skippy/llama_cpp/patches/**', 'Justfile', 'just/**', '.github/cache-version.txt') }}
      - name: Verify cached patched llama.cpp ABI libraries
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' && steps.llama_cache.outputs.cache-hit == 'true' }}
        run: scripts/build-llama.sh --require-existing
      - name: Build patched llama.cpp ABI libraries
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' && steps.llama_cache.outputs.cache-hit != 'true' }}
        run: scripts/build-llama.sh
      - name: Save static Metal ABI build
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' && needs.runner_policy.outputs.allow_native_github_cache == 'true' && steps.llama_cache.outputs.cache-hit != 'true' && (inputs.original_event_name == 'pull_request' || (github.ref == 'refs/heads/main' && inputs.original_event_name != 'pull_request_target')) }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          key: ${{ steps.llama_cache.outputs.cache-primary-key }}
      - name: Resolve platform unit-test owners
        if: ${{ matrix.check.kind == 'unit' }}
        id: packages
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-cargo-packages@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
        with:
          generation: legacy
          crates: '["model-artifact","mesh-llm-host-runtime","mesh-llm"]'
      - name: Resolve Windows unit-test owners
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'windows' }}
        id: windows_packages
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-cargo-packages@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
        with:
          generation: current
          # The `platform-windows-cfg` catalog routes these crates to the
          # Windows unit row because they carry their own cfg(windows)/cfg(unix)
          # code, so they run here without widening the shared macOS owners.
          # The catalog also carries `mesh-llm-host-runtime`, whose only job
          # there is to *select* this row when that crate changes; it is a
          # shared owner already resolved by the step above, so it is
          # deliberately absent here rather than run twice.
          crates: '["mesh-llm-analytics","mesh-llm-config","mesh-llm-events","mesh-llm-identity","mesh-llm-payments","mesh-llm-plugin","mesh-llm-plugin-manager","mesh-llm-tui","mesh-llm-ui","mesh-llm-wallet","skippy-cache"]'
      - name: Run macOS unit tests
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'macos' }}
        env:
          TEST_CRATES: ${{ steps.packages.outputs.crates }}
        run: |
          set -euo pipefail
          while IFS= read -r crate; do
            cargo test --locked -p "$crate" --lib
          done < <(jq -r '.[]' <<<"$TEST_CRATES")
      - name: Resolve Windows dynamic-runtime unit-test owners
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'windows' }}
        id: windows_dynamic_packages
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-cargo-packages@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
        with:
          generation: legacy
          # Also routed by `platform-windows-cfg`, but these reach `skippy-ffi`
          # through `mesh-llm-system/skippy-devices`, which builds it without its
          # dynamic loader. A crate-scoped test build then stops on the static
          # llama archives this row does not prepare, so the run step below
          # turns on `mesh-llm-system/dynamic-native-runtime` for them.
          crates: '["mesh-llm-commands","mesh-llm-system"]'
      - name: Run Windows unit tests
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'windows' }}
        shell: pwsh
        env:
          TEST_CRATES: ${{ steps.packages.outputs.crates }}
          WINDOWS_TEST_CRATES: ${{ steps.windows_packages.outputs.crates }}
          WINDOWS_DYNAMIC_TEST_CRATES: ${{ steps.windows_dynamic_packages.outputs.crates }}
        run: |
          # The macOS unit row's shared source-owner suites, resolved through
          # the same package resolver, plus the crates the
          # `platform-windows-cfg` catalog routes to this row only. They run in
          # the dynamic link mode the shipped Windows host uses, so no native
          # ABI build is needed. pwsh does not stop on a failing native command,
          # hence the explicit exit check after each one.
          $crates = @($env:TEST_CRATES | ConvertFrom-Json) + @($env:WINDOWS_TEST_CRATES | ConvertFrom-Json)
          foreach ($crate in $crates) {
            if ($crate -eq 'mesh-llm-skippy-adapter') {
              # The adapter reaches skippy-ffi without the dynamic loader by
              # default. Windows unit tests do not prepare static llama ABI.
              cargo test --locked -p $crate --lib --features mesh-llm-skippy-adapter/dynamic-native-runtime
            } else {
              cargo test --locked -p $crate --lib
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Feature unification turns on `skippy-ffi`'s `dynamic-runtime`, whose
          # build script returns early (CONTRIBUTING, "Testing crates on native
          # Windows"). Each of these crates is `mesh-llm-system` or depends on
          # it directly, so the feature name resolves for every one.
          foreach ($crate in @($env:WINDOWS_DYNAMIC_TEST_CRATES | ConvertFrom-Json)) {
            cargo test --locked -p $crate --lib --features mesh-llm-system/dynamic-native-runtime
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare Windows automation contract tools
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'windows' }}
        id: windows_automation
        uses: ./.github/actions/prepare-automation
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Run native Windows automation contracts
        if: ${{ matrix.check.kind == 'unit' && matrix.check.platform == 'windows' }}
        timeout-minutes: 20
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ steps.windows_automation.outputs.target_directory }}
          RUST_MIN_STACK: "8388608"
        run: |
          $ErrorActionPreference = "Stop"
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [System.Runtime.InteropServices.Architecture]::X64) { throw "native Windows x64 contracts require x64" }
          Get-Command just -ErrorAction Stop | Out-Null
          $justVersion = @(just --version)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $justVersion | Write-Host
          if ($justVersion.Count -ne 1 -or $justVersion[0] -notmatch '^just ([0-9]+\.[0-9]+\.[0-9]+)$') { throw "cannot determine installed Just version" }
          if ([version]$Matches[1] -lt [version]'1.32.0') { throw "recipe-local script requires Just >=1.32" }
          Get-Command sccache -ErrorAction Stop | Out-Null
          just with-lld cargo build --locked -p xtask --bin xtask --example migration_generator_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            "ci_validation::windows_runtime::tests::native::native_windows_build_directory_tracks_prepared_pin_and_explicit_override",
            "ci_validation::windows_runtime::tests::native::native_windows_bash_paths_preserve_repo_case_and_distinguish_git_bash_from_wsl",
            "ci_validation::windows_runtime::tests::native::native_windows_relative_llama_override_is_bound_to_repo_not_process_directory",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_interactive_runs_setup_and_warns_for_legacy_flavor",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_noninteractive_prints_setup_and_installs_runtime",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_no_setup_prints_command_without_executing_setup",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_tampered_host_digest_preserves_existing_install",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_removes_stale_host_imports_when_bundle_omits_it",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_failed_runtime_replacement_restores_previous_product",
            "ci_validation::windows_runtime::tests::installer::native::native_windows_installer_stale_cleanup_failure_keeps_committed_new_product",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_interactive_runs_setup_and_warns_for_legacy_flavor",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_noninteractive_prints_setup_and_installs_runtime",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_no_setup_prints_command_without_executing_setup",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_tampered_host_digest_preserves_existing_install",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_removes_stale_host_imports_when_bundle_omits_it",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_failed_runtime_replacement_restores_previous_product",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_stale_cleanup_failure_keeps_committed_new_product",
            "ci_validation::windows_runtime::tests::installer::consumer::native_windows_consumer_help_and_missing_cli_value_avoid_download_and_mutation",
            "automation::private_state::deletion::tests::windows_transient_handle_lock_is_removed_after_release",
            "automation::private_state::deletion::tests::windows_persistent_handle_lock_retains_log_and_reports_failure"
          )
          if ($expected.Count -ne 20 -or @($expected | Select-Object -Unique).Count -ne 20) { throw "native Windows contract roster must contain twenty distinct methods" }
          $verified = 0
          foreach ($method in $expected) {
            $listing = @(just with-lld cargo test --locked -p xtask --bin xtask $method -- --exact --list)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actual = @($listing | Where-Object { $_ -match '^(.+): test$' } | ForEach-Object { $_ -replace ': test$', '' })
            if ($actual.Count -ne 1 -or $actual[0] -ne $method) { throw "native Windows method was not selected exactly: $method" }
            $listing | Write-Host
            $result = @(just with-lld cargo test --locked -p xtask --bin xtask $method -- --exact --test-threads=1)
            if ($LASTEXITCODE -ne 0) { $result | Write-Host; exit $LASTEXITCODE }
            $result | Write-Host
            if (@($result | Where-Object { $_ -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw "native Windows method must pass without an ignored test: $method" }
            $verified++
          }
          if ($verified -ne 20) { throw "all twenty native Windows methods must be verified" }
          $wrapper = "ci_validation::windows_runtime::tests::with_lld::windows_with_lld_propagates_native_failure_and_success"
          $wrapperListing = @(just with-lld cargo test --locked -p xtask --bin xtask $wrapper -- --exact --list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($wrapperListing | Where-Object { $_ -eq "$($wrapper): test" }).Count -ne 1) { throw "Windows wrapper regression method was not selected" }
          $wrapperResult = @(just with-lld cargo test --locked -p xtask --bin xtask $wrapper -- --exact --test-threads=1)
          if ($LASTEXITCODE -ne 0) { $wrapperResult | Write-Host; exit $LASTEXITCODE }
          $wrapperResult | Write-Host
          if (@($wrapperResult | Where-Object { $_ -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw "native Windows wrapper regression must pass without an ignored test" }
