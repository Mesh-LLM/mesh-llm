name: Warm Windows ABI CI caches

on:
  push:
    branches: [main]
    paths:
      - 'third_party/llama.cpp/upstream.txt'
      - 'third_party/llama.cpp/patches/**'
      - 'scripts/build-llama.sh'
      - 'scripts/prepare-llama.sh'
      - 'scripts/package-native-runtime.sh'
      - 'scripts/verify-native-runtime-package.sh'
      - 'scripts/verify-checksum-sidecar.py'
      - 'scripts/safe-extract-tar.py'
      - 'scripts/windows-native-runtime-deps.py'
      - '.github/cache-version.txt'
      - '.github/actions/prepare-native-runtime-input/action.yml'
      - '.github/actions/resolve-native-toolchain-epoch/action.yml'
      - '.github/actions/setup-windows-rocm-sdk/action.yml'
      - '.github/actions/restore-windows-abi-cache/action.yml'
      - '.github/actions/save-and-verify-actions-cache/action.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pr_windows.yml'
      - '.github/workflows/windows-warm-caches.yml'
  workflow_dispatch:
    inputs:
      retention:
        description: 'Number of warmed Windows ABI cache versions to keep'
        required: false
        default: ''

concurrency:
  group: windows-warm-caches-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  CACHE_NAMESPACE: mesh-llm
  LLAMA_WINDOWS_CACHE_RETENTION: ${{ github.event.inputs.retention || vars.LLAMA_WINDOWS_CACHE_RETENTION || '2' }}
  WINDOWS_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
  MESH_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
  WINDOWS_VULKAN_SDK_VERSION: ${{ vars.VULKAN_SDK_VERSION || '1.4.328.1' }}
  ROCM_HIP_SDK_FILENAME: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe

jobs:
  warm_windows_cpu:
    name: Warm Windows CPU ABI cache
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    env:
      LLAMA_STAGE_BACKEND: cpu
      LLAMA_STAGE_BUILD_DIR: .deps/llama-build/windows/build-stage-abi-cpu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Resolve Windows native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
      - name: Restore Windows CPU ABI cache
        id: llama_cache
        uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: cpu
          build_dir: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          allow-native-github-cache: "true"
      - name: Initialize MSVC for CPU runtime
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build and verify canonical Windows CPU runtime input
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: cpu
          target: x86_64-pc-windows-msvc
          output_dir: cache-runtime-input/cpu
      - name: Verify Windows CPU ABI cache
        shell: pwsh
        run: |
          $stamp = Join-Path $env:LLAMA_STAGE_BUILD_DIR ".mesh-llm-build-stamp"
          python scripts/verify-static-abi-build-stamp.py `
            $stamp `
            --backend cpu `
            --link-mode dynamic `
            --stamp-version 3 `
            --toolchain-epoch $env:MESH_LLM_LLAMA_TOOLCHAIN_EPOCH
          $requiredLibraries = @{
            llama = @("llama.dll", "libllama.dll")
            common = @("llama-common.dll", "libllama-common.dll")
            mtmd = @("mtmd.dll", "libmtmd.dll")
          }
          foreach ($entry in $requiredLibraries.GetEnumerator()) {
            $library = Get-ChildItem `
              -Path $env:LLAMA_STAGE_BUILD_DIR `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object { $entry.Value -contains $_.Name } |
              Select-Object -First 1
            if (-not $library) {
              throw (
                "Windows CPU ABI cache is missing $($entry.Key): " +
                "$($entry.Value -join ', ')"
              )
            }
            Write-Host $library.FullName
          }
      - name: Save and verify Windows CPU ABI cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-and-verify-actions-cache
        with:
          path: ${{ steps.llama_cache.outputs.cache-path }}
          cache-key: ${{ steps.llama_cache.outputs.cache-primary-key }}
          cache-ref: ${{ github.ref }}
          cache-label: Windows CPU ABI

  warm_windows_gpu:
    name: Warm Windows ${{ matrix.name }} ABI cache
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    env:
      LLAMA_STAGE_BUILD_DIR: .deps/llama-build/windows/build-stage-abi-${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA
            backend: cuda
            build_args: "75"
          - name: ROCm
            backend: rocm
            build_args: "gfx1100"
          - name: Vulkan
            backend: vulkan
            build_args: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Resolve Windows native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
      - name: Restore Windows GPU ABI cache
        id: llama_cache
        uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: ${{ matrix.backend }}
          build_dir: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ matrix.build_args }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Install CUDA toolkit
        if: ${{ matrix.backend == 'cuda' && steps.llama_cache.outputs.cache-hit != 'true' }}
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.WINDOWS_CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: true
          use-local-cache: true
          log-file-suffix: windows-cuda
      - name: Verify CUDA toolkit
        if: ${{ matrix.backend == 'cuda' && steps.llama_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH -or -not (Test-Path $env:CUDA_PATH)) {
            throw "CUDA_PATH was not configured by Jimver/cuda-toolkit."
          }
          & nvcc --version
          foreach ($library in @("cuda.lib", "cudart.lib", "cublas.lib", "cublasLt.lib")) {
            $path = Join-Path $env:CUDA_PATH "lib\x64\$library"
            if (-not (Test-Path $path)) {
              throw "Expected CUDA import library was not found: $path"
            }
          }
      - name: Install Vulkan SDK
        if: ${{ matrix.backend == 'vulkan' && steps.llama_cache.outputs.cache-hit != 'true' }}
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - name: Verify Vulkan SDK
        if: ${{ matrix.backend == 'vulkan' && steps.llama_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            throw "VULKAN_SDK was not configured by jakoch/install-vulkan-sdk-action."
          }
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"
          if (-not (Test-Path $glslc)) {
            throw "glslc.exe was not found at $glslc"
          }
          & $glslc --version
          $vulkanLib = Join-Path $env:VULKAN_SDK "Lib\vulkan-1.lib"
          if (-not (Test-Path $vulkanLib)) {
            throw "Expected Vulkan import library was not found: $vulkanLib"
          }
      - name: Install ROCm HIP SDK
        if: ${{ matrix.backend == 'rocm' && steps.llama_cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-windows-rocm-sdk
        with:
          rocm-hip-sdk-filename: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Initialize MSVC for native runtime
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build and verify canonical Windows GPU runtime input
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.backend == 'cuda' && matrix.build_args || '' }}
          LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.backend == 'rocm' && matrix.build_args || '' }}
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.backend }}
          target: x86_64-pc-windows-msvc
          output_dir: cache-runtime-input/${{ matrix.backend }}
      - name: Verify Windows GPU ABI cache
        shell: pwsh
        env:
          CACHE_BACKEND: ${{ matrix.backend }}
        run: |
          $stamp = Join-Path $env:LLAMA_STAGE_BUILD_DIR ".mesh-llm-build-stamp"
          python scripts/verify-static-abi-build-stamp.py `
            $stamp `
            --backend $env:CACHE_BACKEND `
            --link-mode dynamic `
            --stamp-version 3 `
            --toolchain-epoch $env:MESH_LLM_LLAMA_TOOLCHAIN_EPOCH
          $requiredLibraries = @{
            llama = @("llama.dll", "libllama.dll")
            common = @("llama-common.dll", "libllama-common.dll")
            mtmd = @("mtmd.dll", "libmtmd.dll")
          }
          foreach ($entry in $requiredLibraries.GetEnumerator()) {
            $library = Get-ChildItem `
              -Path $env:LLAMA_STAGE_BUILD_DIR `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object { $entry.Value -contains $_.Name } |
              Select-Object -First 1
            if (-not $library) {
              throw (
                "Windows $env:CACHE_BACKEND ABI cache is missing " +
                "$($entry.Key): $($entry.Value -join ', ')"
              )
            }
            Write-Host $library.FullName
          }
      - name: Save and verify Windows GPU ABI cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-and-verify-actions-cache
        with:
          path: ${{ steps.llama_cache.outputs.cache-path }}
          cache-key: ${{ steps.llama_cache.outputs.cache-primary-key }}
          cache-ref: ${{ github.ref }}
          cache-label: Windows ${{ matrix.name }} ABI

  prune_windows_abi_caches:
    name: Prune old Windows ABI caches
    needs:
      - warm_windows_cpu
      - warm_windows_gpu
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Prune old Windows ABI caches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CACHE_NAMESPACE: ${{ env.CACHE_NAMESPACE }}
          RETENTION: ${{ env.LLAMA_WINDOWS_CACHE_RETENTION }}
          TARGET_REF: ${{ github.ref }}
        with:
          script: |
            const retention = parseInt(process.env.RETENTION, 10);
            const ref = process.env.TARGET_REF;
            const prefixes = [
              `${process.env.CACHE_NAMESPACE}-windows-2022-skippy-abi-cpu-`,
              `${process.env.CACHE_NAMESPACE}-windows-2022-skippy-abi-cuda-`,
              `${process.env.CACHE_NAMESPACE}-windows-2022-skippy-abi-rocm-`,
              `${process.env.CACHE_NAMESPACE}-windows-2022-skippy-abi-vulkan-`,
            ];

            if (!Number.isFinite(retention) || retention < 1) {
              core.setFailed(`LLAMA_WINDOWS_CACHE_RETENTION must be positive, got: "${process.env.RETENTION}"`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allCaches = [];
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner,
                repo,
                ref,
                per_page: 100,
                page,
                sort: 'created_at',
                direction: 'desc',
              });
              const pageCaches = data.actions_caches || [];
              allCaches.push(...pageCaches);
              if (pageCaches.length < 100) break;
            }

            for (const prefix of prefixes) {
              const matching = allCaches.filter((c) => c.key.startsWith(prefix));
              for (const cache of matching.slice(retention)) {
                await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                  owner,
                  repo,
                  cache_id: cache.id,
                });
              }
              core.notice(`Pruned ${Math.max(matching.length - retention, 0)} cache(s) for ${prefix}`);
            }
