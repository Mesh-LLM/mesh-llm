name: Windows ABI cache proof (branch-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-cache-proof-${{ github.ref }}
  cancel-in-progress: false
env:
  CACHE_NAMESPACE: mesh-llm
  SCCACHE_DIR: ${{ github.workspace }}/../.sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_MULTILEVEL_CHAIN: disk,gha
  SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY: ignore
jobs:
  build_native_runtime_windows_gpu:
    name: Build native runtime Windows x86_64 ${{ matrix.name }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    env:
      ROCM_HIP_SDK_FILENAME: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe
      WINDOWS_CUDA_VERSION: ${{ matrix.cuda_version || vars.CUDA_VERSION || '12.9.2' }}
      MESH_CUDA_VERSION: ${{ matrix.cuda_version || vars.CUDA_VERSION || '12.9.2' }}
      WINDOWS_VULKAN_SDK_VERSION: ${{ vars.VULKAN_SDK_VERSION || '1.4.328.1' }}
      LLAMA_STAGE_BUILD_DIR: .deps/llama-build/windows/build-stage-abi-${{ matrix.backend }}
      MESH_NATIVE_RUNTIME_TARGET: x86_64-pc-windows-msvc
      MESH_LLM_REQUIRE_SCCACHE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA 13
            backend: cuda
            rocm_architectures: ''
            cuda_major: '13'
            cuda_version: '13.1.2'
            cuda_architectures: '75;80;86;87;89;90;100;103;120;121'
            cuda_sub_packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
            artifact_name: cache-proof-windows-cuda13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-short-paths
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Resolve Windows native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
      - name: Restore exact Windows GPU ABI cache
        id: llama_cache
        uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: ${{ matrix.backend }}
          build_dir: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ matrix.cuda_architectures || matrix.rocm_architectures || '' }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Validate CUDA artifact contract
        if: ${{ matrix.backend == 'cuda' }}
        shell: pwsh
        env:
          EXPECTED_CUDA_MAJOR: ${{ matrix.cuda_major }}
        run: |
          $cudaVersion = "$env:WINDOWS_CUDA_VERSION".Trim()
          $cudaMajor = ($cudaVersion -split '\.', 2)[0]
          if ($cudaMajor -ne $env:EXPECTED_CUDA_MAJOR) {
            throw "This release lane publishes cuda$env:EXPECTED_CUDA_MAJOR-labelled artifacts, so the CUDA toolkit must be $env:EXPECTED_CUDA_MAJOR.x; got '$cudaVersion'."
          }
      - name: Install CUDA toolkit
        if: ${{ matrix.backend == 'cuda' }}
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ env.WINDOWS_CUDA_VERSION }}
          method: network
          sub-packages: ${{ matrix.cuda_sub_packages }}
          use-github-cache: true
          use-local-cache: true
          log-file-suffix: windows-cuda-native-runtime
      - name: Verify CUDA toolkit
        if: ${{ matrix.backend == 'cuda' }}
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH -or -not (Test-Path $env:CUDA_PATH)) {
            throw "CUDA_PATH was not configured by Jimver/cuda-toolkit."
          }
          & nvcc --version
      - name: Install Vulkan SDK
        if: ${{ matrix.backend == 'vulkan' }}
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - name: Verify Vulkan SDK
        if: ${{ matrix.backend == 'vulkan' }}
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            throw "VULKAN_SDK was not configured by jakoch/install-vulkan-sdk-action."
          }
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"
          if (-not (Test-Path $glslc)) {
            throw "glslc.exe was not found at $glslc"
          }
          & $glslc --version
      - name: Install ROCm HIP SDK
        if: ${{ matrix.backend == 'rocm' }}
        uses: ./.github/actions/setup-windows-rocm-sdk
        with:
          rocm-hip-sdk-filename: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Initialize MSVC for native runtime
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Package native runtime
        env:
          LLAMA_STAGE_BACKEND: ${{ matrix.backend }}
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.cuda_architectures }}
          LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.rocm_architectures }}
          MESH_LLM_CUDA_TOOLKIT_MAJOR: ${{ matrix.cuda_major || '12' }}
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.backend }}
          target: x86_64-pc-windows-msvc
          output_dir: dist/native-runtimes
          allow_native_github_cache: "true"
      - name: Save and verify Windows release ABI cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-and-verify-actions-cache
        with:
          path: ${{ steps.llama_cache.outputs.cache-path }}
          cache-key: ${{ steps.llama_cache.outputs.cache-primary-key }}
          cache-ref: ${{ github.ref }}
          cache-label: Windows release ABI
      - name: Upload native runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/native-runtimes/*.tar.gz
            dist/native-runtimes/*.sha256
          if-no-files-found: error
      - name: Verify compiler cache authority after runtime preparation
        shell: pwsh
        run: |
          if ($env:SCCACHE_GHA_ENABLED -ne 'true' -or $env:SCCACHE_MULTILEVEL_CHAIN -ne 'disk,gha') {
            throw "Nested preparation lost GitHub compiler-cache authority"
          }
          & sccache --show-stats
