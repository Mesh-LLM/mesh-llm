name: Warm Windows ABI CI caches
# ABI publication belongs to Main Windows. This entry verifies existing entries
# and prunes old generations, daily and on manual dispatch.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      retention:
        description: 'Maximum entries per active Windows ABI compatibility family'
        required: false
        default: ''
      workload:
        description: 'Existing cache workload to verify'
        required: true
        type: choice
        default: all
        options:
          - all
          - cpu

concurrency:
  group: windows-warm-caches-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  CACHE_NAMESPACE: mesh-llm
  LLAMA_WINDOWS_CACHE_RETENTION: ${{ github.event.inputs.retention || vars.LLAMA_WINDOWS_CACHE_RETENTION || '2' }}
  WINDOWS_CACHE_MAX_BYTES: '4294967296'
  WINDOWS_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
  MESH_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
  WINDOWS_VULKAN_SDK_VERSION: ${{ vars.VULKAN_SDK_VERSION || '1.4.328.1' }}
  ROCM_HIP_SDK_FILENAME: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe

jobs:
  warm_windows_cpu:
    name: Verify Windows CPU ABI cache
    outputs:
      toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
      input_hash: ${{ steps.llama_cache.outputs.input-hash }}
    if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.workload == 'all' || inputs.workload == 'cpu') }}
    runs-on: windows-2022
    env:
      LLAMA_STAGE_BACKEND: cpu
      LLAMA_STAGE_BUILD_DIR: .deps/llama-build/windows/build-stage-abi-cpu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-short-paths
      - uses: ./.github/actions/prepare-automation
        with:
          allow_native_github_cache: "true"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        # sccache 0.17+ expands Cargo's rustc argfile and exceeds the Windows
        # command-line limit with Rust 1.100's build-dir layout (os error 206,
        # mozilla/sccache#2787). 0.16.0 passes the argfile through.
        with:
          version: v0.16.0
      - name: Resolve Windows native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
      - name: Restore Windows CPU ABI cache
        id: llama_cache
        uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: cpu
          build_dir: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          allow-native-github-cache: "true"
      - name: Verify Windows CPU ABI cache
        shell: pwsh
        run: |
          $stamp = Join-Path $env:LLAMA_STAGE_BUILD_DIR ".mesh-llm-build-stamp"
          & cargo xtool prepared-input static-abi-stamp `
            $stamp `
            --backend cpu `
            --link-mode dynamic `
            --stamp-version 3 `
            --toolchain-epoch $env:MESH_LLM_LLAMA_TOOLCHAIN_EPOCH
          if ($LASTEXITCODE -ne 0) { throw "Windows CPU ABI stamp verification failed" }
          $requiredLibraries = @{
            llama = @("llama.dll", "libllama.dll")
            common = @("llama-common.dll", "libllama-common.dll")
            mtmd = @("mtmd.dll", "libmtmd.dll")
          }
          foreach ($entry in $requiredLibraries.GetEnumerator()) {
            $library = Get-ChildItem `
              -Path $env:LLAMA_STAGE_BUILD_DIR `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object { $entry.Value -contains $_.Name } |
              Select-Object -First 1
            if (-not $library) {
              throw (
                "Windows CPU ABI cache is missing $($entry.Key): " +
                "$($entry.Value -join ', ')"
              )
            }
            Write-Host $library.FullName
          }

  warm_windows_gpu:
    name: Verify Windows ${{ matrix.name }} ABI cache
    if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.workload == 'all') }}
    runs-on: windows-2022
    env:
      LLAMA_STAGE_BUILD_DIR: .deps/llama-build/windows/build-stage-abi-${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA
            backend: cuda
            build_args: "75"
          - name: ROCm
            backend: rocm
            build_args: "gfx1100"
          - name: Vulkan
            backend: vulkan
            build_args: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-short-paths
      - uses: ./.github/actions/prepare-automation
        with:
          allow_native_github_cache: "true"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        # sccache 0.17+ expands Cargo's rustc argfile and exceeds the Windows
        # command-line limit with Rust 1.100's build-dir layout (os error 206,
        # mozilla/sccache#2787). 0.16.0 passes the argfile through.
        with:
          version: v0.16.0
      - name: Resolve Windows native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
      - name: Restore Windows GPU ABI cache
        id: llama_cache
        uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: ${{ matrix.backend }}
          build_dir: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ matrix.build_args }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Verify Windows GPU ABI cache
        shell: pwsh
        env:
          CACHE_BACKEND: ${{ matrix.backend }}
        run: |
          $stamp = Join-Path $env:LLAMA_STAGE_BUILD_DIR ".mesh-llm-build-stamp"
          & cargo xtool prepared-input static-abi-stamp `
            $stamp `
            --backend $env:CACHE_BACKEND `
            --link-mode dynamic `
            --stamp-version 3 `
            --toolchain-epoch $env:MESH_LLM_LLAMA_TOOLCHAIN_EPOCH
          if ($LASTEXITCODE -ne 0) { throw "Windows GPU ABI stamp verification failed" }
          $requiredLibraries = @{
            llama = @("llama.dll", "libllama.dll")
            common = @("llama-common.dll", "libllama-common.dll")
            mtmd = @("mtmd.dll", "libmtmd.dll")
          }
          foreach ($entry in $requiredLibraries.GetEnumerator()) {
            $library = Get-ChildItem `
              -Path $env:LLAMA_STAGE_BUILD_DIR `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object { $entry.Value -contains $_.Name } |
              Select-Object -First 1
            if (-not $library) {
              throw (
                "Windows $env:CACHE_BACKEND ABI cache is missing " +
                "$($entry.Key): $($entry.Value -join ', ')"
              )
            }
            Write-Host $library.FullName
          }

  prune_windows_abi_caches:
    name: Prune old Windows ABI caches
    needs:
      - warm_windows_cpu
      - warm_windows_gpu
    # Retention needs only the current identity; a missing or unverifiable entry must not stop it.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.warm_windows_cpu.outputs.toolchain_epoch != '' && needs.warm_windows_cpu.outputs.input_hash != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
      - name: Retain active Windows ABI compatibility families
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CACHE_TOOLCHAIN_EPOCH: ${{ needs.warm_windows_cpu.outputs.toolchain_epoch }}
          WINDOWS_CACHE_INPUT_HASH: ${{ needs.warm_windows_cpu.outputs.input_hash }}
          CACHE_CUDA_VERSION: ${{ vars.CUDA_VERSION }}
          CACHE_VULKAN_VERSION: ${{ vars.VULKAN_SDK_VERSION }}
        run: '"$MESH_LLM_AUTOMATION_BIN" ci-ops windows-cache-maintenance --output windows-cache-retention --execute'
      - name: Upload Windows retention evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-cache-retention-${{ github.run_attempt }}
          path: windows-cache-retention
          retention-days: 14
          if-no-files-found: error
