name: CI Quality Slice

on:
  workflow_call:
    inputs:
      authority_linux_x64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_linux_arm64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_macos_arm64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_windows_x64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      clippy_matrix:
        description: Validated JSON array of Clippy batches.
        required: false
        default: '[]'
        type: string
      rust_changed:
        description: Whether Rust formatting and Clippy are selected.
        required: true
        type: boolean
      plugin_exemplars_changed:
        description: Whether standalone plugin exemplar packages changed.
        required: true
        type: boolean
      cli_surface_changed:
        description: Whether the public CLI surface changed.
        required: true
        type: boolean
      website_docs_changed:
        description: Whether public website docs/examples changed.
        required: true
        type: boolean
      clippy_max_parallel:
        description: Bounded Clippy worker count for the selected profile.
        required: false
        default: 3
        type: number
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"

permissions:
  contents: read
  packages: read

jobs:
  commit_convention:
    name: Commit convention
    # No `needs`, so this starts at once and fails long before any runner
    # selection, toolchain install, or compile has finished.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Checked out from the default branch: the job validates PR-authored
      # text (title/body/commit messages, all delivered via env/API), so it
      # only needs the script itself. Branches created before this script
      # landed would otherwise fail with a missing file.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
      - name: Check commit convention
        env:
          # Pull-request-authored text reaches the script through the
          # environment and is never interpolated into the shell.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The repository squash-merges, so the pull request title becomes the
          # commit subject on main and has to satisfy Conventional Commits.
          "$MESH_LLM_AUTOMATION_BIN" repository conventional-commits --message "$PR_TITLE"
          # The squash body aggregates the branch commit messages, so their
          # attribution trailers land on main even when their subjects do not.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[].commit.message' > "$RUNNER_TEMP/pr-commit-messages.txt"
          printf '%s\n' "$PR_BODY" >> "$RUNNER_TEMP/pr-commit-messages.txt"
          "$MESH_LLM_AUTOMATION_BIN" repository conventional-commits \
            --trailers-only "$RUNNER_TEMP/pr-commit-messages.txt"

  runner_policy:
    name: Select quality runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_4: ${{ steps.policy.outputs.runner_4 }}
      runner_8: ${{ steps.policy.outputs.runner_8 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
      allow_trusted_sccache_seed: ${{ steps.policy.outputs.allow_trusted_sccache_seed }}
      authority_sentinel_runner: ${{ steps.sentinel_policy.outputs.runner }}
      authority_sentinel_depot_enabled: ${{ steps.sentinel_policy.outputs.depot_enabled }}
      authority_automation_results_origin: ${{ steps.authority_origin.outputs.origin }}
      authority_automation_source_sha: ${{ steps.authority_source.outputs.sha }}
      authority_automation_artifact_id: ${{ steps.authority_upload.outputs.artifact_id }}
      authority_automation_binary_sha256: ${{ steps.authority_upload.outputs.binary_sha256 }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the semantic quality role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: ${{ vars.DEPOT_RUNNERS_ENABLED == 'true' }}
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}
          manual_use_depot: ${{ inputs.use_depot }}
      - name: Select provider for the protected authority sentinel
        id: sentinel_policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          # The diagnostic is selected only by its exact sentinel ref. The
          # ordinary and global PR gates must not activate this exception.
          depot_main_enabled: 'false'
          depot_pr_enabled: 'false'
          pr_canary_ref: ${{ vars.DEPOT_PR_SENTINEL_REF }}
          pr_approved_ref: ''
          pr_approved_sha: ''
          force_hosted: ${{ inputs.force_hosted }}
          manual_use_depot: 'false'

      - name: Freeze protected authority automation source
        if: steps.sentinel_policy.outputs.depot_enabled == 'true'
        id: authority_source
        shell: bash
        env:
          GIT_MASTER: '1'
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Admit protected hosted artifact service origin
        if: steps.sentinel_policy.outputs.depot_enabled == 'true'
        id: authority_origin
        shell: bash
        env:
          AUTOMATION_SOURCE_SHA: ${{ steps.authority_source.outputs.sha }}
          GIT_MASTER: '1'
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          set -euo pipefail
          [[ "$AUTOMATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$AUTOMATION_SOURCE_SHA" = "$(git rev-parse HEAD)" || exit 1
          case "${ACTIONS_RESULTS_URL:-}" in
            https://results-receiver.actions.githubusercontent.com|https://results-receiver.actions.githubusercontent.com/) ;;
            *) echo "Unexpected trusted artifact service origin" >&2; exit 1 ;;
          esac
          printf 'origin=https://results-receiver.actions.githubusercontent.com\n' >> "$GITHUB_OUTPUT"
      - name: Publish protected authority automation
        if: steps.sentinel_policy.outputs.depot_enabled == 'true'
        id: authority_upload
        uses: ./.github/actions/upload-automation
        with:
          source_sha: ${{ steps.authority_source.outputs.sha }}
          runner-profile: hosted-bare
          source-profile: protected-clean

  quality_contracts:
    name: CI contracts and consistency
    needs: runner_policy
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 60
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - uses: ./.github/actions/install-actionlint
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - name: Validate GitHub Actions
        run: actionlint -config-file .github/actionlint.yaml
      - name: Prepare Node for required automation fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Prepare external Python SDK contract source
        uses: ./.github/actions/prepare-python-sdk-source
      - name: Prepare external Python research contract source
        uses: ./.github/actions/prepare-python-research-source
      - name: Test CI, packaging, and SDK contracts
        timeout-minutes: 40
        run: |
          just ci-automation-contracts
          just ci-legacy-contracts
      - name: Check CI crate-list drift
        run: cargo run -p xtask -- repo-consistency ci-crate-lists
      - name: Check publish crate-chain drift
        run: cargo run -p xtask -- repo-consistency publish-crates
      - name: Check release targets and embedded client dependency purity
        run: |
          set -euo pipefail
          cargo run -p xtask -- repo-consistency release-targets
          cargo tree -p mesh-llm-client --prefix=none --no-dedupe > "$RUNNER_TEMP/mesh-client-deps.txt"
          forbidden='keyring|rpassword|hf-hub|dirs|clap|include_dir|rmcp|keyring-core'
          if grep -E "^[[:space:]│├└─-]*($forbidden)([[:space:]]|$)" "$RUNNER_TEMP/mesh-client-deps.txt"; then
            echo "Forbidden dependency found in mesh-client" >&2
            exit 1
          fi

      - name: Check console print drift
        run: just no-console-print
      - name: Check process environment mutation ownership
        run: cargo xtool repository env-mutation-census

  rust_fmt:
    name: Rust format
    needs: runner_policy
    if: ${{ inputs.rust_changed }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 15
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  cargo_machete:
    name: Unused dependency check
    needs: runner_policy
    if: ${{ inputs.rust_changed || inputs.plugin_exemplars_changed }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 15
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-machete@0.9.2
      - name: Flag unused dependencies
        run: cargo machete

  rust_clippy:
    name: Rust Clippy (${{ matrix.batch.id }})
    needs: runner_policy
    if: ${{ inputs.rust_changed && inputs.clippy_matrix != '[]' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_8 }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.clippy_max_parallel }}
      matrix:
        batch: ${{ fromJson(inputs.clippy_matrix) }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:f499b79bc52dc7492d57397fdbec9f890c6f6bb1d8c1fcde9c1c97d45c0541a7
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_8, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify prebuilt CI environment
        run: verify-runner-image public cpu
      - id: sccache_seed
        uses: ./.github/actions/restore-sccache-seed
        with:
          allow_trusted_seed: ${{ needs.runner_policy.outputs.allow_trusted_sccache_seed }}
          cache_key: mesh-llm-sccache-seed-linux-x86_64-img-f499b79b-epoch-f499b79b-v3-${{ hashFiles('Cargo.lock', '.github/cache-version.txt', '.cargo/config.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'Justfile', 'just/**') }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Resolve protected Clippy package names
        id: packages
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-cargo-packages@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
        with:
          # Switch with the protected workspace package rename, not PR source.
          generation: current
          crates: ${{ toJson(matrix.batch.crates) }}
          batches: ${{ inputs.clippy_matrix }}
      - name: Resolve planned batch crates against the checked-out workspace
        id: resolve_batch_crates
        env:
          PLANNED_BATCH_CRATES: ${{ steps.packages.outputs.crates }}
        run: |
          set -euo pipefail
          # The protected planner names these packages in its own generation, so
          # the translation step above has already mapped them to this revision's
          # owners. Filtering here matches renamed owners too, because workspace
          # membership is decided by the tree that is actually checked out.
          # The batch is planned from the default branch's crate inventory while
          # this job builds the revision under test. A branch that predates a
          # workspace member added on the default branch would otherwise abort
          # the whole batch with "package ID specification <crate> did not match
          # any packages". Workspace discovery belongs to Cargo metadata, not a
          # workflow-maintained allowlist, so resolve the planned batch against
          # the tree that is actually checked out exactly once. The build step
          # below consumes this resolved list so skip decisions cannot drift.
          mapfile -t requested < <(jq -r '.[]' <<<"$PLANNED_BATCH_CRATES")
          crates=("${requested[@]}")
          if [[ "${#requested[@]}" -gt 0 ]] && cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/workspace-metadata.json"; then
            jq -r '.packages[].name' "$RUNNER_TEMP/workspace-metadata.json" > "$RUNNER_TEMP/workspace-members.txt"
            crates=()
            for crate in "${requested[@]}"; do
              if grep -qxF -- "$crate" "$RUNNER_TEMP/workspace-members.txt"; then
                crates+=("$crate")
              else
                echo "::warning::batch plans $crate, which is not a workspace member of the checked-out revision; skipping it"
              fi
            done
          elif [[ "${#requested[@]}" -gt 0 ]]; then
            echo "::warning::cargo metadata failed; running the planned batch unchanged"
          fi
          printf 'crates=%s\n' "$(jq -cn --args '$ARGS.positional' ${crates[@]+"${crates[@]}"})" >> "$GITHUB_OUTPUT"
      - name: Run one Clippy invocation for the batch
        env:
          CLIPPY_CRATES: ${{ steps.resolve_batch_crates.outputs.crates }}
        run: |
          set -euo pipefail
          mapfile -t crates < <(jq -r '.[]' <<<"$CLIPPY_CRATES")
          if [[ "${#crates[@]}" -eq 0 ]]; then
            exit 0
          fi
          args=()
          for crate in "${crates[@]}"; do
            [[ "$crate" == "skippy-ffi" ]] && continue
            args+=("-p" "$crate")
          done
          [[ "${#args[@]}" -gt 0 ]] || exit 0
          cargo clippy "${args[@]}" --all-targets -- -D warnings
      - name: Capture Clippy cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-ci-quality-clippy-${{ matrix.batch.id }}-${{ github.run_attempt }}
          cache_expectation: ${{ steps.sccache_seed.outputs.cache_hit == 'true' && 'warm' || 'cold' }}
          minimum_hit_rate: "0.20"

  cli_docs_sync:
    name: CLI inventory freshness
    needs: runner_policy
    if: ${{ inputs.cli_surface_changed }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 15
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Resolve product source layout
        id: layout
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-source-layout@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: ${{ steps.layout.outputs.website_dir }}/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - name: Install website dependencies
        working-directory: ${{ steps.layout.outputs.website_dir }}
        run: npm ci
      - name: Verify generated CLI inventory is deterministic and current
        env:
          MESH_LLM_WEBSITE_DIR: ${{ steps.layout.outputs.website_dir }}
        run: just cli-inventory-check

  # Explicit diagnostic exception: this no-checkout job attests the
  # provider-injected cache authority itself, outside the normal build-cache
  # gate and build graph.
  authority_sentinel:
    name: Depot PR authority sentinel
    needs: runner_policy
    if: >-
      needs.runner_policy.outputs.authority_sentinel_depot_enabled == 'true' &&
      inputs.original_event_name == 'pull_request' &&
      github.event_name == 'pull_request' &&
      github.ref == vars.DEPOT_PR_SENTINEL_REF
    runs-on: ${{ needs.runner_policy.outputs.authority_sentinel_runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Validate protected sentinel identity
        id: validate
        shell: bash
        env:
          SENTINEL_ID: ${{ vars.DEPOT_PR_SENTINEL_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONFIGURED_SENTINEL_REF: ${{ vars.DEPOT_PR_SENTINEL_REF }}
        run: |
          set -euo pipefail
          if [[ ! "$SENTINEL_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "DEPOT_PR_SENTINEL_ID must be exactly 32 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "github.event.pull_request.number must be a canonical positive integer" >&2
            exit 1
          fi
          expected_ref="refs/pull/${PR_NUMBER}/merge"
          if [[ "$CONFIGURED_SENTINEL_REF" != "$expected_ref" ]]; then
            echo "DEPOT_PR_SENTINEL_REF does not match the pull-request merge ref" >&2
            exit 1
          fi
          seed_key="mesh-llm-depot-authority-seed-v1-${SENTINEL_ID}"
          poison_key="mesh-llm-depot-authority-pr-v1-${SENTINEL_ID}-pr-${PR_NUMBER}"
          {
            printf 'sentinel_id=%s\n' "$SENTINEL_ID"
            printf 'pr_number=%s\n' "$PR_NUMBER"
            printf 'seed_key=%s\n' "$seed_key"
            printf 'poison_key=%s\n' "$poison_key"
          } >> "$GITHUB_OUTPUT"

      # No local action: this job has no checkout. Only protected workflow
      # source and the existing pinned GitHub artifact transport participate.
      - name: Admit protected automation producer identity
        shell: bash
        env:
          AUTOMATION_SOURCE_SHA: ${{ needs.runner_policy.outputs.authority_automation_source_sha }}
          AUTOMATION_RESULTS_ORIGIN: ${{ needs.runner_policy.outputs.authority_automation_results_origin }}
          AUTOMATION_ARTIFACT_ID: ${{ needs.runner_policy.outputs.authority_automation_artifact_id }}
          AUTOMATION_BINARY_SHA256: ${{ needs.runner_policy.outputs.authority_automation_binary_sha256 }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux || exit 1
          test "$RUNNER_ARCH" = X64 || exit 1
          [[ "$AUTOMATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$AUTOMATION_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          [[ "$AUTOMATION_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test "$AUTOMATION_RESULTS_ORIGIN" = 'https://results-receiver.actions.githubusercontent.com' || exit 1
          mkdir "$RUNNER_TEMP/immutable-automation-restored"
      - name: Download protected authority automation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          ACTIONS_RESULTS_URL: ${{ needs.runner_policy.outputs.authority_automation_results_origin }}
        with:
          artifact-ids: ${{ needs.runner_policy.outputs.authority_automation_artifact_id }}
          path: ${{ runner.temp }}/immutable-automation-restored
          merge-multiple: true
      - name: Verify protected authority automation without executing it
        shell: bash
        env:
          AUTOMATION_SOURCE_SHA: ${{ needs.runner_policy.outputs.authority_automation_source_sha }}
          AUTOMATION_ARTIFACT_ID: ${{ needs.runner_policy.outputs.authority_automation_artifact_id }}
          AUTOMATION_BINARY_SHA256: ${{ needs.runner_policy.outputs.authority_automation_binary_sha256 }}
        run: |
          set -euo pipefail
          [[ "$AUTOMATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ -n "${AUTOMATION_ARTIFACT_ID:-}" || -n "${AUTOMATION_BINARY_SHA256:-}" ]]; then
            [[ "$AUTOMATION_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
            [[ "$AUTOMATION_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          fi
          cd "$RUNNER_TEMP/immutable-automation-restored"
          binary=xtask
          if [[ "$RUNNER_OS" == Windows ]]; then binary=xtask.exe; fi
          shopt -s nullglob dotglob
          members=(*)
          [[ ${#members[@]} == 3 ]] || exit 1
          for member in "$binary" source.txt SHA256SUMS; do
            [[ -f "$member" && ! -L "$member" ]] || exit 1
          done
          [[ "$(wc -c < source.txt | tr -d '[:space:]')" == 41 ]] || exit 1
          IFS= read -r source_line < source.txt || exit 1
          [[ "$source_line" == "$AUTOMATION_SOURCE_SHA" ]] || exit 1
          checksum_pattern='^([0-9a-f]{64}) ([ *])([a-zA-Z0-9.]+)$'
          [[ "$(wc -c < SHA256SUMS | tr -d '[:space:]')" -le 256 ]] || exit 1
          seen_binary=0
          seen_source=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ $checksum_pattern ]] || exit 1
            digest="${BASH_REMATCH[1]}"
            name="${BASH_REMATCH[3]}"
            case "$name" in
              "$binary")
                [[ "$seen_binary" == 0 ]] || exit 1
                seen_binary=1
                if [[ -n "${AUTOMATION_BINARY_SHA256:-}" ]]; then
                  [[ "$digest" == "$AUTOMATION_BINARY_SHA256" ]] || exit 1
                fi
                ;;
              source.txt) [[ "$seen_source" == 0 ]] || exit 1; seen_source=1 ;;
              *) exit 1 ;;
            esac
          done < SHA256SUMS
          [[ "$seen_binary" == 1 && "$seen_source" == 1 ]] || exit 1
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --strict -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          test -s "$binary" || exit 1
          chmod +x "$binary"
          binary_path="$PWD/$binary"
          if command -v cygpath >/dev/null 2>&1; then
            binary_path="$(cygpath -m "$binary_path")"
          fi
          printf 'MESH_LLM_AUTOMATION_BIN=%s\n' "$binary_path" >> "$GITHUB_ENV"
      - name: Attest provider-injected cache backend
        shell: bash
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" ci-ops authority-audit endpoint ACTIONS_CACHE_URL
          "$MESH_LLM_AUTOMATION_BIN" ci-ops authority-audit endpoint ACTIONS_RESULTS_URL

      - name: Restore trusted authority marker
        id: restore_seed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .depot-authority-sentinel
          key: ${{ steps.validate.outputs.seed_key }}
          fail-on-cache-miss: false

      - name: Validate trusted seed marker content on hit
        shell: bash
        env:
          SENTINEL_ID: ${{ steps.validate.outputs.sentinel_id }}
          CACHE_HIT: ${{ steps.restore_seed.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" != "true" ]]; then
            exit 0
          fi
          expected_file="$(mktemp)"
          trap 'rm -f "$expected_file"' EXIT
          printf 'mesh-llm-depot-authority-marker-v1\nsentinel_id=%s\n' \
            "$SENTINEL_ID" > "$expected_file"
          if [[ ! -f .depot-authority-sentinel/marker ]] ||
             ! cmp -s "$expected_file" .depot-authority-sentinel/marker; then
            echo "trusted authority marker content mismatch" >&2
            exit 1
          fi

      - name: Replace with deterministic PR poison marker
        shell: bash
        env:
          SENTINEL_ID: ${{ steps.validate.outputs.sentinel_id }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        run: |
          set -euo pipefail
          rm -rf -- .depot-authority-sentinel
          mkdir -p .depot-authority-sentinel
          printf 'mesh-llm-depot-authority-pr-marker-v1\nsentinel_id=%s\npr_number=%s\n' \
            "$SENTINEL_ID" "$PR_NUMBER" > .depot-authority-sentinel/marker

      - name: Save PR poison marker
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .depot-authority-sentinel
          key: ${{ steps.validate.outputs.poison_key }}

      - name: Clear local poison marker before proof restore
        shell: bash
        run: rm -rf -- .depot-authority-sentinel

      - name: Restore saved PR poison marker
        id: restore_poison
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .depot-authority-sentinel
          key: ${{ steps.validate.outputs.poison_key }}
          fail-on-cache-miss: true

      - name: Validate saved PR poison marker content
        shell: bash
        env:
          SENTINEL_ID: ${{ steps.validate.outputs.sentinel_id }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          CACHE_HIT: ${{ steps.restore_poison.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" != "true" ]]; then
            echo "saved PR poison marker restore did not report a cache hit" >&2
            exit 1
          fi
          expected_file="$(mktemp)"
          trap 'rm -f "$expected_file"' EXIT
          printf 'mesh-llm-depot-authority-pr-marker-v1\nsentinel_id=%s\npr_number=%s\n' \
            "$SENTINEL_ID" "$PR_NUMBER" > "$expected_file"
          if [[ ! -f .depot-authority-sentinel/marker ]] ||
             ! cmp -s "$expected_file" .depot-authority-sentinel/marker; then
            echo "saved PR poison marker content mismatch" >&2
            exit 1
          fi

      - name: Require trusted seed isolation after poison publication
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore_seed.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "Trusted authority marker was readable by the PR probe" >&2
            exit 1
          fi
          echo "Trusted seed was not readable; pending trusted-main verify-pr-write."
