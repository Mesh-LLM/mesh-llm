name: Isolated native runtime signing diagnostic

on:
  workflow_call:
    secrets:
      MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_SECRET_KEY:
        required: true
      MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_PASSWORD:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
          reuse-hosted-binary: "false"
      # Immutable CPU runtime producer from PR #2488, source 8b34702e8f001dde2ff6f4045bf76f0abc1144a3.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12180569782"
          run-id: "39237670909"
          github-token: ${{ github.token }}
          path: runtime-input
          merge-multiple: true
      - name: Prepare isolated catalog from real archive
        run: |
          printf '%s\n' '35a103e3666c5d841c3faec57e822bc763cc6b2cc41d2a364b4298529b42ca46  runtime-input/meshllm-native-runtime-linux-x86_64-cpu.tar.gz' | sha256sum --check --strict
          "$MESH_LLM_AUTOMATION_BIN" product runtime-catalog-diagnostic \
            runtime-input/meshllm-native-runtime-linux-x86_64-cpu.tar.gz 0.76.1 public-artifacts
      - name: Sign with repository credentials
        env:
          MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_SECRET_KEY: ${{ secrets.MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_SECRET_KEY }}
          MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_PASSWORD: ${{ secrets.MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_PASSWORD }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" product runtime-catalog-sign \
            public-artifacts/native-runtimes.json public-artifacts/native-runtimes.json.minisig \
            skippy/crates/skippy-runtime-install/trust/native-runtime-catalog.pub
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: upload
        with:
          name: signed-runtime-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            public-artifacts/native-runtimes.json
            public-artifacts/native-runtimes.json.sha256
            public-artifacts/native-runtimes.json.minisig
            public-artifacts/runtime.tar.gz
          if-no-files-found: error
          retention-days: 7

  consume:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: public-artifacts
          merge-multiple: true
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Strict HTTP install, negative cases, and real native load
        env:
          SCCACHE_GHA_ENABLED: "false"
          SIGNED_RUNTIME_DIAGNOSTIC_DIR: ${{ github.workspace }}/public-artifacts
        run: cargo test --locked -p skippy-runtime-install -- --include-ignored
      - name: Record evidence
        run: |
          printf 'Verified source %s: production signature, compiled trust pin, HTTP download, strict installation, tamper rejection, and native library loading. No release was published.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
