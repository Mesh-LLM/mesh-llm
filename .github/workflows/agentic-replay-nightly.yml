name: Agentic Replay (micstudio)

# Coding-agent replay benchmark on the pinned micstudio runner.
#
# Scheduled runs and manual dispatches from main execute trusted main and
# publish results to the HF dataset repo. Manual dispatches from any other
# branch run that branch, gate against history, and print the numbers to the
# run summary without writing to the dataset. The dataset repo is public, so
# branch-controlled code never needs — or sees — a write-capable HF token.
on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Branch dispatches get a per-ref group so they can never queue-block the
  # nightly schedule; scheduled and main dispatches stay serialized in the
  # shared group (this workflow is the only consumer of micstudio).
  group: agentic-replay-nightly-${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('branch-{0}', github.ref) || 'default' }}
  cancel-in-progress: false

env:
  MATRIX_FILE: ci/agentic-replay-nightly/matrix.json
  DATASET_REPO: meshllm/agentic-replay-nightly

jobs:
  replay:
    if: github.repository == 'Mesh-LLM/mesh-llm'
    runs-on: [self-hosted, X64, macOS, family-certify, agentic-replay]
    timeout-minutes: 720
    steps:
      - name: Resolve run context
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" != "micstudio" ]]; then
            echo "agentic replay requires the micstudio runner; got '$RUNNER_NAME'" >&2
            exit 1
          fi
          # Label for this run's cells; branch names may contain '/'.
          label=$(printf '%s' "$GITHUB_REF_NAME" | tr -C 'a-zA-Z0-9._-' '-')
          {
            echo "is_main=$([[ "$GITHUB_REF_NAME" == main ]] && echo true || echo false)"
            echo "replay_ref=$GITHUB_REF_NAME"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          # micstudio exports its pre-warmed HF cache as HF_CACHE; the hf CLI
          # needs the standard HF_HOME/HF_HUB_CACHE names. These are process
          # environment, not step outputs — write them to GITHUB_ENV so the
          # download and replay steps actually inherit them.
          {
            echo "HF_HOME=${HF_CACHE:?HF_CACHE is not exported on this runner}"
            echo "HF_HUB_CACHE=${HF_CACHE}/hub"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.meta.outputs.replay_ref }}
          persist-credentials: false

      - name: Download and verify pinned inputs
        # No HF_TOKEN: all pinned inputs are public and the runner cache is
        # pre-warmed, so downloads are anonymous cache-miss backfills — the
        # write-capable token exists only in the main-only publish step.
        run: |
          set -euo pipefail
          # Validate pins before any download: format errors and drift from
          # the canonical harness pin must fail in seconds, not after hours
          # of downloads.
          python3 - "$MATRIX_FILE" evals/skippy-competitive-benchmark.json > "$RUNNER_TEMP/agentic-replay-models.tsv" <<'PY'
          import json, pathlib, re, sys
          matrix = json.loads(pathlib.Path(sys.argv[1]).read_text())
          canonical = json.loads(pathlib.Path(sys.argv[2]).read_text())["thoughtworks"]["dataset"]
          for model in matrix["models"]:
              family = model.get("family", "unknown")
              for key in ("family", "repo", "file"):
                  if not model.get(key):
                      raise SystemExit(f"{family}: matrix model entry missing {key}")
              for key, pattern in (("revision", r"[0-9a-f]{40}"), ("sha256", r"[0-9a-f]{64}")):
                  value = model.get(key)
                  if not isinstance(value, str) or not re.fullmatch(pattern, value):
                      raise SystemExit(f"{family}: {key} must match {pattern} (got {value!r})")
              print("\t".join((model["family"], model["repo"], model["revision"], model["file"], model["sha256"])))
          replay = matrix["replay"]
          dataset = {
              "repo": replay.get("dataset"),
              "revision": replay.get("dataset_revision"),
              "filename": replay.get("dataset_file"),
              "sha256": replay.get("dataset_sha256"),
          }
          if dataset != canonical:
              raise SystemExit(
                  "nightly dataset pin must match the agentic-replay harness pin:\n"
                  f"  matrix:   {dataset}\n  canonical: {canonical}"
              )
          PY
          while IFS=$'\t' read -r family repo revision file expected_sha; do
            model_path=$(hf download "$repo" "$file" --revision "$revision")
            python3 - "$model_path" "$expected_sha" "$family" <<'PY'
          import hashlib, pathlib, sys
          path, expected, family = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          digest = hashlib.sha256()
          with path.open("rb") as model_file:
              for chunk in iter(lambda: model_file.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"{family}: model SHA-256 mismatch: expected={expected} actual={actual}")
          print(f"verified {family}: {actual}")
          PY
          done < "$RUNNER_TEMP/agentic-replay-models.tsv"
          python3 - "$MATRIX_FILE" > "$RUNNER_TEMP/agentic-replay-dataset.pin" <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path(sys.argv[1]).read_text())["replay"]
          missing = [k for k in ("dataset", "dataset_revision", "dataset_file", "dataset_sha256") if not d.get(k)]
          missing += [k for k in ("trajectories_per_framework", "passes", "warmup_turns", "concurrency") if not d.get(k)]
          if missing:
              raise SystemExit(f"matrix replay block missing fields: {missing}")
          print(d["dataset"], d["dataset_revision"], d["dataset_file"], d["dataset_sha256"])
          PY
          read -r dataset_repo dataset_revision dataset_file dataset_sha < "$RUNNER_TEMP/agentic-replay-dataset.pin"
          dataset_path=$(hf download "$dataset_repo" "$dataset_file" \
            --repo-type dataset --revision "$dataset_revision")
          python3 - "$dataset_path" "$dataset_sha" <<'PY'
          import hashlib, pathlib, sys
          path, expected = pathlib.Path(sys.argv[1]), sys.argv[2]
          digest = hashlib.sha256()
          with path.open("rb") as dataset_file:
              for chunk in iter(lambda: dataset_file.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"dataset SHA-256 mismatch: expected={expected} actual={actual}")
          print(f"verified trajectory dataset: {actual}")
          PY
          echo "DATASET_FILE=$dataset_path" >> "$GITHUB_ENV"

      - name: Record hardware fingerprint
        run: |
          set -euo pipefail
          # Create the artifacts root this step writes into (and summary/ for
          # the later normalize step) so a step reorder cannot break writers.
          mkdir -p "$RUNNER_TEMP/agentic-replay-artifacts/summary"
          python3 - <<'PY' > "$RUNNER_TEMP/agentic-replay-artifacts/hardware.json"
          import json, subprocess
          sysctl = lambda k: subprocess.check_output(["sysctl", "-n", k]).decode().strip()
          print(json.dumps({
              "machine_model": sysctl("hw.model"),
              "chip": sysctl("machdep.cpu.brand_string"),
              "gpu_cores": 80,
              "unified_memory_bytes": int(sysctl("hw.memsize")),
              "os_version": subprocess.check_output(["sw_vers", "-productVersion"]).decode().strip(),
          }))
          PY

      - name: Replay each pinned model
        env:
          LABEL: ${{ steps.meta.outputs.label }}
        run: |
          set -euo pipefail
          # Replay shape comes from the matrix (like the repair re-run) so the
          # recorded history rows, the gate's baseline matching, and the
          # repair re-run share one source of truth.
          LEVELS=$(python3 -c "import json;print(' '.join(map(str, json.load(open('$MATRIX_FILE'))['replay']['concurrency'])))")
          LEVEL_ARGS=()
          for level in $LEVELS; do LEVEL_ARGS+=(--concurrency "$level"); done
          TPFS=$(python3 -c "import json;print(json.load(open('$MATRIX_FILE'))['replay']['trajectories_per_framework'])")
          PASSES=$(python3 -c "import json;print(json.load(open('$MATRIX_FILE'))['replay']['passes'])")
          WARMUP=$(python3 -c "import json;print(json.load(open('$MATRIX_FILE'))['replay']['warmup_turns'])")
          FAILED=0
          for family in $(python3 -c "import json;print(' '.join(m['family'] for m in json.load(open('$MATRIX_FILE'))['models']))"); do
            model_uri=$(python3 -c "import json;m=[m for m in json.load(open('$MATRIX_FILE'))['models'] if m['family']=='$family'][0];print(m['repo']+'@'+m['revision']+'/'+m['file'])")
            if ! python3 evals/agentic-replay.py run \
                --ref "${LABEL}=HEAD" \
                --model "$model_uri" \
                --backend metal \
                --trajectories-per-framework "$TPFS" \
                "${LEVEL_ARGS[@]}" \
                --passes "$PASSES" \
                --warmup-turns "$WARMUP" \
                --dataset-file "$DATASET_FILE" \
                --output "$RUNNER_TEMP/agentic-replay-artifacts/$family"; then
              FAILED=1
            fi
          done
          exit $FAILED # failures continue to the gate step via `if: !cancelled()`

      - name: Summarize and gate against history
        id: history
        if: ${{ !cancelled() }}
        env:
          LABEL: ${{ steps.meta.outputs.label }}
          IS_MAIN: ${{ steps.meta.outputs.is_main }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/agentic-replay-artifacts"
          HISTORY_LOCAL="$RUNNER_TEMP/agentic-replay-history"
          # The dataset repo is public: history downloads are anonymous, so
          # no HF token is exposed to branch-controlled code in this step.
          # Replay parameters via a plain file: process substitution breaks on
          # this runner's bash/Python combination (/dev/fd is not passable).
          python3 -c "import json;print(json.dumps(json.load(open('$MATRIX_FILE'))['replay']))" \
            > "$RUNNER_TEMP/agentic-replay-params.json"
          # Baseline history: only a genuinely missing dataset is a bootstrap
          # run; auth, permission, and network failures must fail loudly so
          # the gate never fails open on infrastructure errors.
          rm -rf "$HISTORY_LOCAL"
          if ! hf download "$DATASET_REPO" \
            --repo-type dataset --local-dir "$HISTORY_LOCAL" --exclude "*.md" \
            > "$RUNNER_TEMP/hf-download.log" 2>&1; then
            if python3 - "$DATASET_REPO" <<'PY' > "$RUNNER_TEMP/hf-probe.log" 2>&1; then
          import os, sys
          import huggingface_hub
          repo = sys.argv[1]
          try:
              huggingface_hub.repo_info(repo, repo_type="dataset", token=os.environ.get("HF_TOKEN"))
          except Exception as exc:
              message = str(exc)
              if "404" in message or "Entry Not Found" in message or "Repository Not Found" in message:
                  sys.exit(3)
              sys.exit(1)
          PY
              probe_rc=0
            else
              probe_rc=$?
            fi
            case "$probe_rc" in
              0)
                echo "history dataset exists but download failed:" >&2
                cat "$RUNNER_TEMP/hf-download.log" "$RUNNER_TEMP/hf-probe.log" >&2
                exit 1
                ;;
              3) echo "no history yet (bootstrap run)" ;;
              *)
                echo "history dataset lookup failed:" >&2
                cat "$RUNNER_TEMP/hf-download.log" "$RUNNER_TEMP/hf-probe.log" >&2
                exit 1
                ;;
            esac
          fi
          BACKEND_SHA=$(python3 - "$OUTPUT_DIR" <<'PY'
          import json, sys, pathlib
          digests = set()
          for run_doc in pathlib.Path(sys.argv[1]).glob("*/run.json"):
              for build in json.loads(run_doc.read_text()).get("builds", []):
                  if build.get("binary_sha256"):
                      digests.add(build["binary_sha256"])
          if len(digests) > 1:
              sys.exit(f"multiple backend binaries: {sorted(digests)}")
          print(digests.pop() if digests else "")
          PY
          )
          args=(
            --matrix "$MATRIX_FILE"
            --replay-dir "$OUTPUT_DIR"
            --label "$LABEL"
            --hardware "$OUTPUT_DIR/hardware.json"
            --source-sha "$(git rev-parse HEAD)"
            --replay "$RUNNER_TEMP/agentic-replay-params.json"
            --output "$OUTPUT_DIR/summary/history.jsonl"
            --gate
          )
          [[ -n "$BACKEND_SHA" ]] && args+=(--backend-binary-sha256 "$BACKEND_SHA")
          [[ -d "$HISTORY_LOCAL/data/runs" ]] && args+=(--baseline "$HISTORY_LOCAL/data/runs")
          # Run the gate without set -e aborting mid-step so the summary card
          # is always produced; the gate status becomes this step's status.
          gate_rc=0
          python3 scripts/agentic-replay-history.py "${args[@]}" || gate_rc=$?
          python3 scripts/agentic-replay-card.py \
            --history "$HISTORY_LOCAL/data/runs" \
            --latest "$OUTPUT_DIR/summary/history.jsonl" \
            --output "$OUTPUT_DIR/card.md"
          cat "$OUTPUT_DIR/card.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$IS_MAIN" != "true" ]]; then
            echo "branch run — latest numbers vs history are in the step summary above; dataset not written"
            exit 0
          fi
          exit "$gate_rc"

      - name: Publish run shard and card (main only)
        if: ${{ !cancelled() && steps.history.outcome == 'success' && steps.meta.outputs.is_main == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/agentic-replay-artifacts"
          RUN_DATE=$(date -u +%F)
          hf upload "$DATASET_REPO" \
            "$OUTPUT_DIR/summary/history.jsonl" "data/runs/$RUN_DATE/${{ github.run_id }}.jsonl" \
            --repo-type dataset --commit-message "run $RUN_DATE ${{ github.run_id }} @ ${{ github.sha }}"
          hf upload "$DATASET_REPO" \
            "$OUTPUT_DIR/card.md" "card.md" --repo-type dataset \
            --commit-message "card refresh $RUN_DATE"

      - name: Open repair PR on regression (opencode loop)
        if: failure() && steps.meta.outputs.is_main == 'true'
        env:
          GH_TOKEN: ${{ secrets.CANARY_REPAIR_TOKEN }}
          # Same location the summarize step downloaded the baseline to.
          HISTORY_LOCAL: ${{ runner.temp }}/agentic-replay-history
        run: |
          set -euo pipefail
          scripts/agentic-replay-repair.sh "$RUNNER_TEMP/agentic-replay-artifacts" || {
            echo "repair did not clear the regression — PR opened flagged needs-attention" >&2
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: replay-artifacts
          path: ${{ runner.temp }}/agentic-replay-artifacts/
          retention-days: 30
