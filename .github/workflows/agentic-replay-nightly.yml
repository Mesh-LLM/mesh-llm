name: Agentic Replay Nightly (micstudio)

on:
  schedule:
    - cron: "23 14 * * *" # after the Linux competitive run settles
  workflow_dispatch:

# Scheduled runs execute the default-branch definition only; manual dispatch is
# accepted only from main so caller-selected content never reaches micstudio.
permissions:
  contents: read

concurrency:
  group: agentic-replay-nightly
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: [self-hosted, X64, macOS, family-certify, agentic-replay]
    # Separate replay and repair budgets, plus preflight and evidence headroom.
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_REPLAY_RUNNER_NAME: micstudio
      MATRIX_FILE: ci/agentic-replay-nightly/matrix.json
      DATASET_REPO: ${{ vars.MESH_AGENTIC_REPLAY_DATASET || 'meshllm/agentic-replay-nightly' }}
      # Reuse micstudio's shared HF cache and permit pinned cache-miss downloads.
      # Override the runner service's historical offline default explicitly.
      HF_HUB_OFFLINE: "0"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      GATE_ENABLED: ${{ vars.MESH_AGENTIC_REPLAY_GATE_ENABLED || '0' }}
    outputs:
      repair_prepared: ${{ steps.repair.outputs.prepared }}
    steps:
      - name: Verify pinned replay runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" != "$EXPECTED_REPLAY_RUNNER_NAME" ]]; then
            echo "agentic replay nightly requires runner '$EXPECTED_REPLAY_RUNNER_NAME'; got '$RUNNER_NAME'" >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "micstudio must run the ARM64 Actions runner and bundled Node natively; repair the runner installation before checkout" >&2
            exit 1
          fi
          git --version
          xcrun --find clang

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify runner toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail
          missing=0
          export PATH="/Users/lab/.local/bin:$PATH"
          echo "/Users/lab/.local/bin" >> "$GITHUB_PATH"
          for cmd in cargo just sccache jq python3 uv cmake ninja git-lfs hf; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "missing on micstudio image: $cmd" >&2
              missing=1
            fi
          done
          if [[ "${HF_CACHE:-}" != "/Users/lab/models/huggingface" ]]; then
            echo "HF_CACHE must name /Users/lab/models/huggingface" >&2
            missing=1
          else
            mkdir -p "$HF_CACHE/hub"
            if [[ ! -w "$HF_CACHE" || ! -w "$HF_CACHE/hub" ]]; then
              echo "the shared Hugging Face cache must be writable for pinned downloads" >&2
              missing=1
            fi
          fi
          if [[ "$missing" == "1" ]]; then exit 1; fi
          export HF_HOME="$HF_CACHE"
          export HF_HUB_CACHE="$HF_CACHE/hub"
          export HISTORY_LOCAL="$RUNNER_TEMP/agentic-replay-history"
          export OUTPUT_DIR="$RUNNER_TEMP/agentic-replay-artifacts"
          {
            echo "HF_HOME=$HF_HOME"
            echo "HF_HUB_CACHE=$HF_HUB_CACHE"
            echo "HISTORY_LOCAL=$HISTORY_LOCAL"
            echo "OUTPUT_DIR=$OUTPUT_DIR"
          } >> "$GITHUB_ENV"

      - name: Record hardware fingerprint
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR/summary"
          python3 - <<'PY' > "$OUTPUT_DIR/hardware.json"
          import json, subprocess
          sysctl = lambda k: subprocess.check_output(["sysctl", "-n", k]).decode().strip()
          print(json.dumps({
              "machine_model": sysctl("hw.model"),
              "chip": sysctl("machdep.cpu.brand_string"),
              "gpu_cores": 80,
              "unified_memory_bytes": int(sysctl("hw.memsize")),
              "os_version": subprocess.check_output(["sw_vers", "-productVersion"]).decode().strip(),
          }))
          PY

      - name: Verify pinned replay inputs
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Validate pins before any download: format errors and drift from
          # the canonical harness pin must fail in seconds, not after hours
          # of downloads.
          python3 - "$MATRIX_FILE" evals/skippy-competitive-benchmark.json > "$RUNNER_TEMP/agentic-replay-models.tsv" <<'PY'
          import json, pathlib, re, sys
          matrix = json.loads(pathlib.Path(sys.argv[1]).read_text())
          canonical = json.loads(pathlib.Path(sys.argv[2]).read_text())["thoughtworks"]["dataset"]
          for model in matrix["models"]:
              family = model.get("family", "unknown")
              for key in ("family", "repo", "file"):
                  if not model.get(key):
                      raise SystemExit(f"{family}: matrix model entry missing {key}")
              for key, pattern in (("revision", r"[0-9a-f]{40}"), ("sha256", r"[0-9a-f]{64}")):
                  value = model.get(key)
                  if not isinstance(value, str) or not re.fullmatch(pattern, value):
                      raise SystemExit(f"{family}: {key} must match {pattern} (got {value!r})")
              print("\t".join((model["family"], model["repo"], model["revision"], model["file"], model["sha256"])))
          replay = matrix.get("replay")
          if not isinstance(replay, dict):
              raise SystemExit("matrix replay block is missing")
          dataset = {
              "repo": replay.get("dataset"),
              "revision": replay.get("dataset_revision"),
              "filename": replay.get("dataset_file"),
              "sha256": replay.get("dataset_sha256"),
          }
          if dataset != canonical:
              raise SystemExit(
                  "nightly dataset pin must match the agentic-replay harness pin:\n"
                  f"  matrix:   {dataset}\n  canonical: {canonical}"
              )
          PY
          python3 scripts/agentic-replay-params.py \
            --matrix "$MATRIX_FILE" \
            --json-output "$RUNNER_TEMP/agentic-replay-params.json" \
            --github-env "$GITHUB_ENV"
          while IFS=$'\t' read -r family repo revision file expected_sha; do
            # Use the API return value; CLI stdout may contain styled status text.
            python3 - "$repo" "$revision" "$file" "$expected_sha" "$family" <<'PY'
          import hashlib, pathlib, sys
          from huggingface_hub import hf_hub_download
          repo, revision, filename, expected, family = sys.argv[1:]
          path = pathlib.Path(hf_hub_download(
              repo_id=repo, filename=filename, revision=revision, token=False,
          ))
          digest = hashlib.sha256()
          with path.open("rb") as model_file:
              for chunk in iter(lambda: model_file.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"{family}: model SHA-256 mismatch: expected={expected} actual={actual}")
          print(f"verified {family}: {actual}")
          PY
          done < "$RUNNER_TEMP/agentic-replay-models.tsv"

          python3 - "$MATRIX_FILE" evals/skippy-competitive-benchmark.json <<'PY' > "$RUNNER_TEMP/agentic-replay-dataset.tsv"
          import json, pathlib, re, sys
          matrix = json.loads(pathlib.Path(sys.argv[1]).read_text())["replay"]
          canonical = json.loads(pathlib.Path(sys.argv[2]).read_text())["thoughtworks"]["dataset"]
          dataset = {
              "repo": matrix.get("dataset"),
              "revision": matrix.get("dataset_revision"),
              "filename": matrix.get("dataset_file"),
              "sha256": matrix.get("dataset_sha256"),
          }
          if dataset != canonical:
              raise SystemExit("nightly dataset pin must match the agentic-replay harness pin")
          if not re.fullmatch(r"[0-9a-f]{40}", dataset["revision"] or ""):
              raise SystemExit("dataset revision must be an immutable 40-hex commit")
          if not re.fullmatch(r"[0-9a-f]{64}", dataset["sha256"] or ""):
              raise SystemExit("dataset sha256 must be a 64-hex digest")
          print("\t".join((dataset["repo"], dataset["revision"], dataset["filename"], dataset["sha256"])))
          PY
          IFS=$'\t' read -r dataset_repo dataset_revision dataset_file dataset_sha < "$RUNNER_TEMP/agentic-replay-dataset.tsv"
          python3 - "$dataset_repo" "$dataset_revision" "$dataset_file" "$dataset_sha" "$GITHUB_ENV" <<'PY'
          import hashlib, pathlib, sys
          from huggingface_hub import hf_hub_download
          repo, revision, filename, expected, github_env = sys.argv[1:]
          path = pathlib.Path(hf_hub_download(
              repo_id=repo, filename=filename, revision=revision,
              repo_type="dataset", token=False,
          ))
          digest = hashlib.sha256()
          with path.open("rb") as dataset_file:
              for chunk in iter(lambda: dataset_file.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"dataset SHA-256 mismatch: expected={expected} actual={actual}")
          print(f"verified trajectory dataset: {actual}")
          with pathlib.Path(github_env).open("a", encoding="utf-8") as env:
              env.write(f"DATASET_FILE={path}\n")
          PY

      - name: Replay each pinned model
        id: benchmark
        # GitHub limits individual steps to six hours, including self-hosted.
        timeout-minutes: 360
        run: |
          set -euo pipefail
          # Replay shape comes from the matrix (like the repair re-run) so the
          # recorded history rows, the gate's baseline matching, and the
          # repair re-run share one source of truth.
          LEVELS="${AGENTIC_REPLAY_CONCURRENCY:?validated replay concurrency is unavailable}"
          IFS=',' read -r -a CONCURRENCY_LEVELS <<< "$LEVELS"
          LEVEL_ARGS=()
          for level in "${CONCURRENCY_LEVELS[@]}"; do LEVEL_ARGS+=(--concurrency "$level"); done
          TPFS="${AGENTIC_REPLAY_TRAJECTORIES_PER_FRAMEWORK:?validated trajectories_per_framework is unavailable}"
          PASSES="${AGENTIC_REPLAY_PASSES:?validated passes is unavailable}"
          WARMUP="${AGENTIC_REPLAY_WARMUP_TURNS:?validated warmup_turns is unavailable}"
          REPLAY_MODE="${AGENTIC_REPLAY_MODE:?validated replay mode is unavailable}"
          MAX_OUTPUT="${AGENTIC_REPLAY_MAX_OUTPUT_TOKENS:?validated max_output_tokens is unavailable}"
          FAILED=0
          for family in $(python3 -c "import json;print(' '.join(m['family'] for m in json.load(open('$MATRIX_FILE'))['models']))"); do
            model_uri=$(python3 -c "import json;m=[m for m in json.load(open('$MATRIX_FILE'))['models'] if m['family']=='$family'][0];print(m['repo']+'@'+m['revision']+'/'+m['file'])")
            if ! python3 evals/agentic-replay.py run \
                --ref main=HEAD \
                --model "$model_uri" \
                --backend metal \
                --replay-mode "$REPLAY_MODE" \
                --trajectories-per-framework "$TPFS" \
                "${LEVEL_ARGS[@]}" \
                --passes "$PASSES" \
                --warmup-turns "$WARMUP" \
                --max-output-tokens "$MAX_OUTPUT" \
                --dataset-file "$DATASET_FILE" \
                --output "$OUTPUT_DIR/$family"; then
              FAILED=1
            fi
          done
          exit $FAILED # failed measurements retain raw evidence and do not start repair

      - name: Download cohort-matched history
        id: baseline
        if: ${{ !cancelled() && steps.benchmark.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The dataset repo is public, so history downloads are anonymous and
          # the write-capable token remains confined to the publish step.
          # Replay parameters were validated before downloads and retain the
          # matrix schema in history metadata; the CLI mode is mapped only for
          # the benchmark invocation.
          # Baseline history: only a genuinely missing dataset is a bootstrap
          # run; auth, permission, and network failures must fail loudly so
          # the gate never fails open on infrastructure errors.
          rm -rf "$HISTORY_LOCAL"
          if HF_HUB_OFFLINE=0 hf download "$DATASET_REPO" \
            --repo-type dataset --local-dir "$HISTORY_LOCAL" --exclude "*.md" 2> "$RUNNER_TEMP/hf-download.err"; then
            exit 0
          fi
          # Only a genuinely missing dataset is a bootstrap run; auth,
          # permission, and network failures must fail loudly.
          if HF_HUB_OFFLINE=0 python3 - "$DATASET_REPO" <<'PY' > "$RUNNER_TEMP/repo-exists.out" 2>&1; then
          import sys
          import huggingface_hub
          repo = sys.argv[1]
          try:
              huggingface_hub.repo_info(repo, repo_type="dataset", token=False)
          except Exception as exc:
              # Authentication errors can also say "Repository Not Found".
              # Only an actual HTTP 404 permits bootstrap.
              if getattr(getattr(exc, "response", None), "status_code", None) == 404:
                  sys.exit(3)
              sys.exit(1)
          PY
            rc=0
          else
            rc=$?
          fi
          if [[ "$rc" == "0" ]]; then
            echo "history dataset exists but download failed:" >&2
            cat "$RUNNER_TEMP/hf-download.err" >&2; cat "$RUNNER_TEMP/repo-exists.out" >&2
            exit 1
          elif [[ "$rc" == "3" ]]; then
            echo "no history yet (bootstrap run)"
          else
            echo "history dataset lookup failed:" >&2
            cat "$RUNNER_TEMP/hf-download.err" >&2; cat "$RUNNER_TEMP/repo-exists.out" >&2
            exit 1
          fi

      - name: Normalize history and gate on regression
        id: history
        if: ${{ !cancelled() && steps.benchmark.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          set -euo pipefail
          BACKEND_SHA=$(python3 - "$OUTPUT_DIR" <<'PY'
          import json, sys, pathlib
          output = pathlib.Path(sys.argv[1])
          digests = set()
          for run_doc in output.glob("*/run.json"):
              for build in json.loads(run_doc.read_text()).get("builds", []):
                  if build.get("binary_sha256"):
                      digests.add(build["binary_sha256"])
          if len(digests) > 1:
              print(f"multiple backend binaries: {sorted(digests)}", file=sys.stderr)
              sys.exit(1)
          print(digests.pop() if digests else "")
          PY
          )
          args=(
            --matrix "$MATRIX_FILE"
            --replay-dir "$OUTPUT_DIR"
            --label main
            --hardware "$OUTPUT_DIR/hardware.json"
            --source-sha "$(git rev-parse HEAD)"
            --replay "$RUNNER_TEMP/agentic-replay-params.json"
            --output "$OUTPUT_DIR/summary/history.jsonl"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$BACKEND_SHA" ]]; then
            args+=(--backend-binary-sha256 "$BACKEND_SHA")
          fi
          if [[ -d "$HISTORY_LOCAL/data/runs" ]]; then
            args+=(--baseline "$HISTORY_LOCAL/data/runs")
          fi
          if [[ "$GATE_ENABLED" == "1" ]]; then
            args+=(--gate)
          fi
          python3 scripts/agentic-replay-history.py "${args[@]}"

      - name: Publish immutable run shard and card
        if: ${{ !cancelled() && steps.history.outcome == 'success' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          RUN_DATE=$(date -u +%F)
          HF_HUB_OFFLINE=0 hf upload "$DATASET_REPO" \
            "$OUTPUT_DIR/summary/history.jsonl" "data/runs/$RUN_DATE/${{ github.run_id }}.jsonl" \
            --repo-type dataset --commit-message "run $RUN_DATE ${{ github.run_id }} @ ${{ github.sha }}"
          python3 scripts/agentic-replay-card.py \
            --history "$HISTORY_LOCAL/data/runs" \
            --latest "$OUTPUT_DIR/summary/history.jsonl" \
            --output "$OUTPUT_DIR/card.md"
          HF_HUB_OFFLINE=0 hf upload "$DATASET_REPO" \
            "$OUTPUT_DIR/card.md" "card.md" --repo-type dataset \
            --commit-message "card refresh $RUN_DATE"

      - name: Prepare repair PR artifact on regression (Goose)
        id: repair
        if: ${{ !cancelled() && steps.history.outcome == 'failure' && steps.history.outputs.repair_required == 'true' }}
        # Includes Goose and the complete verification replay.
        timeout-minutes: 360
        env:
          REPLAY_AGENT_PROVIDER: ${{ vars.LLAMA_CANARY_GOOSE_PROVIDER || 'zai_coding_plan' }}
          REPLAY_AGENT_MODEL: ${{ vars.LLAMA_CANARY_GOOSE_MODEL || 'glm-5.3-flash' }}
          # Same location the summarize step downloaded the baseline to.
          HISTORY_LOCAL: ${{ runner.temp }}/agentic-replay-history
        run: |
          set -euo pipefail
          if scripts/agentic-replay-repair.sh "$RUNNER_TEMP/agentic-replay-artifacts" 2>&1 | tee "$RUNNER_TEMP/agentic-replay-artifacts/repair.log"; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "repair artifact preparation failed; no PR was opened" >&2
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() || failure() || cancelled() }}
        with:
          name: replay-artifacts
          path: ${{ runner.temp }}/agentic-replay-artifacts/
          retention-days: 30

  publish-repair:
    needs: replay
    if: >-
      !cancelled() &&
      github.repository == 'Mesh-LLM/mesh-llm' &&
      github.ref == 'refs/heads/main' &&
      needs.replay.result == 'failure' &&
      needs.replay.outputs.repair_prepared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download repair publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: replay-artifacts
          path: ${{ runner.temp }}/replay-artifacts

      - name: Check out trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate and apply repair publication
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          PUBLICATION_DIR="$RUNNER_TEMP/replay-artifacts/repair-publication"
          STATUS_FILE="$PUBLICATION_DIR/status.json"
          PATCH_FILE="$PUBLICATION_DIR/repair.patch"
          BODY_FILE="$PUBLICATION_DIR/pr-body.md"
          VALIDATED=$(python3 - "$PUBLICATION_DIR" "$STATUS_FILE" "$PATCH_FILE" "$BODY_FILE" "${{ github.sha }}" "${{ github.run_id }}" "${{ github.run_attempt }}" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys

          publication_dir = pathlib.Path(sys.argv[1])
          status_path = pathlib.Path(sys.argv[2])
          patch_path = pathlib.Path(sys.argv[3])
          body_path = pathlib.Path(sys.argv[4])
          expected_base = sys.argv[5]
          expected_run_id = sys.argv[6]
          expected_attempt = sys.argv[7]
          expected_files = {"pr-body.md", "repair.patch", "status.json"}
          if publication_dir.is_symlink() or not publication_dir.is_dir() or {
              path.name for path in publication_dir.iterdir()
          } != expected_files:
              raise SystemExit("repair publication must contain exactly its three data files")
          for path in (status_path, patch_path, body_path):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"repair publication file is not regular: {path}")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          required = {
              "base_sha",
              "body_bytes",
              "body_sha256",
              "patch_bytes",
              "patch_sha256",
              "resolution",
              "run_id",
              "run_attempt",
              "schema_version",
          }
          if (
              set(status) != required
              or type(status["schema_version"]) is not int
              or status["schema_version"] != 1
          ):
              raise SystemExit("repair publication status schema is invalid")
          if status["resolution"] not in {"fix-verified", "needs-attention"}:
              raise SystemExit("repair publication resolution is invalid")
          if (
              not isinstance(status["run_id"], str)
              or not re.fullmatch(r"[0-9]+", status["run_id"])
              or status["run_id"] != expected_run_id
          ):
              raise SystemExit("repair publication run_id is invalid")
          if (
              isinstance(status["run_attempt"], bool)
              or not isinstance(status["run_attempt"], int)
              or status["run_attempt"] <= 0
              or not re.fullmatch(r"[1-9][0-9]*", expected_attempt)
              or status["run_attempt"] != int(expected_attempt)
          ):
              raise SystemExit("repair publication run_attempt is invalid")
          for key in ("base_sha",):
              if not isinstance(status[key], str) or not re.fullmatch(r"[0-9a-f]{40}", status[key]):
                  raise SystemExit(f"repair publication {key} is invalid")
          if status["base_sha"] != expected_base:
              raise SystemExit("repair publication is for a different workflow source SHA")
          current_base = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if current_base != expected_base:
              raise SystemExit("trusted checkout is not the workflow source SHA")

          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          patch_bytes = patch_path.stat().st_size
          body_bytes = body_path.stat().st_size
          if not 0 < patch_bytes <= 64 * 1024 * 1024 or not 0 < body_bytes <= 1024 * 1024:
              raise SystemExit("repair publication size is outside the allowed bounds")
          if status["patch_bytes"] != patch_bytes or status["patch_sha256"] != sha256(patch_path):
              raise SystemExit("repair patch digest does not match status metadata")
          if status["body_bytes"] != body_bytes or status["body_sha256"] != sha256(body_path):
              raise SystemExit("repair PR body digest does not match status metadata")
          body_path.read_text(encoding="utf-8")
          if b"\x00" in body_path.read_bytes():
              raise SystemExit("repair PR body contains a NUL byte")
          patch = patch_path.read_bytes()
          if not patch.startswith(b"From ") or b"\nSubject: " not in patch:
              raise SystemExit("repair patch is not a format-patch artifact")
          print(f'{status["run_id"]}\t{status["run_attempt"]}\t{status["resolution"]}')
          PY
          )
          IFS=$'\t' read -r RUN_ID RUN_ATTEMPT RESOLUTION <<< "$VALIDATED"
          {
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "resolution=$RESOLUTION"
          } >> "$GITHUB_OUTPUT"
          PATCH_FILE="$RUNNER_TEMP/replay-artifacts/repair-publication/repair.patch"
          git config user.name "mesh-replay-bot"
          git config user.email "replay-bot@meshllm.invalid"
          git -c core.hooksPath=/dev/null am --no-verify --no-gpg-sign --empty=keep "$PATCH_FILE"
          test "$(git rev-parse HEAD^)" = "${{ github.sha }}"
          if ! git diff --quiet HEAD^ HEAD -- .github .agents scripts evals ci; then
            echo "repair publication changes protected verification or CI files" >&2
            exit 1
          fi

      - name: Push repair branch and open PR
        env:
          CANARY_REPAIR_TOKEN: ${{ secrets.CANARY_REPAIR_TOKEN }}
        run: |
          set -euo pipefail
          PUBLICATION_DIR="$RUNNER_TEMP/replay-artifacts/repair-publication"
          RUN_ID="${{ steps.validate.outputs.run_id }}"
          RUN_ATTEMPT="${{ steps.validate.outputs.run_attempt }}"
          RESOLUTION="${{ steps.validate.outputs.resolution }}"
          case "$RESOLUTION" in
            fix-verified)
              TITLE="fix: agentic replay nightly regression (run ${RUN_ID}-${RUN_ATTEMPT})"
              LABELS="agentic-replay,nightly"
              ;;
            needs-attention)
              TITLE="fix: agentic replay nightly regression needs attention (run ${RUN_ID}-${RUN_ATTEMPT})"
              LABELS="agentic-replay,nightly,needs-attention"
              ;;
            *)
              echo "validated resolution is invalid" >&2
              exit 1
              ;;
          esac
          BRANCH="agentic-replay-nightly/repair-${RUN_ID}-${RUN_ATTEMPT}"
          ASKPASS_SCRIPT=$(mktemp "${RUNNER_TEMP}/agentic-replay-askpass.XXXXXX")
          chmod 700 "$ASKPASS_SCRIPT"
          trap 'rm -f -- "$ASKPASS_SCRIPT"' EXIT
          cat > "$ASKPASS_SCRIPT" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            Username*) printf '%s\n' 'x-access-token' ;;
            Password*) printf '%s\n' "${CANARY_REPAIR_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          EOF
          CANARY_REPAIR_TOKEN="$CANARY_REPAIR_TOKEN" \
            GIT_ASKPASS="$ASKPASS_SCRIPT" GIT_TERMINAL_PROMPT=0 \
            git -c core.hooksPath=/dev/null -c credential.helper= \
              push "https://github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/${BRANCH}"
          rm -f -- "$ASKPASS_SCRIPT"
          ASKPASS_SCRIPT=""
          GH_TOKEN="$CANARY_REPAIR_TOKEN" gh pr create \
            --title "$TITLE" \
            --body-file "$PUBLICATION_DIR/pr-body.md" \
            --label "$LABELS" \
            --base main \
            --head "$BRANCH"
