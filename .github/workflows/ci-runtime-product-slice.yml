name: CI Runtime Product Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      linux_runtime_matrix:
        description: JSON Linux runtime rows from the versioned CI plan.
        required: true
        type: string
      macos_runtime_matrix:
        description: JSON macOS runtime rows from the versioned CI plan.
        required: true
        type: string
      windows_runtime_matrix:
        description: JSON Windows runtime rows from the versioned CI plan.
        required: true
        type: string
      linux_max_parallel:
        description: Linux runtime worker budget.
        required: false
        default: 3
        type: number
      macos_max_parallel:
        description: macOS runtime worker budget.
        required: false
        default: 2
        type: number
      windows_max_parallel:
        description: Windows runtime worker budget.
        required: false
        default: 1
        type: number
      compose_products:
        description: Run composition consumers instead of native runtime producers.
        required: false
        default: false
        type: boolean
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  runner_policy:
    name: Select Linux native runner
    if: ${{ !inputs.compose_products && inputs.linux_runtime_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_16: ${{ steps.policy.outputs.runner_16 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the native runtime role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          ref: ${{ github.ref }}
          depot_main_enabled: ${{ vars.DEPOT_RUNNERS_ENABLED == 'true' }}
          manual_use_depot: ${{ inputs.use_depot }}

  linux_runtime:
    name: Linux runtime (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ !cancelled() && !inputs.compose_products && inputs.linux_runtime_matrix != '[]' && needs.runner_policy.result == 'success' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_16 }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.linux_max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.linux_runtime_matrix) }}
    container:
      image: ${{ matrix.runtime.container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.runtime.backend }}
      LLAMA_STAGE_BUILD_DIR: ${{ matrix.runtime.build_dir }}
      LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.runtime.cuda_architectures }}
      LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.runtime.rocm_architectures }}
      MESH_CUDA_VERSION: ${{ matrix.runtime.cuda_version }}
      MESH_LLM_REQUIRE_SCCACHE: "1"
      GGML_CUDA_NO_VMM: "1"
      LLAMA_STAGE_SKIP_NCCL: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify prebuilt native environment
        env:
          VERIFY_BACKEND: ${{ matrix.runtime.verify_backend }}
        run: |
          read -r -a verify_args <<< "$VERIFY_BACKEND"
          verify-runner-image "${verify_args[@]}"
      - name: Resolve native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          pinned_epoch: ${{ matrix.runtime.toolchain_epoch }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 snapshot 2026-03-12
        continue-on-error: true
        with:
          workspaces: . -> target
          cache-bin: "false"
          prefix-key: ${{ env.CACHE_NAMESPACE }}-rust-${{ runner.os }}-${{ hashFiles('.github/cache-version.txt') }}
          shared-key: ci-runtime-linux-${{ matrix.runtime.backend }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}
      - name: Prepare immutable Linux native runtime
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.runtime.backend }}
          target: ${{ matrix.runtime.target }}
          output_dir: runtime-input
      - name: Upload immutable Linux runtime input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-runtime-linux-${{ matrix.runtime.backend }}
          path: |
            runtime-input/*.tar.gz
            runtime-input/*.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Capture native cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-ci-runtime-linux-${{ matrix.runtime.backend }}-${{ github.run_attempt }}

  linux_product:
    name: Linux product (${{ matrix.runtime.backend }})
    needs: linux_runtime
    if: ${{ !cancelled() && inputs.compose_products && inputs.linux_runtime_matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.linux_max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.linux_runtime_matrix) }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify product composition environment
        run: verify-runner-image public
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-host-linux-${{ matrix.runtime.architecture }}
          path: host-input
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-runtime-linux-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose immutable Linux product
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          backend: ${{ matrix.runtime.backend }}
      - name: Upload immutable Linux product
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-product-linux-${{ matrix.runtime.backend }}
          path: ${{ steps.compose.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1

  macos_runtime:
    name: macOS Metal runtime
    if: ${{ !inputs.compose_products && inputs.macos_runtime_matrix != '[]' }}
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.macos_max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.macos_runtime_matrix) }}
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.runtime.backend }}
      LLAMA_STAGE_BUILD_DIR: ${{ matrix.runtime.build_dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install Metal runtime dependencies
        run: brew install cmake ninja jq
      - uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          include_tool_versions: "true"
      - uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.runtime.backend }}
          target: ${{ matrix.runtime.target }}
          output_dir: runtime-input
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-runtime-macos-${{ matrix.runtime.backend }}
          path: |
            runtime-input/*.tar.gz
            runtime-input/*.sha256
          if-no-files-found: error
          retention-days: 1

  macos_product:
    name: macOS product (${{ matrix.runtime.backend }})
    needs: macos_runtime
    if: ${{ !cancelled() && inputs.compose_products && inputs.macos_runtime_matrix != '[]' }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.macos_max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.macos_runtime_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-host-macos-${{ matrix.runtime.architecture }}
          path: host-input
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-runtime-macos-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose immutable macOS product
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          backend: ${{ matrix.runtime.backend }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-product-macos-${{ matrix.runtime.backend }}
          path: ${{ steps.compose.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1

  windows_runtime:
    name: Windows runtime (${{ matrix.runtime.backend }})
    if: ${{ !inputs.compose_products && inputs.windows_runtime_matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.windows_max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.windows_runtime_matrix) }}
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.runtime.backend }}
      LLAMA_STAGE_BUILD_DIR: ${{ matrix.runtime.build_dir }}
      RUSTC_WRAPPER: sccache
      WINDOWS_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
      WINDOWS_VULKAN_SDK_VERSION: ${{ vars.VULKAN_SDK_VERSION || '1.4.328.1' }}
      ROCM_HIP_SDK_FILENAME: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: "false"
      - uses: ./.github/actions/resolve-native-toolchain-epoch
        id: native_toolchain
      - uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: ${{ matrix.runtime.backend }}
          build_dir: ${{ matrix.runtime.build_dir }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ matrix.runtime.cuda_architectures || matrix.runtime.rocm_architectures || '' }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
      - name: Install CUDA toolkit
        if: ${{ matrix.runtime.backend == 'cuda' }}
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.WINDOWS_CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: true
          use-local-cache: true
          log-file-suffix: windows-cuda
      - name: Install Vulkan SDK
        if: ${{ matrix.runtime.backend == 'vulkan' }}
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - name: Install ROCm HIP SDK
        if: ${{ matrix.runtime.backend == 'rocm' }}
        uses: ./.github/actions/setup-windows-rocm-sdk
        with:
          rocm-hip-sdk-filename: ${{ env.ROCM_HIP_SDK_FILENAME }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Prepare immutable Windows native runtime
        uses: ./.github/actions/prepare-native-runtime-input
        env:
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.runtime.cuda_architectures }}
          LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.runtime.rocm_architectures }}
        with:
          backend: ${{ matrix.runtime.backend }}
          target: ${{ matrix.runtime.target }}
          output_dir: runtime-input
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-runtime-windows-${{ matrix.runtime.backend }}
          path: |
            runtime-input/*.tar.gz
            runtime-input/*.sha256
          if-no-files-found: error
          retention-days: 1

  windows_product:
    name: Windows product (${{ matrix.runtime.backend }})
    needs: windows_runtime
    if: ${{ !cancelled() && inputs.compose_products && inputs.windows_runtime_matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.windows_max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.windows_runtime_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-host-windows-${{ matrix.runtime.architecture }}
          path: host-input
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-runtime-windows-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose immutable Windows product
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          backend: ${{ matrix.runtime.backend }}
          binary_name: mesh-llm.exe
          readiness_smoke: "true"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-product-windows-${{ matrix.runtime.backend }}
          path: ${{ steps.compose.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1
