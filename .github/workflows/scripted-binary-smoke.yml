name: Reusable Scripted Binary Smoke Tests

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      artifact_name:
        required: true
        type: string
      artifact_path:
        required: false
        default: ci-artifacts/linux
        type: string
      binary_name:
        required: false
        default: mesh-llm
        type: string
      staged_binary_path:
        required: false
        default: target/debug/mesh-llm
        type: string
      model_url:
        required: false
        default: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/9e6855bc4be717fca1ef21360a1db4b29d5c559a/SmolLM2-135M-Instruct-Q8_0.gguf
        type: string
      model_file:
        required: false
        default: SmolLM2-135M-Instruct-Q8_0.gguf
        type: string
      model_cache_scope:
        required: true
        type: string
      cache_key_prefix:
        required: false
        default: ''
        type: string
      smoke_script:
        required: true
        type: string
      timeout_minutes:
        required: false
        default: 20
        type: number
    secrets:
      HF_TOKEN:
        required: false

env:
  MODEL_URL: ${{ inputs.model_url }}
  MODEL_FILE: ${{ inputs.model_file }}

permissions:
  contents: read
  packages: read

jobs:
  scripted_binary_smoke:
    name: Scripted Binary Smoke
    # Model credentials stay on an isolated GitHub-hosted runner; the
    # container just supplies prebuilt smoke utilities, it does not move
    # execution to self-hosted/depot infra.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Verify prebuilt smoke environment
        run: verify-runner-image public cpu

      - uses: ./.github/actions/restore-smoke-inputs
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}
          binary_name: ${{ inputs.binary_name }}
          staged_binary_path: ${{ inputs.staged_binary_path }}
          model_url: ${{ inputs.model_url }}
          model_file: ${{ inputs.model_file }}
          model_cache_scope: ${{ inputs.model_cache_scope }}
          cache_key_prefix: ${{ inputs.cache_key_prefix }}
          save_model_cache: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}

      - name: Run scripted smoke
        run: ${{ inputs.smoke_script }} "${{ inputs.staged_binary_path }}" "${{ inputs.artifact_path }}" "$HOME/.models/${{ inputs.model_file }}"
