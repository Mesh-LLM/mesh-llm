name: Reusable Scripted Binary Smoke Tests

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      artifact_name:
        required: true
        type: string
      artifact_path:
        required: false
        default: ci-artifacts/linux
        type: string
      binary_name:
        required: false
        default: mesh-llm
        type: string
      staged_binary_path:
        required: false
        default: target/debug/mesh-llm
        type: string
      model_url:
        required: false
        default: ''
        type: string
      model_file:
        required: false
        default: ''
        type: string
      model_manifest:
        description: Generated manifest for the immutable smoke models.
        required: false
        default: ci/model-artifacts/manifests/scripted-binary-smoke.json
        type: string
      model_artifact_id:
        description: Dense model artifact selected from the manifest.
        required: false
        default: smollm2-q8-inference
        type: string
      model_cache_scope:
        required: true
        type: string
      model_context_size:
        description: Optional context-size override passed to model smoke scripts.
        required: false
        default: ''
        type: string
      expected_exact_payload_kind:
        description: Optional exact-state payload kind the smoke must observe in stage telemetry.
        required: false
        default: ''
        type: string
      kv_recurrent_model_artifact_id:
        description: Optional recurrent artifact selected from the same manifest.
        required: false
        default: ''
        type: string
      kv_recurrent_model_cache_scope:
        description: Cache scope for the optional recurrent smoke model.
        required: false
        default: two-node-split-recurrent-smoke-model
        type: string
      kv_recurrent_context_size:
        description: Context-size override passed to the recurrent leg of the KV caching smoke.
        required: false
        default: ''
        type: string
      kv_recurrent_expected_exact_payload_kind:
        description: Exact-state payload kind required only from the recurrent smoke leg.
        required: false
        default: ''
        type: string
      split_evidence_artifact_name:
        description: Optional artifact name for persisted split-smoke evidence.
        required: false
        default: ''
        type: string
      cache_key_prefix:
        required: false
        default: ''
        type: string
      smoke_script:
        required: true
        type: string
      timeout_minutes:
        required: false
        default: 20
        type: number
    secrets:
      HF_TOKEN:
        required: false

env:
  MESH_LLM_SMOKE_CONTEXT_SIZE: ${{ inputs.model_context_size }}
  MESH_TWO_NODE_SPLIT_EXPECTED_EXACT_PAYLOAD_KIND: ${{ inputs.expected_exact_payload_kind }}
  MESH_TWO_NODE_SPLIT_RECURRENT_CTX_SIZE: ${{ inputs.kv_recurrent_context_size }}
  MESH_TWO_NODE_SPLIT_RECURRENT_EXPECTED_EXACT_PAYLOAD_KIND: ${{ inputs.kv_recurrent_expected_exact_payload_kind }}
  MESH_LLM_NATIVE_RUNTIME_MANIFEST_URL: http://127.0.0.1:9/native-runtimes.json
permissions:
  contents: read
  packages: read

jobs:
  scripted_binary_smoke:
    name: Scripted Binary Smoke
    # Model credentials stay on an isolated GitHub-hosted runner; the
    # container just supplies prebuilt smoke utilities, it does not move
    # execution to self-hosted/depot infra.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:f499b79bc52dc7492d57397fdbec9f890c6f6bb1d8c1fcde9c1c97d45c0541a7
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Verify prebuilt smoke environment
        run: verify-runner-image public cpu

      - uses: ./.github/actions/restore-smoke-inputs
        id: model_inputs
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}
          binary_name: ${{ inputs.binary_name }}
          staged_binary_path: ${{ inputs.staged_binary_path }}
          model_url: ${{ inputs.model_url }}
          model_file: ${{ inputs.model_file }}
          model_manifest: ${{ inputs.model_manifest }}
          model_artifact_id: ${{ inputs.model_artifact_id }}
          expected_backend: cpu
          model_cadence: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event.inputs.original_event_name == 'pull_request' || github.event.inputs.original_event_name == 'pull_request_target') && 'pull-request' || 'main' }}
          model_cache_scope: ${{ inputs.model_cache_scope }}
          cache_key_prefix: ${{ inputs.cache_key_prefix }}
          save_model_cache: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}

      - name: Restore recurrent smoke model
        if: ${{ inputs.kv_recurrent_model_artifact_id != '' }}
        id: recurrent_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ${{ inputs.model_manifest }}
          model_artifact_id: ${{ inputs.kv_recurrent_model_artifact_id }}
          model_cadence: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event.inputs.original_event_name == 'pull_request' || github.event.inputs.original_event_name == 'pull_request_target') && 'pull-request' || 'main' }}
          model_cache_scope: ${{ inputs.kv_recurrent_model_cache_scope }}
          cache_key_prefix: ${{ inputs.cache_key_prefix }}
          save_model_cache: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}

      - name: Run scripted smoke
        env:
          MESH_TWO_NODE_SPLIT_RECURRENT_MODEL: ${{ steps.recurrent_model.outputs.model_path }}
          MESH_TWO_NODE_SPLIT_WORK_DIR: ${{ inputs.split_evidence_artifact_name != '' && format('{0}/{1}', runner.temp, inputs.split_evidence_artifact_name) || '' }}
        run: ${{ inputs.smoke_script }} "${{ inputs.staged_binary_path }}" "${{ inputs.artifact_path }}" "${{ steps.model_inputs.outputs.model_path }}"

      - name: Upload split-smoke evidence
        if: ${{ (success() || failure()) && inputs.split_evidence_artifact_name != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.split_evidence_artifact_name }}
          path: ${{ runner.temp }}/${{ inputs.split_evidence_artifact_name }}
          if-no-files-found: error
