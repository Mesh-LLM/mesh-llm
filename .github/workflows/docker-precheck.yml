name: Docker precheck

on:
  workflow_call:
    inputs:
      job_name:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      validate_shared_core:
        required: false
        type: boolean
        default: false
      validate_fly_ui_builder:
        required: false
        type: boolean
        default: false
      validate_entrypoint_modes:
        required: false
        type: boolean
        default: false
      validate_workflow_no_qemu:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  precheck:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
          allow_depot_remote_cache: "false"
          allow_native_github_cache: "false"
      - name: Validate Docker source policy
        shell: bash
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          SHARED_CORE: ${{ inputs.validate_shared_core }}
          FLY_UI_BUILDER: ${{ inputs.validate_fly_ui_builder }}
          ENTRYPOINT_MODES: ${{ inputs.validate_entrypoint_modes }}
          WORKFLOW_NO_QEMU: ${{ inputs.validate_workflow_no_qemu }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" repository docker-precheck \
            --dockerfile "$DOCKERFILE_PATH" --shared-core "$SHARED_CORE" \
            --fly-ui-builder "$FLY_UI_BUILDER" --entrypoint-modes "$ENTRYPOINT_MODES" \
            --workflow-no-qemu "$WORKFLOW_NO_QEMU"
