name: CI · Linux
run-name: CI · Linux · ${{ inputs.source_sha }}

on:
  workflow_call:
    inputs: &lane_inputs
      lane_plan_json:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      original_event_name:
        required: true
        type: string
      correlation_id:
        required: false
        default: ""
        type: string
      supersession_key:
        required: false
        default: ""
        type: string
      lane_check_id:
        required: false
        default: ""
        type: string
      overall_check_id:
        required: false
        default: ""
        type: string
      expected_lane_checks:
        required: false
        default: "[]"
        type: string
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean
    secrets:
      HF_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *lane_inputs
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-linux-${{ inputs.supersession_key || inputs.source_sha }}
  cancel-in-progress: ${{ inputs.original_event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"

jobs:
  authority_source:
    name: Freeze protected automation source
    if: ${{ (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null || fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null || fromJson(inputs.lane_plan_json).matrices.rust_tests[0] != null || contains(fromJson(inputs.lane_plan_json).required_slices, 'static-abi') || contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'kotlin')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GIT_MASTER: '1'
      MESH_LLM_POSTHOG_KEY: ''
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Freeze the protected commit
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  authority_linux_x64:
    name: Protected linux x64 automation
    needs: authority_source
    if: ${{ needs.authority_source.result == 'success' && (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null || fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null || fromJson(inputs.lane_plan_json).matrices.rust_tests[0] != null || contains(fromJson(inputs.lane_plan_json).required_slices, 'static-abi') || contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'kotlin')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/protected-automation-artifact.yml
    with:
      platform: linux-x64
      lane: linux
      protected_source_sha: ${{ needs.authority_source.outputs.source_sha }}

  product_automation_linux_x64:
    name: Product linux x64 automation
    if: ${{ (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null || fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null || fromJson(inputs.lane_plan_json).matrices.rust_tests[0] != null || contains(fromJson(inputs.lane_plan_json).required_slices, 'static-abi')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/product-automation-artifact.yml
    with:
      platform: linux-x64
      lane: linux
      product_source_sha: ${{ inputs.source_sha }}

  ui_artifact:
    needs: [authority_linux_x64]
    name: Console artifact
    if: ${{ (fromJson(inputs.lane_plan_json).required && fromJson(inputs.lane_plan_json).matrices.hosts[0] != null) && needs.authority_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-ui-artifact-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      retention_days: 1

  static_abi:
    needs: [authority_linux_x64, product_automation_linux_x64]
    name: Static ABI
    if: ${{ (contains(fromJson(inputs.lane_plan_json).required_slices, 'static-abi')) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/static-abi-artifact.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cpu
      target: x86_64-unknown-linux-gnu
      artifact_name: ci-static-abi-${{ github.run_id }}
      runner_size: '8'
      retention_days: 1
      timeout_minutes: 60

  rust_tests:
    name: Rust tests
    needs: [static_abi, authority_linux_x64, product_automation_linux_x64]
    if: ${{ (!cancelled() && needs.static_abi.result == 'success' && fromJson(inputs.lane_plan_json).matrices.rust_tests[0] != null) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-rust-tests-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      rust_tests_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.rust_tests) }}
      static_abi_artifact_name: ci-static-abi-${{ github.run_id }}
      static_abi_toolchain_epoch: ${{ needs.static_abi.outputs.toolchain_epoch }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.linux_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  hosts:
    name: Neutral Linux host
    needs: [ui_artifact, authority_linux_x64, product_automation_linux_x64]
    if: ${{ (!cancelled() && needs.ui_artifact.result == 'success' && fromJson(inputs.lane_plan_json).matrices.hosts[0] != null) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-host-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      hosts_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.hosts) }}
      ui_artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      profile: release
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.linux_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  native_runtime_cpu:
    needs: [authority_linux_x64, product_automation_linux_x64]
    name: Native Linux cpu runtime
    if: ${{ (contains(fromJson(inputs.lane_plan_json).matrices.runtime_products.*.id, 'linux-cpu')) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-runtime-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cpu
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  product_cpu:
    name: Linux cpu product
    needs: [hosts, native_runtime_cpu, authority_linux_x64, product_automation_linux_x64]
    if: ${{ (!cancelled() && needs.hosts.result == 'success' && needs.native_runtime_cpu.result == 'success') && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-product-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cpu
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  native_runtime_cuda:
    needs: [authority_linux_x64, product_automation_linux_x64]
    name: Native Linux cuda runtime
    if: ${{ (contains(fromJson(inputs.lane_plan_json).matrices.runtime_products.*.id, 'linux-cuda')) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-runtime-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cuda
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  product_cuda:
    name: Linux cuda product
    needs: [hosts, native_runtime_cuda, authority_linux_x64, product_automation_linux_x64]
    if: ${{ (!cancelled() && needs.hosts.result == 'success' && needs.native_runtime_cuda.result == 'success') && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-product-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cuda
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  native_runtime_rocm:
    needs: [authority_linux_x64, product_automation_linux_x64]
    name: Native Linux rocm runtime
    if: ${{ (contains(fromJson(inputs.lane_plan_json).matrices.runtime_products.*.id, 'linux-rocm')) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-runtime-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: rocm
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  product_rocm:
    name: Linux rocm product
    needs: [hosts, native_runtime_rocm, authority_linux_x64, product_automation_linux_x64]
    if: ${{ (!cancelled() && needs.hosts.result == 'success' && needs.native_runtime_rocm.result == 'success') && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-product-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: rocm
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  native_runtime_vulkan:
    needs: [authority_linux_x64, product_automation_linux_x64]
    name: Native Linux vulkan runtime
    if: ${{ (contains(fromJson(inputs.lane_plan_json).matrices.runtime_products.*.id, 'linux-vulkan')) && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-runtime-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: vulkan
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  product_vulkan:
    name: Linux vulkan product
    needs: [hosts, native_runtime_vulkan, authority_linux_x64, product_automation_linux_x64]
    if: ${{ (!cancelled() && needs.hosts.result == 'success' && needs.native_runtime_vulkan.result == 'success') && needs.authority_linux_x64.result == 'success' && needs.product_automation_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-linux-product-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      product_automation: ${{ needs.product_automation_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: vulkan
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: 1
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  kotlin_sdk_input:
    name: Kotlin SDK input
    needs: [static_abi, authority_linux_x64]
    if: ${{ (!cancelled() && needs.static_abi.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'kotlin')) && needs.authority_linux_x64.result == 'success' }}
    uses: ./.github/workflows/native-sdk-artifact.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cpu
      target: x86_64-unknown-linux-gnu
      profile: release
      artifact_name: ci-sdk-kotlin-native
      static_abi_artifact_name: ci-static-abi-${{ github.run_id }}
      static_abi_artifact_path: ci-sdk-kotlin-static-abi
      runner_size: '8'
      retention_days: 1

  sdk_rust:
    name: Linux rust SDK smoke
    needs: [product_cpu]
    if: ${{ !cancelled() && needs.product_cpu.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'rust') }}
    uses: ./.github/workflows/ci-linux-sdk-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      sdk_kind: rust
      sdk_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.sdk) }}
      binary_target: target/release/mesh-llm
      ui_artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      profile: release
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  sdk_kotlin:
    name: Linux kotlin SDK smoke
    needs: [product_cpu, kotlin_sdk_input]
    if: ${{ !cancelled() && needs.product_cpu.result == 'success' && needs.kotlin_sdk_input.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'kotlin') }}
    uses: ./.github/workflows/ci-linux-sdk-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      sdk_kind: kotlin
      sdk_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.sdk) }}
      binary_target: target/release/mesh-llm
      ui_artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      profile: release
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke_cpu:
    name: Linux cpu product smoke
    needs: [product_cpu]
    if: ${{ !cancelled() && needs.product_cpu.result == 'success' && (contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'core') || contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'two-node-client') || contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'two-node-split') || contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'model-download')) }}
    uses: ./.github/workflows/ci-linux-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      backend: cpu
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 45
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke_cuda:
    name: Linux cuda product smoke
    needs: [product_cuda]
    if: ${{ !cancelled() && needs.product_cuda.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'core-cuda') }}
    uses: ./.github/workflows/ci-linux-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      backend: cuda
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 45
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke_rocm:
    name: Linux rocm product smoke
    needs: [product_rocm]
    if: ${{ !cancelled() && needs.product_rocm.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'core') }}
    uses: ./.github/workflows/ci-linux-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      backend: rocm
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 45
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke_vulkan:
    name: Linux vulkan product smoke
    needs: [product_vulkan]
    if: ${{ !cancelled() && needs.product_vulkan.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.smoke.*.id, 'core') }}
    uses: ./.github/workflows/ci-linux-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      backend: vulkan
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 45
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  summary:
    name: CI / Linux
    needs: [ui_artifact, static_abi, rust_tests, hosts, native_runtime_cpu, product_cpu, product_smoke_cpu, native_runtime_cuda, product_cuda, product_smoke_cuda, native_runtime_rocm, product_rocm, product_smoke_rocm, native_runtime_vulkan, product_vulkan, product_smoke_vulkan, kotlin_sdk_input, sdk_rust, sdk_kotlin, authority_source, authority_linux_x64, product_automation_linux_x64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authority_source.outputs.source_sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci-controller
      - name: Validate planned Linux jobs
        id: validate
        continue-on-error: true
        env:
          LANE_PLAN: ${{ inputs.lane_plan_json }}
          NEEDS_RESULTS: ${{ toJson(needs) }}
        run: '"$MESH_CI_CONTROLLER_BIN" ci validate-lane --lane-plan "$LANE_PLAN" --needs "$NEEDS_RESULTS"'
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/report-ci-lane
        with:
          lane_name: CI / Linux
          lane_result: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          lane_check_id: ${{ inputs.lane_check_id }}
          overall_check_id: ${{ inputs.overall_check_id }}
          expected_lane_checks: ${{ inputs.expected_lane_checks }}
          source_sha: ${{ inputs.source_sha }}
          correlation_id: ${{ inputs.correlation_id }}
          plan_digest: ${{ inputs.plan_digest }}
      - name: Enforce Linux result
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
