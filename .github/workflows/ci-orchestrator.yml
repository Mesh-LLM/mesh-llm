name: CI Orchestrator

on:
  workflow_call:
    inputs:
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean
    secrets:
      HF_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  plan:
    name: Plan CI graph
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      required_slices: ${{ steps.plan.outputs.required_slices }}
      domains: ${{ steps.plan.outputs.domains }}
      clippy_matrix: ${{ steps.plan.outputs.clippy_matrix }}
      rust_tests_matrix: ${{ steps.plan.outputs.rust_tests_matrix }}
      hosts_matrix: ${{ steps.plan.outputs.hosts_matrix }}
      runtime_products_matrix: ${{ steps.plan.outputs.runtime_products_matrix }}
      platform_checks_matrix: ${{ steps.plan.outputs.platform_checks_matrix }}
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
      sdk_matrix: ${{ steps.plan.outputs.sdk_matrix }}
      linux_hosts_matrix: ${{ steps.plan.outputs.linux_hosts_matrix }}
      macos_hosts_matrix: ${{ steps.plan.outputs.macos_hosts_matrix }}
      windows_hosts_matrix: ${{ steps.plan.outputs.windows_hosts_matrix }}
      linux_runtime_products_matrix: ${{ steps.plan.outputs.linux_runtime_products_matrix }}
      macos_runtime_products_matrix: ${{ steps.plan.outputs.macos_runtime_products_matrix }}
      windows_runtime_products_matrix: ${{ steps.plan.outputs.windows_runtime_products_matrix }}
      rust_changed: ${{ steps.plan.outputs.rust_changed }}
      ui_changed: ${{ steps.plan.outputs.ui_changed }}
      website_changed: ${{ steps.plan.outputs.website_changed }}
      website_docs_changed: ${{ steps.plan.outputs.website_docs_changed }}
      cli_surface_changed: ${{ steps.plan.outputs.cli_surface_changed }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      backend_changed: ${{ steps.plan.outputs.backend_changed }}
      runner_contract_required: ${{ steps.plan.outputs.runner_contract_required }}
      linux_max_parallel: ${{ steps.plan.outputs.linux_max_parallel }}
      macos_max_parallel: ${{ steps.plan.outputs.macos_max_parallel }}
      windows_max_parallel: ${{ steps.plan.outputs.windows_max_parallel }}
      total_max_workers: ${{ steps.plan.outputs.total_max_workers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute changed files and affected crates
        id: changes
        uses: ./.github/actions/compute-changes
        with:
          event_name: ${{ github.event_name }}
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build one versioned provider-neutral plan
        id: plan
        uses: ./.github/actions/plan-ci
        with:
          event_name: ${{ github.event_name }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          draft: ${{ github.event.pull_request.draft || false }}
          changed_files: ${{ steps.changes.outputs.changed_files }}
          affected_crates: ${{ steps.changes.outputs.affected_crates }}
          upload_artifact: "true"
          artifact_name: ci-plan-${{ github.run_id }}

  quality:
    name: Quality slice
    needs: plan
    if: ${{ contains(needs.plan.outputs.required_slices, '"quality"') }}
    uses: ./.github/workflows/ci-quality-slice.yml
    with:
      clippy_matrix: ${{ needs.plan.outputs.clippy_matrix }}
      rust_changed: ${{ needs.plan.outputs.rust_changed == 'true' }}
      cli_surface_changed: ${{ needs.plan.outputs.cli_surface_changed == 'true' }}
      website_docs_changed: ${{ needs.plan.outputs.website_docs_changed == 'true' }}
      clippy_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  web:
    name: Web slice
    needs: plan
    if: ${{ contains(needs.plan.outputs.required_slices, '"web"') }}
    uses: ./.github/workflows/ci-web-slice.yml
    with:
      ui_changed: ${{ needs.plan.outputs.ui_changed == 'true' || contains(needs.plan.outputs.domains, '"ci-control"') }}
      website_changed: ${{ needs.plan.outputs.website_changed == 'true' || contains(needs.plan.outputs.domains, '"ci-control"') }}

  ui_artifact:
    name: UI artifact slice
    needs: plan
    if: ${{ contains(needs.plan.outputs.required_slices, '"ui-artifact"') }}
    uses: ./.github/workflows/ci-ui-artifact-slice.yml
    with:
      artifact_name: ci-ui-dist-${{ github.run_id }}
      retention_days: 1

  static_abi:
    name: Static ABI slice
    needs: plan
    if: ${{ contains(needs.plan.outputs.required_slices, '"static-abi"') }}
    uses: ./.github/workflows/static-abi-artifact.yml
    with:
      backend: cpu
      target: x86_64-unknown-linux-gnu
      artifact_name: ci-static-abi-${{ github.run_id }}
      runner_size: '8'
      retention_days: 1
      timeout_minutes: 60
      use_depot: ${{ inputs.use_depot }}

  rust_tests:
    name: Rust tests slice
    needs: [plan, static_abi]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.static_abi.result == 'success' && contains(needs.plan.outputs.required_slices, '"rust-tests"') }}
    uses: ./.github/workflows/ci-rust-tests-slice.yml
    with:
      rust_tests_matrix: ${{ needs.plan.outputs.rust_tests_matrix }}
      static_abi_artifact_name: ci-static-abi-${{ github.run_id }}
      static_abi_toolchain_epoch: ${{ needs.static_abi.outputs.toolchain_epoch }}
      max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}

  hosts_linux:
    name: Linux host slice
    needs: [plan, ui_artifact]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.ui_artifact.result == 'success' && needs.plan.outputs.linux_hosts_matrix != '[]' }}
    uses: ./.github/workflows/ci-host-slice.yml
    with:
      linux_hosts_matrix: ${{ needs.plan.outputs.linux_hosts_matrix }}
      macos_hosts_matrix: '[]'
      windows_hosts_matrix: '[]'
      ui_artifact_name: ci-ui-dist-${{ github.run_id }}
      profile: release
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  hosts_macos:
    name: macOS host slice
    needs: [plan, ui_artifact]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.ui_artifact.result == 'success' && needs.plan.outputs.macos_hosts_matrix != '[]' }}
    uses: ./.github/workflows/ci-host-slice.yml
    with:
      linux_hosts_matrix: '[]'
      macos_hosts_matrix: ${{ needs.plan.outputs.macos_hosts_matrix }}
      windows_hosts_matrix: '[]'
      ui_artifact_name: ci-ui-dist-${{ github.run_id }}
      profile: release
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  hosts_windows:
    name: Windows host slice
    needs: [plan, ui_artifact]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.ui_artifact.result == 'success' && needs.plan.outputs.windows_hosts_matrix != '[]' }}
    uses: ./.github/workflows/ci-host-slice.yml
    with:
      linux_hosts_matrix: '[]'
      macos_hosts_matrix: '[]'
      windows_hosts_matrix: ${{ needs.plan.outputs.windows_hosts_matrix }}
      ui_artifact_name: ci-ui-dist-${{ github.run_id }}
      profile: release
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  native_runtimes_linux:
    name: Linux native runtime producers
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.linux_runtime_products_matrix != '[]' }}
    uses: ./.github/workflows/ci-runtime-product-slice.yml
    with:
      linux_runtime_matrix: ${{ needs.plan.outputs.linux_runtime_products_matrix }}
      macos_runtime_matrix: '[]'
      windows_runtime_matrix: '[]'
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  native_runtimes_macos:
    name: macOS native runtime producers
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.macos_runtime_products_matrix != '[]' }}
    uses: ./.github/workflows/ci-runtime-product-slice.yml
    with:
      linux_runtime_matrix: '[]'
      macos_runtime_matrix: ${{ needs.plan.outputs.macos_runtime_products_matrix }}
      windows_runtime_matrix: '[]'
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  native_runtimes_windows:
    name: Windows native runtime producers
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.windows_runtime_products_matrix != '[]' }}
    uses: ./.github/workflows/ci-runtime-product-slice.yml
    with:
      linux_runtime_matrix: '[]'
      macos_runtime_matrix: '[]'
      windows_runtime_matrix: ${{ needs.plan.outputs.windows_runtime_products_matrix }}
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      use_depot: ${{ inputs.use_depot }}

  runtime_product_linux:
    name: Linux product composition
    needs: [plan, hosts_linux, native_runtimes_linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.hosts_linux.result == 'success' && needs.native_runtimes_linux.result == 'success' }}
    uses: ./.github/workflows/ci-runtime-product-slice.yml
    with:
      linux_runtime_matrix: ${{ needs.plan.outputs.linux_runtime_products_matrix }}
      macos_runtime_matrix: '[]'
      windows_runtime_matrix: '[]'
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      compose_products: true
      use_depot: ${{ inputs.use_depot }}

  runtime_product_macos:
    name: macOS product composition
    needs: [plan, hosts_macos, native_runtimes_macos]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.hosts_macos.result == 'success' && needs.native_runtimes_macos.result == 'success' }}
    uses: ./.github/workflows/ci-runtime-product-slice.yml
    with:
      linux_runtime_matrix: '[]'
      macos_runtime_matrix: ${{ needs.plan.outputs.macos_runtime_products_matrix }}
      windows_runtime_matrix: '[]'
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      compose_products: true
      use_depot: ${{ inputs.use_depot }}

  runtime_product_windows:
    name: Windows product composition
    needs: [plan, hosts_windows, native_runtimes_windows]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.hosts_windows.result == 'success' && needs.native_runtimes_windows.result == 'success' }}
    uses: ./.github/workflows/ci-runtime-product-slice.yml
    with:
      linux_runtime_matrix: '[]'
      macos_runtime_matrix: '[]'
      windows_runtime_matrix: ${{ needs.plan.outputs.windows_runtime_products_matrix }}
      linux_max_parallel: ${{ fromJson(needs.plan.outputs.linux_max_parallel) }}
      macos_max_parallel: ${{ fromJson(needs.plan.outputs.macos_max_parallel) }}
      windows_max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}
      compose_products: true
      use_depot: ${{ inputs.use_depot }}

  platform_checks:
    name: Platform checks slice
    needs: plan
    if: ${{ contains(needs.plan.outputs.required_slices, '"platform-checks"') }}
    uses: ./.github/workflows/ci-platform-checks-slice.yml
    with:
      platform_checks_matrix: ${{ needs.plan.outputs.platform_checks_matrix }}
      profile: ${{ needs.plan.outputs.profile }}
      max_parallel: ${{ fromJson(needs.plan.outputs.windows_max_parallel) }}

  product_smoke:
    name: Product smoke slice
    needs: [plan, runtime_product_linux, runtime_product_macos]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.runtime_product_linux.result == 'success' || needs.runtime_product_linux.result == 'skipped') && (needs.runtime_product_macos.result == 'success' || needs.runtime_product_macos.result == 'skipped') && contains(needs.plan.outputs.required_slices, '"product-smoke"') }}
    uses: ./.github/workflows/ci-product-smoke-slice.yml
    with:
      smoke_matrix: ${{ needs.plan.outputs.smoke_matrix }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 30
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  kotlin_sdk_input:
    name: Kotlin SDK input
    needs: [plan, static_abi]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.static_abi.result == 'success' && contains(fromJson(needs.plan.outputs.sdk_matrix).*.id, 'kotlin') }}
    uses: ./.github/workflows/native-sdk-artifact.yml
    with:
      backend: cpu
      target: x86_64-unknown-linux-gnu
      profile: release
      artifact_name: ci-sdk-kotlin-native
      static_abi_artifact_name: ci-static-abi-${{ github.run_id }}
      static_abi_artifact_path: ci-sdk-kotlin-static-abi
      runner_size: '8'
      retention_days: 1
      use_depot: ${{ inputs.use_depot }}

  swift_sdk_input:
    name: Swift SDK input
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJson(needs.plan.outputs.sdk_matrix).*.id, 'swift') }}
    uses: ./.github/workflows/swift-sdk-artifact.yml
    with:
      mode: ${{ (needs.plan.outputs.profile == 'main' || needs.plan.outputs.profile == 'manual-full') && 'full' || 'host-only' }}
      artifact_name: ci-sdk-swift
      retention_days: 1
      timeout_minutes: 90

  sdk_linux:
    name: Linux SDK consumers
    needs: [plan, runtime_product_linux, kotlin_sdk_input]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.runtime_product_linux.result == 'success' && (!contains(fromJson(needs.plan.outputs.sdk_matrix).*.id, 'kotlin') || needs.kotlin_sdk_input.result == 'success') && (contains(fromJson(needs.plan.outputs.sdk_matrix).*.id, 'rust') || contains(fromJson(needs.plan.outputs.sdk_matrix).*.id, 'kotlin')) }}
    uses: ./.github/workflows/ci-sdk-slice.yml
    with:
      sdk_matrix: ${{ needs.plan.outputs.sdk_matrix }}
      lane: linux
      binary_target: target/release/mesh-llm
      profile: release
      swift_mode: ${{ (needs.plan.outputs.profile == 'main' || needs.plan.outputs.profile == 'manual-full') && 'full' || 'host-only' }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  sdk_macos:
    name: macOS SDK consumers
    needs: [plan, runtime_product_macos, swift_sdk_input]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.runtime_product_macos.result == 'success' && needs.swift_sdk_input.result == 'success' && contains(fromJson(needs.plan.outputs.sdk_matrix).*.id, 'swift') }}
    uses: ./.github/workflows/ci-sdk-slice.yml
    with:
      sdk_matrix: ${{ needs.plan.outputs.sdk_matrix }}
      lane: macos
      binary_target: target/release/mesh-llm
      profile: release
      swift_mode: ${{ (needs.plan.outputs.profile == 'main' || needs.plan.outputs.profile == 'manual-full') && 'full' || 'host-only' }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  runner_contract:
    name: Runner contract slice
    needs: plan
    if: ${{ contains(needs.plan.outputs.required_slices, '"runner-contract"') }}
    uses: ./.github/workflows/ci-runner-contract-slice.yml
    with:
      plan_json: ${{ needs.plan.outputs.plan_json }}
      profile: ${{ needs.plan.outputs.profile }}
      total_max_workers: ${{ fromJson(needs.plan.outputs.total_max_workers) }}

  summary:
    name: CI Required
    needs:
      - plan
      - quality
      - web
      - ui_artifact
      - static_abi
      - rust_tests
      - hosts_linux
      - hosts_macos
      - hosts_windows
      - native_runtimes_linux
      - native_runtimes_macos
      - native_runtimes_windows
      - runtime_product_linux
      - runtime_product_macos
      - runtime_product_windows
      - platform_checks
      - product_smoke
      - kotlin_sdk_input
      - swift_sdk_input
      - sdk_linux
      - sdk_macos
      - runner_contract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Validate the static superset and render the stable gate
        env:
          NEEDS_RESULTS: ${{ toJson(needs) }}
          REQUIRED_SLICES: ${{ needs.plan.outputs.required_slices }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and all(.[]; type == "string" and length > 0) and (length == (unique | length))' <<<"$REQUIRED_SLICES" >/dev/null
          jq -e --argjson required "$REQUIRED_SLICES" '
            . as $needs
            | all($required[];
                if . == "runtime-product" then
                  (["runtime_product_linux", "runtime_product_macos", "runtime_product_windows"]
                    | any(.[]; $needs[.].result == "success"))
                elif . == "sdk" then
                  (["sdk_linux", "sdk_macos"] | any(.[]; $needs[.].result == "success"))
                else
                  (if . == "quality" then "quality"
                   elif . == "web" then "web"
                   elif . == "ui-artifact" then "ui_artifact"
                   elif . == "static-abi" then "static_abi"
                   elif . == "rust-tests" then "rust_tests"
                   elif . == "platform-checks" then "platform_checks"
                   elif . == "product-smoke" or . == "model-download" then "product_smoke"
                   elif . == "runner-contract" then "runner_contract"
                   else "" end) as $job
                  | ($job != "" and ($needs[$job].result == "success"))
                end)
          ' <<<"$NEEDS_RESULTS" >/dev/null
          jq -e '
            all(to_entries[];
              if .key == "plan"
              then .value.result == "success"
              else .value.result == "success" or .value.result == "skipped"
              end)
          ' <<<"$NEEDS_RESULTS" >/dev/null
          {
            echo "## CI Required"
            echo
            echo "Plan digest: \`$PLAN_DIGEST\`"
            echo
            echo "| Slice job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key)[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS_RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
