name: CI Windows Runtime Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event used to derive trusted cache-write policy.
        required: true
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      runtime_matrix:
        description: JSON Windows runtime rows from the versioned CI plan.
        required: true
        type: string
      max_parallel:
        description: Runtime worker budget.
        required: false
        default: 2
        type: number
      fail_fast:
        description: Cancel sibling runtime builds after the first required failure.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  runner_policy:
    name: Select Windows runtime runner
    if: ${{ inputs.runtime_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_windows: ${{ steps.policy.outputs.runner_windows }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the Windows runtime role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}

  windows_runtime:
    name: Windows runtime (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ inputs.runtime_matrix != '[]' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_windows }}
    timeout-minutes: 90
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.runtime.backend }}
      LLAMA_STAGE_BUILD_DIR: ${{ matrix.runtime.build_dir }}
      RUSTC_WRAPPER: sccache
      WINDOWS_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
      MESH_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
      WINDOWS_VULKAN_SDK_VERSION: ${{ vars.VULKAN_SDK_VERSION || '1.4.328.1' }}
      ROCM_HIP_SDK_FILENAME: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_windows, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - name: Validate immutable source SHA
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a lowercase 40-character commit SHA'
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - uses: ./.github/actions/resolve-native-toolchain-epoch
        id: native_toolchain
      - uses: ./.github/actions/restore-windows-abi-cache
        id: llama_cache
        with:
          backend: ${{ matrix.runtime.backend }}
          build_dir: ${{ matrix.runtime.build_dir }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ matrix.runtime.cuda_architectures || matrix.runtime.rocm_architectures || '' }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Install CUDA toolkit
        if: ${{ matrix.runtime.backend == 'cuda' }}
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.WINDOWS_CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: ${{ needs.runner_policy.outputs.allow_native_github_cache == 'true' }}
          use-local-cache: true
          log-file-suffix: windows-cuda
      - name: Install Vulkan SDK
        if: ${{ matrix.runtime.backend == 'vulkan' }}
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          cache: ${{ needs.runner_policy.outputs.allow_native_github_cache == 'true' }}
          cache_save_if: ${{ inputs.original_event_name != 'pull_request' && inputs.original_event_name != 'pull_request_target' }}
          stripdown: true
      - name: Install ROCm HIP SDK
        if: ${{ matrix.runtime.backend == 'rocm' }}
        uses: ./.github/actions/setup-windows-rocm-sdk
        with:
          rocm-hip-sdk-filename: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Prepare immutable Windows native runtime
        uses: ./.github/actions/prepare-native-runtime-input
        env:
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.runtime.cuda_architectures }}
          LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.runtime.rocm_architectures }}
        with:
          backend: ${{ matrix.runtime.backend }}
          target: ${{ matrix.runtime.target }}
          output_dir: runtime-input
      - name: Save exact PR-scoped Windows ABI build
        if: ${{ inputs.original_event_name == 'pull_request' && needs.runner_policy.outputs.allow_native_github_cache == 'true' && steps.llama_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.llama_cache.outputs.cache-path }}
          key: ${{ steps.llama_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-runtime-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: |
            runtime-input/*.tar.gz
            runtime-input/*.sha256
          if-no-files-found: error
          retention-days: 1
