name: Verify runtime catalog signing

# Proves the repository minisign secrets can sign a native-runtime catalog
# that verifies against the committed trusted public key. Signs a throwaway
# dummy catalog only: nothing is uploaded, released, or kept.
# Secrets are unavailable to fork PRs, so this only runs for same-repo branches.

on:
  pull_request:
    paths:
      - .github/workflows/verify-runtime-signing.yml
      - .github/workflows/release.yml
      - tools/xtask/src/product/runtime_catalog_signing.rs
      - skippy/crates/skippy-runtime-install/trust/**
      - skippy/crates/skippy-runtime-install/src/catalog_authentication.rs
  workflow_dispatch:

permissions:
  contents: read

env:
  # No sccache on this plain runner; build the signer directly.
  RUSTC_WRAPPER: ""

concurrency:
  group: verify-runtime-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Sign and verify dummy catalog
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20

      - name: Build signer
        run: cargo build --locked -p xtask

      - name: Create dummy catalog
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signcheck"
          printf '{"dummy":true,"run":"%s","sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/signcheck/native-runtimes.json"

      - name: Sign with repository secrets (same command as release.yml)
        env:
          MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_SECRET_KEY: ${{ secrets.MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_SECRET_KEY }}
          MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_PASSWORD: ${{ secrets.MESH_NATIVE_RUNTIME_CATALOG_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cargo xtool product runtime-catalog-sign \
            "$RUNNER_TEMP/signcheck/native-runtimes.json" \
            "$RUNNER_TEMP/signcheck/native-runtimes.json.minisig" \
            skippy/crates/skippy-runtime-install/trust/native-runtime-catalog.pub

      - name: Independently verify with minisign CLI and committed public key
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          minisign -V \
            -p skippy/crates/skippy-runtime-install/trust/native-runtime-catalog.pub \
            -m "$RUNNER_TEMP/signcheck/native-runtimes.json" \
            -x "$RUNNER_TEMP/signcheck/native-runtimes.json.minisig"

