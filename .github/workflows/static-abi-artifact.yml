name: Reusable Static ABI Artifact

on:
  workflow_call:
    inputs:
      backend:
        description: Static llama ABI backend.
        required: true
        type: string
      target:
        description: Native target triple represented by the ABI.
        required: true
        type: string
      artifact_name:
        description: Immutable GitHub artifact name.
        required: true
        type: string
      runner_size:
        description: Eligible Linux runner size (default, 4, 8, or 16).
        required: false
        default: '8'
        type: string
      retention_days:
        description: Artifact retention in days.
        required: false
        default: 1
        type: number
      timeout_minutes:
        description: Producer timeout in minutes.
        required: false
        default: 45
        type: number

env:
  CACHE_NAMESPACE: mesh-llm

jobs:
  runner_policy:
    name: Select protected static ABI runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      runner: ${{ steps.policy.outputs.runner }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
    steps:
      - name: Derive protected runner policy
        id: policy
        shell: bash
        env:
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_REF: ${{ github.ref }}
          POLICY_EVENT_NAME: ${{ github.event_name }}
          POLICY_DEPOT_ENABLED: ${{ vars.DEPOT_RUNNERS_ENABLED == 'true' }}
          POLICY_MANUAL_USE_DEPOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_depot == 'true' }}
          POLICY_TARGET: ${{ inputs.target }}
          POLICY_RUNNER_SIZE: ${{ inputs.runner_size }}
        run: |
          set -euo pipefail

          case "$POLICY_RUNNER_SIZE" in
            default|4|8|16) ;;
            *)
              echo "runner_size must be one of: default, 4, 8, 16" >&2
              exit 1
              ;;
          esac

          case "$POLICY_TARGET" in
            x86_64-unknown-linux-gnu)
              hosted_runner=ubuntu-24.04
              depot_runner=depot-ubuntu-24.04
              ;;
            aarch64-unknown-linux-gnu)
              hosted_runner=ubuntu-24.04-arm
              depot_runner=depot-ubuntu-24.04-arm
              ;;
            *)
              echo "unsupported static ABI producer target: $POLICY_TARGET" >&2
              exit 1
              ;;
          esac

          allow_depot_remote_cache=false
          runner=$hosted_runner
          if [[ "$POLICY_REPOSITORY" == "Mesh-LLM/mesh-llm" &&
                "$POLICY_REF" == "refs/heads/main" &&
                ( "$POLICY_EVENT_NAME" == "push" ||
                  "$POLICY_EVENT_NAME" == "workflow_dispatch" ) &&
                ( "$POLICY_DEPOT_ENABLED" == "true" ||
                  ( "$POLICY_EVENT_NAME" == "workflow_dispatch" &&
                    "$POLICY_MANUAL_USE_DEPOT" == "true" ) ) ]]; then
            suffix=
            if [[ "$POLICY_RUNNER_SIZE" != "default" ]]; then
              suffix="-$POLICY_RUNNER_SIZE"
            fi
            runner="${depot_runner}${suffix}"
            allow_depot_remote_cache=true
          fi

          {
            echo "runner=$runner"
            echo "allow_depot_remote_cache=$allow_depot_remote_cache"
          } >> "$GITHUB_OUTPUT"

  static_abi_artifact:
    needs: runner_policy
    name: Static ABI input (${{ inputs.target }}, ${{ inputs.backend }})
    runs-on: ${{ needs.runner_policy.outputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      LLAMA_STAGE_BACKEND: ${{ inputs.backend }}
      LLAMA_STAGE_BUILD_DIR: .deps/llama.cpp/build-stage-abi-static
      MESH_LLM_LLAMA_TOOLCHAIN_EPOCH: mesh-llm-cuda-runner-sha256-8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d
      MESH_LLM_REQUIRE_SCCACHE: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify prebuilt static ABI environment
        run: verify-runner-image public

      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}

      # Prepare before restoring the nested build cache. prepare-llama replaces
      # an unowned .deps/llama.cpp directory, so doing this after cache restore
      # would discard the restored build tree.
      - name: Prepare patched llama.cpp checkout
        run: scripts/prepare-llama.sh pinned

      - name: Cache portable static ABI input
        id: static_abi_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: static-abi-artifact-output
          key: ${{ format('{0}-{1}-skippy-abi-{2}-{3}-{4}-{5}', env.CACHE_NAMESPACE, runner.os, inputs.backend, inputs.target, env.MESH_LLM_LLAMA_TOOLCHAIN_EPOCH, hashFiles('scripts/build-llama.sh', 'scripts/prepare-llama.sh', 'scripts/restore-static-abi-input.sh', 'scripts/safe-extract-tar.py', 'scripts/verify-checksum-sidecar.py', 'scripts/verify-static-abi-build-stamp.py', '.github/actions/prepare-static-abi-input/action.yml', 'third_party/llama.cpp/upstream.txt', 'third_party/llama.cpp/patches/**', 'Justfile', '.github/cache-version.txt')) }}

      - name: Restore and verify cached portable static ABI
        if: ${{ steps.static_abi_cache.outputs.cache-hit == 'true' }}
        env:
          STATIC_ABI_TARGET: ${{ inputs.target }}
          STATIC_ABI_BACKEND: ${{ inputs.backend }}
        run: |
          scripts/restore-static-abi-input.sh \
            static-abi-artifact-output \
            "$LLAMA_STAGE_BUILD_DIR" \
            "$STATIC_ABI_TARGET" \
            "$STATIC_ABI_BACKEND"

      - name: Build and archive immutable static ABI input
        id: static-abi
        if: ${{ steps.static_abi_cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/prepare-static-abi-input
        with:
          backend: ${{ inputs.backend }}
          target: ${{ inputs.target }}
          build: "true"

      - name: Upload immutable static ABI input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: static-abi-artifact-output/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Capture static ABI sccache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-static-abi-${{ inputs.target }}-${{ inputs.backend }}-${{ github.run_attempt }}
