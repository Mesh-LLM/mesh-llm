name: Diagnostic · Windows ABI cache measurement

# Manual-only cold versus exact-warm measurement of one Windows runtime row.
# It restores (exact-warm only) and never saves, prunes or publishes a cache.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Windows runtime row backend from ci/slices.yml
        required: true
        type: choice
        options:
          - cpu
          - cuda
          - rocm
          - vulkan
      condition:
        description: cold skips ABI retrieval; exact-warm requires an exact hit and no rebuild
        required: true
        type: choice
        options:
          - cold
          - exact-warm
      sample:
        description: Sample label within the matched cohort
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

concurrency:
  group: windows-abi-measurement-${{ github.ref }}-${{ inputs.backend }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"

jobs:
  automation:
    name: Product automation for measurement
    if: ${{ github.repository == 'Mesh-LLM/mesh-llm' }}
    permissions:
      contents: read
    uses: ./.github/workflows/product-automation-artifact.yml
    with:
      platform: windows-x64
      lane: windows
      product_source_sha: ${{ github.sha }}

  measure:
    name: Measure Windows ${{ inputs.backend }} ABI (${{ inputs.condition }} ${{ inputs.sample }})
    needs: automation
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      LLAMA_STAGE_BACKEND: ${{ inputs.backend }}
      RUSTC_WRAPPER: sccache
      WINDOWS_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
      MESH_CUDA_VERSION: ${{ vars.CUDA_VERSION || '12.6.3' }}
      WINDOWS_VULKAN_SDK_VERSION: ${{ vars.VULKAN_SDK_VERSION || '1.4.328.1' }}
      ROCM_HIP_SDK_FILENAME: AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe
      MEASUREMENT_CONDITION: ${{ inputs.condition }}
      MEASUREMENT_SAMPLE: ${{ inputs.sample }}
      RECEIPT_DIR: windows-abi-measurement-evidence
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore product-source automation
        uses: ./.github/actions/restore-automation
        with:
          source_sha: ${{ github.sha }}
          artifact_id: ${{ needs.automation.outputs.artifact_id }}
          binary_sha256: ${{ needs.automation.outputs.binary_sha256 }}
          producer_os: ${{ needs.automation.outputs.producer_os }}
          producer_arch: ${{ needs.automation.outputs.producer_arch }}
      - uses: ./.github/actions/setup-windows-short-paths
      - name: Select closed Windows runtime row
        id: row
        shell: pwsh
        env:
          ROW_BACKEND: ${{ inputs.backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          $row = @(& $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement row --backend $env:ROW_BACKEND --condition $env:MEASUREMENT_CONDITION --sample $env:MEASUREMENT_SAMPLE)
          if ($LASTEXITCODE -ne 0) { throw 'Windows ABI measurement row was refused' }
          $row | Add-Content -Path $env:GITHUB_OUTPUT
          $buildDir = ($row | Where-Object { $_ -like 'build_dir=*' }) -replace '^build_dir=', ''
          "LLAMA_STAGE_BUILD_DIR=$buildDir" | Add-Content -Path $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        # sccache 0.17+ expands Cargo's rustc argfile and exceeds the Windows
        # command-line limit with Rust 1.100's build-dir layout (os error 206,
        # mozilla/sccache#2787). 0.16.0 passes the argfile through.
        with:
          version: v0.16.0
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: "false"
          allow_native_github_cache: "false"
      - uses: ./.github/actions/resolve-native-toolchain-epoch
        id: native_toolchain
      - name: Mark ABI lookup start
        shell: pwsh
        run: |
          & $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement mark --receipt-dir $env:RECEIPT_DIR --phase lookup_start
          if ($LASTEXITCODE -ne 0) { throw 'measurement phase mark failed' }
      - uses: ./.github/actions/restore-windows-abi-cache
        id: llama_cache
        with:
          backend: ${{ steps.row.outputs.backend }}
          build_dir: ${{ steps.row.outputs.build_dir }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ steps.row.outputs.architecture_set }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: ${{ inputs.condition == 'exact-warm' && 'true' || 'false' }}
      - name: Mark ABI lookup end
        shell: pwsh
        run: |
          & $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement mark --receipt-dir $env:RECEIPT_DIR --phase lookup_end
          if ($LASTEXITCODE -ne 0) { throw 'measurement phase mark failed' }
      - name: Admit measurement sample
        id: admit
        shell: pwsh
        env:
          INPUT_BACKEND: ${{ steps.row.outputs.backend }}
          INPUT_ARCHITECTURE_SET: ${{ steps.row.outputs.architecture_set }}
          INPUT_TOOLCHAIN_EPOCH: ${{ steps.native_toolchain.outputs.epoch }}
          INPUT_CUDA_TOOLCHAIN_VERSION: ${{ env.WINDOWS_CUDA_VERSION }}
          INPUT_VULKAN_TOOLCHAIN_VERSION: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          INPUT_ROCM_TOOLCHAIN_VERSION: ${{ env.ROCM_HIP_SDK_FILENAME }}
          CACHE_INPUT_HASH: ${{ steps.llama_cache.outputs.input-hash }}
          CACHE_HIT: ${{ steps.llama_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.llama_cache.outputs.cache-primary-key }}
          BUILD_DIR: ${{ steps.llama_cache.outputs.cache-path }}
        run: |
          & $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement admit --receipt-dir $env:RECEIPT_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Windows ABI measurement sample was refused' }
      - name: Install CUDA toolkit
        if: ${{ inputs.backend == 'cuda' }}
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ env.WINDOWS_CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: false
          use-local-cache: true
          log-file-suffix: windows-cuda
      - name: Install Vulkan SDK
        if: ${{ inputs.backend == 'vulkan' }}
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          cache: false
          cache_save_if: false
          stripdown: true
      - name: Install ROCm HIP SDK
        if: ${{ inputs.backend == 'rocm' }}
        uses: ./.github/actions/setup-windows-rocm-sdk
        with:
          rocm-hip-sdk-filename: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "false"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Mark runtime preparation start
        shell: pwsh
        run: |
          & $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement mark --receipt-dir $env:RECEIPT_DIR --phase prepare_start
          if ($LASTEXITCODE -ne 0) { throw 'measurement phase mark failed' }
      - name: Prepare immutable Windows native runtime
        id: prepare
        uses: ./.github/actions/prepare-native-runtime-input
        env:
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ steps.row.outputs.cuda_architectures }}
          LLAMA_STAGE_AMDGPU_TARGETS: ${{ steps.row.outputs.rocm_architectures }}
        with:
          backend: ${{ steps.row.outputs.backend }}
          target: ${{ steps.row.outputs.target }}
          output_dir: runtime-input
          allow_depot_remote_cache: "false"
          allow_native_github_cache: "false"
      - name: Mark runtime preparation end
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        shell: pwsh
        run: |
          & $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement mark --receipt-dir $env:RECEIPT_DIR --phase prepare_end
          if ($LASTEXITCODE -ne 0) { throw 'measurement phase mark failed' }
      - name: Write measurement receipt
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.llama_cache.outputs.cache-path }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          & $env:MESH_LLM_AUTOMATION_BIN ci-ops windows-abi-measurement finish --receipt-dir $env:RECEIPT_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Windows ABI measurement sample was refused' }
      - name: Upload measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-abi-measurement-${{ inputs.backend }}-${{ inputs.condition }}-${{ inputs.sample }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: warn
          retention-days: 14
