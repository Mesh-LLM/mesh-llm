name: Reusable SDK Smoke Tests

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      sdk_kind:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
      binary_name:
        required: false
        default: mesh-llm
        type: string
      staged_binary_path:
        required: true
        type: string
      swift_artifact_name:
        required: false
        default: ''
        type: string
      swift_artifact_path:
        required: false
        default: sdk-artifacts/swift
        type: string
      swift_artifact_mode:
        required: false
        default: ''
        type: string
      kotlin_artifact_name:
        required: false
        default: ''
        type: string
      kotlin_artifact_path:
        required: false
        default: sdk-artifacts/kotlin
        type: string
      kotlin_artifact_target:
        required: false
        default: ''
        type: string
      kotlin_artifact_backend:
        required: false
        default: ''
        type: string
      kotlin_artifact_profile:
        required: false
        default: ''
        type: string
      model_url:
        required: false
        default: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/9e6855bc4be717fca1ef21360a1db4b29d5c559a/SmolLM2-135M-Instruct-Q8_0.gguf
        type: string
      model_file:
        required: false
        default: SmolLM2-135M-Instruct-Q8_0.gguf
        type: string
      model_cache_scope:
        required: true
        type: string
      cache_key_prefix:
        required: false
        default: ''
        type: string
      timeout_minutes:
        required: false
        default: 30
        type: number
    secrets:
      HF_TOKEN:
        required: false

env:
  MODEL_URL: ${{ inputs.model_url }}
  MODEL_FILE: ${{ inputs.model_file }}

jobs:
  sdk_smoke:
    name: ${{ inputs.sdk_kind }} SDK Smoke
    # Swift stays on the same pinned Apple toolchain boundary as its producer.
    # Kotlin maps its validated artifact architecture to a bounded hosted
    # runner; every other Linux SDK smoke stays on hosted x86 Ubuntu.
    runs-on: ${{ inputs.sdk_kind == 'swift' && 'macos-15' || inputs.sdk_kind == 'kotlin' && inputs.kotlin_artifact_target == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    # Rust and Kotlin smoke both run on Linux (x86 or arm) and get the
    # prebuilt image; Swift stays on bare macos-15, unchanged (that's
    # chunk 6). Empty string opts the job out of containerization
    # per-run. The truthy value must stay first in the `&&` here --
    # see smoke.yml's container block for what breaks if it isn't.
    container:
      image: ${{ inputs.sdk_kind != 'swift' && 'ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d' || '' }}
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Validate bounded SDK smoke inputs
        shell: bash
        env:
          SDK_KIND: ${{ inputs.sdk_kind }}
        run: |
          set -euo pipefail
          case "$SDK_KIND" in
            rust|kotlin|swift) ;;
            *)
              echo "unsupported SDK smoke kind: $SDK_KIND" >&2
              exit 1
              ;;
          esac

      - name: Validate Swift SDK producer contract
        if: ${{ inputs.sdk_kind == 'swift' }}
        env:
          SWIFT_ARTIFACT_NAME: ${{ inputs.swift_artifact_name }}
          SWIFT_ARTIFACT_MODE: ${{ inputs.swift_artifact_mode }}
        run: |
          set -euo pipefail
          if [[ -z "$SWIFT_ARTIFACT_NAME" ]]; then
            echo "swift_artifact_name is required for Swift SDK smoke" >&2
            exit 1
          fi
          case "$SWIFT_ARTIFACT_MODE" in
            host-only|full) ;;
            *)
              echo "unsupported Swift SDK artifact mode: $SWIFT_ARTIFACT_MODE" >&2
              exit 1
              ;;
          esac

      - name: Download immutable Swift SDK input
        if: ${{ inputs.sdk_kind == 'swift' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.swift_artifact_name }}
          path: ${{ inputs.swift_artifact_path }}

      - name: Download immutable generated Swift binding
        if: ${{ inputs.sdk_kind == 'swift' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: generated-swift-binding-${{ inputs.swift_artifact_name }}
          path: sdk-artifacts/swift-generated-binding

      - name: Validate Kotlin SDK producer contract
        if: ${{ inputs.sdk_kind == 'kotlin' }}
        env:
          KOTLIN_ARTIFACT_NAME: ${{ inputs.kotlin_artifact_name }}
          KOTLIN_ARTIFACT_TARGET: ${{ inputs.kotlin_artifact_target }}
          KOTLIN_ARTIFACT_BACKEND: ${{ inputs.kotlin_artifact_backend }}
          KOTLIN_ARTIFACT_PROFILE: ${{ inputs.kotlin_artifact_profile }}
        run: |
          set -euo pipefail
          if [[ -z "$KOTLIN_ARTIFACT_NAME" ]]; then
            echo "kotlin_artifact_name is required for Kotlin SDK smoke" >&2
            exit 1
          fi
          case "$KOTLIN_ARTIFACT_TARGET" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu) ;;
            *)
              echo "unsupported Kotlin native SDK target: $KOTLIN_ARTIFACT_TARGET" >&2
              exit 1
              ;;
          esac
          if [[ "$KOTLIN_ARTIFACT_BACKEND" != "cpu" ]]; then
            echo "Kotlin smoke requires the CPU native SDK input" >&2
            exit 1
          fi
          case "$KOTLIN_ARTIFACT_PROFILE" in
            debug|release) ;;
            *)
              echo "unsupported Kotlin native SDK profile: $KOTLIN_ARTIFACT_PROFILE" >&2
              exit 1
              ;;
          esac

      - name: Download immutable Kotlin native SDK input
        if: ${{ inputs.sdk_kind == 'kotlin' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.kotlin_artifact_name }}
          path: ${{ inputs.kotlin_artifact_path }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        # rust is always containerized (only swift opts out), so this stays
        # gated off in practice — the image bakes the venv this would shadow.
        if: ${{ inputs.sdk_kind == 'rust' && job.container.id == '' }}
        with:
          python-version: "3.12"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        # No JDK is baked into the image (not in verify-runner-image's
        # asserted tool list), so this stays ungated.
        if: ${{ inputs.sdk_kind == 'kotlin' }}
        with:
          distribution: temurin
          java-version: '21'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # Only the uncontained swift row (macos-15) needs this; rust/kotlin
        # get pnpm from the image.
        if: job.container.id == ''
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: job.container.id == ''
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crates/mesh-llm-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        if: ${{ inputs.sdk_kind == 'rust' }}

      - name: Verify prebuilt smoke environment
        if: ${{ inputs.sdk_kind != 'swift' }}
        run: verify-runner-image public cpu

      - name: Configure Linux Rust linker
        if: ${{ runner.os == 'Linux' && inputs.sdk_kind == 'rust' }}
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - uses: ./.github/actions/restore-smoke-inputs
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}
          binary_name: ${{ inputs.binary_name }}
          staged_binary_path: ${{ inputs.staged_binary_path }}
          model_url: ${{ inputs.model_url }}
          model_file: ${{ inputs.model_file }}
          model_cache_scope: ${{ inputs.model_cache_scope }}
          cache_key_prefix: ${{ inputs.cache_key_prefix }}
          save_model_cache: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}

      - name: Rust SDK smoke test
        if: ${{ inputs.sdk_kind == 'rust' }}
        run: scripts/ci-rust-sdk-smoke.sh "${{ inputs.staged_binary_path }}" "${{ inputs.artifact_path }}" "$HOME/.models/${{ inputs.model_file }}"

      - name: Kotlin SDK smoke test
        if: ${{ inputs.sdk_kind == 'kotlin' }}
        run: |
          scripts/ci-kotlin-sdk-smoke.sh \
            "${{ inputs.staged_binary_path }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/${{ inputs.model_file }}" \
            "${{ inputs.kotlin_artifact_path }}" \
            "${{ inputs.kotlin_artifact_target }}" \
            "${{ inputs.kotlin_artifact_backend }}" \
            "${{ inputs.kotlin_artifact_profile }}"

      - name: Swift SDK smoke test
        if: ${{ inputs.sdk_kind == 'swift' }}
        env:
          STAGED_BINARY_PATH: ${{ inputs.staged_binary_path }}
          SWIFT_INPUT_ARCHIVE: ${{ format('{0}/MeshLLMFFI.xcframework.zip', inputs.swift_artifact_path) }}
          SWIFT_INPUT_BINDING: sdk-artifacts/swift-generated-binding/mesh_ffi.swift
          SWIFT_INPUT_MODE: ${{ inputs.swift_artifact_mode }}
        run: |
          scripts/ci-swift-sdk-smoke.sh \
            "$STAGED_BINARY_PATH" \
            "$(dirname "$STAGED_BINARY_PATH")" \
            "$HOME/.models/${{ inputs.model_file }}" \
            "$SWIFT_INPUT_ARCHIVE" \
            "$SWIFT_INPUT_MODE" \
            "$SWIFT_INPUT_BINDING"
