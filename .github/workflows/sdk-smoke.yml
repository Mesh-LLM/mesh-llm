          cp "$RUNNER_TEMP/immutable-automation-restored/source.txt" "$RUNNER_TEMP/automation-diagnostic-evidence/source.txt"
          cp "$RUNNER_TEMP/immutable-automation-restored/SHA256SUMS" "$RUNNER_TEMP/automation-diagnostic-evidence/SHA256SUMS"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Admit current immutable resolver source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          command -v cargo
      - name: Execute native package resolver against actual current workspace
        id: resolve
        timeout-minutes: 3
        uses: ./.github/actions/resolve-cargo-packages
        with:
          crates: '["xtask"]'
          batches: ''
          generation: current
      - name: Admit exact resolver result
        env:
          RESOLVED: ${{ steps.resolve.outputs.crates }}
        run: |
          set -euo pipefail
          test "$RESOLVED" = '["xtask"]'
          printf '%s\n' "$RESOLVED" > "$RUNNER_TEMP/automation-diagnostic-evidence/resolved.json"
          git diff --exit-code
      - name: Retain consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: diagnostic-automation-consumer-windows_x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-diagnostic-evidence
          if-no-files-found: warn
          retention-days: 1
