name: Cache · Trusted sccache seed

on:
  workflow_run:
    workflows: ["Main · Quality"]
    types: [completed]
  workflow_dispatch:
    inputs:
      qualification:
        description: Compare current and standalone Skippy seed recipes without publishing caches
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: trusted-sccache-seed-${{ inputs.qualification && github.run_id || 'publisher' }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"

jobs:
  qualification_automation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification }}
    uses: ./.github/workflows/product-automation-artifact.yml
    with:
      platform: linux-x64
      lane: linux
      product_source_sha: ${{ github.sha }}

  qualification:
    name: Compiler seed pair ${{ matrix.pair }}
    needs: qualification_automation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: [1, 2, 3]
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:aaa3684385c53d0e41d67011da0a101e8a84420de490375f1e3ce5efb4ba7e60
    env:
      CARGO_INCREMENTAL: '0'
      MESH_LLM_SKIP_UI: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_MULTILEVEL_CHAIN: disk
      SCCACHE_CACHE_SIZE: 2G
      COMPILER_SEED_IMAGE: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:aaa3684385c53d0e41d67011da0a101e8a84420de490375f1e3ce5efb4ba7e60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify measurement image
        run: verify-runner-image public cpu
      - name: Resolve product source layout
        id: layout
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-source-layout@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
      - name: Prepare seed UI input
        env:
          UI_DIR: ${{ steps.layout.outputs.ui_dir }}
        run: mkdir -p "$UI_DIR/dist" && printf '<html></html>' > "$UI_DIR/dist/index.html"
      - name: Restore product automation
        uses: ./.github/actions/restore-automation
        with:
          source_sha: ${{ needs.qualification_automation.outputs.source_sha }}
          product_source_sha: ${{ github.sha }}
          source_profile: product-clean
          require_product: 'true'
          artifact_id: ${{ needs.qualification_automation.outputs.artifact_id }}
          binary_sha256: ${{ needs.qualification_automation.outputs.binary_sha256 }}
          producer_os: ${{ needs.qualification_automation.outputs.producer_os }}
          producer_arch: ${{ needs.qualification_automation.outputs.producer_arch }}
      - name: Measure isolated seed recipes and consumers
        env:
          PAIR: ${{ matrix.pair }}
        run: '"$MESH_LLM_AUTOMATION_BIN" ci-ops compiler-seed run --pair "$PAIR" --output "$RUNNER_TEMP/compiler-seed-evidence"'
      - name: Retain paired measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compiler-seed-pair-${{ matrix.pair }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiler-seed-evidence
          if-no-files-found: error
          retention-days: 14

  warm:
    name: Publish bounded Linux compiler seed
    if: ${{ !inputs.qualification && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:aaa3684385c53d0e41d67011da0a101e8a84420de490375f1e3ce5efb4ba7e60
    env:
      CARGO_INCREMENTAL: "0"
      MESH_LLM_SKIP_UI: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify trusted cache-warmer environment
        run: verify-runner-image public cpu
      - name: Resolve compiler seed key
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          key="mesh-llm-sccache-seed-linux-x86_64-img-aaa36843-epoch-aaa36843-v3-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'mesh/crates/*/Cargo.toml', 'skippy/crates/*/Cargo.toml', 'tools/*/Cargo.toml', '.github/workflows/cache-warm-sccache.yml', '.github/cache-version.txt', '.cargo/config.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'Justfile', 'just/**') }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Check for an existing exact seed
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/mesh-llm-sccache
          key: ${{ steps.seed.outputs.key }}
          lookup-only: true
      - name: Configure bounded local sccache
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: "false"
          allow_native_github_cache: "false"
      - name: Resolve product source layout
        id: layout
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-source-layout@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
      - name: Prepare UI placeholder
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        env:
          UI_DIR: ${{ steps.layout.outputs.ui_dir }}
        run: mkdir -p "$UI_DIR/dist" && printf '<html></html>' > "$UI_DIR/dist/index.html"
      - name: Compile the dominant host dependency graph
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: just ci-sccache-seed-build
      - name: Capture intentionally cold warmer evidence
        if: ${{ steps.restore.outputs.cache-hit != 'true' && !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-trusted-seed-${{ github.run_attempt }}
          cache_expectation: cold
      - name: Stop sccache before archiving
        if: ${{ steps.restore.outputs.cache-hit != 'true' && !cancelled() }}
        run: sccache --stop-server
      - name: Publish exact trusted compiler seed
        if: ${{ steps.restore.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/mesh-llm-sccache
          key: ${{ steps.seed.outputs.key }}
