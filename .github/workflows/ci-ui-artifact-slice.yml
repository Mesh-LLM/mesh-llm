name: CI UI Artifact Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      artifact_name:
        description: Immutable UI distribution artifact consumed by host builders.
        required: true
        type: string
      retention_days:
        description: Short retention for the per-run producer artifact.
        required: false
        default: 1
        type: number

permissions:
  contents: read

env:
  CACHE_NAMESPACE: mesh-llm

jobs:
  runner_policy:
    name: Select console artifact runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_4: ${{ steps.policy.outputs.runner_4 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the console artifact role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          # The pre-existing trusted-main allowlist does not include this
          # producer. PR placement is independently gated and cache-isolated.
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}

  ui_artifact:
    name: Build immutable console UI
    needs: runner_policy
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/mesh-llm-ui
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure isolated pnpm store
        run: pnpm config set store-dir ~/.pnpm-store
      - name: Restore pnpm store
        id: pnpm_cache
        if: ${{ needs.runner_policy.outputs.allow_native_github_cache == 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ env.CACHE_NAMESPACE }}-pnpm-${{ runner.os }}-${{ hashFiles('crates/mesh-llm-ui/pnpm-lock.yaml', '.github/cache-version.txt') }}
          restore-keys: |
            ${{ env.CACHE_NAMESPACE }}-pnpm-${{ runner.os }}-
      - name: Install UI dependencies
        run: pnpm i --frozen-lockfile
      - name: Build console distribution
        run: pnpm run build
      - name: Verify console distribution
        run: test -s dist/index.html
      - name: Upload immutable console distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: crates/mesh-llm-ui/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
