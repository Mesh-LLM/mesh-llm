name: CI UI Artifact Slice

on:
  workflow_call:
    inputs:
      authority_linux_x64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_linux_arm64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_macos_arm64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      authority_windows_x64:
        description: Exact same-run protected native producer identity JSON, source SHA, artifact ID, independent digest, OS, and architecture.
        required: false
        default: ''
        type: string
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      policy_source_sha:
        description: Optional source revision for the runner-policy checkout; defaults to the protected branch.
        required: false
        default: ''
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      artifact_name:
        description: Immutable UI distribution artifact consumed by host builders.
        required: true
        type: string
      retention_days:
        description: Short retention for the per-run producer artifact.
        required: false
        default: 1
        type: number
      release_tag:
        description: Optional release version to prepare and bind to the UI artifact.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

jobs:
  runner_policy:
    name: Select console artifact runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_4: ${{ steps.policy.outputs.runner_4 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.policy_source_sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the console artifact role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          # The pre-existing trusted-main allowlist does not include this
          # producer. PR placement is independently gated and cache-isolated.
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}

  ui_artifact:
    name: Build immutable console UI
    needs: runner_policy
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 20
    container:
      image: ${{ inputs.release_tag != '' && 'ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:ff53048ee7a87b3244ccbfa1b2888fde5db31a73d0dfa42f283d25dde0115307' || 'ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:37dc12322bd2efaefc59e51ad58d8cd3284974cb23721d13f0ff3564715037bb' }}
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Resolve product source layout
        id: layout
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-source-layout@5c8fb4d472bc57058c8153761c561daa77dd5b94 # product-layout compatibility helpers
      - name: Prepare release UI version
        if: ${{ inputs.release_tag != '' }}
        working-directory: .
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$UI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$UI_SOURCE_SHA"
          scripts/release-version.sh "$RELEASE_TAG"
          echo "VITE_MESH_LLM_DEBUG_UI=false" >> "$GITHUB_ENV"
      # The container image bakes a warm pnpm store at
      # /home/runner/.local/share/pnpm/store (mesh-llm-runner-images
      # scripts/warm-dependencies.sh). Point pnpm at it directly instead of
      # the Actions cache: containerized jobs fix $HOME to /github/home, so
      # neither pnpm's default store-dir resolution nor a plain HOME
      # override can find the baked store from in here, and restoring
      # ~/.pnpm-store from the Actions cache reported a hit but the files
      # didn't land where pnpm looks for them (#1392). Using the image's
      # own store sidesteps both and needs no cache round trip at all — this
      # also removes the restore-with-no-publisher race this job used to
      # have against ui_quality's save (three lanes restored a key only
      # ui_quality ever saved).
      - name: Point pnpm at the image's baked store
        working-directory: ${{ steps.layout.outputs.ui_dir }}
        run: pnpm config set store-dir /home/runner/.local/share/pnpm/store
      - name: Install UI dependencies
        working-directory: ${{ steps.layout.outputs.ui_dir }}
        run: pnpm i --frozen-lockfile
      - name: Build console distribution
        working-directory: ${{ steps.layout.outputs.ui_dir }}
        run: pnpm run build
      - name: Verify console distribution
        working-directory: ${{ steps.layout.outputs.ui_dir }}
        run: test -s dist/index.html
      - name: Upload immutable console distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.release_tag != '' && format('{0}-raw', inputs.artifact_name) || inputs.artifact_name }}
          path: ${{ steps.layout.outputs.ui_dir }}/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  ui_stamp:
    name: Bind immutable release console UI
    needs: [runner_policy, ui_artifact]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 20
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:f499b79bc52dc7492d57397fdbec9f890c6f6bb1d8c1fcde9c1c97d45c0541a7
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.policy_source_sha || github.event.repository.default_branch }}
          persist-credentials: false
      - id: automation
        uses: ./.github/actions/prepare-automation
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Download immutable raw console distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('{0}-raw', inputs.artifact_name) }}
          path: ${{ runner.temp }}/release-ui-dist
      - name: Bind release UI identity and checksums
        shell: bash
        env:
          AUTOMATION_BIN: ${{ steps.automation.outputs.binary_path }}
          UI_DIST: ${{ runner.temp }}/release-ui-dist
          UI_SOURCE_SHA: ${{ inputs.source_sha }}
          UI_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          "$AUTOMATION_BIN" prepared-input ui-distribution stamp \
            --dist "$UI_DIST" \
            --source-sha "$UI_SOURCE_SHA" \
            --release-tag "$UI_RELEASE_TAG"
      - name: Upload immutable console distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/release-ui-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
