name: Public Website Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "install.sh"
      - "install.ps1"
      - "install.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Justfile"
      - "crates/**"
      - "scripts/build-crate-docs.sh"
      - "scripts/publish-crates.sh"
      - ".github/workflows/website-pages.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: public-website-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public website
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:1c73f0f2e4b2ce657cc9dc49c9c27374f3c364af19f884f1970331c3689da5d2

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Rust
        # Kept deliberately: the image's rustc comes from `rustup ...
        # --default-toolchain stable` at image-build time, an unpinned
        # moving target, not this repo's pinned toolchain SHA. `just
        # crate-docs` (below) runs `cargo doc` for the published crate API
        # docs this job deploys to Pages, and this workflow has no
        # pre-merge harness coverage at all (push-to-main, path-filtered) --
        # so a silent toolchain drift here would ship unnoticed. Re-pins on
        # top of the baked toolchain; CARGO_HOME/RUSTUP_HOME are baked ENV
        # so this resolves the same install location regardless of the
        # container's HOME.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Clean generated website output
        working-directory: website
        run: npm run clean

      - name: Build public website
        working-directory: website
        run: npm run build

      - name: Build published crate API docs
        run: just crate-docs

      - name: Stage Pages artifact
        # shell: bash is required: this job's container: resolves the
        # default run: shell to sh -e {0}, and dash has no -o pipefail.
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="public-website-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          cp docs/index.html "$artifact_dir/"
          cp docs/CNAME "$artifact_dir/"
          cp docs/funding.json "$artifact_dir/"
          cp docs/install.sh "$artifact_dir/"
          cp docs/install.ps1 "$artifact_dir/"
          cp docs/setup-mesh "$artifact_dir/"
          cp docs/mesh-llm-logo.svg "$artifact_dir/"
          cp -R docs/assets "$artifact_dir/"
          cp -R docs/catalog "$artifact_dir/"
          cp -R docs/.well-known "$artifact_dir/"
          cp -R docs/docs "$artifact_dir/"
          cp -R docs/crates "$artifact_dir/"
          cp -R docs/pagefind "$artifact_dir/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public-website-artifact

  deploy:
    name: Deploy public website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: Public Website
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
