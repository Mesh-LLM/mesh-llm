name: Diagnostic · Linux cache measurement

# Manual-only cold, exact-warm and unrelated-edit measurement of the Linux CPU
# runtime package and hosted automation executables. It restores existing exact
# keys and never saves, prunes or publishes a cache.
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Cache cohort under measurement
        required: true
        type: choice
        options:
          - cpu-runtime
          - hosted-xtask
          - hosted-controller
      condition:
        description: cold skips retrieval; exact-warm and unrelated-edit require an exact trusted entry or record BLOCKED
        required: true
        type: choice
        options:
          - cold
          - exact-warm
          - unrelated-edit
      sample:
        description: Sample label within the matched cohort
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

concurrency:
  group: linux-cache-measurement-${{ github.ref }}-${{ inputs.cohort }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"
  MEASUREMENT_CONDITION: ${{ inputs.condition }}
  MEASUREMENT_SAMPLE: ${{ inputs.sample }}
  RECEIPT_DIR: linux-cache-measurement-evidence

defaults:
  run:
    shell: bash

jobs:
  cpu_row:
    name: Select Linux CPU runtime row
    if: ${{ inputs.cohort == 'cpu-runtime' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runtime_matrix: ${{ steps.row.outputs.runtime_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the unchanged catalog row
        id: row
        run: |
          set -euo pipefail
          rows="$(jq -c '[.runtime_rows[] | select(.id == "linux-cpu")]' ci/slices.yml)"
          test "$(jq length <<< "$rows")" = 1
          printf 'runtime_matrix=%s\n' "$rows" >> "$GITHUB_OUTPUT"

  measure_cpu_runtime:
    name: Measure Linux CPU runtime (${{ inputs.condition }} ${{ inputs.sample }})
    needs: cpu_row
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        runtime: ${{ fromJson(needs.cpu_row.outputs.runtime_matrix) }}
    container:
      image: ${{ matrix.runtime.container_image }}
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.runtime.backend }}
      LLAMA_STAGE_BUILD_DIR: ${{ matrix.runtime.build_dir }}
      MESH_LLM_REQUIRE_SCCACHE: "1"
      LLAMA_STAGE_SKIP_NCCL: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify prebuilt native environment
        env:
          VERIFY_BACKEND: ${{ matrix.runtime.verify_backend }}
        run: |
          read -r -a verify_args <<< "$VERIFY_BACKEND"
          verify-runner-image "${verify_args[@]}"
      - name: Build measurement automation outside measured roots
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/linux-cache-measurement-target"
          RUSTC_WRAPPER='' CARGO_BUILD_RUSTC_WRAPPER='' CARGO_TARGET_DIR="$target" \
            cargo build --locked --release -p xtask --bin xtask
          echo "MESH_LLM_AUTOMATION_BIN=$target/release/xtask" >> "$GITHUB_ENV"
      - name: Resolve native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          pinned_epoch: ${{ matrix.runtime.toolchain_epoch }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: "false"
          allow_native_github_cache: "false"
      - name: Record computed key before any edit
        env:
          CACHE_KEY: skippy-runtime-linux-v2-${{ matrix.runtime.target }}-${{ matrix.runtime.toolchain_epoch }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-native-runtime-input/**', '.github/actions/resolve-native-toolchain-epoch/**', '.github/cache-version.txt', '.github/workflows/ci-linux-runtime-slice.yml', 'Cargo.lock', 'Cargo.toml', 'ci/python-research-source.json', 'mesh/crates/mesh-llm-release-footer/Cargo.toml', 'mesh/crates/mesh-llm-release-footer/src/**', 'scripts/**', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/ci-compat-smoke.sh', 'scripts/lib/lld.sh', 'scripts/linux-glibc-floor.txt', 'skippy/crates/skippy-cache/Cargo.toml', 'skippy/crates/skippy-cache/src/**', 'skippy/crates/skippy-ffi/Cargo.toml', 'skippy/crates/skippy-ffi/bindgen/**', 'skippy/crates/skippy-ffi/build.rs', 'skippy/crates/skippy-ffi/build/**', 'skippy/crates/skippy-ffi/src/**', 'skippy/crates/skippy-gpu-bench/native/**', 'skippy/crates/skippy-hf-hub/Cargo.toml', 'skippy/crates/skippy-hf-hub/src/**', 'skippy/crates/skippy-model-artifact/Cargo.toml', 'skippy/crates/skippy-model-artifact/src/**', 'skippy/crates/skippy-model-hf/Cargo.toml', 'skippy/crates/skippy-model-hf/src/**', 'skippy/crates/skippy-model-ref/Cargo.toml', 'skippy/crates/skippy-model-ref/src/**', 'skippy/crates/skippy-model-resolver/Cargo.toml', 'skippy/crates/skippy-model-resolver/src/**', 'skippy/crates/skippy-model/Cargo.toml', 'skippy/crates/skippy-model/src/**', 'skippy/crates/skippy-native-runtime/RUNTIME_VERSION', 'skippy/crates/skippy-package-builder/Cargo.toml', 'skippy/crates/skippy-package-builder/src/**', 'skippy/crates/skippy-package-format/Cargo.toml', 'skippy/crates/skippy-package-format/src/**', 'skippy/crates/skippy-protocol/Cargo.toml', 'skippy/crates/skippy-protocol/build.rs', 'skippy/crates/skippy-protocol/proto/**', 'skippy/crates/skippy-protocol/src/**', 'skippy/crates/skippy-runtime/Cargo.toml', 'skippy/crates/skippy-runtime/src/**', 'skippy/crates/skippy-tokenizer/Cargo.toml', 'skippy/crates/skippy-tokenizer/src/**', 'skippy/llama_cpp/**', 'skippy/scripts/**', 'tools/authority-automation/Cargo.toml', 'tools/authority-automation/src/**', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**', 'tools/process-supervision/Cargo.toml', 'tools/process-supervision/src/**', 'tools/runner-cleanup/Cargo.toml', 'tools/runner-cleanup/src/**', 'tools/trajectory-reader/Cargo.toml', 'tools/trajectory-reader/src/**', 'tools/xtask/Cargo.toml', 'tools/xtask/build.rs', 'tools/xtask/src/**') }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement key --receipt-dir "$RECEIPT_DIR" --cohort cpu-runtime --phase before
      - name: Apply the admitted unrelated edit
        if: ${{ inputs.condition == 'unrelated-edit' }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement edit --receipt-dir "$RECEIPT_DIR" --cohort cpu-runtime
      - name: Record measured key
        env:
          CACHE_KEY: skippy-runtime-linux-v2-${{ matrix.runtime.target }}-${{ matrix.runtime.toolchain_epoch }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-native-runtime-input/**', '.github/actions/resolve-native-toolchain-epoch/**', '.github/cache-version.txt', '.github/workflows/ci-linux-runtime-slice.yml', 'Cargo.lock', 'Cargo.toml', 'ci/python-research-source.json', 'mesh/crates/mesh-llm-release-footer/Cargo.toml', 'mesh/crates/mesh-llm-release-footer/src/**', 'scripts/**', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/ci-compat-smoke.sh', 'scripts/lib/lld.sh', 'scripts/linux-glibc-floor.txt', 'skippy/crates/skippy-cache/Cargo.toml', 'skippy/crates/skippy-cache/src/**', 'skippy/crates/skippy-ffi/Cargo.toml', 'skippy/crates/skippy-ffi/bindgen/**', 'skippy/crates/skippy-ffi/build.rs', 'skippy/crates/skippy-ffi/build/**', 'skippy/crates/skippy-ffi/src/**', 'skippy/crates/skippy-gpu-bench/native/**', 'skippy/crates/skippy-hf-hub/Cargo.toml', 'skippy/crates/skippy-hf-hub/src/**', 'skippy/crates/skippy-model-artifact/Cargo.toml', 'skippy/crates/skippy-model-artifact/src/**', 'skippy/crates/skippy-model-hf/Cargo.toml', 'skippy/crates/skippy-model-hf/src/**', 'skippy/crates/skippy-model-ref/Cargo.toml', 'skippy/crates/skippy-model-ref/src/**', 'skippy/crates/skippy-model-resolver/Cargo.toml', 'skippy/crates/skippy-model-resolver/src/**', 'skippy/crates/skippy-model/Cargo.toml', 'skippy/crates/skippy-model/src/**', 'skippy/crates/skippy-native-runtime/RUNTIME_VERSION', 'skippy/crates/skippy-package-builder/Cargo.toml', 'skippy/crates/skippy-package-builder/src/**', 'skippy/crates/skippy-package-format/Cargo.toml', 'skippy/crates/skippy-package-format/src/**', 'skippy/crates/skippy-protocol/Cargo.toml', 'skippy/crates/skippy-protocol/build.rs', 'skippy/crates/skippy-protocol/proto/**', 'skippy/crates/skippy-protocol/src/**', 'skippy/crates/skippy-runtime/Cargo.toml', 'skippy/crates/skippy-runtime/src/**', 'skippy/crates/skippy-tokenizer/Cargo.toml', 'skippy/crates/skippy-tokenizer/src/**', 'skippy/llama_cpp/**', 'skippy/scripts/**', 'tools/authority-automation/Cargo.toml', 'tools/authority-automation/src/**', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**', 'tools/process-supervision/Cargo.toml', 'tools/process-supervision/src/**', 'tools/runner-cleanup/Cargo.toml', 'tools/runner-cleanup/src/**', 'tools/trajectory-reader/Cargo.toml', 'tools/trajectory-reader/src/**', 'tools/xtask/Cargo.toml', 'tools/xtask/build.rs', 'tools/xtask/src/**') }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement key --receipt-dir "$RECEIPT_DIR" --cohort cpu-runtime --phase measured
      - name: Mark lookup start
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase lookup_start
      - name: Restore exact trusted entry
        id: runtime_cache
        if: ${{ inputs.condition != 'cold' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: runtime-input
          key: skippy-runtime-linux-v2-${{ matrix.runtime.target }}-${{ matrix.runtime.toolchain_epoch }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-native-runtime-input/**', '.github/actions/resolve-native-toolchain-epoch/**', '.github/cache-version.txt', '.github/workflows/ci-linux-runtime-slice.yml', 'Cargo.lock', 'Cargo.toml', 'ci/python-research-source.json', 'mesh/crates/mesh-llm-release-footer/Cargo.toml', 'mesh/crates/mesh-llm-release-footer/src/**', 'scripts/**', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/ci-compat-smoke.sh', 'scripts/lib/lld.sh', 'scripts/linux-glibc-floor.txt', 'skippy/crates/skippy-cache/Cargo.toml', 'skippy/crates/skippy-cache/src/**', 'skippy/crates/skippy-ffi/Cargo.toml', 'skippy/crates/skippy-ffi/bindgen/**', 'skippy/crates/skippy-ffi/build.rs', 'skippy/crates/skippy-ffi/build/**', 'skippy/crates/skippy-ffi/src/**', 'skippy/crates/skippy-gpu-bench/native/**', 'skippy/crates/skippy-hf-hub/Cargo.toml', 'skippy/crates/skippy-hf-hub/src/**', 'skippy/crates/skippy-model-artifact/Cargo.toml', 'skippy/crates/skippy-model-artifact/src/**', 'skippy/crates/skippy-model-hf/Cargo.toml', 'skippy/crates/skippy-model-hf/src/**', 'skippy/crates/skippy-model-ref/Cargo.toml', 'skippy/crates/skippy-model-ref/src/**', 'skippy/crates/skippy-model-resolver/Cargo.toml', 'skippy/crates/skippy-model-resolver/src/**', 'skippy/crates/skippy-model/Cargo.toml', 'skippy/crates/skippy-model/src/**', 'skippy/crates/skippy-native-runtime/RUNTIME_VERSION', 'skippy/crates/skippy-package-builder/Cargo.toml', 'skippy/crates/skippy-package-builder/src/**', 'skippy/crates/skippy-package-format/Cargo.toml', 'skippy/crates/skippy-package-format/src/**', 'skippy/crates/skippy-protocol/Cargo.toml', 'skippy/crates/skippy-protocol/build.rs', 'skippy/crates/skippy-protocol/proto/**', 'skippy/crates/skippy-protocol/src/**', 'skippy/crates/skippy-runtime/Cargo.toml', 'skippy/crates/skippy-runtime/src/**', 'skippy/crates/skippy-tokenizer/Cargo.toml', 'skippy/crates/skippy-tokenizer/src/**', 'skippy/llama_cpp/**', 'skippy/scripts/**', 'tools/authority-automation/Cargo.toml', 'tools/authority-automation/src/**', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**', 'tools/process-supervision/Cargo.toml', 'tools/process-supervision/src/**', 'tools/runner-cleanup/Cargo.toml', 'tools/runner-cleanup/src/**', 'tools/trajectory-reader/Cargo.toml', 'tools/trajectory-reader/src/**', 'tools/xtask/Cargo.toml', 'tools/xtask/build.rs', 'tools/xtask/src/**') }}
      - name: Mark lookup end
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase lookup_end
      - name: Admit measurement sample
        id: admit
        env:
          CACHE_HIT: ${{ steps.runtime_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.runtime_cache.outputs.cache-primary-key }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement admit --receipt-dir "$RECEIPT_DIR" --cohort cpu-runtime
      - name: Mark prepare start
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase prepare_start
      - name: Verify restored Linux CPU runtime
        id: verify
        if: ${{ steps.runtime_cache.outputs.cache-hit == 'true' }}
        env:
          EXPECTED_BACKEND: ${{ matrix.runtime.backend }}
          EXPECTED_TARGET: ${{ matrix.runtime.target }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find runtime-input -mindepth 2 -maxdepth 2 -type f -name manifest.json -print)
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "expected exactly one cached native runtime" >&2
            exit 1
          fi
          runtime_dir="$(dirname "${manifests[0]}")"
          scripts/verify-native-runtime-package.sh --expected-backend "$EXPECTED_BACKEND" --expected-target "$EXPECTED_TARGET" "$runtime_dir" "$runtime_dir.tar.gz"
          if ! tar -xOzf "$runtime_dir.tar.gz" "$(basename "$runtime_dir")/manifest.json" | cmp -s "$runtime_dir/manifest.json" -; then
            echo "cached runtime directory and archive manifests differ" >&2
            exit 1
          fi
      - name: Prepare immutable Linux native runtime
        id: prepare
        if: ${{ steps.runtime_cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.runtime.backend }}
          target: ${{ matrix.runtime.target }}
          output_dir: runtime-input
      - name: Mark prepare end
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase prepare_end
      - name: Write measurement receipt
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        env:
          PREPARE_OUTCOME: ${{ steps.verify.outcome == 'failure' && 'failure' || steps.prepare.outcome == 'skipped' && steps.verify.outcome || steps.prepare.outcome }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement finish --receipt-dir "$RECEIPT_DIR" --cohort cpu-runtime
      - name: Upload measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-cache-measurement-cpu-runtime-${{ inputs.condition }}-${{ inputs.sample }}-${{ github.run_attempt }}
          path: linux-cache-measurement-evidence
          if-no-files-found: warn
          retention-days: 14

  measure_hosted_xtask:
    name: Measure hosted xtask (${{ inputs.condition }} ${{ inputs.sample }})
    if: ${{ inputs.cohort == 'hosted-xtask' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        id: rust_toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Resolve hosted system image
        id: hosted_image
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          case "${ImageOS:-}" in ''|*[!A-Za-z0-9._-]*) exit 1 ;; esac
          case "${ImageVersion:-}" in ''|*[!A-Za-z0-9._-]*) exit 1 ;; esac
          printf 'identity=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Build measurement automation outside measured roots
