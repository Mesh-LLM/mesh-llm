          CACHE_KEY: xtask-hosted-bare-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.cachekey }}-${{ steps.hosted_image.outputs.identity }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-automation/action.yml', '.github/cache-version.txt', 'Cargo.lock', 'Cargo.toml', 'ci/python-research-source.json', 'mesh/crates/mesh-llm-release-footer/Cargo.toml', 'mesh/crates/mesh-llm-release-footer/src/**', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/ci-compat-smoke.sh', 'scripts/lib/lld.sh', 'scripts/linux-glibc-floor.txt', 'tools/authority-automation/Cargo.toml', 'tools/authority-automation/src/**', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**', 'tools/process-supervision/Cargo.toml', 'tools/process-supervision/src/**', 'tools/runner-cleanup/Cargo.toml', 'tools/runner-cleanup/src/**', 'tools/trajectory-reader/Cargo.toml', 'tools/trajectory-reader/src/**', 'tools/xtask/Cargo.toml', 'tools/xtask/build.rs', 'tools/xtask/src/**') }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement key --receipt-dir "$RECEIPT_DIR" --cohort hosted-xtask --phase before
      - name: Apply the admitted unrelated edit
