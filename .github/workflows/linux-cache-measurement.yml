          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase prepare_start
      - name: Prepare hosted xtask as production does
        id: prepare
        env:
          CACHE_HIT: ${{ steps.cached.outputs.cache-hit }}
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER='' CARGO_BUILD_RUSTC_WRAPPER=''
          if [[ "${CACHE_HIT:-}" != true || ! -x target/release/xtask ]]; then
            cargo build --locked --release -p xtask --bin xtask
          fi
          target/release/xtask automation bootstrap
      - name: Mark prepare end
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase prepare_end
      - name: Write measurement receipt
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement finish --receipt-dir "$RECEIPT_DIR" --cohort hosted-xtask
      - name: Upload measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-cache-measurement-hosted-xtask-${{ inputs.condition }}-${{ inputs.sample }}-${{ github.run_attempt }}
          path: linux-cache-measurement-evidence
          if-no-files-found: warn
          retention-days: 14

  measure_hosted_controller:
    name: Measure hosted controller (${{ inputs.condition }} ${{ inputs.sample }})
    if: ${{ inputs.cohort == 'hosted-controller' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        id: rust_toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Resolve hosted system image
        id: hosted_image
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          case "${ImageOS:-}" in ''|*[!A-Za-z0-9._-]*) exit 1 ;; esac
          case "${ImageVersion:-}" in ''|*[!A-Za-z0-9._-]*) exit 1 ;; esac
          printf 'identity=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Build measurement automation outside measured roots
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/linux-cache-measurement-target"
          RUSTC_WRAPPER='' CARGO_BUILD_RUSTC_WRAPPER='' CARGO_TARGET_DIR="$target" \
            cargo build --locked --release -p xtask --bin xtask
          echo "MESH_LLM_AUTOMATION_BIN=$target/release/xtask" >> "$GITHUB_ENV"
      - name: Record computed key before any edit
        env:
          CACHE_KEY: ci-controller-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.cachekey }}-${{ steps.hosted_image.outputs.identity }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-ci-controller/action.yml', '.github/cache-version.txt', 'Cargo.lock', 'Cargo.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**') }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement key --receipt-dir "$RECEIPT_DIR" --cohort hosted-controller --phase before
      - name: Apply the admitted unrelated edit
        if: ${{ inputs.condition == 'unrelated-edit' }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement edit --receipt-dir "$RECEIPT_DIR" --cohort hosted-controller
      - name: Record measured key
        env:
          CACHE_KEY: ci-controller-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.cachekey }}-${{ steps.hosted_image.outputs.identity }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-ci-controller/action.yml', '.github/cache-version.txt', 'Cargo.lock', 'Cargo.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**') }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement key --receipt-dir "$RECEIPT_DIR" --cohort hosted-controller --phase measured
      - name: Mark lookup start
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase lookup_start
      - name: Restore exact trusted entry
        id: cached
        if: ${{ inputs.condition != 'cold' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/release/ci-controller
          key: ci-controller-hosted-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.cachekey }}-${{ steps.hosted_image.outputs.identity }}-${{ hashFiles('.cargo/**', '.github/actions/prepare-ci-controller/action.yml', '.github/cache-version.txt', 'Cargo.lock', 'Cargo.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'tools/ci-controller/Cargo.toml', 'tools/ci-controller/src/**') }}
      - name: Mark lookup end
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase lookup_end
      - name: Admit measurement sample
        id: admit
        env:
          CACHE_HIT: ${{ steps.cached.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.cached.outputs.cache-primary-key }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement admit --receipt-dir "$RECEIPT_DIR" --cohort hosted-controller
      - name: Mark prepare start
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase prepare_start
      - name: Prepare hosted controller as production does
        id: prepare
        env:
          CACHE_HIT: ${{ steps.cached.outputs.cache-hit }}
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER='' CARGO_BUILD_RUSTC_WRAPPER=''
          if [[ "${CACHE_HIT:-}" != true || ! -x target/release/ci-controller ]]; then
            cargo build --locked --release -p ci-controller --bin ci-controller
          fi
          target/release/ci-controller automation bootstrap
      - name: Mark prepare end
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement mark --receipt-dir "$RECEIPT_DIR" --phase prepare_end
      - name: Write measurement receipt
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          "$MESH_LLM_AUTOMATION_BIN" ci-ops linux-cache-measurement finish --receipt-dir "$RECEIPT_DIR" --cohort hosted-controller
      - name: Upload measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-cache-measurement-hosted-controller-${{ inputs.condition }}-${{ inputs.sample }}-${{ github.run_attempt }}
          path: linux-cache-measurement-evidence
          if-no-files-found: warn
          retention-days: 14
