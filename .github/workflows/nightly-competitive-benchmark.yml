name: Nightly Competitive Benchmark

on:
  schedule:
    - cron: "17 11 * * *"

# Scheduled workflows execute the definition from the default branch. This file intentionally has
# no workflow_dispatch entry because a manually selected ref could otherwise execute untrusted
# workflow content on the persistent GPU runner. Runner-group policy remains the external backstop.
permissions:
  contents: read

concurrency:
  group: nightly-competitive-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.MESH_NIGHTLY_COMPETITIVE_ENABLED == '1' }}
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","amd64","gpu-nvidia","mesh-llm-amd64","mesh-llm"]') }}
    timeout-minutes: 780
    env:
      LLAMA_STAGE_BUILD_DIR: ${{ vars.MESH_NIGHTLY_COMPETITIVE_NATIVE_DIR }}
      COMPETITIVE_MODEL_ROOT: ${{ vars.MESH_NIGHTLY_COMPETITIVE_MODEL_ROOT }}
      COMPETITIVE_TOKENIZER_ROOT: ${{ vars.MESH_NIGHTLY_COMPETITIVE_TOKENIZER_ROOT }}
      COMPETITIVE_MANIFEST: ${{ vars.MESH_NIGHTLY_COMPETITIVE_MANIFEST }}
      COMPETITIVE_LLAMA_ROOT: ${{ vars.MESH_NIGHTLY_COMPETITIVE_LLAMA_ROOT }}
      COMPETITIVE_LLAMA_BINARY: ${{ vars.MESH_NIGHTLY_COMPETITIVE_LLAMA_BINARY }}
      COMPETITIVE_BENCHY: ${{ vars.MESH_NIGHTLY_COMPETITIVE_BENCHY }}
      COMPETITIVE_VLLM_BINARY: ${{ vars.MESH_NIGHTLY_COMPETITIVE_VLLM_BINARY }}
      COMPETITIVE_VLLM_MODEL_ROOT: ${{ vars.MESH_NIGHTLY_COMPETITIVE_VLLM_MODEL_ROOT }}
      COMPETITIVE_VLLM_HF_CONFIG_ROOT: ${{ vars.MESH_NIGHTLY_COMPETITIVE_VLLM_HF_CONFIG_ROOT }}
      COMPETITIVE_SGLANG_PYTHON: ${{ vars.MESH_NIGHTLY_COMPETITIVE_SGLANG_PYTHON }}
      COMPETITIVE_SGLANG_MODEL_ROOT: ${{ vars.MESH_NIGHTLY_COMPETITIVE_SGLANG_MODEL_ROOT }}
      COMPETITIVE_OUTPUT: ${{ github.workspace }}/.benchmark-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
      HF_HISTORY_ENABLED: ${{ vars.MESH_PERFORMANCE_HISTORY_ENABLED || '0' }}
      HF_HISTORY_GATE_ENABLED: ${{ vars.MESH_PERFORMANCE_HISTORY_GATE_ENABLED || '0' }}
      HF_DATASET_REPO: ${{ vars.MESH_PERFORMANCE_HISTORY_DATASET }}
      HF_HISTORY_LOCAL: ${{ github.workspace }}/.performance-history-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Verify baked benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          for command in cargo just python3 nvidia-smi; do
            command -v "$command" >/dev/null || {
              echo "missing on gpu-nvidia runner image: $command" >&2
              exit 1
            }
          done
          if [[ "$HF_HISTORY_ENABLED" == "1" ]] && ! command -v hf >/dev/null 2>&1; then
            echo "hf must be baked into the benchmark runner when performance history is enabled" >&2
            exit 1
          fi
          if [[ "$HF_HISTORY_GATE_ENABLED" == "1" && "$HF_HISTORY_ENABLED" != "1" ]]; then
            echo "MESH_PERFORMANCE_HISTORY_GATE_ENABLED requires performance history to be enabled" >&2
            exit 1
          fi
          for variable in \
            LLAMA_STAGE_BUILD_DIR \
            COMPETITIVE_MODEL_ROOT \
            COMPETITIVE_TOKENIZER_ROOT \
            COMPETITIVE_MANIFEST \
            COMPETITIVE_LLAMA_ROOT \
            COMPETITIVE_LLAMA_BINARY \
            COMPETITIVE_BENCHY; do
            value="${!variable:-}"
            if [[ -z "$value" || ! -e "$value" ]]; then
              echo "$variable must name a pre-baked benchmark input" >&2
              exit 1
            fi
          done
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader

      - name: Capture benchmark runner fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$COMPETITIVE_OUTPUT"
          nvidia-smi \
            --query-gpu=name,uuid,compute_cap,driver_version,pci.bus_id,pstate,temperature.gpu,clocks.current.sm,clocks.current.memory \
            --format=csv,noheader,nounits \
            > "$COMPETITIVE_OUTPUT/runner-gpu.csv"

      - name: Download cohort-matched performance history
        if: ${{ env.HF_HISTORY_ENABLED == '1' }}
        env:
          HF_TOKEN: ${{ secrets.MESH_PERFORMANCE_HISTORY_HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$HF_DATASET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "MESH_PERFORMANCE_HISTORY_DATASET must be an owner/dataset repo id" >&2
            exit 1
          fi
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "MESH_PERFORMANCE_HISTORY_HF_TOKEN must be configured when history is enabled" >&2
            exit 1
          fi
          hf datasets info "$HF_DATASET_REPO" --revision main >/dev/null
          hf download "$HF_DATASET_REPO" \
            --type dataset \
            --revision main \
            --local-dir "$HF_HISTORY_LOCAL"
          cmp ci/performance-history/schema.json "$HF_HISTORY_LOCAL/schema.json"

      - name: Build current Mesh benchmark server
        shell: bash
        run: just competitive-benchmark-build

      - name: Run competitive matrix
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform cuda
            --output "$COMPETITIVE_OUTPUT"
            --model-root "$COMPETITIVE_MODEL_ROOT"
            --tokenizer-root "$COMPETITIVE_TOKENIZER_ROOT"
            --manifest "$COMPETITIVE_MANIFEST"
            --mesh-root "$GITHUB_WORKSPACE"
            --mesh-binary "$GITHUB_WORKSPACE/target/release/skippy-server"
            --native-dir "$LLAMA_STAGE_BUILD_DIR"
            --llama-root "$COMPETITIVE_LLAMA_ROOT"
            --llama-binary "$COMPETITIVE_LLAMA_BINARY"
            --benchy "$COMPETITIVE_BENCHY"
            --mesh-adaptive
            --capacity-match-comparison-kv
          )
          args+=(--comparison-backend vllm --comparison-backend sglang)
          if [[ -n "${COMPETITIVE_VLLM_BINARY:-}" ]]; then
            args+=(--vllm-binary "$COMPETITIVE_VLLM_BINARY")
          fi
          if [[ -n "${COMPETITIVE_VLLM_MODEL_ROOT:-}" ]]; then
            args+=(--vllm-model-root "$COMPETITIVE_VLLM_MODEL_ROOT")
          fi
          if [[ -n "${COMPETITIVE_VLLM_HF_CONFIG_ROOT:-}" ]]; then
            args+=(--vllm-hf-config-root "$COMPETITIVE_VLLM_HF_CONFIG_ROOT")
          fi
          if [[ -n "${COMPETITIVE_SGLANG_PYTHON:-}" ]]; then
            args+=(--sglang-python "$COMPETITIVE_SGLANG_PYTHON")
          fi
          if [[ -n "${COMPETITIVE_SGLANG_MODEL_ROOT:-}" ]]; then
            args+=(--sglang-model-root "$COMPETITIVE_SGLANG_MODEL_ROOT")
          fi
          python3 evals/skippy-competitive-benchmark.py run "${args[@]}"

      - name: Render report
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$COMPETITIVE_OUTPUT/benchmark-config.json" ]]; then
            python3 evals/skippy-competitive-benchmark.py report \
              --artifact "$COMPETITIVE_OUTPUT"
            cat "$COMPETITIVE_OUTPUT/summary/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Normalize performance history and report regressions
        id: performance_history
        if: ${{ !cancelled() && steps.benchmark.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --artifact "$COMPETITIVE_OUTPUT"
            --output "$COMPETITIVE_OUTPUT/summary/performance-history.jsonl"
            --report "$COMPETITIVE_OUTPUT/summary/PERFORMANCE_REGRESSIONS.md"
          )
          if [[ -d "$HF_HISTORY_LOCAL/data/runs" ]]; then
            args+=(--baseline "$HF_HISTORY_LOCAL/data/runs")
          fi
          if [[ "$HF_HISTORY_GATE_ENABLED" == "1" ]]; then
            args+=(--gate)
          fi
          python3 scripts/performance-history.py "${args[@]}"
          cat "$COMPETITIVE_OUTPUT/summary/PERFORMANCE_REGRESSIONS.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable performance history shard
        if: ${{ !cancelled() && env.HF_HISTORY_ENABLED == '1' && steps.performance_history.outcome == 'success' }}
        env:
          HF_TOKEN: ${{ secrets.MESH_PERFORMANCE_HISTORY_HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          remote_path="data/runs/$source_sha/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          hf upload "$HF_DATASET_REPO" \
            "$COMPETITIVE_OUTPUT/summary/performance-history.jsonl" \
            "$remote_path" \
            --type dataset \
            --revision main \
            --commit-message "Record nightly performance for $source_sha"

      - name: Upload benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-competitive-${{ github.run_number }}-${{ github.sha }}
          path: ${{ env.COMPETITIVE_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail incomplete benchmark
        if: ${{ !cancelled() && steps.benchmark.outcome == 'failure' }}
        shell: bash
        run: |
          echo "The competitive matrix failed; inspect the uploaded partial evidence." >&2
          exit 1
