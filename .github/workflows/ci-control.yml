name: CI Control
run-name: CI Control · ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: [PR CI, Main CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-control-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  plan:
    name: Compute canonical CI shape
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push') && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_dispatch: ${{ steps.resolve.outputs.should_dispatch }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      original_event_name: ${{ steps.resolve.outputs.original_event_name }}
      draft: ${{ steps.resolve.outputs.draft }}
      correlation_id: ${{ steps.resolve.outputs.correlation_id }}
      supersession_key: ${{ steps.resolve.outputs.supersession_key }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      quality_lane_plan: ${{ steps.plan.outputs.quality_lane_plan }}
      website_lane_plan: ${{ steps.plan.outputs.website_lane_plan }}
      linux_lane_plan: ${{ steps.plan.outputs.linux_lane_plan }}
      macos_lane_plan: ${{ steps.plan.outputs.macos_lane_plan }}
      windows_lane_plan: ${{ steps.plan.outputs.windows_lane_plan }}
    steps:
      - name: Resolve protected source identity
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: run.id,
              per_page: 100,
            });
            const bootstrapped = jobs.some((job) =>
              job.conclusion !== 'skipped' && (
                job.name === 'Bootstrap PR CI' ||
                job.name === 'Bootstrap main CI' ||
                job.name.startsWith('Bootstrap PR CI / ') ||
                job.name.startsWith('Bootstrap main CI / ')
              )
            );
            core.setOutput('should_dispatch', String(!bootstrapped));
            if (bootstrapped) return;
            let sourceSha = run.head_sha;
            let baseSha = '';
            let draft = false;
            if (run.event === 'pull_request') {
              const pull = run.pull_requests?.[0];
              if (!pull) throw new Error('pull_request workflow run has no pull request identity');
              sourceSha = pull.head.sha;
              baseSha = pull.base.sha;
              const response = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pull.number,
              });
              draft = response.data.draft === true;
              core.setOutput('supersession_key', `pr-${pull.number}`);
            } else {
              const commit = await github.rest.repos.getCommit({
                ...context.repo,
                ref: sourceSha,
              });
              baseSha = commit.data.parents?.[0]?.sha ?? '';
              core.setOutput('supersession_key', 'main');
            }
            if (!/^[0-9a-f]{40}$/.test(sourceSha) || (baseSha && !/^[0-9a-f]{40}$/.test(baseSha))) {
              throw new Error('resolved source identity is malformed');
            }
            core.setOutput('source_sha', sourceSha);
            core.setOutput('base_sha', baseSha);
            core.setOutput('original_event_name', run.event);
            core.setOutput('draft', String(draft));
            core.setOutput('correlation_id', `ci-${run.id}-${sourceSha.slice(0, 12)}`);
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ steps.resolve.outputs.should_dispatch == 'true' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute changed files and affected crates
        if: ${{ steps.resolve.outputs.should_dispatch == 'true' }}
        id: changes
        uses: ./.github/actions/compute-changes
        with:
          event_name: ${{ steps.resolve.outputs.original_event_name }}
          base_sha: ${{ steps.resolve.outputs.base_sha }}
          head_sha: ${{ steps.resolve.outputs.source_sha }}
      - name: Build one versioned provider-neutral plan
        if: ${{ steps.resolve.outputs.should_dispatch == 'true' }}
        id: plan
        uses: ./.github/actions/plan-ci
        with:
          event_name: ${{ steps.resolve.outputs.original_event_name }}
          source_sha: ${{ steps.resolve.outputs.source_sha }}
          base_sha: ${{ steps.resolve.outputs.base_sha }}
          draft: ${{ steps.resolve.outputs.draft }}
          changed_files: ${{ steps.changes.outputs.changed_files }}
          affected_crates: ${{ steps.changes.outputs.affected_crates }}

  dispatch:
    name: Dispatch topic and platform workflows
    needs: plan
    if: ${{ needs.plan.outputs.should_dispatch == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: write
      contents: read
    steps:
      - name: Create correlated checks and dispatch selected lanes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ORIGINAL_EVENT_NAME: ${{ needs.plan.outputs.original_event_name }}
          CORRELATION_ID: ${{ needs.plan.outputs.correlation_id }}
          SUPERSESSION_KEY: ${{ needs.plan.outputs.supersession_key }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          QUALITY_LANE_PLAN: ${{ needs.plan.outputs.quality_lane_plan }}
          WEBSITE_LANE_PLAN: ${{ needs.plan.outputs.website_lane_plan }}
          LINUX_LANE_PLAN: ${{ needs.plan.outputs.linux_lane_plan }}
          MACOS_LANE_PLAN: ${{ needs.plan.outputs.macos_lane_plan }}
          WINDOWS_LANE_PLAN: ${{ needs.plan.outputs.windows_lane_plan }}
        with:
          script: |
            const crypto = require('crypto');
            const plan = JSON.parse(process.env.PLAN_JSON);
            const digest = crypto.createHash('sha256').update(process.env.PLAN_JSON).digest('hex');
            if (plan.schema_version !== 1 || plan.source_sha !== process.env.SOURCE_SHA) {
              throw new Error('planner output does not match the protected source identity');
            }
            if (digest !== process.env.PLAN_DIGEST) {
              throw new Error('planner output digest mismatch');
            }

            const lanes = [
              ['CI / Quality', 'ci-quality-lane.yml', process.env.QUALITY_LANE_PLAN],
              ['CI / Website', 'ci-website-lane.yml', process.env.WEBSITE_LANE_PLAN],
              ['CI / Linux', 'ci-linux-lane.yml', process.env.LINUX_LANE_PLAN],
              ['CI / macOS', 'ci-macos-lane.yml', process.env.MACOS_LANE_PLAN],
              ['CI / Windows', 'ci-windows-lane.yml', process.env.WINDOWS_LANE_PLAN],
            ].map(([name, workflow, serialized]) => ({name, workflow, plan: JSON.parse(serialized)}));
            const expected = lanes.map((lane) => lane.name);
            for (const lane of lanes) {
              if (lane.plan.lane !== lane.name.replace('CI / ', '').toLowerCase()) {
                throw new Error(`lane identity mismatch for ${lane.name}`);
              }
            }

            const overall = await github.rest.checks.create({
              ...context.repo,
              name: 'CI Required',
              head_sha: process.env.SOURCE_SHA,
              status: 'in_progress',
              external_id: process.env.CORRELATION_ID,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'CI lanes dispatched',
                summary: `Plan digest: ${process.env.PLAN_DIGEST}`,
              },
            });

            for (const lane of lanes) {
              const laneCheck = await github.rest.checks.create({
                ...context.repo,
                name: lane.name,
                head_sha: process.env.SOURCE_SHA,
                status: lane.plan.required ? 'queued' : 'completed',
                conclusion: lane.plan.required ? undefined : 'success',
                external_id: process.env.CORRELATION_ID,
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                output: {
                  title: lane.plan.required ? 'Waiting for dispatched workflow' : 'Lane not selected',
                  summary: `Plan digest: ${process.env.PLAN_DIGEST}`,
                },
              });
              if (!lane.plan.required) continue;
              try {
                const inputs = {
                  lane_plan_json: JSON.stringify(lane.plan),
                  plan_digest: process.env.PLAN_DIGEST,
                  source_sha: process.env.SOURCE_SHA,
                  original_event_name: process.env.ORIGINAL_EVENT_NAME,
                  correlation_id: process.env.CORRELATION_ID,
                  supersession_key: process.env.SUPERSESSION_KEY,
                  lane_check_id: String(laneCheck.data.id),
                  overall_check_id: String(overall.data.id),
                  expected_lane_checks: JSON.stringify(expected),
                };
                if (lane.name === 'CI / Quality') {
                  inputs.canonical_plan_json = process.env.PLAN_JSON;
                }
                await github.rest.actions.createWorkflowDispatch({
                  ...context.repo,
                  workflow_id: lane.workflow,
                  ref: process.env.DEFAULT_BRANCH,
                  inputs,
                });
              } catch (error) {
                await github.rest.checks.update({
                  ...context.repo,
                  check_run_id: laneCheck.data.id,
                  status: 'completed',
                  conclusion: 'failure',
                  output: {title: 'Dispatch failed', summary: String(error)},
                });
                await github.rest.checks.update({
                  ...context.repo,
                  check_run_id: overall.data.id,
                  status: 'completed',
                  conclusion: 'failure',
                  output: {title: 'CI dispatch failed', summary: `${lane.name}: ${error}`},
                });
                throw error;
              }
            }
