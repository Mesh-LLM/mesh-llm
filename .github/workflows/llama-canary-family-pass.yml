name: llama canary family pass
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      mesh_source:
        description: Frozen trusted MeshLLM commit for certify-only mode
        type: string
        default: ''
      upstream:
        type: string
        required: true
      pass_id:
        type: string
        required: true
      mode:
        type: string
        required: true
      previous_package:
        type: string
        default: ''
      previous_identity:
        type: string
        default: ''
      previous_head:
        type: string
        default: ''
      previous_feedback:
        description: Digest-bound failed-family evidence from the preceding distributed attempt
        type: string
        default: ''
    outputs:
      green:
        value: ${{ jobs.reconcile.outputs.green || jobs.aggregate.outputs.green }}
      package:
        value: ${{ jobs.build.outputs.package }}
      identity:
        value: ${{ jobs.build.outputs.identity }}
      head:
        value: ${{ jobs.build.outputs.head }}
      branch:
        value: ${{ jobs.build.outputs.branch }}
      failure_class:
        value: ${{ jobs.reconcile.outputs.failure_class || jobs.aggregate.outputs.failure_class || jobs.build.outputs.failure_class }}
      failure_stage:
        value: ${{ jobs.reconcile.outputs.failure_stage || jobs.aggregate.outputs.failure_stage || jobs.build.outputs.failure_stage }}
      repairable:
        value: ${{ jobs.reconcile.outputs.repairable || jobs.aggregate.outputs.repairable }}
      feedback:
        value: ${{ jobs.reconcile.outputs.feedback || jobs.aggregate.outputs.feedback }}
      state:
        value: ${{ jobs.reconcile.outputs.state || jobs.aggregate.outputs.state }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CANARY_CONTROLLER_SHA: ${{ inputs.source }}
  CANARY_MESH_SOURCE: ${{ inputs.mesh_source }}
  CANARY_SOURCE_ROOT: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}
jobs:
  build:
    # These persistent machines only execute the protected main workflow.
    if: github.repository == 'Mesh-LLM/mesh-llm' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, family-certify]
    timeout-minutes: 1430
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      identity: ${{ steps.build.outputs.identity_sha256 }}
      head: ${{ steps.build.outputs.candidate }}
      branch: ${{ steps.build.outputs.branch }}
      failure_class: ${{ steps.build.outputs.failure_class }}
      failure_stage: ${{ steps.build.outputs.failure_stage }}
      package: llama-family-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ steps.build.outputs.identity_sha256 }}
    env:
      MESH_LLM_REQUIRE_SCCACHE: '1'
      CTEST_PARALLEL_LEVEL: '16'
      LLAMA_STAGE_BACKEND: metal
      LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.deps/llama-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}
      LLAMA_BUILD_DIR: ${{ github.workspace }}/.deps/llama-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out explicitly trusted certification source
        if: inputs.mesh_source != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.mesh_source }}
          path: canary-source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-canary-runner
        with:
          require-agent: ${{ inputs.mode == 'repair-build' }}
      - uses: ./.github/actions/setup-canary-python
      - name: Prepare protected controller automation
        uses: ./.github/actions/prepare-automation
        env:
          SCCACHE_GHA_ENABLED: 'false'
          SCCACHE_MULTILEVEL_CHAIN: disk
        with:
          allow_depot_remote_cache: 'false'
          allow_native_github_cache: 'false'
      - uses: ./.github/actions/use-canary-cache
      - name: Download previous candidate
        if: inputs.previous_package != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.previous_package }}
          path: ${{ runner.temp }}/canary-previous-${{ inputs.pass_id }}
      - name: Download previous family failure evidence
        if: inputs.previous_feedback != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.previous_feedback }}
          path: ${{ runner.temp }}/canary-feedback-${{ inputs.pass_id }}
      - name: Build exact candidate for distributed certification
        id: build
        env:
          CANARY_HARNESS_MODE: ${{ inputs.mode }}
          CANARY_PASS_ID: ${{ inputs.pass_id }}
          UPSTREAM_SHA_INPUT: ${{ inputs.upstream }}
          CANARY_PREVIOUS_PACKAGE: ${{ inputs.previous_package != '' && format('{0}/canary-previous-{1}', runner.temp, inputs.pass_id) || '' }}
          CANARY_PREVIOUS_IDENTITY: ${{ inputs.previous_identity }}
          CANARY_CANDIDATE_SHA: ${{ inputs.previous_head }}
          CANARY_PREVIOUS_FEEDBACK: ${{ inputs.previous_feedback != '' && format('{0}/canary-feedback-{1}', runner.temp, inputs.pass_id) || '' }}
          CANARY_EXPORT_DIR: ${{ runner.temp }}/canary-export-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}
          CANARY_AGENT_PROVIDER: ${{ vars.LLAMA_CANARY_GOOSE_PROVIDER || 'zai_coding_plan' }}
          CANARY_AGENT_MODEL: ${{ vars.LLAMA_CANARY_GOOSE_MODEL || 'glm-5.3-flash' }}
          CANARY_AGENT_TIMEOUT_SECONDS: '41400'
          CANARY_VERIFICATION_TIMEOUT_SECONDS: '43200'
          CANARY_BUILD_SOURCE_REVISION: ${{ inputs.mesh_source || inputs.source }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/canary-build-${CANARY_PASS_ID}.json"
          jq -n \
            --arg controller_root "$GITHUB_WORKSPACE" --arg source_root "$CANARY_SOURCE_ROOT" \
            --arg controller_revision "$CANARY_CONTROLLER_SHA" \
            --arg selected_revision "$CANARY_BUILD_SOURCE_REVISION" --arg mesh_source "$CANARY_MESH_SOURCE" \
            --arg upstream_revision "$UPSTREAM_SHA_INPUT" --arg mode "$CANARY_HARNESS_MODE" \
            --arg pass_id "$CANARY_PASS_ID" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg previous_package "$CANARY_PREVIOUS_PACKAGE" --arg previous_identity "$CANARY_PREVIOUS_IDENTITY" \
            --arg previous_candidate "$CANARY_CANDIDATE_SHA" \
            --arg evidence "$RUNNER_TEMP/canary-build-contract-${CANARY_PASS_ID}" --arg export "$CANARY_EXPORT_DIR" \
            --argjson agent_timeout_seconds "$CANARY_AGENT_TIMEOUT_SECONDS" \
            --argjson verification_timeout_seconds "$CANARY_VERIFICATION_TIMEOUT_SECONDS" \
            '{controller_root:$controller_root, source_root:$source_root,
              controller_revision:$controller_revision, selected_revision:$selected_revision,
              mesh_source:$mesh_source, upstream_revision:$upstream_revision, mode:$mode,
              pass_id:$pass_id, run_id:$run_id, run_attempt:$run_attempt,
              previous:(if $previous_package == "" then null else
                {package:$previous_package, identity:$previous_identity, candidate:$previous_candidate} end),
              evidence:$evidence, export:$export, agent_timeout_seconds:$agent_timeout_seconds,
              verification_timeout_seconds:$verification_timeout_seconds}' > "$input"
          if [[ -n "${CANARY_PREVIOUS_FEEDBACK:-}" ]]; then
            # Main's digest-bound distributed repair feedback is not in the native build contract yet.
            python3 scripts/llama-canary-family-evidence.py build
          else
            "$MESH_LLM_AUTOMATION_BIN" automation canary-receipts build --input "$input"
          fi
      - name: Report System One smoke result
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          # The smoke runs from the selected source checkout, so its report and
          # evidence live there for a trusted `mesh_source` build.
          WORK_DIR: ${{ env.CANARY_SOURCE_ROOT }}/target/skippy-system-one-smoke
        run: |
          set -euo pipefail
          report="$WORK_DIR/reports/system-one.json"
          {
            echo "## System One (OpenJEV) smoke"
            echo
            if [[ ! -f "$report" ]]; then
              echo "No System One smoke report was produced (build step outcome: ${BUILD_OUTCOME})."
            elif [[ "$(jq -r '.status' "$report")" == "unqualified" ]]; then
              echo "**Full-model System One read: NOT CERTIFIED on this runner.**"
              echo
              echo "The contract part $(jq -r '.contract.status' "$report"). The complete-model read is admitted only on a declared qualified backend; this runner reports backend \`$(jq -r '.full_model_read.backend // "<unset>"' "$report")\` against \`$(jq -r '.full_model_read.certified_backends | join(",")' "$report")\`, with the pinned artifact $(if [[ "$(jq -r '.full_model_read.artifact_cache_checked // false' "$report")" != "true" ]]; then echo "cache state not checked (backend not qualified)"; elif [[ -z "$(jq -r '.full_model_read.artifact_path // ""' "$report")" ]]; then echo "not present in the offline cache"; else echo "present in the offline cache"; fi)."
              echo
              echo "Pre-warm instructions: \`scripts/skippy-system-one-smoke.sh --prewarm\`."
            else
              echo "Contract part: $(jq -r '.contract.status' "$report"). Full-model read: $(jq -r '.full_model_read.status' "$report"). Backend: \`$(jq -r '.full_model_read.backend // "<unset>"' "$report")\`."
            fi
            if [[ -f "$report" ]] && [[ "$(jq -r '.reasons | length' "$report" 2>/dev/null || echo 0)" != "0" ]]; then
              echo
              jq -r '.reasons[] | "- \(.)"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report Laya smoke result
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WORK_DIR: ${{ env.CANARY_SOURCE_ROOT }}/target/skippy-system-one-smoke
        run: |
          set -euo pipefail
          report="$WORK_DIR/reports/laya.json"
          {
            echo "## Laya smoke"
            echo
            if [[ ! -f "$report" ]]; then
              echo "No Laya smoke report was produced (build step outcome: ${BUILD_OUTCOME})."
            elif [[ "$(jq -r '.passed' "$report")" == "true" ]]; then
              echo "The pinned Laya Multilingual GGUF passed every upstream golden fixture on the explicit CPU device."
            else
              echo "The Laya golden battery failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload System One smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-canary-system-one-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}
          path: |
            ${{ env.CANARY_SOURCE_ROOT }}/target/skippy-system-one-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact candidate and executable handoff
        id: upload_package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-family-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ steps.build.outputs.identity_sha256 }}
          path: ${{ runner.temp }}/canary-export-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build and repair evidence
        id: upload_evidence
        if: ${{ success() || failure() || cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}
          path: |
            ${{ env.CANARY_SOURCE_ROOT }}/.deps/llama-canary-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}/
            ${{ runner.temp }}/canary-build-contract-${{ inputs.pass_id }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean build job outputs
        if: ${{ (success() || failure() || cancelled()) }}
        timeout-minutes: 5
        env:
          CANARY_PASS_ID: ${{ inputs.pass_id }}
          EVIDENCE_UPLOADED: ${{ steps.upload_evidence.outcome == 'success' }}
          PACKAGE_UPLOADED: ${{ steps.upload_package.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job build \
            --evidence-uploaded "$EVIDENCE_UPLOADED" --package-uploaded "$PACKAGE_UPLOADED"
  family:
    name: ${{ inputs.pass_id }} / ${{ matrix.families }}
    needs: build
    runs-on: [self-hosted, family-certify, "${{ matrix.memory_tier }}"]
    timeout-minutes: 780
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      CANARY_SOURCE_ROOT: ${{ github.workspace }}/canary-source
      LLAMA_STAGE_BACKEND: metal
      FAMILY_BATTERY_RUN_ID: ${{ inputs.pass_id }}-${{ matrix.shard_index }}
      FAMILY_BATTERY_ARTIFACT_ROOT: ${{ github.workspace }}/target/canary-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      FAMILY_BATTERY_MM_TEST_BIN: ${{ github.workspace }}/canary-source/target/debug/skippy-mm-test
      PACKAGE: ${{ github.workspace }}/.deps/canary-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ matrix.shard_index }}
      IDENTITY: ${{ needs.build.outputs.identity }}
      # Restored workload oracle closure (Rust canary-receipts
      # restore). The battery's non-chat lanes consume the CPU candidate and
      # native oracle executables from this immutable handoff instead of
      # compiling on the worker.
      SKIPPY_WORKLOAD_ORACLE_SERVER: ${{ github.workspace }}/canary-source/.deps/canary-workload-oracles/native/bin/llama-server
      SKIPPY_WORKLOAD_ORACLE_COMPLETION: ${{ github.workspace }}/canary-source/.deps/canary-workload-oracles/native/bin/llama-completion
      SKIPPY_WORKLOAD_ORACLE_TTS: ${{ github.workspace }}/canary-source/.deps/canary-workload-oracles/native/bin/llama-tts
      SKIPPY_WORKLOAD_NATIVE_BUILD_DIR: ${{ github.workspace }}/canary-source/.deps/canary-workload-oracles/native
      SKIPPY_WORKLOAD_CANDIDATE_BIN_DIR: ${{ github.workspace }}/canary-source/.deps/canary-workload-oracles/cargo/debug
      SKIPPY_WORKLOAD_PRODUCER_MANIFEST: ${{ github.workspace }}/canary-source/.deps/canary-workload-oracles/producer.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out fresh dedicated certification consumer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.mesh_source || inputs.source }}
          path: canary-source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare frozen controller automation for verify-only restore
        uses: ./.github/actions/prepare-automation
        env:
          SCCACHE_GHA_ENABLED: 'false'
          SCCACHE_MULTILEVEL_CHAIN: disk
        with:
          allow_depot_remote_cache: 'false'
          allow_native_github_cache: 'false'
      - uses: ./.github/actions/use-canary-cache
      - uses: ./.github/actions/setup-canary-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package }}
          path: ${{ env.PACKAGE }}
      - name: Verify immutable handoff and restore producer executables
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/canary-restore-${FAMILY_BATTERY_RUN_ID}.json"
          jq -n --arg controller_root "$GITHUB_WORKSPACE" --arg controller_revision "$CANARY_CONTROLLER_SHA" \
            --arg selected_source "$CANARY_MESH_SOURCE" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg root "$CANARY_SOURCE_ROOT" --arg package "$PACKAGE" --arg identity_sha256 "$IDENTITY" \
            '{context:{controller_root:$controller_root,controller_revision:$controller_revision,selected_source:$selected_source,run_id:$run_id,run_attempt:$run_attempt},
              root:$root,package:$package,identity_sha256:$identity_sha256}' > "$input"
          "$MESH_LLM_AUTOMATION_BIN" automation canary-receipts restore --input "$input"
      - name: Certify one family
        id: certify
        continue-on-error: true
        timeout-minutes: 720
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          MEMORY_TIER: ${{ matrix.memory_tier }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/canary-certify-${FAMILY_BATTERY_RUN_ID}.json"
          jq -n --arg controller_root "$GITHUB_WORKSPACE" --arg controller_revision "$CANARY_CONTROLLER_SHA" \
            --arg selected_source "$CANARY_MESH_SOURCE" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg root "$CANARY_SOURCE_ROOT" --arg package "$PACKAGE" --arg identity_sha256 "$IDENTITY" \
            --argjson shard_index "$SHARD_INDEX" --arg memory_tier "$MEMORY_TIER" \
            --arg evidence "$FAMILY_BATTERY_ARTIFACT_ROOT/$FAMILY_BATTERY_RUN_ID" \
            '{context:{controller_root:$controller_root,controller_revision:$controller_revision,selected_source:$selected_source,run_id:$run_id,run_attempt:$run_attempt},
              root:$root,package:$package,identity_sha256:$identity_sha256,shard_index:$shard_index,memory_tier:$memory_tier,evidence:$evidence,max_seconds:43200}' > "$input"
          "$MESH_LLM_AUTOMATION_BIN" automation canary-receipts certify --input "$input"
      - name: Bind worker result to candidate and plan
        if: ${{ !cancelled() }}
        env:
          FAMILY: ${{ matrix.families }}
          OUTCOME: ${{ steps.certify.outcome }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/canary-receipt-${FAMILY_BATTERY_RUN_ID}.json"
          jq -n --arg package "$PACKAGE" --arg identity_sha256 "$IDENTITY" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg controller_revision "$CANARY_CONTROLLER_SHA" --arg selected_source "$CANARY_MESH_SOURCE" \
            --arg family "$FAMILY" --arg outcome "$OUTCOME" --arg runner "$RUNNER_NAME" \
            --arg evidence "$FAMILY_BATTERY_ARTIFACT_ROOT/$FAMILY_BATTERY_RUN_ID" \
            '{package:$package,identity_sha256:$identity_sha256,run_id:$run_id,run_attempt:$run_attempt,
              controller_revision:$controller_revision,selected_source:$selected_source,
              family:$family,outcome:$outcome,runner:$runner,evidence:$evidence}' > "$input"
          "$MESH_LLM_AUTOMATION_BIN" automation canary-receipts receipt --input "$input"
      - name: Upload family evidence
        id: upload_evidence
        if: ${{ success() || failure() || cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-family-${{ github.run_id }}-${{ needs.build.outputs.identity }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ matrix.shard_index }}
          path: ${{ env.FAMILY_BATTERY_ARTIFACT_ROOT }}/${{ env.FAMILY_BATTERY_RUN_ID }}/
          if-no-files-found: error
          retention-days: 14
      - name: Require successful family certification
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.certify.outcome }}
        run: test "$OUTCOME" = success
      - name: Clean family job outputs
        if: ${{ (success() || failure() || cancelled()) }}
        timeout-minutes: 5
        env:
          CANARY_PASS_ID: ${{ inputs.pass_id }}
          CANARY_SHARD_INDEX: ${{ matrix.shard_index }}
          EVIDENCE_UPLOADED: ${{ steps.upload_evidence.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job family --evidence-uploaded "$EVIDENCE_UPLOADED"
  aggregate:
    needs: [build, family]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      green: ${{ steps.aggregate.outputs.green }}
      state: ${{ steps.aggregate.outputs.state }}
      repairable: ${{ steps.aggregate.outputs.repairable }}
      failure_class: ${{ steps.aggregate.outputs.failure_class }}
      failure_stage: ${{ steps.aggregate.outputs.failure_stage }}
      retry_matrix: ${{ steps.aggregate.outputs.retry_matrix }}
      feedback_ready: ${{ steps.aggregate.outputs.feedback_ready }}
      feedback: llama-family-feedback-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ needs.build.outputs.identity }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Prepare frozen controller automation for aggregation
        uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package }}
          path: ${{ runner.temp }}/aggregate-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llama-family-${{ github.run_id }}-${{ needs.build.outputs.identity }}-*-${{ inputs.pass_id }}-*
          path: ${{ runner.temp }}/aggregate-evidence
      - name: Require every planned family and lane
        id: aggregate
        continue-on-error: true
        env:
          IDENTITY: ${{ needs.build.outputs.identity }}
          FAMILY_RESULT: ${{ needs.family.result }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py aggregate --package "$RUNNER_TEMP/aggregate-input" \
            --identity "$IDENTITY" --evidence "$RUNNER_TEMP/aggregate-evidence" \
            --family-result "$FAMILY_RESULT" --feedback "$RUNNER_TEMP/canary-family-feedback"
      - name: Upload classified family failure evidence
        if: ${{ !cancelled() && steps.aggregate.outputs.feedback_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-family-feedback-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ needs.build.outputs.identity }}
          path: ${{ runner.temp }}/canary-family-feedback/
          if-no-files-found: error
          retention-days: 14

  retry_family:
    name: ${{ inputs.pass_id }} infrastructure retry / ${{ matrix.families }}
    needs: [build, aggregate]
    if: ${{ !cancelled() && needs.aggregate.outputs.state == 'infrastructure_retryable' }}
    runs-on: [self-hosted, family-certify, "${{ matrix.memory_tier }}"]
    timeout-minutes: 780
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.aggregate.outputs.retry_matrix) }}
    env:
      LLAMA_STAGE_BACKEND: metal
      FAMILY_BATTERY_RUN_ID: ${{ inputs.pass_id }}-infrastructure-retry-${{ matrix.shard_index }}
      FAMILY_BATTERY_ARTIFACT_ROOT: ${{ github.workspace }}/target/canary-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      FAMILY_BATTERY_MM_TEST_BIN: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/target/debug/skippy-mm-test
      PACKAGE: ${{ github.workspace }}/.deps/canary-retry-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ matrix.shard_index }}
      IDENTITY: ${{ needs.build.outputs.identity }}
      SKIPPY_WORKLOAD_ORACLE_SERVER: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/.deps/canary-workload-oracles/native/bin/llama-server
      SKIPPY_WORKLOAD_ORACLE_COMPLETION: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/.deps/canary-workload-oracles/native/bin/llama-completion
      SKIPPY_WORKLOAD_ORACLE_TTS: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/.deps/canary-workload-oracles/native/bin/llama-tts
      SKIPPY_WORKLOAD_NATIVE_BUILD_DIR: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/.deps/canary-workload-oracles/native
      SKIPPY_WORKLOAD_CANDIDATE_BIN_DIR: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/.deps/canary-workload-oracles/cargo/debug
      SKIPPY_WORKLOAD_PRODUCER_MANIFEST: ${{ github.workspace }}${{ inputs.mesh_source != '' && '/canary-source' || '' }}/.deps/canary-workload-oracles/producer.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out explicitly trusted certification source
        if: inputs.mesh_source != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.mesh_source }}
          path: canary-source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare frozen controller automation for retry cache admission
        uses: ./.github/actions/prepare-automation
        env:
          SCCACHE_GHA_ENABLED: 'false'
          SCCACHE_MULTILEVEL_CHAIN: disk
        with:
          allow_depot_remote_cache: 'false'
          allow_native_github_cache: 'false'
      - uses: ./.github/actions/use-canary-cache
      - uses: ./.github/actions/setup-canary-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package }}
          path: ${{ env.PACKAGE }}
      - name: Verify immutable handoff and restore producer executables
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py restore --root "$CANARY_SOURCE_ROOT" --package "$PACKAGE" --identity "$IDENTITY"
      - name: Recheck one infrastructure-failed family
        id: certify
        continue-on-error: true
        timeout-minutes: 720
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          MEMORY_TIER: ${{ matrix.memory_tier }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py certify --root "$CANARY_SOURCE_ROOT" \
            --package "$PACKAGE" --identity "$IDENTITY" --shard-index "$SHARD_INDEX" \
            --memory-tier "$MEMORY_TIER" --evidence "$FAMILY_BATTERY_ARTIFACT_ROOT/$FAMILY_BATTERY_RUN_ID"
      - name: Bind retry result to candidate and plan
        if: ${{ !cancelled() }}
        env:
          FAMILY: ${{ matrix.families }}
          OUTCOME: ${{ steps.certify.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py receipt --package "$PACKAGE" --identity "$IDENTITY" \
            --family "$FAMILY" --outcome "$OUTCOME" --evidence "$FAMILY_BATTERY_ARTIFACT_ROOT/$FAMILY_BATTERY_RUN_ID"
      - name: Upload infrastructure retry evidence
        id: upload_evidence
        if: ${{ success() || failure() || cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-family-retry-${{ github.run_id }}-${{ needs.build.outputs.identity }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ matrix.shard_index }}
          path: ${{ env.FAMILY_BATTERY_ARTIFACT_ROOT }}/${{ env.FAMILY_BATTERY_RUN_ID }}/
          if-no-files-found: error
          retention-days: 14
      - name: Require successful infrastructure retry
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.certify.outcome }}
        run: test "$OUTCOME" = success
      - name: Clean infrastructure retry outputs
        if: ${{ success() || failure() || cancelled() }}
        timeout-minutes: 5
        env:
          CANARY_PASS_ID: ${{ inputs.pass_id }}
          CANARY_SHARD_INDEX: ${{ matrix.shard_index }}
          EVIDENCE_UPLOADED: ${{ steps.upload_evidence.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job family --evidence-uploaded "$EVIDENCE_UPLOADED"

  reconcile:
    needs: [build, aggregate, retry_family]
    if: ${{ !cancelled() && needs.aggregate.outputs.state == 'infrastructure_retryable' }}
    runs-on: ubuntu-24.04
    outputs:
      green: ${{ steps.reconcile.outputs.green }}
      state: ${{ steps.reconcile.outputs.state }}
      repairable: ${{ steps.reconcile.outputs.repairable }}
      failure_class: ${{ steps.reconcile.outputs.failure_class }}
      failure_stage: ${{ steps.reconcile.outputs.failure_stage }}
      feedback: llama-family-reconciled-feedback-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ needs.build.outputs.identity }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package }}
          path: ${{ runner.temp }}/reconcile-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.aggregate.outputs.feedback }}
          path: ${{ runner.temp }}/previous-feedback
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llama-family-retry-${{ github.run_id }}-${{ needs.build.outputs.identity }}-*-${{ inputs.pass_id }}-*
          path: ${{ runner.temp }}/retry-evidence
      - name: Reconcile targeted infrastructure retries
        id: reconcile
        continue-on-error: true
        env:
          IDENTITY: ${{ needs.build.outputs.identity }}
          FAMILY_RESULT: ${{ needs.retry_family.result }}
        run: |
          set -euo pipefail
          python3 scripts/llama-canary-family-evidence.py reconcile --package "$RUNNER_TEMP/reconcile-input" \
            --identity "$IDENTITY" --previous-feedback "$RUNNER_TEMP/previous-feedback" \
            --evidence "$RUNNER_TEMP/retry-evidence" --family-result "$FAMILY_RESULT" \
            --feedback "$RUNNER_TEMP/reconciled-family-feedback"
      - name: Upload reconciled candidate repair evidence
        if: ${{ !cancelled() && steps.reconcile.outputs.feedback_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llama-family-reconciled-feedback-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass_id }}-${{ needs.build.outputs.identity }}
          path: ${{ runner.temp }}/reconciled-family-feedback/
          if-no-files-found: error
          retention-days: 14
