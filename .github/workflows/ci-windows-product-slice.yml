name: CI Windows Product Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      runtime_matrix:
        description: JSON Windows product rows from the versioned CI plan.
        required: true
        type: string
      max_parallel:
        description: Product composition worker budget.
        required: false
        default: 2
        type: number
      fail_fast:
        description: Cancel sibling product rows after the first required failure.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runner_policy:
    name: Select Windows product runner
    if: ${{ inputs.runtime_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_windows: ${{ steps.policy.outputs.runner_windows }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the Windows product role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}

  windows_product:
    name: Windows product (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ inputs.runtime_matrix != '[]' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_windows }}
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@6daacb8a15a3e71f4bdfab1e88e417cb5c0017a3
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_windows, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-host-windows-${{ matrix.runtime.architecture }}
          path: host-input
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-runtime-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose immutable Windows product
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          backend: ${{ matrix.runtime.backend }}
          binary_name: mesh-llm.exe
          readiness_smoke: "true"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-product-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ${{ steps.compose.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1
