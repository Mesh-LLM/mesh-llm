name: Reusable Smoke Tests

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      artifact_name:
        required: true
        type: string
      mesh_binary_target:
        required: true
        type: string
      cache_key_prefix:
        required: true
        type: string
      release_tag:
        required: false
        default: ''
        type: string
      runner:
        required: false
        default: 'ubuntu-24.04'
        type: string
      artifact_path:
        required: false
        default: 'ci-artifacts/linux'
        type: string
      timeout_minutes:
        required: false
        default: 30
        type: number
    secrets:
      HF_TOKEN:
        required: false

env:
  CACHE_NAMESPACE: mesh-llm
  MODEL_URL: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/9e6855bc4be717fca1ef21360a1db4b29d5c559a/SmolLM2-135M-Instruct-Q8_0.gguf
  MODEL_FILE: SmolLM2-135M-Instruct-Q8_0.gguf

permissions:
  contents: read
  packages: read

jobs:
  smoke_tests:
    name: Skippy Inference Smoke Tests
    if: inputs.runner != 'macos-15'
    # gpu-nvidia is the approved ephemeral, repository-scoped exception for
    # uncredentialed PR CUDA smoke. Other credential-bearing smoke stays hosted.
    runs-on: ${{ inputs.runner == 'gpu-nvidia' && fromJSON('["self-hosted","Linux","X64","amd64","gpu-nvidia","mesh-llm-amd64","mesh-llm"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Only the GitHub-hosted ubuntu-24.04 path gets prebuilt tooling; the
    # gpu-nvidia self-hosted runner keeps running bare-metal, unchanged.
    # Empty string opts the job out of containerization per-run. The
    # truthy value must come first in the `&&`: `cond && '' || url` always
    # evaluates to `url`, because `cond && ''` collapses to the falsy `''`
    # and the trailing `||` then overrides it regardless of `cond`.
    container:
      image: ${{ inputs.runner != 'gpu-nvidia' && 'ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d' || '' }}
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      # /github/home is a host-side mount owned by the host runner uid; the
      # public image's container runs as root (Dockerfile's public stage
      # never drops back from `USER root`), and pip refuses a cache dir
      # whose owner isn't its own euid, so it otherwise noisily disables
      # its cache. This is job-level env, so it applies to every step
      # regardless of container -- including the bare-metal gpu-nvidia
      # row, where it redirects setup-python's own `cache: pip` off
      # `~/.cache/pip` and onto this ephemeral runner's `/tmp` instead.
      # Harmless (the runner is single-use), just not container-only.
      PIP_CACHE_DIR: /tmp/pip-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      # The container runs as root while the host-mounted workspace is owned
      # by the runner uid, so git refuses every command in it as "dubious
      # ownership". release-version.sh enumerates manifests with `git
      # ls-files`, which then returns nothing and the script exits 1. Same
      # step every containerized release job already carries (release.yml,
      # native-sdk-artifact.yml, node-sdk-addon-artifact.yml).
      - name: Trust checkout directory
        if: job.container.id != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare dispatched release version
        if: inputs.release_tag != ''
        run: scripts/release-version.sh "${{ inputs.release_tag }}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        # The prebuilt image bakes a venv on PATH; a host-side setup-python
        # both shadows it (silently losing every installed dependency) and,
        # in-container, fails outright because its pip cache dir isn't
        # owned by the container's (root) euid under the container's HOME.
        # Only the uncontained gpu-nvidia row needs this.
        if: job.container.id == ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/cache-version.txt
            ci/requirements-ci-python.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: job.container.id == ''
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify prebuilt smoke environment
        if: inputs.runner != 'gpu-nvidia'
        run: verify-runner-image public cpu

      - name: Install smoke runtime utilities (self-hosted)
        if: inputs.runner == 'gpu-nvidia'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq lsof

      - name: Install smoke dependencies
        # The venv baked into the image is pinned to the image's own mesh-llm
        # revision; this reconciles it against the repo's current
        # requirements even in-container, where it's close to a no-op.
        run: python -m pip install --upgrade pip -r ci/requirements-ci-python.txt

      - name: Install OpenAI client
        # NOT gated on job.container.id: install-core-tools.sh:83 bakes an
        # exact-pinned openai, but that landed in runner-images #20
        # (2026-08-19) and the CPU digest pinned here was built 2026-07-22
        # (verify-runner-image reports mesh_llm_revision 5f341d68). Re-gate
        # this only when the CPU digest is promoted past #20 -- and confirm
        # it from a green run, not from the image repo's HEAD.
        #
        # Exact-pinned rather than floating: this step runs with the job
        # environment (HF_TOKEN included) and npm lifecycle scripts inherit
        # it, so an unreviewed upstream release must not be able to execute
        # here. The version tracks the image's own ARG OPENAI_NPM_VERSION
        # (mesh-llm-runner-images Dockerfile:25) so that re-gating this step
        # once the digest is promoted is a no-op rather than a swap.
        env:
          # npm lifecycle scripts inherit the job environment, and neither
          # token is needed to install a client library. Deny both to this
          # step rather than relying on the version pin alone.
          HF_TOKEN: ""
          HUGGING_FACE_HUB_TOKEN: ""
        run: npm install --global openai@7.5.0

      - name: Install CUDA smoke runtime libraries
        if: inputs.runner == 'gpu-nvidia'
        run: |
          sudo apt-get install -y --no-install-recommends \
            cuda-cudart-12-9 \
            libcublas-12-9
          nvidia-smi --query-gpu=name,compute_cap,driver_version \
            --format=csv,noheader

      - uses: ./.github/actions/restore-smoke-inputs
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}
          staged_binary_path: ${{ inputs.mesh_binary_target }}
          model_url: ${{ env.MODEL_URL }}
          model_file: ${{ env.MODEL_FILE }}
          model_cache_scope: inference-smoke-model
          cache_key_prefix: ${{ inputs.cache_key_prefix }}
          save_model_cache: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}

      - name: Smoke test real skippy inference
        run: |
          scripts/ci-smoke-test.sh \
            "${{ inputs.mesh_binary_target }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/$MODEL_FILE"

      - name: OpenAI client compatibility smoke
        run: |
          scripts/ci-compat-smoke.sh \
            "${{ inputs.mesh_binary_target }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/$MODEL_FILE"

      - name: Constrained-stack smoke (detect oversized spawned futures)
        # Canary that detects pathologically oversized spawned futures by
        # running the smoke under a reduced tokio worker stack. The default
        # at runtime is 8 MiB (see crates/mesh-llm/src/main.rs); the canary
        # currently allows 2 MiB, which gives normal owner-control,
        # mesh, and inference startup state machines headroom while still
        # catching multi-megabyte regressions in spawn sites.
        env:
          MESH_TOKIO_STACK_SIZE: "2097152"
          MESH_CI_API_PORT: "9347"
          MESH_CI_CONSOLE_PORT: "3141"
          MESH_CI_LOG: /tmp/mesh-llm-ci-constrained-stack.log
        run: |
          scripts/ci-smoke-test.sh \
            "${{ inputs.mesh_binary_target }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/$MODEL_FILE"

  smoke_tests_macos:
    name: Skippy Inference Smoke Tests (macOS Metal)
    if: inputs.runner == 'macos-15'
    # Model credentials stay on an isolated GitHub-hosted runner.
    runs-on: macos-15
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Prepare dispatched release version
        if: inputs.release_tag != ''
        run: scripts/release-version.sh "${{ inputs.release_tag }}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        # This job never containerizes, so this is always true today; gated
        # for the same reason as the linux job's — a single expression that
        # can't drift from whatever decides containerization.
        if: job.container.id == ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/cache-version.txt
            ci/requirements-ci-python.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: job.container.id == ''
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install smoke dependencies
        run: python -m pip install --upgrade pip -r ci/requirements-ci-python.txt

      - name: Install OpenAI client (uncontainerized rows only)
        # This job never containerizes (see the setup-python/setup-node gates
        # above); gated the same way for consistency, not because it varies.
        # Pinned to the same version as the Linux job above -- see the
        # rationale there.
        if: job.container.id == ''
        env:
          # npm lifecycle scripts inherit the job environment, and neither
          # token is needed to install a client library. Deny both to this
          # step rather than relying on the version pin alone.
          HF_TOKEN: ""
          HUGGING_FACE_HUB_TOKEN: ""
        run: npm install --global openai@7.5.0

      - uses: ./.github/actions/restore-smoke-inputs
        with:
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}
          staged_binary_path: ${{ inputs.mesh_binary_target }}
          model_url: ${{ env.MODEL_URL }}
          model_file: ${{ env.MODEL_FILE }}
          model_cache_scope: inference-smoke-model
          cache_key_prefix: ${{ inputs.cache_key_prefix }}
          save_model_cache: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}

      - name: Smoke test real skippy inference
        run: |
          scripts/ci-smoke-test.sh \
            "${{ inputs.mesh_binary_target }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/$MODEL_FILE"

      - name: OpenAI client compatibility smoke
        run: |
          scripts/ci-compat-smoke.sh \
            "${{ inputs.mesh_binary_target }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/$MODEL_FILE"

      - name: Constrained-stack smoke (detect oversized spawned futures)
        # Canary that detects pathologically oversized spawned futures by
        # running the smoke under a reduced tokio worker stack. The default
        # at runtime is 8 MiB (see crates/mesh-llm/src/main.rs); the canary
        # currently allows 2 MiB, which gives normal owner-control,
        # mesh, and inference startup state machines headroom while still
        # catching multi-megabyte regressions in spawn sites.
        env:
          MESH_TOKIO_STACK_SIZE: "2097152"
          MESH_CI_API_PORT: "9347"
          MESH_CI_CONSOLE_PORT: "3141"
          MESH_CI_LOG: /tmp/mesh-llm-ci-constrained-stack.log
        run: |
          scripts/ci-smoke-test.sh \
            "${{ inputs.mesh_binary_target }}" \
            "${{ inputs.artifact_path }}" \
            "$HOME/.models/$MODEL_FILE"
