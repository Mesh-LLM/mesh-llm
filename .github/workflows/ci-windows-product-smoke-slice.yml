name: CI Windows Product Smoke Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      product_automation:
        description: Same-run product-source automation identity JSON; empty selects standalone preparation.
        required: true
        type: string
      original_event_name:
        description: Original event used for model-cache publication policy.
        required: false
        default: ''
        type: string
      runtime_matrix:
        description: JSON Windows runtime/product rows from the versioned CI plan.
        required: true
        type: string
      smoke_matrix:
        description: JSON platform smoke rows from the versioned CI plan.
        required: true
        type: string
      binary_target:
        description: Product binary path used by the smoke harness.
        required: true
        type: string
      timeout_minutes:
        description: Bounded smoke timeout.
        required: false
        default: 25
        type: number

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"

jobs:
  laya_cpu:
    name: Laya smoke (Windows CPU)
    if: ${{ contains(fromJson(inputs.runtime_matrix).*.id, 'windows-cpu') && contains(fromJson(inputs.smoke_matrix).*.id, 'core') }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Restore product automation
        uses: ./.github/actions/restore-automation
        with:
          source_sha: ${{ inputs.source_sha }}
          require_product: 'true'
          product_source_sha: ${{ fromJson(inputs.product_automation).source_sha }}
          source_profile: ${{ fromJson(inputs.product_automation).source_profile }}
          artifact_id: ${{ fromJson(inputs.product_automation).artifact_id }}
          binary_sha256: ${{ fromJson(inputs.product_automation).binary_sha256 }}
          producer_os: ${{ fromJson(inputs.product_automation).producer_os }}
          producer_arch: ${{ fromJson(inputs.product_automation).producer_arch }}

      - uses: ./.github/actions/run-laya-product-smoke
        with:
          artifact_name: ci-product-windows-amd64-cpu
          artifact_path: ci-artifacts/laya-windows-cpu
          staged_binary_path: ${{ inputs.binary_target }}
          expected_backend: cpu
          device: CPU
          model_cadence: ${{ inputs.original_event_name == 'push' && 'main' || inputs.original_event_name == 'pull_request' && 'pull-request' || 'manual' }}
          save_model_cache: ${{ inputs.original_event_name == 'push' }}
