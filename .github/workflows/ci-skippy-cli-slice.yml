name: CI standalone Skippy CLI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event for protected runner policy.
        required: true
        type: string
      platform:
        description: Closed platform selector (linux, macos, windows).
        required: true
        type: string
      architecture:
        description: Closed architecture selector (amd64 or arm64).
        required: true
        type: string
      profile:
        description: Build profile (release, dev, or debug).
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"

jobs:
  runner_policy:
    name: Select standalone Skippy CLI runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.policy.outputs.runner_8 }}
      macos: ${{ steps.policy.outputs.runner_macos }}
      windows: ${{ steps.policy.outputs.runner_windows }}
    steps:
      - name: Validate bounded CLI target
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "$PLATFORM/$ARCHITECTURE" in
            linux/amd64|macos/arm64|windows/amd64) ;;
            *) echo "unsupported Skippy CLI target: $PLATFORM/$ARCHITECTURE" >&2; exit 1 ;;
          esac
          case "$PROFILE" in
            release|debug|dev) ;;
            *) echo "unsupported Skippy CLI profile: $PROFILE" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select protected hosted CLI role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: 'false'
          depot_pr_enabled: 'false'
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          force_hosted: true

  linux_cli:
    name: Standalone Linux Skippy CLI
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'linux' }}
    runs-on: ${{ needs.runner_policy.outputs.linux }}
    timeout-minutes: 45
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:f499b79bc52dc7492d57397fdbec9f890c6f6bb1d8c1fcde9c1c97d45c0541a7
    defaults:
      run:
        shell: bash
    env:
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - name: Verify standalone Linux toolchain
        run: verify-runner-image public cpu
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: 'false'
          allow_native_github_cache: 'false'
      - uses: ./.github/actions/prepare-skippy-cli-input
        with:
          source_sha: ${{ inputs.source_sha }}
          profile: ${{ inputs.profile }}
      - name: Upload immutable Linux Skippy CLI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-cli-linux-${{ inputs.architecture }}
          path: skippy-cli-input/
          if-no-files-found: error
          retention-days: 1

  macos_cli:
    name: Standalone macOS Skippy CLI
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'macos' }}
    runs-on: ${{ needs.runner_policy.outputs.macos }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/setup-macos-lld
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: 'false'
          allow_native_github_cache: 'false'
      - uses: ./.github/actions/prepare-skippy-cli-input
        with:
          source_sha: ${{ inputs.source_sha }}
          profile: ${{ inputs.profile }}
      - name: Upload immutable macOS Skippy CLI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-cli-macos-${{ inputs.architecture }}
          path: skippy-cli-input/
          if-no-files-found: error
          retention-days: 1

  windows_cli:
    name: Standalone Windows Skippy CLI
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'windows' }}
    runs-on: ${{ needs.runner_policy.outputs.windows }}
    timeout-minutes: 50
    env:
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - uses: ./.github/actions/setup-windows-short-paths
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: 'false'
          allow_native_github_cache: 'false'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: ./.github/actions/prepare-skippy-cli-input
        with:
          source_sha: ${{ inputs.source_sha }}
          profile: ${{ inputs.profile }}
      - name: Upload immutable Windows Skippy CLI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-cli-windows-${{ inputs.architecture }}
          path: skippy-cli-input/
          if-no-files-found: error
          retention-days: 1
