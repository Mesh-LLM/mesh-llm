name: CI Linux Product Smoke Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event used for model-cache publication policy.
        required: false
        default: ''
        type: string
      runtime_matrix:
        description: JSON Linux runtime/product rows from the versioned CI plan.
        required: true
        type: string
      smoke_matrix:
        description: JSON platform smoke rows from the versioned CI plan.
        required: true
        type: string
      binary_target:
        description: Product binary path used by the smoke harness.
        required: true
        type: string
      timeout_minutes:
        description: Bounded smoke timeout.
        required: false
        default: 25
        type: number
    secrets:
      HF_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  core:
    name: Core inference smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'core') }}
    uses: ./.github/workflows/smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      mesh_binary_target: ${{ inputs.binary_target }}
      cache_key_prefix: ""
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  two_node_client:
    name: Two-node client smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'two-node-client') }}
    uses: ./.github/workflows/scripted-binary-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      staged_binary_path: ${{ inputs.binary_target }}
      model_artifact_id: smollm2-q8-inference
      model_cache_scope: two-node-smoke-model
      smoke_script: scripts/ci-two-node-client-serving-smoke.sh
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  two_node_split:
    name: KV caching smoke (dense + recurrent)
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'two-node-split') }}
    uses: ./.github/workflows/scripted-binary-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      staged_binary_path: ${{ inputs.binary_target }}
      model_artifact_id: smollm2-q8-inference
      model_cache_scope: two-node-split-smoke-model
      smoke_script: MESH_TWO_NODE_SPLIT_DURABLE_L3=1 MESH_TWO_NODE_SPLIT_ALLOW_UNCERTIFIED=1 scripts/ci-two-node-split-smoke.sh
      kv_recurrent_model_artifact_id: family-granite-hybrid
      kv_recurrent_model_cache_scope: two-node-split-recurrent-smoke-model
      kv_recurrent_context_size: '4096'
      kv_recurrent_expected_exact_payload_kind: kv-recurrent
      split_evidence_artifact_name: two-node-split-dense-recurrent-evidence
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  core_cuda:
    name: CUDA inference smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'core-cuda') }}
    uses: ./.github/workflows/smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cuda
      artifact_path: ci-artifacts/linux-cuda
      mesh_binary_target: ${{ inputs.binary_target }}
      cache_key_prefix: ""
      runner: gpu-nvidia
      timeout_minutes: ${{ inputs.timeout_minutes }}

  model_download:
    name: Model download smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'model-download') }}
    uses: ./.github/workflows/hf-download-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  laya_cpu:
    name: Laya smoke (Linux CPU)
    if: ${{ contains(fromJson(inputs.runtime_matrix).*.id, 'linux-cpu') && contains(fromJson(inputs.smoke_matrix).*.id, 'core') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/run-laya-product-smoke
        with:
          artifact_name: ci-product-linux-amd64-cpu
          artifact_path: ci-artifacts/laya-linux-cpu
          staged_binary_path: target/release/mesh-llm
          expected_backend: cpu
          device: CPU
          model_cadence: ${{ inputs.original_event_name == 'push' && 'main' || inputs.original_event_name == 'pull_request' && 'pull-request' || 'manual' }}
          save_model_cache: ${{ inputs.original_event_name == 'push' }}

  laya_cuda:
    name: Laya smoke (Linux CUDA)
    if: ${{ contains(fromJson(inputs.runtime_matrix).*.id, 'linux-cuda') && contains(fromJson(inputs.smoke_matrix).*.id, 'core-cuda') }}
    runs-on: [self-hosted, Linux, X64, amd64, gpu-nvidia, mesh-llm-amd64]
    timeout-minutes: ${{ inputs.timeout_minutes > 100 && inputs.timeout_minutes || 100 }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Prepare source-bound native cleanup before managed work
        id: native_cleanup
        if: ${{ hashFiles('tools/xtask/src/ci_operations/runner_cleanup/mod.rs') != '' && hashFiles('scripts/cleanup-self-hosted.py') == '' }}
        timeout-minutes: 20
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$SOURCE_SHA"
          report="$(just automation-bootstrap)"
          binary="$(printf '%s\n' "$report" | awk -F= '$1 == "binary_path" { count++; print substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1 }')"
          [[ "$binary" == /* && -f "$binary" && ! -L "$binary" && -x "$binary" ]] || exit 1
          sha="$(sha256sum "$binary" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          controller_dir="$(mktemp -d "$RUNNER_TEMP/native-cleanup.XXXXXX")"
          cp "$binary" "$controller_dir/xtask"
          chmod 500 "$controller_dir/xtask"
          test "$(sha256sum "$controller_dir/xtask" | awk '{print $1}')" = "$sha"
          binary="$controller_dir/xtask"
          {
            printf 'MESH_LLM_AUTOMATION_BIN=%s\n' "$binary"
            printf 'MESH_NATIVE_CLEANUP_SHA=%s\n' "$sha"
            printf 'MESH_NATIVE_CLEANUP_SOURCE=%s\n' "$SOURCE_SHA"
          } >> "$GITHUB_ENV"

      - name: Admit cleanup controller before managed work
        run: |
          set -euo pipefail
          if [[ -f scripts/cleanup-self-hosted.py ]]; then
            exit 0
          fi
          test -f tools/xtask/src/ci_operations/runner_cleanup/mod.rs
          test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$MESH_NATIVE_CLEANUP_SOURCE"
          test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$MESH_NATIVE_CLEANUP_SHA"
          printf 'MESH_NATIVE_MANAGED_WORK_STARTED=true\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-laya-product-smoke
        timeout-minutes: ${{ hashFiles('scripts/cleanup-self-hosted.py') == '' && 70 || inputs.timeout_minutes }}
        with:
          artifact_name: ci-product-linux-amd64-cuda
          artifact_path: ci-artifacts/laya-linux-cuda
          staged_binary_path: target/release/mesh-llm
          expected_backend: cuda
          device: CUDA0
          model_cadence: ${{ inputs.original_event_name == 'push' && 'main' || inputs.original_event_name == 'pull_request' && 'pull-request' || 'manual' }}
          save_model_cache: 'false'
      - name: Clean self-hosted Laya smoke outputs
        if: ${{ success() || failure() || cancelled() }}
        timeout-minutes: 5
        env:
          CLEANUP_ARTIFACT_PATH: ci-artifacts/laya-linux-cuda
          CLEANUP_BINARY_PATH: target/release/mesh-llm
        run: |
          set -euo pipefail
          if [[ -f scripts/cleanup-self-hosted.py ]]; then
            python3 scripts/cleanup-self-hosted.py --job smoke --evidence-uploaded false
          elif [[ -f tools/xtask/src/ci_operations/runner_cleanup/mod.rs ]]; then
            if [[ "${MESH_NATIVE_MANAGED_WORK_STARTED:-}" != true ]]; then
              echo 'native cleanup refused: managed work never started; no owned workload cleanup attempted' >&2
              exit 1
            fi
            test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$MESH_NATIVE_CLEANUP_SOURCE"
            test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$MESH_NATIVE_CLEANUP_SHA"
            "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job smoke --evidence-uploaded false
          else
            echo 'unsupported cleanup source' >&2
            exit 1
          fi

  # Case-sensitive exact-`true` gate for the two hardware-backed Laya rows.
  #
  # A GitHub Actions expression cannot compare strings case-sensitively: `==`
  # ignores case, so `vars.X == 'true'` also matches `TRUE` and `True`. A
  # mis-cased variable therefore schedules a GPU row against a runner that is
  # not certified for that backend - the `gpu-nvidia` scale set has never
  # exposed a Vulkan device, and the `gpu-amd` ROCm role is repository-scoped -
  # which restores the red main these gates exist to prevent. Validate the raw
  # value in the shell, where `[[ .. == .. ]]` is exact, and let both rows
  # depend on the normalized result. `run-laya-product-smoke` still repeats the
  # gate from that normalized input, so an older protected workflow cannot run
  # the Vulkan smoke on an uncertified PR runner before this workflow change
  # reaches main.
  gpu_runner_gate:
    name: GPU runner gate
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'core') && (contains(fromJson(inputs.runtime_matrix).*.id, 'linux-vulkan') || contains(fromJson(inputs.runtime_matrix).*.id, 'linux-rocm')) }}
    runs-on: ubuntu-24.04
    outputs:
      vulkan_enabled: ${{ steps.check.outputs.vulkan_enabled }}
      rocm_enabled: ${{ steps.check.outputs.rocm_enabled }}
    steps:
      - name: Require exactly the lowercase true
        id: check
        env:
          MESH_VULKAN_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
          MESH_ROCM_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
        run: |
          set -euo pipefail
          for pair in \
            "vulkan_enabled:MESH_VULKAN_INFERENCE_RUNNER_ENABLED" \
            "rocm_enabled:MESH_ROCM_INFERENCE_RUNNER_ENABLED"
          do
            output="${pair%%:*}"
            name="${pair#*:}"
            value="${!name:-}"
            enabled=false
            if [[ "$value" == "true" ]]; then
              enabled=true
            fi
            echo "$output=$enabled" >> "$GITHUB_OUTPUT"
          done

  laya_vulkan:
    name: Laya smoke (Linux Vulkan)
    needs: [gpu_runner_gate]
    if: ${{ contains(fromJson(inputs.runtime_matrix).*.id, 'linux-vulkan') && contains(fromJson(inputs.smoke_matrix).*.id, 'core') && needs.gpu_runner_gate.outputs.vulkan_enabled == 'true' }}
    runs-on: [self-hosted, Linux, X64, amd64, gpu-nvidia, mesh-llm-amd64]
    timeout-minutes: ${{ inputs.timeout_minutes > 100 && inputs.timeout_minutes || 100 }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MESH_LLM_VULKAN_AVAILABLE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Prepare source-bound native cleanup before managed work
        id: native_cleanup
        if: ${{ hashFiles('tools/xtask/src/ci_operations/runner_cleanup/mod.rs') != '' && hashFiles('scripts/cleanup-self-hosted.py') == '' }}
        timeout-minutes: 20
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$SOURCE_SHA"
          report="$(just automation-bootstrap)"
          binary="$(printf '%s\n' "$report" | awk -F= '$1 == "binary_path" { count++; print substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1 }')"
          [[ "$binary" == /* && -f "$binary" && ! -L "$binary" && -x "$binary" ]] || exit 1
          sha="$(sha256sum "$binary" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          controller_dir="$(mktemp -d "$RUNNER_TEMP/native-cleanup.XXXXXX")"
          cp "$binary" "$controller_dir/xtask"
          chmod 500 "$controller_dir/xtask"
          test "$(sha256sum "$controller_dir/xtask" | awk '{print $1}')" = "$sha"
          binary="$controller_dir/xtask"
          {
            printf 'MESH_LLM_AUTOMATION_BIN=%s\n' "$binary"
            printf 'MESH_NATIVE_CLEANUP_SHA=%s\n' "$sha"
            printf 'MESH_NATIVE_CLEANUP_SOURCE=%s\n' "$SOURCE_SHA"
          } >> "$GITHUB_ENV"

      - name: Admit cleanup controller before managed work
        run: |
          set -euo pipefail
          if [[ -f scripts/cleanup-self-hosted.py ]]; then
            exit 0
          fi
          test -f tools/xtask/src/ci_operations/runner_cleanup/mod.rs
          test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$MESH_NATIVE_CLEANUP_SOURCE"
          test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$MESH_NATIVE_CLEANUP_SHA"
          printf 'MESH_NATIVE_MANAGED_WORK_STARTED=true\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-laya-product-smoke
        timeout-minutes: ${{ hashFiles('scripts/cleanup-self-hosted.py') == '' && 70 || inputs.timeout_minutes }}
        with:
          artifact_name: ci-product-linux-amd64-vulkan
          artifact_path: ci-artifacts/laya-linux-vulkan
          staged_binary_path: target/release/mesh-llm
          expected_backend: vulkan
          device: Vulkan0
          enable_vulkan_inference: ${{ needs.gpu_runner_gate.outputs.vulkan_enabled }}
          model_cadence: ${{ inputs.original_event_name == 'push' && 'main' || inputs.original_event_name == 'pull_request' && 'pull-request' || 'manual' }}
          save_model_cache: 'false'
      - name: Clean self-hosted Laya smoke outputs
        if: ${{ success() || failure() || cancelled() }}
        timeout-minutes: 5
        env:
          CLEANUP_ARTIFACT_PATH: ci-artifacts/laya-linux-vulkan
          CLEANUP_BINARY_PATH: target/release/mesh-llm
        run: |
          set -euo pipefail
          if [[ -f scripts/cleanup-self-hosted.py ]]; then
            python3 scripts/cleanup-self-hosted.py --job smoke --evidence-uploaded false
          elif [[ -f tools/xtask/src/ci_operations/runner_cleanup/mod.rs ]]; then
            if [[ "${MESH_NATIVE_MANAGED_WORK_STARTED:-}" != true ]]; then
              echo 'native cleanup refused: managed work never started; no owned workload cleanup attempted' >&2
              exit 1
            fi
            test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$MESH_NATIVE_CLEANUP_SOURCE"
            test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$MESH_NATIVE_CLEANUP_SHA"
            "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job smoke --evidence-uploaded false
          else
            echo 'unsupported cleanup source' >&2
            exit 1
          fi

  laya_rocm:
    name: Laya smoke (Linux ROCm)
    needs: [gpu_runner_gate]
    if: ${{ contains(fromJson(inputs.runtime_matrix).*.id, 'linux-rocm') && contains(fromJson(inputs.smoke_matrix).*.id, 'core') && needs.gpu_runner_gate.outputs.rocm_enabled == 'true' }}
    runs-on: [self-hosted, Linux, X64, amd64, gpu-amd, mesh-llm-amd64]
    timeout-minutes: ${{ inputs.timeout_minutes > 100 && inputs.timeout_minutes || 100 }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Prepare source-bound native cleanup before managed work
        id: native_cleanup
        if: ${{ hashFiles('tools/xtask/src/ci_operations/runner_cleanup/mod.rs') != '' && hashFiles('scripts/cleanup-self-hosted.py') == '' }}
        timeout-minutes: 20
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$SOURCE_SHA"
          report="$(just automation-bootstrap)"
          binary="$(printf '%s\n' "$report" | awk -F= '$1 == "binary_path" { count++; print substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1 }')"
          [[ "$binary" == /* && -f "$binary" && ! -L "$binary" && -x "$binary" ]] || exit 1
          sha="$(sha256sum "$binary" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          controller_dir="$(mktemp -d "$RUNNER_TEMP/native-cleanup.XXXXXX")"
          cp "$binary" "$controller_dir/xtask"
          chmod 500 "$controller_dir/xtask"
          test "$(sha256sum "$controller_dir/xtask" | awk '{print $1}')" = "$sha"
          binary="$controller_dir/xtask"
          {
            printf 'MESH_LLM_AUTOMATION_BIN=%s\n' "$binary"
            printf 'MESH_NATIVE_CLEANUP_SHA=%s\n' "$sha"
            printf 'MESH_NATIVE_CLEANUP_SOURCE=%s\n' "$SOURCE_SHA"
          } >> "$GITHUB_ENV"

      - name: Admit cleanup controller before managed work
        run: |
          set -euo pipefail
          if [[ -f scripts/cleanup-self-hosted.py ]]; then
            exit 0
          fi
          test -f tools/xtask/src/ci_operations/runner_cleanup/mod.rs
          test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$MESH_NATIVE_CLEANUP_SOURCE"
          test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$MESH_NATIVE_CLEANUP_SHA"
          printf 'MESH_NATIVE_MANAGED_WORK_STARTED=true\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-laya-product-smoke
        timeout-minutes: ${{ hashFiles('scripts/cleanup-self-hosted.py') == '' && 70 || inputs.timeout_minutes }}
        with:
          artifact_name: ci-product-linux-amd64-rocm
          artifact_path: ci-artifacts/laya-linux-rocm
          staged_binary_path: target/release/mesh-llm
          expected_backend: rocm
          device: ROCm0
          model_cadence: ${{ inputs.original_event_name == 'push' && 'main' || inputs.original_event_name == 'pull_request' && 'pull-request' || 'manual' }}
          save_model_cache: 'false'
      - name: Clean self-hosted Laya smoke outputs
        if: ${{ success() || failure() || cancelled() }}
        timeout-minutes: 5
        env:
          CLEANUP_ARTIFACT_PATH: ci-artifacts/laya-linux-rocm
          CLEANUP_BINARY_PATH: target/release/mesh-llm
        run: |
          set -euo pipefail
          if [[ -f scripts/cleanup-self-hosted.py ]]; then
            python3 scripts/cleanup-self-hosted.py --job smoke --evidence-uploaded false
          elif [[ -f tools/xtask/src/ci_operations/runner_cleanup/mod.rs ]]; then
            if [[ "${MESH_NATIVE_MANAGED_WORK_STARTED:-}" != true ]]; then
              echo 'native cleanup refused: managed work never started; no owned workload cleanup attempted' >&2
              exit 1
            fi
            test "$(GIT_MASTER=1 git rev-parse HEAD)" = "$MESH_NATIVE_CLEANUP_SOURCE"
            test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$MESH_NATIVE_CLEANUP_SHA"
            "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job smoke --evidence-uploaded false
          else
            echo 'unsupported cleanup source' >&2
            exit 1
          fi
