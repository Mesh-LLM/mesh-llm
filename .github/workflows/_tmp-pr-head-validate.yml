name: TMP · PR head validation

# THROWAWAY WORKFLOW — DO NOT MERGE TO main.
#
# Purpose: pr_quality.yml / pr_linux.yml / pr_website.yml pin their lane call
# to `Mesh-LLM/mesh-llm/.github/workflows/ci-*-lane.yml@main`, so an edit to a
# reusable slice workflow (ci-quality-slice.yml, ci-linux-host-slice.yml, ...)
# is never exercised by this PR's own required checks — it only runs for the
# first time after merging to main. See feat/ci-prebuilt-runner-images PR
# thread (mesh-dev channel, 2026-08-19) for the finding and Nick's decision to
# validate pre-merge instead of merging chunks blind (option 2, not option 1).
#
# This mirrors pr_quality.yml / pr_linux.yml / pr_website.yml, with the lane
# `uses:` unpinned (`./...` instead of `...@main`) so it resolves from this
# branch's tip instead of main.
#
# Triggered on push-to-branch, not pull_request: scripts/tests/
# test_pr_workflow_artifacts.py::test_pr_validation_has_exactly_five_focused_
# entrypoints asserts every `pull_request`-triggered workflow is one of the
# five pr_*.yml files, and that check runs as PR content (not main-pinned),
# so a sixth pull_request-triggered file reds the real PR · Quality. `plan-ci`
# still receives `event_name: pull_request` / `original_event_name:
# pull_request` as explicit inputs so it selects the same pr-ready profile
# (full rows, not the draft-collapsed set) — scripts/plan-ci.py rejects a
# pr-* profile paired with any other event value, so these must stay as
# written, not switched to `push`.
#
# Delete this file in the final commit of this branch, before merge — it
# must never reach main.

on:
  push:
    branches: [feat/ci-prebuilt-runner-images]
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  packages: read

concurrency:
  group: tmp-pr-head-validate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  plan_quality:
    name: Plan quality (branch head)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      canonical_plan: ${{ steps.plan.outputs.plan_json }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      lane_plan: ${{ steps.plan.outputs.quality_lane_plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable branch identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "push source identity is malformed" >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          base_sha=$(git merge-base "origin/$DEFAULT_BRANCH" "$SOURCE_SHA")
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Compute changed files and affected crates
        id: changes
        uses: ./.github/actions/compute-changes
        with:
          event_name: pull_request
          base_sha: ${{ steps.identity.outputs.base_sha }}
          head_sha: ${{ steps.identity.outputs.source_sha }}
      - name: Build canonical plan
        id: plan
        uses: ./.github/actions/plan-ci
        with:
          event_name: pull_request
          source_sha: ${{ steps.identity.outputs.source_sha }}
          base_sha: ${{ steps.identity.outputs.base_sha }}
          draft: false
          changed_files: ${{ steps.changes.outputs.changed_files }}
          affected_crates: ${{ steps.changes.outputs.affected_crates }}

  lane_quality:
    name: Quality (branch head)
    needs: plan_quality
    if: ${{ needs.plan_quality.result == 'success' && fromJson(needs.plan_quality.outputs.lane_plan).required }}
    permissions:
      checks: write
      contents: read
      packages: read
    uses: ./.github/workflows/ci-quality-lane.yml
    with:
      lane_plan_json: ${{ needs.plan_quality.outputs.lane_plan }}
      canonical_plan_json: ${{ needs.plan_quality.outputs.canonical_plan }}
      plan_digest: ${{ needs.plan_quality.outputs.plan_digest }}
      source_sha: ${{ needs.plan_quality.outputs.source_sha }}
      original_event_name: pull_request
      supersession_key: tmp-pr-head-validate-${{ github.ref_name }}

  plan_linux:
    name: Plan Linux (branch head)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      lane_plan: ${{ steps.plan.outputs.linux_lane_plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable branch identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "push source identity is malformed" >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          base_sha=$(git merge-base "origin/$DEFAULT_BRANCH" "$SOURCE_SHA")
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Compute changed files and affected crates
        id: changes
        uses: ./.github/actions/compute-changes
        with:
          event_name: pull_request
          base_sha: ${{ steps.identity.outputs.base_sha }}
          head_sha: ${{ steps.identity.outputs.source_sha }}
      - name: Build canonical plan
        id: plan
        uses: ./.github/actions/plan-ci
        with:
          event_name: pull_request
          source_sha: ${{ steps.identity.outputs.source_sha }}
          base_sha: ${{ steps.identity.outputs.base_sha }}
          draft: false
          changed_files: ${{ steps.changes.outputs.changed_files }}
          affected_crates: ${{ steps.changes.outputs.affected_crates }}

  lane_linux:
    name: Linux (branch head)
    needs: plan_linux
    if: ${{ needs.plan_linux.result == 'success' && fromJson(needs.plan_linux.outputs.lane_plan).required }}
    permissions:
      checks: write
      contents: read
      packages: read
    uses: ./.github/workflows/ci-linux-lane.yml
    with:
      lane_plan_json: ${{ needs.plan_linux.outputs.lane_plan }}
      plan_digest: ${{ needs.plan_linux.outputs.plan_digest }}
      source_sha: ${{ needs.plan_linux.outputs.source_sha }}
      original_event_name: pull_request
      supersession_key: tmp-pr-head-validate-${{ github.ref_name }}

  plan_website:
    name: Plan website (branch head)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      lane_plan: ${{ steps.plan.outputs.website_lane_plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable branch identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "push source identity is malformed" >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          base_sha=$(git merge-base "origin/$DEFAULT_BRANCH" "$SOURCE_SHA")
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Compute changed files and affected crates
        id: changes
        uses: ./.github/actions/compute-changes
        with:
          event_name: pull_request
          base_sha: ${{ steps.identity.outputs.base_sha }}
          head_sha: ${{ steps.identity.outputs.source_sha }}
      - name: Build canonical plan
        id: plan
        uses: ./.github/actions/plan-ci
        with:
          event_name: pull_request
          source_sha: ${{ steps.identity.outputs.source_sha }}
          base_sha: ${{ steps.identity.outputs.base_sha }}
          draft: false
          changed_files: ${{ steps.changes.outputs.changed_files }}
          affected_crates: ${{ steps.changes.outputs.affected_crates }}

  lane_website:
    name: Website (branch head)
    needs: plan_website
    if: ${{ needs.plan_website.result == 'success' && fromJson(needs.plan_website.outputs.lane_plan).required }}
    permissions:
      checks: write
      contents: read
    uses: ./.github/workflows/ci-website-lane.yml
    with:
      lane_plan_json: ${{ needs.plan_website.outputs.lane_plan }}
      plan_digest: ${{ needs.plan_website.outputs.plan_digest }}
      source_sha: ${{ needs.plan_website.outputs.source_sha }}
      original_event_name: pull_request
      supersession_key: tmp-pr-head-validate-${{ github.ref_name }}
