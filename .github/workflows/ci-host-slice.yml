name: CI Host Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      linux_hosts_matrix:
        description: JSON Linux host rows from the versioned CI plan.
        required: true
        type: string
      macos_hosts_matrix:
        description: JSON macOS host rows from the versioned CI plan.
        required: true
        type: string
      windows_hosts_matrix:
        description: JSON Windows host rows from the versioned CI plan.
        required: true
        type: string
      ui_artifact_name:
        description: Immutable console UI producer artifact.
        required: true
        type: string
      profile:
        description: Host profile selected by the semantic CI profile.
        required: true
        type: string
      linux_max_parallel:
        description: Linux host worker budget.
        required: false
        default: 2
        type: number
      macos_max_parallel:
        description: macOS host worker budget.
        required: false
        default: 2
        type: number
      windows_max_parallel:
        description: Windows host worker budget.
        required: false
        default: 1
        type: number
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  runner_policy:
    name: Select Linux host runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_8: ${{ steps.policy.outputs.runner_8 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the host role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          ref: ${{ github.ref }}
          depot_main_enabled: ${{ vars.DEPOT_RUNNERS_ENABLED == 'true' }}
          manual_use_depot: ${{ inputs.use_depot }}

  linux_host:
    name: Linux host (${{ matrix.host.architecture }})
    needs: runner_policy
    if: ${{ inputs.linux_hosts_matrix != '[]' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_8 }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.linux_max_parallel }}
      matrix:
        host: ${{ fromJson(inputs.linux_hosts_matrix) }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      MESH_LLM_SKIP_UI: "1"
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify prebuilt host environment
        run: verify-runner-image public
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 snapshot 2026-03-12
        continue-on-error: true
        with:
          workspaces: . -> target
          cache-bin: "false"
          prefix-key: ${{ env.CACHE_NAMESPACE }}-rust-${{ runner.os }}-${{ hashFiles('.github/cache-version.txt') }}
          shared-key: ci-host-linux-${{ inputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}
      - name: Download immutable UI distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.ui_artifact_name }}
          path: crates/mesh-llm-ui/dist
      - name: Verify UI distribution input
        run: test -s crates/mesh-llm-ui/dist/index.html
      - name: Prepare immutable Linux host
        uses: ./.github/actions/prepare-host-input
        with:
          profile: ${{ inputs.profile }}
          output_dir: host-input
          skip_ui: "true"
      - name: Upload immutable Linux host input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-host-linux-${{ matrix.host.architecture }}
          path: host-input/
          if-no-files-found: error
          retention-days: 1
      - name: Capture host cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-ci-host-linux-${{ matrix.host.architecture }}-${{ github.run_attempt }}

  macos_host:
    name: macOS host (${{ matrix.host.architecture }})
    if: ${{ inputs.macos_hosts_matrix != '[]' }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.macos_max_parallel }}
      matrix:
        host: ${{ fromJson(inputs.macos_hosts_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 snapshot 2026-03-12
        continue-on-error: true
        with:
          workspaces: . -> target
          cache-bin: "false"
          prefix-key: ${{ env.CACHE_NAMESPACE }}-rust-${{ runner.os }}-${{ hashFiles('.github/cache-version.txt') }}
          shared-key: ci-host-macos-${{ inputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}
      - name: Install host linker
        run: brew install lld
      - name: Download immutable UI distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.ui_artifact_name }}
          path: crates/mesh-llm-ui/dist
      - name: Verify UI distribution input
        run: test -s crates/mesh-llm-ui/dist/index.html
      - name: Prepare immutable macOS host
        uses: ./.github/actions/prepare-host-input
        with:
          profile: ${{ inputs.profile }}
          output_dir: host-input
          skip_ui: "true"
      - name: Upload immutable macOS host input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-host-macos-${{ matrix.host.architecture }}
          path: host-input/
          if-no-files-found: error
          retention-days: 1

  windows_host:
    name: Windows host (${{ matrix.host.architecture }})
    if: ${{ inputs.windows_hosts_matrix != '[]' }}
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.windows_max_parallel }}
      matrix:
        host: ${{ fromJson(inputs.windows_hosts_matrix) }}
    env:
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: "false"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 snapshot 2026-03-12
        continue-on-error: true
        with:
          workspaces: . -> target
          cache-bin: "false"
          prefix-key: ${{ env.CACHE_NAMESPACE }}-rust-${{ runner.os }}-${{ hashFiles('.github/cache-version.txt') }}
          shared-key: ci-host-windows-${{ inputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Download immutable UI distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.ui_artifact_name }}
          path: crates/mesh-llm-ui/dist
      - name: Verify UI distribution input
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath "crates/mesh-llm-ui/dist/index.html")) { throw "UI distribution is missing" }
      - name: Prepare immutable Windows host
        uses: ./.github/actions/prepare-windows-host-input
        with:
          profile: ${{ inputs.profile == 'dev' && 'debug' || inputs.profile }}
          skip_ui: "true"
      - name: Upload immutable Windows host input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-host-windows-${{ matrix.host.architecture }}
          path: host-input/
          if-no-files-found: error
          retention-days: 1
