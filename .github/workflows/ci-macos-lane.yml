name: CI · macOS
run-name: CI · macOS · ${{ inputs.source_sha }}

on:
  workflow_call:
    inputs: &lane_inputs
      lane_plan_json:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      original_event_name:
        required: true
        type: string
      correlation_id:
        required: false
        default: ""
        type: string
      supersession_key:
        required: false
        default: ""
        type: string
      lane_check_id:
        required: false
        default: ""
        type: string
      overall_check_id:
        required: false
        default: ""
        type: string
      expected_lane_checks:
        required: false
        default: "[]"
        type: string
    secrets:
      HF_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *lane_inputs
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-macos-${{ inputs.supersession_key || inputs.source_sha }}
  cancel-in-progress: ${{ inputs.original_event_name == 'pull_request' }}

jobs:
  authority_source:
    name: Freeze protected automation source
    if: ${{ (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null) || (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null || fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null || fromJson(inputs.lane_plan_json).matrices.platform_checks[0] != null || contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'swift')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GIT_MASTER: '1'
      MESH_LLM_POSTHOG_KEY: ''
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Freeze the protected commit
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  authority_linux_x64:
    name: Protected linux x64 automation
    needs: authority_source
    if: ${{ needs.authority_source.result == 'success' && (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null) }}
    permissions:
      contents: read
    uses: ./.github/workflows/protected-automation-artifact.yml
    with:
      platform: linux-x64
      lane: macos
      protected_source_sha: ${{ needs.authority_source.outputs.source_sha }}

  authority_macos_arm64:
    name: Protected macos arm64 automation
    needs: authority_source
    if: ${{ needs.authority_source.result == 'success' && (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null || fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null || fromJson(inputs.lane_plan_json).matrices.platform_checks[0] != null || contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'swift')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/protected-automation-artifact.yml
    with:
      platform: macos-arm64
      lane: macos
      protected_source_sha: ${{ needs.authority_source.outputs.source_sha }}

  validate_plan:
    name: Validate macOS lane plan
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce one consumer architecture
        env:
          LANE_PLAN: ${{ inputs.lane_plan_json }}
        run: |
          set -euo pipefail
          jq -e '
            .lane == "macos" and
            (.matrices.runtime_products | type == "array") and
            ([.matrices.runtime_products[].architecture] | unique | length) <= 1
          ' <<<"$LANE_PLAN" >/dev/null

  ui_artifact:
    needs: [authority_linux_x64]
    name: Console artifact
    if: ${{ (fromJson(inputs.lane_plan_json).matrices.hosts[0] != null) && needs.authority_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-ui-artifact-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      artifact_name: ci-ui-dist-macos-${{ github.run_id }}
      retention_days: 1

  hosts:
    name: Neutral macOS host
    needs: [ui_artifact, authority_macos_arm64]
    if: ${{ (!cancelled() && needs.ui_artifact.result == 'success' && fromJson(inputs.lane_plan_json).matrices.hosts[0] != null) && needs.authority_macos_arm64.result == 'success' }}
    uses: ./.github/workflows/ci-macos-host-slice.yml
    with:
      authority_macos_arm64: ${{ needs.authority_macos_arm64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      hosts_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.hosts) }}
      ui_artifact_name: ci-ui-dist-macos-${{ github.run_id }}
      profile: release
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  native_runtimes:
    needs: [authority_macos_arm64]
    name: Native macOS runtimes
    if: ${{ (fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null) && needs.authority_macos_arm64.result == 'success' }}
    uses: ./.github/workflows/ci-macos-runtime-slice.yml
    with:
      authority_macos_arm64: ${{ needs.authority_macos_arm64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  runtime_product:
    name: macOS products
    needs: [hosts, native_runtimes, authority_macos_arm64]
    if: ${{ (!cancelled() && needs.hosts.result == 'success' && needs.native_runtimes.result == 'success') && needs.authority_macos_arm64.result == 'success' }}
    uses: ./.github/workflows/ci-macos-product-slice.yml
    with:
      authority_macos_arm64: ${{ needs.authority_macos_arm64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  platform_checks:
    needs: [authority_macos_arm64]
    name: macOS checks
    if: ${{ (fromJson(inputs.lane_plan_json).matrices.platform_checks[0] != null) && needs.authority_macos_arm64.result == 'success' }}
    uses: ./.github/workflows/ci-platform-checks-slice.yml
    with:
      authority_macos_arm64: ${{ needs.authority_macos_arm64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      platform_checks_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.platform_checks) }}
      profile: ${{ fromJson(inputs.lane_plan_json).profile }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  swift_sdk_input:
    needs: [authority_macos_arm64]
    name: Swift SDK input
    if: ${{ (contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'swift')) && needs.authority_macos_arm64.result == 'success' }}
    uses: ./.github/workflows/swift-sdk-artifact.yml
    with:
      authority_macos_arm64: ${{ needs.authority_macos_arm64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      mode: ${{ (fromJson(inputs.lane_plan_json).profile == 'main' || fromJson(inputs.lane_plan_json).profile == 'manual-full') && 'full' || 'host-only' }}
      artifact_name: ci-sdk-swift
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      retention_days: 1
      timeout_minutes: 90

  sdk:
    name: Swift SDK smoke
    needs: [validate_plan, runtime_product, swift_sdk_input]
    if: ${{ !cancelled() && needs.validate_plan.result == 'success' && needs.runtime_product.result == 'success' && needs.swift_sdk_input.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'swift') }}
    uses: ./.github/workflows/ci-macos-sdk-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      architecture: ${{ fromJson(inputs.lane_plan_json).matrices.runtime_products[0].architecture }}
      sdk_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.sdk) }}
      binary_target: target/release/mesh-llm
      ui_artifact_name: ci-ui-dist-macos-${{ github.run_id }}
      swift_mode: ${{ (fromJson(inputs.lane_plan_json).profile == 'main' || fromJson(inputs.lane_plan_json).profile == 'manual-full') && 'full' || 'host-only' }}
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke:
    name: Metal product smoke
    needs: [validate_plan, runtime_product]
    if: ${{ !cancelled() && needs.validate_plan.result == 'success' && needs.runtime_product.result == 'success' && fromJson(inputs.lane_plan_json).matrices.smoke[0] != null }}
    uses: ./.github/workflows/ci-macos-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      architecture: ${{ fromJson(inputs.lane_plan_json).matrices.runtime_products[0].architecture }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 45
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  summary:
    name: CI / macOS
    needs: [validate_plan, ui_artifact, hosts, native_runtimes, runtime_product, platform_checks, swift_sdk_input, sdk, product_smoke, authority_source, authority_linux_x64, authority_macos_arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
      - name: Validate planned macOS jobs
        id: validate
        continue-on-error: true
        env:
          LANE_PLAN: ${{ inputs.lane_plan_json }}
          NEEDS_RESULTS: ${{ toJson(needs) }}
        run: '"$MESH_LLM_AUTOMATION_BIN" ci validate-lane --lane-plan "$LANE_PLAN" --needs "$NEEDS_RESULTS"'
      - uses: ./.github/actions/report-ci-lane
        with:
          lane_name: CI / macOS
          lane_result: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          lane_check_id: ${{ inputs.lane_check_id }}
          overall_check_id: ${{ inputs.overall_check_id }}
          expected_lane_checks: ${{ inputs.expected_lane_checks }}
          source_sha: ${{ inputs.source_sha }}
          correlation_id: ${{ inputs.correlation_id }}
          plan_digest: ${{ inputs.plan_digest }}
      - name: Enforce macOS result
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
