name: CI · macOS
run-name: CI · macOS · ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      lane_plan_json:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      original_event_name:
        required: true
        type: string
      correlation_id:
        required: false
        default: ""
        type: string
      supersession_key:
        required: false
        default: ""
        type: string
      lane_check_id:
        required: false
        default: ""
        type: string
      overall_check_id:
        required: false
        default: ""
        type: string
      expected_lane_checks:
        required: false
        default: "[]"
        type: string
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-macos-${{ inputs.supersession_key || inputs.source_sha }}
  cancel-in-progress: ${{ inputs.original_event_name == 'pull_request' }}

jobs:
  ui_artifact:
    name: Console artifact
    if: ${{ fromJson(inputs.lane_plan_json).matrices.hosts[0] != null }}
    uses: ./.github/workflows/ci-ui-artifact-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-ui-dist-macos-${{ github.run_id }}
      retention_days: 1

  hosts:
    name: Neutral macOS host
    needs: [ui_artifact]
    if: ${{ !cancelled() && needs.ui_artifact.result == 'success' && fromJson(inputs.lane_plan_json).matrices.hosts[0] != null }}
    uses: ./.github/workflows/ci-macos-host-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      hosts_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.hosts) }}
      ui_artifact_name: ci-ui-dist-macos-${{ github.run_id }}
      profile: release
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}

  native_runtimes:
    name: Native macOS runtimes
    if: ${{ fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null }}
    uses: ./.github/workflows/ci-macos-runtime-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}

  runtime_product:
    name: macOS products
    needs: [hosts, native_runtimes]
    if: ${{ !cancelled() && needs.hosts.result == 'success' && needs.native_runtimes.result == 'success' }}
    uses: ./.github/workflows/ci-macos-product-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}

  platform_checks:
    name: macOS checks
    if: ${{ fromJson(inputs.lane_plan_json).matrices.platform_checks[0] != null }}
    uses: ./.github/workflows/ci-platform-checks-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      platform_checks_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.platform_checks) }}
      profile: ${{ fromJson(inputs.lane_plan_json).profile }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.macos_max_parallel }}

  swift_sdk_input:
    name: Swift SDK input
    if: ${{ contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'swift') }}
    uses: ./.github/workflows/swift-sdk-artifact.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      mode: ${{ (fromJson(inputs.lane_plan_json).profile == 'main' || fromJson(inputs.lane_plan_json).profile == 'manual-full') && 'full' || 'host-only' }}
      artifact_name: ci-sdk-swift
      retention_days: 1
      timeout_minutes: 90

  sdk:
    name: Swift SDK smoke
    needs: [runtime_product, swift_sdk_input]
    if: ${{ !cancelled() && needs.runtime_product.result == 'success' && needs.swift_sdk_input.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'swift') }}
    uses: ./.github/workflows/ci-macos-sdk-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      architecture: ${{ fromJson(inputs.lane_plan_json).matrices.runtime_products[0].architecture }}
      sdk_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.sdk) }}
      binary_target: target/release/mesh-llm
      swift_mode: ${{ (fromJson(inputs.lane_plan_json).profile == 'main' || fromJson(inputs.lane_plan_json).profile == 'manual-full') && 'full' || 'host-only' }}
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke:
    name: Metal product smoke
    needs: [runtime_product]
    if: ${{ !cancelled() && needs.runtime_product.result == 'success' && fromJson(inputs.lane_plan_json).matrices.smoke[0] != null }}
    uses: ./.github/workflows/ci-macos-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      architecture: ${{ fromJson(inputs.lane_plan_json).matrices.runtime_products[0].architecture }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 30

  summary:
    name: CI / macOS
    needs:
      - ui_artifact
      - hosts
      - native_runtimes
      - runtime_product
      - platform_checks
      - swift_sdk_input
      - sdk
      - product_smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate planned macOS jobs
        id: validate
        continue-on-error: true
        env:
          LANE_PLAN: ${{ inputs.lane_plan_json }}
          NEEDS_RESULTS: ${{ toJson(needs) }}
        run: python3 scripts/validate-ci-lane-results.py --lane-plan "$LANE_PLAN" --needs "$NEEDS_RESULTS"
      - uses: ./.github/actions/report-ci-lane
        with:
          lane_name: CI / macOS
          lane_result: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          lane_check_id: ${{ inputs.lane_check_id }}
          overall_check_id: ${{ inputs.overall_check_id }}
          expected_lane_checks: ${{ inputs.expected_lane_checks }}
          source_sha: ${{ inputs.source_sha }}
          correlation_id: ${{ inputs.correlation_id }}
          plan_digest: ${{ inputs.plan_digest }}
      - name: Enforce macOS result
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
