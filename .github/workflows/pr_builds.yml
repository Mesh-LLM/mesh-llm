name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  request_plan:
    name: Request protected CI plan
    runs-on: ubuntu-24.04
    steps:
      - name: Queue the protected planner
        run: |
          {
            echo "## CI plan requested"
            echo
            echo "The protected CI · Plan workflow will classify this revision and dispatch only selected topic/platform workflows."
          } >> "$GITHUB_STEP_SUMMARY"
