name: PR CI migration compatibility

# This reusable-only shim keeps the pre-migration protected runner contract
# valid while PR #1282 deletes the old PR entrypoint. It has no event trigger
# and cannot create the former monolithic PR graph.
on:
  workflow_call:

permissions: {}

jobs:
  compatibility:
    name: Split PR entrypoints active
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "PR validation is owned by the five pr_<lane>.yml workflows."
