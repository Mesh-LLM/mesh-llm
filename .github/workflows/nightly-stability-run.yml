name: Reusable Nightly Stability Run

on:
  workflow_call:
    inputs:
      base_url:
        required: false
        default: ""
        type: string
      models:
        required: false
        default: "auto,mesh"
        type: string
      attempts:
        required: false
        default: "5"
        type: string
      agent_smokes:
        required: false
        default: ""
        type: string
      skip_streaming:
        required: false
        default: false
        type: boolean
      timeout:
        required: false
        default: "180"
        type: string
      output_dir:
        required: false
        default: nightly-artifacts/stability/latest
        type: string
      kv_tool_loop:
        required: false
        default: true
        type: boolean
      kv_models:
        required: false
        default: ""
        type: string
      kv_attempts:
        required: false
        default: "3"
        type: string
      kv_pressure_turns:
        required: false
        default: "6"
        type: string
      kv_overlap_requests:
        required: false
        default: "2"
        type: string
      kv_min_cached_tokens:
        required: false
        default: "2048"
        type: string
      kv_suffix_prefill_limit:
        required: false
        default: "256"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  stability:
    name: Run stability harness
    # This reusable workflow checks out caller content, so it never accepts a
    # caller-selected label for a privileged runner group.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:1c73f0f2e4b2ce657cc9dc49c9c27374f3c364af19f884f1970331c3689da5d2
    env:
      MESH_STABILITY_BASE_URL: ${{ inputs.base_url }}
      MESH_STABILITY_MODELS: ${{ inputs.models }}
      MESH_STABILITY_ATTEMPTS: ${{ inputs.attempts }}
      MESH_STABILITY_AGENT_SMOKES: ${{ inputs.agent_smokes }}
      MESH_STABILITY_TIMEOUT: ${{ inputs.timeout }}
      MESH_STABILITY_OUTPUT_DIR: ${{ inputs.output_dir }}
      MESH_STABILITY_SKIP_STREAMING: ${{ inputs.skip_streaming && 'true' || 'false' }}
      MESH_KV_TOOL_LOOP: ${{ inputs.kv_tool_loop && 'true' || 'false' }}
      MESH_KV_MODELS: ${{ inputs.kv_models || inputs.models }}
      MESH_KV_ATTEMPTS: ${{ inputs.kv_attempts }}
      MESH_KV_PRESSURE_TURNS: ${{ inputs.kv_pressure_turns }}
      MESH_KV_OVERLAP_REQUESTS: ${{ inputs.kv_overlap_requests }}
      MESH_KV_MIN_CACHED_TOKENS: ${{ inputs.kv_min_cached_tokens }}
      MESH_KV_SUFFIX_PREFILL_LIMIT: ${{ inputs.kv_suffix_prefill_limit }}
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_PRUNE: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Preflight configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MESH_STABILITY_BASE_URL:-}" ]]; then
            {
              echo "## Nightly stability"
              echo
              echo "No mesh endpoint configured. Set MESH_NIGHTLY_STABILITY_BASE_URL, MESH_AGENT_BASE_URL, or pass base_url manually."
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              exit 1
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install requested agent CLIs
        # node/pnpm come from the prebuilt image; corepack is unneeded since
        # the image already bakes the pinned pnpm version on PATH.
        if: ${{ steps.preflight.outputs.run == 'true' && inputs.agent_smokes != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export PNPM_HOME="$HOME/.local/share/pnpm"
          mkdir -p "$PNPM_HOME"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"

          if [[ ",${MESH_STABILITY_AGENT_SMOKES}," == *",opencode,"* ]]; then
            pnpm add --global opencode-ai@latest
            opencode --version
          fi

          if [[ ",${MESH_STABILITY_AGENT_SMOKES}," == *",pi,"* ]]; then
            pnpm add --global @earendil-works/pi-coding-agent@latest
            pi --version
          fi

          if [[ ",${MESH_STABILITY_AGENT_SMOKES}," == *",goose,"* ]]; then
            curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/goose" --version
          fi

      - name: Run stability harness
        id: stability_harness
        if: ${{ steps.preflight.outputs.run == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --base-url "$MESH_STABILITY_BASE_URL"
            --models "$MESH_STABILITY_MODELS"
            --attempts "$MESH_STABILITY_ATTEMPTS"
            --timeout "$MESH_STABILITY_TIMEOUT"
            --agent-smokes "$MESH_STABILITY_AGENT_SMOKES"
            --output-dir "$MESH_STABILITY_OUTPUT_DIR"
          )
          if [[ "$MESH_STABILITY_SKIP_STREAMING" == "true" ]]; then
            args+=(--skip-streaming)
          fi
          scripts/qa-nightly-stability.py "${args[@]}"

      - name: Run KV tool-loop stability harness
        id: kv_tool_loop
        if: ${{ !cancelled() && steps.preflight.outputs.run == 'true' && inputs.kv_tool_loop }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scripts/qa-kv-tool-loop-stability.py \
            --base-url "$MESH_STABILITY_BASE_URL" \
            --models "$MESH_KV_MODELS" \
            --attempts "$MESH_KV_ATTEMPTS" \
            --pressure-turns "$MESH_KV_PRESSURE_TURNS" \
            --overlap-requests "$MESH_KV_OVERLAP_REQUESTS" \
            --timeout "$MESH_STABILITY_TIMEOUT" \
            --min-cached-tokens "$MESH_KV_MIN_CACHED_TOKENS" \
            --suffix-prefill-limit "$MESH_KV_SUFFIX_PREFILL_LIMIT" \
            --output-dir "$MESH_STABILITY_OUTPUT_DIR/kv-tool-loop"

      - name: Publish run summary
        if: ${{ !cancelled() && steps.preflight.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$MESH_STABILITY_OUTPUT_DIR/summary.md" ]]; then
            cat "$MESH_STABILITY_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Nightly stability"
              echo
              echo "No summary.md was produced by the stability harness."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$MESH_STABILITY_OUTPUT_DIR/kv-tool-loop/summary.md" ]]; then
            cat "$MESH_STABILITY_OUTPUT_DIR/kv-tool-loop/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$MESH_KV_TOOL_LOOP" == "true" ]]; then
            {
              echo
              echo "## KV tool-loop stability"
              echo
              echo "No summary.md was produced by the KV tool-loop harness."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stability evidence
        if: ${{ !cancelled() && steps.preflight.outputs.run == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-stability-${{ github.run_number }}-${{ github.sha }}
          path: ${{ inputs.output_dir }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on stability regression
        if: ${{ !cancelled() && steps.preflight.outputs.run == 'true' && (steps.stability_harness.outcome == 'failure' || steps.kv_tool_loop.outcome == 'failure') }}
        shell: bash
        run: |
          echo "A nightly stability harness failed; inspect the uploaded evidence and job summary." >&2
          exit 1
