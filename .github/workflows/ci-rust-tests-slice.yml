name: CI Rust Tests Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      rust_tests_matrix:
        description: Validated JSON array of deterministic Rust test batches.
        required: true
        type: string
      static_abi_artifact_name:
        description: Immutable static ABI producer artifact.
        required: true
        type: string
      static_abi_toolchain_epoch:
        description: Exact toolchain identity recorded by the static ABI producer.
        required: true
        type: string
      max_parallel:
        description: Profile worker budget for Rust test batches.
        required: false
        default: 4
        type: number
      fail_fast:
        description: Cancel sibling test batches after the first required failure.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"

jobs:
  runner_policy:
    name: Select Rust test runner
    if: ${{ inputs.rust_tests_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.policy.outputs.runner }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
      allow_trusted_sccache_seed: ${{ steps.policy.outputs.allow_trusted_sccache_seed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the Rust test role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          # Rust tests are not in the existing trusted-main Depot allowlist.
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}

  rust_tests:
    name: Rust tests (${{ matrix.batch.id }})
    needs: runner_policy
    if: ${{ inputs.rust_tests_matrix != '[]' }}
    runs-on: ${{ needs.runner_policy.outputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        batch: ${{ fromJson(inputs.rust_tests_matrix) }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:0d4e98e62d9e06419e87e1b1d10020a2eb2b0584086aa983795e1c5f2d933dd7
    defaults:
      run:
        shell: bash
    env:
      LLAMA_STAGE_BACKEND: cpu
      LLAMA_STAGE_BUILD_DIR: .deps/llama.cpp/build-stage-abi-static
      MESH_LLM_SKIP_UI: "1"
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Resolve product source layout
        id: layout
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-source-layout@38d63b2f6e27998034fdf0452150c7cc081fe921 # product-layout compatibility helpers
      - name: Verify prebuilt test environment
        run: verify-runner-image public cpu
      - name: Resolve static ABI toolchain epoch
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          pinned_epoch: ${{ inputs.static_abi_toolchain_epoch }}
      - id: sccache_seed
        uses: ./.github/actions/restore-sccache-seed
        with:
          allow_trusted_seed: ${{ needs.runner_policy.outputs.allow_trusted_sccache_seed }}
          cache_key: mesh-llm-sccache-seed-linux-x86_64-img-0d4e98e6-epoch-0d4e98e6-v3-${{ hashFiles('Cargo.lock', '.github/cache-version.txt', '.cargo/config.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'Justfile', 'just/**') }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Resolve protected test package names
        id: packages
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-cargo-packages@38d63b2f6e27998034fdf0452150c7cc081fe921 # product-layout compatibility helpers
        with:
          # Switch with the protected workspace package rename, not PR source.
          generation: legacy
          crates: ${{ toJson(matrix.batch.crates) }}
          batches: ${{ inputs.rust_tests_matrix }}
      - name: Resolve planned batch crates against the checked-out workspace
        id: resolve_batch_crates
        env:
          PLANNED_BATCH_CRATES: ${{ steps.packages.outputs.crates }}
        run: |
          set -euo pipefail
          # The protected planner names these packages in its own generation, so
          # the translation step above has already mapped them to this revision's
          # owners. Filtering here matches renamed owners too, because workspace
          # membership is decided by the tree that is actually checked out.
          # The batch is planned from the default branch's crate inventory while
          # this job builds the revision under test. A branch that predates a
          # workspace member added on the default branch would otherwise abort
          # the whole batch with "package ID specification <crate> did not match
          # any packages", and package-specific setup would run for a crate that
          # is not present. Workspace discovery belongs to Cargo metadata, not a
          # workflow-maintained allowlist, so resolve the planned batch against
          # the tree that is actually checked out exactly once. Every
          # package-specific condition and the build step below consume this
          # resolved list so skip decisions cannot drift.
          mapfile -t requested < <(jq -r '.[]' <<<"$PLANNED_BATCH_CRATES")
          crates=("${requested[@]}")
          if [[ "${#requested[@]}" -gt 0 ]] && cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/workspace-metadata.json"; then
            jq -r '.packages[].name' "$RUNNER_TEMP/workspace-metadata.json" > "$RUNNER_TEMP/workspace-members.txt"
            crates=()
            for crate in "${requested[@]}"; do
              if grep -qxF -- "$crate" "$RUNNER_TEMP/workspace-members.txt"; then
                crates+=("$crate")
              else
                echo "::warning::batch plans $crate, which is not a workspace member of the checked-out revision; skipping it"
              fi
            done
          elif [[ "${#requested[@]}" -gt 0 ]]; then
            echo "::warning::cargo metadata failed; running the planned batch unchanged"
          fi
          printf 'crates=%s\n' "$(jq -cn --args '$ARGS.positional' ${crates[@]+"${crates[@]}"})" >> "$GITHUB_OUTPUT"
      - name: Prepare UI placeholder
        env:
          UI_DIR: ${{ steps.layout.outputs.ui_dir }}
        run: mkdir -p "$UI_DIR/dist" && printf '<html></html>' > "$UI_DIR/dist/index.html"
      - name: Prepare patched llama.cpp when required
        if: ${{ contains(steps.resolve_batch_crates.outputs.crates, 'skippy-quantize') || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-runtime') || (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-model-package') || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-package-builder')) || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-ffi') }}
        run: scripts/prepare-llama.sh pinned
      - name: Download immutable static ABI input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.static_abi_artifact_name }}
          path: ${{ runner.temp }}/static-abi-input
      - name: Restore immutable static ABI input
        run: scripts/restore-static-abi-input.sh "$RUNNER_TEMP/static-abi-input" "$LLAMA_STAGE_BUILD_DIR" x86_64-unknown-linux-gnu cpu
      - name: Resolve Skippy correctness model when required
        id: skippy_correctness_model
        if: ${{ contains(steps.resolve_batch_crates.outputs.crates, 'skippy-runtime') || (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-model-package') || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-package-builder')) }}
        run: |
          python3 scripts/resolve-test-model-manifest.py \
            ci/model-artifacts/manifests/skippy-correctness.json \
            --cadence "${{ (inputs.original_event_name == 'pull_request' || inputs.original_event_name == 'pull_request_target') && 'pull-request' || inputs.original_event_name == 'push' && 'main' || 'manual' }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore Skippy correctness model cache when required
        id: skippy_correctness_model_cache
        if: ${{ (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-runtime') || (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-model-package') || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-package-builder'))) && needs.runner_policy.outputs.allow_native_github_cache == 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/skippy-correctness-model
          key: ${{ env.CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-skippy-correctness-model-${{ steps.skippy_correctness_model.outputs.sha256 }}-${{ hashFiles('.github/cache-version.txt') }}
      - name: Download Skippy correctness model when required
        if: ${{ (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-runtime') || (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-model-package') || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-package-builder'))) && steps.skippy_correctness_model_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skippy-correctness-model"
          hf download "${{ steps.skippy_correctness_model.outputs.repo }}" \
            "${{ steps.skippy_correctness_model.outputs.file }}" \
            --revision "${{ steps.skippy_correctness_model.outputs.revision }}" \
            --local-dir "$RUNNER_TEMP/skippy-correctness-model"
      - name: Verify Skippy correctness model when required
        if: ${{ contains(steps.resolve_batch_crates.outputs.crates, 'skippy-runtime') || (contains(steps.resolve_batch_crates.outputs.crates, 'skippy-model-package') || contains(steps.resolve_batch_crates.outputs.crates, 'skippy-package-builder')) }}
        run: |
          set -euo pipefail
          python3 scripts/resolve-test-model-manifest.py \
            ci/model-artifacts/manifests/skippy-correctness.json \
            --cadence "${{ (inputs.original_event_name == 'pull_request' || inputs.original_event_name == 'pull_request_target') && 'pull-request' || inputs.original_event_name == 'push' && 'main' || 'manual' }}" \
            --verify-root "$RUNNER_TEMP/skippy-correctness-model"
      - name: Save trusted Skippy correctness model cache
        # Main is exhaustive, so the batch containing skippy-runtime is the
        # sole publisher for this shared package-manager-style cache key.
        if: ${{ contains(steps.resolve_batch_crates.outputs.crates, 'skippy-runtime') && needs.runner_policy.outputs.allow_native_github_cache == 'true' && github.ref == 'refs/heads/main' && inputs.original_event_name != 'pull_request' && inputs.original_event_name != 'pull_request_target' && steps.skippy_correctness_model_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/skippy-correctness-model
          key: ${{ steps.skippy_correctness_model_cache.outputs.cache-primary-key }}
      - name: Run isolated Cargo tests for the batch
        env:
          TEST_CRATES: ${{ steps.resolve_batch_crates.outputs.crates }}
          SKIPPY_CORRECTNESS_MODEL: ${{ runner.temp }}/skippy-correctness-model/${{ steps.skippy_correctness_model.outputs.file }}
        run: |
          set -euo pipefail
          mapfile -t crates < <(jq -r '.[]' <<<"$TEST_CRATES")
          for crate in ${crates[@]+"${crates[@]}"}; do
            [[ "$crate" == "skippy-ffi" ]] && continue
            echo "::group::cargo test -p $crate"
            cargo test --locked -p "$crate"
            echo "::endgroup::"
          done
      - name: Capture Rust test cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-ci-rust-tests-${{ matrix.batch.id }}-${{ github.run_attempt }}
          cache_expectation: ${{ steps.sccache_seed.outputs.cache_hit == 'true' && 'warm' || 'cold' }}
          minimum_hit_rate: "0.20"

  safetensors_runtime_smoke:
    name: SafeTensors runtime smoke
    needs: runner_policy
    if: ${{ inputs.original_event_name == 'pull_request' && (contains(inputs.rust_tests_matrix, 'skippy-model') || contains(inputs.rust_tests_matrix, 'skippy-runtime') || contains(inputs.rust_tests_matrix, 'skippy-quantize') || contains(inputs.rust_tests_matrix, 'skippy-ffi') || contains(inputs.rust_tests_matrix, 'skippy-server') || contains(inputs.rust_tests_matrix, 'skippy-serving') || contains(inputs.rust_tests_matrix, 'skippy-cli') || contains(inputs.rust_tests_matrix, 'mesh-llm-skippy-adapter') || contains(inputs.rust_tests_matrix, 'skippy-protocol') || contains(inputs.rust_tests_matrix, 'skippy-cache') || contains(inputs.rust_tests_matrix, 'mesh-llm-config') || contains(inputs.rust_tests_matrix, 'mesh-llm-host-runtime') || contains(inputs.rust_tests_matrix, 'mesh-llm-cli')) }}
    runs-on: ${{ needs.runner_policy.outputs.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:0d4e98e62d9e06419e87e1b1d10020a2eb2b0584086aa983795e1c5f2d933dd7
    defaults:
      run:
        shell: bash
    env:
      LLAMA_STAGE_BACKEND: cpu
      LLAMA_STAGE_BUILD_DIR: .deps/llama.cpp/build-stage-abi-static
      MESH_LLM_SKIP_UI: "1"
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Resolve product source layout
        id: layout
        uses: Mesh-LLM/mesh-llm/.github/actions/resolve-source-layout@38d63b2f6e27998034fdf0452150c7cc081fe921 # product-layout compatibility helpers
      - name: Verify prebuilt test environment
        run: verify-runner-image public cpu
      - name: Resolve static ABI toolchain epoch
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          pinned_epoch: ${{ inputs.static_abi_toolchain_epoch }}
      - id: sccache_seed
        uses: ./.github/actions/restore-sccache-seed
        with:
          allow_trusted_seed: ${{ needs.runner_policy.outputs.allow_trusted_sccache_seed }}
          cache_key: mesh-llm-sccache-seed-linux-x86_64-img-0d4e98e6-epoch-0d4e98e6-v3-${{ hashFiles('Cargo.lock', '.github/cache-version.txt', '.cargo/config.toml', 'scripts/cargo-linker', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh', 'Justfile', 'just/**') }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Prepare patched llama.cpp
        run: scripts/prepare-llama.sh pinned
      - name: Download immutable static ABI input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.static_abi_artifact_name }}
          path: ${{ runner.temp }}/static-abi-input
      - name: Restore immutable static ABI input
        run: scripts/restore-static-abi-input.sh "$RUNNER_TEMP/static-abi-input" "$LLAMA_STAGE_BUILD_DIR" x86_64-unknown-linux-gnu cpu
      - name: Prepare UI placeholder
        env:
          UI_DIR: ${{ steps.layout.outputs.ui_dir }}
        run: mkdir -p "$UI_DIR/dist" && printf '<html></html>' > "$UI_DIR/dist/index.html"
      - name: Resolve SafeTensors checkpoint manifest
        id: safetensors_model
        run: |
          python3 scripts/resolve-test-model-manifest.py \
            ci/model-artifacts/manifests/safetensors-runtime-smoke.json \
            --cadence pull-request \
            --github-output "$GITHUB_OUTPUT"
      - name: Download pinned SafeTensors checkpoint
        env:
          SAFETENSORS_FILES_JSON: ${{ steps.safetensors_model.outputs.files_json }}
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/safetensors-smollm2"
          mapfile -t files < <(jq -r '.[]' <<<"$SAFETENSORS_FILES_JSON")
          hf download "${{ steps.safetensors_model.outputs.repo }}" "${files[@]}" \
            --revision "${{ steps.safetensors_model.outputs.revision }}" \
            --local-dir "$fixture_dir"
          python3 scripts/resolve-test-model-manifest.py \
            ci/model-artifacts/manifests/safetensors-runtime-smoke.json \
            --cadence pull-request \
            --verify-root "$fixture_dir"
      - name: Build and locate the SafeTensors smoke test
        id: safetensors_smoke_test
        run: |
          set -euo pipefail
          test_name="inference::skippy::resolver::tests::safetensors_checkpoint_reaches_mesh_host_runtime"
          test_crate=mesh-llm-host-runtime
          workspace=$(cargo metadata --locked --no-deps --format-version=1)
          if jq -e '.workspace_members as $members | any(.packages[]; .id as $id | ($members | index($id)) != null and .name == "mesh-llm-skippy-adapter")' <<<"$workspace" >/dev/null; then
            test_crate=mesh-llm-skippy-adapter
            test_name="config::hardware_translation_tests::safetensors_checkpoint_reaches_mesh_host_runtime"
          fi
          test_target="${test_crate//-/_}"
          test_binary="$(
            cargo test --locked -p "$test_crate" --no-default-features \
              --lib --no-run --message-format=json |
              jq -r --arg target "$test_target" '
                if .reason == "compiler-message" then
                  (.message.rendered // empty) | stderr | empty
                elif .reason == "compiler-artifact" and
                  .target.name == $target and
                  .profile.test == true and
                  .executable != null
                then
                  .executable
                else
                  empty
                end
              ' |
              tail -n 1
          )"
          if [[ -z "$test_binary" || ! -x "$test_binary" ]]; then
            echo "Unable to locate the $test_crate library test binary" >&2
            exit 1
          fi
          test_listing="$("$test_binary" --list --ignored --format terse)"
          if ! grep -Fqx "$test_name: test" <<<"$test_listing"; then
            echo "Required ignored smoke test is absent: $test_name" >&2
            exit 1
          fi
          printf 'test_binary=%s\n' "$test_binary" >> "$GITHUB_OUTPUT"
          printf 'test_name=%s\n' "$test_name" >> "$GITHUB_OUTPUT"
      - name: Capture SafeTensors smoke cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-safetensors-runtime-smoke-${{ github.run_attempt }}
          cache_expectation: ${{ steps.sccache_seed.outputs.cache_hit == 'true' && 'warm' || 'cold' }}
      - name: Exercise every current direct-load quantization
        env:
          SAFETENSORS_SMOKE_TEST_BINARY: ${{ steps.safetensors_smoke_test.outputs.test_binary }}
          SAFETENSORS_SMOKE_TEST_NAME: ${{ steps.safetensors_smoke_test.outputs.test_name }}
          SAFETENSORS_QUANTIZATIONS_JSON: ${{ steps.safetensors_model.outputs.quantizations_json }}
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/safetensors-smollm2"
          while IFS= read -r quantization; do
            echo "::group::$quantization"
            SKIPPY_SAFETENSORS_SMOKE_DIR="$fixture_dir" \
              SKIPPY_SAFETENSORS_SMOKE_QUANTIZATION="$quantization" \
              SKIPPY_SAFETENSORS_SMOKE_IMATRIX=synthetic \
              "$SAFETENSORS_SMOKE_TEST_BINARY" \
                "$SAFETENSORS_SMOKE_TEST_NAME" --exact --ignored --nocapture
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$SAFETENSORS_QUANTIZATIONS_JSON")
