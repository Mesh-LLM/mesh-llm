name: CI Rust Tests Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      rust_tests_matrix:
        description: Validated JSON array of deterministic Rust test batches.
        required: true
        type: string
      static_abi_artifact_name:
        description: Immutable static ABI producer artifact.
        required: true
        type: string
      static_abi_toolchain_epoch:
        description: Exact toolchain identity recorded by the static ABI producer.
        required: true
        type: string
      max_parallel:
        description: Profile worker budget for Rust test batches.
        required: false
        default: 4
        type: number
      fail_fast:
        description: Cancel sibling test batches after the first required failure.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  runner_policy:
    name: Select Rust test runner
    if: ${{ inputs.rust_tests_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.policy.outputs.runner }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the Rust test role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.ref }}
          # Rust tests are not in the existing trusted-main Depot allowlist.
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          force_hosted: ${{ inputs.force_hosted }}

  rust_tests:
    name: Rust tests (${{ matrix.batch.id }})
    needs: runner_policy
    if: ${{ inputs.rust_tests_matrix != '[]' }}
    runs-on: ${{ needs.runner_policy.outputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        batch: ${{ fromJson(inputs.rust_tests_matrix) }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:8d93de6ba30173e825a16fdecf011f9c632edc6e1259df7289e491b0a05f829d
    defaults:
      run:
        shell: bash
    env:
      LLAMA_STAGE_BACKEND: cpu
      LLAMA_STAGE_BUILD_DIR: .deps/llama.cpp/build-stage-abi-static
      MESH_LLM_SKIP_UI: "1"
      MESH_LLM_REQUIRE_SCCACHE: "1"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@b5dc126b0abe9b990cccbbf65796c26af7a09dc8
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify prebuilt test environment
        run: verify-runner-image public
      - name: Resolve static ABI toolchain epoch
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          pinned_epoch: ${{ inputs.static_abi_toolchain_epoch }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - if: ${{ needs.runner_policy.outputs.allow_native_github_cache == 'true' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 snapshot 2026-03-12
        continue-on-error: true
        with:
          workspaces: . -> target
          cache-bin: "false"
          prefix-key: ${{ env.CACHE_NAMESPACE }}-rust-${{ runner.os }}-${{ hashFiles('.github/cache-version.txt') }}
          shared-key: ci-rust-tests-${{ matrix.batch.id }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.original_event_name != 'pull_request' && github.event.inputs.original_event_name != 'pull_request_target' }}
      - name: Prepare UI placeholder
        run: mkdir -p crates/mesh-llm-ui/dist && printf '<html></html>' > crates/mesh-llm-ui/dist/index.html
      - name: Prepare patched llama.cpp when required
        if: ${{ contains(toJson(matrix.batch.crates), 'skippy-quantize') || contains(toJson(matrix.batch.crates), 'skippy-runtime') || contains(toJson(matrix.batch.crates), 'skippy-model-package') || contains(toJson(matrix.batch.crates), 'skippy-ffi') }}
        run: scripts/prepare-llama.sh pinned
      - name: Download immutable static ABI input
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.static_abi_artifact_name }}
          path: ${{ runner.temp }}/static-abi-input
      - name: Restore immutable static ABI input
        run: scripts/restore-static-abi-input.sh "$RUNNER_TEMP/static-abi-input" "$LLAMA_STAGE_BUILD_DIR" x86_64-unknown-linux-gnu cpu
      - name: Download Skippy correctness model when required
        if: ${{ contains(toJson(matrix.batch.crates), 'skippy-runtime') || contains(toJson(matrix.batch.crates), 'skippy-model-package') }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skippy-correctness-model"
          hf download Qwen/Qwen3-0.6B-GGUF Qwen3-0.6B-Q8_0.gguf --local-dir "$RUNNER_TEMP/skippy-correctness-model"
          test -s "$RUNNER_TEMP/skippy-correctness-model/Qwen3-0.6B-Q8_0.gguf"
      - name: Run isolated Cargo tests for the batch
        env:
          TEST_CRATES: ${{ toJson(matrix.batch.crates) }}
          SKIPPY_CORRECTNESS_MODEL: ${{ runner.temp }}/skippy-correctness-model/Qwen3-0.6B-Q8_0.gguf
        run: |
          set -euo pipefail
          while IFS= read -r crate; do
            [[ "$crate" == "skippy-ffi" ]] && continue
            echo "::group::cargo test -p $crate"
            cargo test --locked -p "$crate"
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$TEST_CRATES")
      - name: Capture Rust test cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-ci-rust-tests-${{ matrix.batch.id }}-${{ github.run_attempt }}
