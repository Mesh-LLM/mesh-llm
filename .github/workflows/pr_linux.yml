name: PR · Linux

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: write
  contents: read
  packages: read

concurrency:
  group: pr-linux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      lane_plan: ${{ steps.hosted_plan.outputs.lane_plan }}
      hosted_projection_digest: ${{ steps.hosted_plan.outputs.projection_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 70238ad1048498b24c524453800599b591131d35
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable PR identity
        id: identity
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == 'release/0.78.1' ]] || { echo 'release executor requires release/0.78.1 base' >&2; exit 1; }
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "pull request source identity is malformed" >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Compute changed files and affected crates
        id: changes
        uses: ./.github/actions/compute-changes
        with:
          event_name: pull_request
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ steps.identity.outputs.source_sha }}
      - name: Build canonical plan
        id: plan
        uses: ./.github/actions/plan-ci
        with:
          event_name: pull_request
          source_sha: ${{ steps.identity.outputs.source_sha }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          draft: ${{ github.event.pull_request.draft || false }}
          changed_files: ${{ steps.changes.outputs.changed_files }}
          affected_crates: ${{ steps.changes.outputs.affected_crates }}
      # Approved release exception: no GPU execution authority. Keep all hosted
      # production rows; explicitly report the excluded hardware qualification.
      - name: Project hosted-only release smoke coverage
        id: hosted_plan
        env:
          LANE_PLAN: ${{ steps.plan.outputs.linux_lane_plan }}
          CANONICAL_DIGEST: ${{ steps.plan.outputs.plan_digest }}
        run: |
          set -euo pipefail
          hosted=$(jq -c '.matrices.smoke |= map(select(.id != "core-cuda"))' <<<"$LANE_PLAN")
          echo "lane_plan=$hosted" >> "$GITHUB_OUTPUT"
          projection_digest=$(printf '%s' "$hosted" | sha256sum | awk '{print $1}')
          echo "projection_digest=$projection_digest" >> "$GITHUB_OUTPUT"
          echo "Canonical plan provenance: $CANONICAL_DIGEST; effective hosted projection: $projection_digest" >> "$GITHUB_STEP_SUMMARY"
          echo 'Release CI exception: GPU inference qualification excluded; hosted build and smoke rows remain required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out immutable PR source for Claude compatibility
        if: ${{ contains(steps.changes.outputs.affected_crates, 'openai-frontend') || contains(steps.changes.outputs.affected_crates, 'mesh-llm-host-runtime') }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Install pinned Claude Code client
        if: ${{ contains(steps.changes.outputs.affected_crates, 'openai-frontend') || contains(steps.changes.outputs.affected_crates, 'mesh-llm-host-runtime') }}
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.273
          test "$(claude --version | awk '{print $1}')" = "2.1.273"
      - name: Install repository build accelerator
        if: ${{ contains(steps.changes.outputs.affected_crates, 'openai-frontend') || contains(steps.changes.outputs.affected_crates, 'mesh-llm-host-runtime') }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Run Claude Code protocol and real-client integration
        if: ${{ contains(steps.changes.outputs.affected_crates, 'openai-frontend') || contains(steps.changes.outputs.affected_crates, 'mesh-llm-host-runtime') }}
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          MESH_LLM_SKIP_UI: '1'
        run: |
          cargo test --locked -p openai-frontend
          cargo test --locked -p mesh-llm-host-runtime --no-default-features \
            --features claude-code-integration \
            claude_cli_executes_read_tool_through_host_ingress

  lane:
    name: Linux
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJson(needs.plan.outputs.lane_plan).required }}
    permissions:
      checks: write
      contents: read
      packages: read
    uses: ./.github/workflows/ci-linux-lane.yml
    with:
      lane_plan_json: ${{ needs.plan.outputs.lane_plan }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      original_event_name: pull_request
      supersession_key: pr-${{ github.event.pull_request.number }}

  required:
    name: PR / Linux
    needs: [plan, lane]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce Linux result
        env:
          LANE_PLAN: ${{ needs.plan.outputs.lane_plan }}
          LANE_RESULT: ${{ needs.lane.result }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HOSTED_PROJECTION_DIGEST: ${{ needs.plan.outputs.hosted_projection_digest }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]]
          [[ "$(printf '%s' "$LANE_PLAN" | sha256sum | awk '{print $1}')" == "$HOSTED_PROJECTION_DIGEST" ]]
          echo "Effective hosted projection: $HOSTED_PROJECTION_DIGEST (canonical provenance: $PLAN_DIGEST)" >> "$GITHUB_STEP_SUMMARY"
          required=$(jq -r '.required' <<<"$LANE_PLAN")
          if [[ "$required" == "true" ]]; then
            [[ "$LANE_RESULT" == "success" ]]
          else
            [[ "$LANE_RESULT" == "skipped" ]]
          fi
          echo "Plan digest: \`$PLAN_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
