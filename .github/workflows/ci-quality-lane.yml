name: Isolated native migration diagnostic

# Temporary override on the exact diagnostic ref only; never merge this file.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Published immutable candidate source SHA to validate.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-migration-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native_source_contracts:
    if: github.repository == 'Mesh-LLM/mesh-llm' && github.ref == 'refs/heads/codex/xtask-migration-diagnostic-20261006' && inputs.source_sha == '2c90866e9858b73c2263a3076b70f69415ae9fb1'
    name: Diagnostic native source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GIT_MASTER: '1'
      GIT_OPTIONAL_LOCKS: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # No restored trusted compiler/automation artifacts in this diagnostic.
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_CACHE_SIZE: 1G
      RUSTC_WRAPPER: ''
    steps:
      - name: Admit exact candidate source input
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'CARGO_TARGET_DIR=%s/native-migration-diagnostic-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SCCACHE_DIR=%s/native-migration-diagnostic-sccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checked-out candidate identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # existing Just installer
        with:
          tool: just
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Build admitted candidate native automation
        run: |
          rustc --version
          cargo --version
          just --version
          node --version
          sccache --version
          df -h "$RUNNER_TEMP"
          just automation-bootstrap
      - uses: ./.github/actions/install-actionlint
      - name: Strict current source inventory and policy
        run: |
          just with-lld cargo xtool automation inventory --check
          just with-lld cargo xtool automation policy --check
      - name: Full required native contract roster
        run: just ci-automation-contracts
      - name: Required source validation
        run: just ci-validate
