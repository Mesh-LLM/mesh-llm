name: CI

on:
  pull_request:
    # `edited` so that changing Skippy-Ref in the description starts a run.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skippy_ref:
        description: Skippy branch, tag, commit or pull/<number> to build and smoke against. Empty uses the pinned revision.
        required: false
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  MODEL_URL: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/9e6855bc4be717fca1ef21360a1db4b29d5c559a/SmolLM2-135M-Instruct-Q8_0.gguf
  MODEL_SHA256: c4a3dd037301b6ecea31d6da37f5cd793ead920dd5ddfe6d589294628d6ce66a

jobs:
  skippy:
    name: Select Skippy revision
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      repository: ${{ steps.skippy.outputs.repository }}
      sha: ${{ steps.skippy.outputs.sha }}
      override: ${{ steps.skippy.outputs.override }}
      artifact: ${{ steps.inputs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Resolve the Skippy commit once for every Rust job
        id: skippy
        env:
          INPUT_REF: ${{ inputs.skippy_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ref="${INPUT_REF:-$(scripts/ci-skippy-ref.sh)}"
          scripts/ci-resolve-skippy.sh "$ref" | tee -a "$GITHUB_OUTPUT"
          if [[ -n "$ref" ]]; then
            echo 'override=true' >> "$GITHUB_OUTPUT"
          else
            echo 'override=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
        if: steps.skippy.outputs.override == 'true'
      - name: Resolve the temporary manifest and lockfile once
        if: steps.skippy.outputs.override == 'true'
        env:
          SKIPPY_SHA: ${{ steps.skippy.outputs.sha }}
          RUSTC_WRAPPER: ""
        run: |
          scripts/ci-pin-skippy.sh "$SKIPPY_SHA"
          cargo metadata --format-version 1 > /dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: inputs
        if: steps.skippy.outputs.override == 'true'
        with:
          name: skippy-inputs-${{ github.run_attempt }}
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 3
          if-no-files-found: error

  lint:
    needs: skippy
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.skippy.outputs.override == 'true'
        with:
          artifact-ids: ${{ needs.skippy.outputs.artifact }}
          merge-multiple: true
      - name: Record the selected Skippy revision
        shell: bash
        env:
          SKIPPY_SHA: ${{ needs.skippy.outputs.sha }}
          SKIPPY_REPOSITORY: ${{ needs.skippy.outputs.repository }}
        run: echo "Skippy source = $SKIPPY_REPOSITORY@$SKIPPY_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: just lint --locked

  test:
    needs: skippy
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.skippy.outputs.override == 'true'
        with:
          artifact-ids: ${{ needs.skippy.outputs.artifact }}
          merge-multiple: true
      - name: Record the selected Skippy revision
        shell: bash
        env:
          SKIPPY_SHA: ${{ needs.skippy.outputs.sha }}
          SKIPPY_REPOSITORY: ${{ needs.skippy.outputs.repository }}
        run: echo "Skippy source = $SKIPPY_REPOSITORY@$SKIPPY_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: just test-rust --locked --no-fail-fast

  ui:
    name: Console
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - run: just test-ui

  website:
    needs: skippy
    name: Public website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.skippy.outputs.override == 'true'
        with:
          artifact-ids: ${{ needs.skippy.outputs.artifact }}
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - run: scripts/ci-website.sh

  # Override builds use the same frozen Cargo inputs as lint and tests.
  # Only smoke builds a native CPU runtime; ordinary runs download the release.
  smoke:
    needs: skippy
    name: Inference smoke (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.skippy.outputs.override == 'true'
        with:
          artifact-ids: ${{ needs.skippy.outputs.artifact }}
          merge-multiple: true
      - name: Record the selected Skippy revision
        shell: bash
        env:
          SKIPPY_SHA: ${{ needs.skippy.outputs.sha }}
          SKIPPY_REPOSITORY: ${{ needs.skippy.outputs.repository }}
        run: echo "Skippy source = $SKIPPY_REPOSITORY@$SKIPPY_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      # The pinned Skippy release publishes the runtime; a named ref has
      # none, so it is built here from that ref's source. Dispatching this
      # workflow on main with a Skippy ref means you trust that code.
      - name: Download the CPU runtime of the pinned Skippy release
        if: needs.skippy.outputs.override != 'true'
        run: scripts/fetch-skippy-runtime.sh skippy-runtime cpu

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.skippy.outputs.override == 'true'
        with:
          repository: ${{ needs.skippy.outputs.repository }}
          ref: ${{ needs.skippy.outputs.sha }}
          path: .deps/skippy
          persist-credentials: false

      - name: Build the CPU runtime from the named Skippy source
        if: needs.skippy.outputs.override == 'true'
        env:
          SKIPPY_SHA: ${{ needs.skippy.outputs.sha }}
        run: scripts/ci-skippy-runtime.sh .deps/skippy "$SKIPPY_SHA" skippy-runtime

      - name: Restore the test model
        id: model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: smoke-model.gguf
          key: smoke-model-${{ env.MODEL_SHA256 }}

      - name: Download the test model
        if: steps.model.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 --max-time 600 -o smoke-model.gguf "$MODEL_URL"

      - run: echo "$MODEL_SHA256  smoke-model.gguf" | sha256sum -c -

      - name: Build MeshLLM
        env:
          MESH_LLM_SKIP_UI: "1"
        # Host only: the runtime was downloaded or built above.
        run: just mesh

      - name: Run inference
        run: just smoke skippy-runtime smoke-model.gguf

      # Two MeshLLM processes: a host that serves the model and a client that
      # joins it with the host's invite token. Requests go to the client, so
      # they pass only if the mesh formed and routed them to the host.
      - name: Form a two-node mesh and route requests through it
        env:
          MESH_LLM_NATIVE_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/skippy-runtime
        run: scripts/ci-two-node-client-serving-smoke.sh target/debug/mesh-llm target/debug smoke-model.gguf

      - name: Run the tests that need a runtime
        run: just test-with-runtime skippy-runtime --locked

      - name: Record what was tested
        if: always()
        env:
          SKIPPY_REPOSITORY: ${{ needs.skippy.outputs.repository }}
          SKIPPY_SHA: ${{ needs.skippy.outputs.sha }}
          OVERRIDE: ${{ needs.skippy.outputs.override }}
        run: |
          {
            echo "Skippy source: $SKIPPY_REPOSITORY@$SKIPPY_SHA"
            echo "Runtime from:  $([[ "$OVERRIDE" == true ]] && echo "built from that source" || echo "the published release")"
            for manifest in skippy-runtime/*/manifest.json; do
              echo "Runtime:       $(jq -r '.runtime.id' "$manifest") manifest sha256 $(sha256sum "$manifest" | cut -d ' ' -f 1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Exercise the MeshLLM host/runtime boundary with Skippy's published CPU
  # package on the other desktop platforms. Skippy qualifies its own backend.
  cpu_smoke_platforms:
    needs: skippy
    # An arbitrary source ref has no published CPU packages for these platforms.
    # These install-boundary checks remain mandatory in fresh pinned CI.
    if: needs.skippy.outputs.override == 'false'
    name: CPU host smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
            binary: target/debug/mesh-llm
          - os: windows-2022
            python: python
            binary: target/debug/mesh-llm.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: model
        with:
          path: smoke-model.gguf
          key: smoke-model-${{ env.MODEL_SHA256 }}
      - name: Download the test model
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fL --retry 3 --max-time 600 -o smoke-model.gguf "$MODEL_URL"
      - name: Check the test model
        shell: bash
        run: echo "$MODEL_SHA256  smoke-model.gguf" | sha256sum -c -
      - name: Build MeshLLM host
        env:
          MESH_LLM_SKIP_UI: "1"
        run: just mesh
      - name: Run CPU host smoke
        run: ${{ matrix.python }} scripts/ci-cpu-host-smoke.py ${{ matrix.binary }} smoke-model.gguf

  # The merge rule for main requires these five check names, which the old
  # per-platform workflows used to report. Keep the test-only override guard
  # required as well as successful tests if those required names ever change.
  required:
    permissions:
      contents: read
      pull-requests: read
    name: PR / ${{ matrix.lane }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [skippy, lint, test, ui, website, smoke, cpu_smoke_platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        lane: [Quality, Linux, macOS, Windows, Website]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require successful pinned CI and no current override
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OVERRIDE: ${{ needs.skippy.outputs.override }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"
          export PR_BODY
          scripts/ci-skippy-ref.sh --merge-ready
