name: CI · Website
run-name: CI · Website · ${{ inputs.source_sha }}

on:
  workflow_call:
    inputs: &lane_inputs
      lane_plan_json:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      original_event_name:
        required: true
        type: string
      correlation_id:
        required: false
        default: ""
        type: string
      supersession_key:
        required: false
        default: ""
        type: string
      lane_check_id:
        required: false
        default: ""
        type: string
      overall_check_id:
        required: false
        default: ""
        type: string
      expected_lane_checks:
        required: false
        default: "[]"
        type: string
  workflow_dispatch:
    inputs: *lane_inputs
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-website-${{ inputs.supersession_key || inputs.source_sha }}
  cancel-in-progress: ${{ inputs.original_event_name == 'pull_request' }}

jobs:
  authority_source:
    name: Freeze protected automation source
    if: ${{ (contains(fromJson(inputs.lane_plan_json).required_slices, 'web')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GIT_MASTER: '1'
      MESH_LLM_POSTHOG_KEY: ''
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Freeze the protected commit
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  authority_linux_x64:
    name: Protected linux x64 automation
    needs: authority_source
    if: ${{ needs.authority_source.result == 'success' && (contains(fromJson(inputs.lane_plan_json).required_slices, 'web')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/protected-automation-artifact.yml
    with:
      platform: linux-x64
      lane: website
      protected_source_sha: ${{ needs.authority_source.outputs.source_sha }}

  web:
    needs: [authority_linux_x64]
    name: Website and console
    if: ${{ (contains(fromJson(inputs.lane_plan_json).required_slices, 'web')) && needs.authority_linux_x64.result == 'success' }}
    uses: ./.github/workflows/ci-web-slice.yml
    with:
      authority_linux_x64: ${{ needs.authority_linux_x64.outputs.identity_json }}
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      ui_changed: ${{ fromJson(inputs.lane_plan_json).signals.ui_changed || contains(fromJson(inputs.lane_plan_json).domains, 'ci-control') }}
      website_changed: ${{ fromJson(inputs.lane_plan_json).signals.website_changed || contains(fromJson(inputs.lane_plan_json).domains, 'ci-control') }}

  summary:
    name: CI / Website
    needs: [web, authority_source, authority_linux_x64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-automation
        with:
          runner-profile: hosted-bare
      - name: Validate planned website jobs
        id: validate
        continue-on-error: true
        env:
          LANE_PLAN: ${{ inputs.lane_plan_json }}
          NEEDS_RESULTS: ${{ toJson(needs) }}
        run: '"$MESH_LLM_AUTOMATION_BIN" ci validate-lane --lane-plan "$LANE_PLAN" --needs "$NEEDS_RESULTS"'
      - uses: ./.github/actions/report-ci-lane
        with:
          lane_name: CI / Website
          lane_result: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          lane_check_id: ${{ inputs.lane_check_id }}
          overall_check_id: ${{ inputs.overall_check_id }}
          expected_lane_checks: ${{ inputs.expected_lane_checks }}
          source_sha: ${{ inputs.source_sha }}
          correlation_id: ${{ inputs.correlation_id }}
          plan_digest: ${{ inputs.plan_digest }}
      - name: Enforce website result
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
