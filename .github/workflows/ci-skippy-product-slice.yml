name: CI standalone Skippy product

on:
  workflow_call:
    inputs:
      product_automation:
        description: Same-run product-source automation identity JSON from the lane's product_automation producer (source SHA, artifact ID, executable digest, OS, architecture). The job restores that executable and never compiles xtask.
        required: true
        type: string
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event for protected runner policy.
        required: true
        type: string
      plan_digest:
        description: Protected CI plan digest bound into every qualification receipt.
        required: true
        type: string
      platform:
        description: Closed platform selector (linux, macos, windows).
        required: true
        type: string
      runtime_matrix:
        description: Bounded selected runtime rows from the checked CI plan.
        required: true
        type: string
      max_parallel:
        description: Bounded product composition worker budget.
        required: true
        type: number
      fail_fast:
        description: Cancel sibling PR rows on a required failure.
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  runner_policy:
    name: Select standalone product runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
      linux: ${{ steps.policy.outputs.runner }}
      cuda: ${{ steps.hardware.outputs.cuda }}
      rocm: ${{ steps.hardware.outputs.rocm }}
      vulkan: ${{ steps.hardware.outputs.vulkan }}
      macos: ${{ steps.policy.outputs.runner_macos }}
      windows: ${{ steps.policy.outputs.runner_windows }}
    steps:
      - name: Normalize protected hardware gates
        id: hardware
        shell: bash
        env:
          CUDA_ENABLED: ${{ vars.MESH_CUDA_INFERENCE_RUNNER_ENABLED }}
          ROCM_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
          VULKAN_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
        run: |
          set -euo pipefail
          for backend in CUDA ROCM VULKAN; do
            variable="${backend}_ENABLED"
            enabled=false
            if [[ "${!variable}" == true ]]; then enabled=true; fi
            printf '%s=%s\n' "${backend,,}" "$enabled" >> "$GITHUB_OUTPUT"
          done
      - name: Validate bounded product rows
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          RUNTIME_ROWS: ${{ inputs.runtime_matrix }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in linux|macos|windows) ;; *) exit 1 ;; esac
          [[ "$MAX_PARALLEL" =~ ^[0-9]+$ ]] && (( MAX_PARALLEL >= 1 && MAX_PARALLEL <= 12 ))
          jq -e --arg platform "$PLATFORM" '
            type == "array" and length > 0 and length <= 4 and
            all(.[]; .platform == $platform and .id == (.platform + "-" + .backend) and
              (if .platform == "macos" then
                .architecture == "arm64" and .backend == "metal" and .target == "aarch64-apple-darwin"
              else
                .architecture == "amd64" and
                (.backend == "cpu" or .backend == "cuda" or .backend == "rocm" or .backend == "vulkan") and
                .target == (if .platform == "linux" then "x86_64-unknown-linux-gnu" else "x86_64-pc-windows-msvc" end)
              end)) and
            ([.[].id] | unique | length) == length
          ' <<<"$RUNTIME_ROWS" >/dev/null
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select protected hosted composition role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: 'false'
          depot_pr_enabled: 'false'
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: true

  linux_product:
    name: Standalone Linux Skippy (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'linux' }}
    runs-on: ${{ fromJson(matrix.runtime.backend == 'rocm' && needs.runner_policy.outputs.rocm == 'true' && '["self-hosted","Linux","X64","amd64","gpu-amd","mesh-llm-amd64"]' || ((matrix.runtime.backend == 'cuda' && needs.runner_policy.outputs.cuda == 'true') || (matrix.runtime.backend == 'rocm' && needs.runner_policy.outputs.rocm == 'true') || (matrix.runtime.backend == 'vulkan' && needs.runner_policy.outputs.vulkan == 'true')) && '["self-hosted","Linux","X64","amd64","gpu-nvidia","mesh-llm-amd64"]' || format('["{0}"]', needs.runner_policy.outputs.linux)) }}
    timeout-minutes: 100
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    container:
      image: ${{ !((matrix.runtime.backend == 'cuda' && needs.runner_policy.outputs.cuda == 'true') || (matrix.runtime.backend == 'rocm' && needs.runner_policy.outputs.rocm == 'true') || (matrix.runtime.backend == 'vulkan' && needs.runner_policy.outputs.vulkan == 'true')) && 'ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:f499b79bc52dc7492d57397fdbec9f890c6f6bb1d8c1fcde9c1c97d45c0541a7' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Restore product-source automation
        uses: ./.github/actions/restore-automation
        with:
          source_sha: ${{ inputs.source_sha }}
          artifact_id: ${{ fromJson(inputs.product_automation).artifact_id }}
          binary_sha256: ${{ fromJson(inputs.product_automation).binary_sha256 }}
          producer_os: ${{ fromJson(inputs.product_automation).producer_os }}
          producer_arch: ${{ fromJson(inputs.product_automation).producer_arch }}
      - name: Verify composition environment
        if: ${{ job.container.id != '' }}
        run: verify-runner-image public cpu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-skippy-cli-linux-${{ matrix.runtime.architecture }}
          path: ci-artifacts/skippy/skippy-cli-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ci-artifacts/skippy/runtime-input
      - name: Admit immutable controller and hardware execution
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BACKEND: ${{ matrix.runtime.backend }}
        run: |
          set -euo pipefail
          [[ "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          digest="$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')"
          printf 'SKIPPY_CONTROLLER_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          if [[ "$BACKEND" == vulkan && "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            verify-vulkan-device
          fi
      - name: Compose exact standalone product
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.runtime.target }}
          BACKEND: ${{ matrix.runtime.backend }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify compose --cli-input ci-artifacts/skippy/skippy-cli-input \
            --runtime-input ci-artifacts/skippy/runtime-input --output ci-artifacts/skippy/skippy-product-input \
            --source-sha "$SOURCE_SHA" --target "$TARGET" --backend "$BACKEND"
      - name: Materialize protected hardware availability
        id: availability
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
          BACKEND: ${{ matrix.runtime.backend }}
          MESH_CUDA_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_CUDA_INFERENCE_RUNNER_ENABLED }}
          MESH_ROCM_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
          MESH_VULKAN_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify availability \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" \
            --row-id "$ROW_ID" --output ci-artifacts/skippy/skippy-availability.json
          case "$BACKEND" in
            cpu|cuda|rocm|vulkan|metal) ;;
            *) echo "unknown backend: $BACKEND" >&2; exit 1 ;;
          esac
          state="$(jq -r '.state' ci-artifacts/skippy/skippy-availability.json)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Upload hardware availability
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-availability-${{ matrix.runtime.platform }}-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ci-artifacts/skippy/skippy-availability.json
          if-no-files-found: error
          retention-days: 1
      - name: Qualify exact standalone packaging and runtime
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify packaging \
            --product-dir ci-artifacts/skippy/skippy-product-input --product-archive ci-artifacts/skippy/skippy-product-input.tar.gz \
            --source-sha "$SOURCE_SHA" --row-id "$ROW_ID" \
            --evidence ci-artifacts/skippy/skippy-packaging-runtime.json
      - name: Upload standalone packaging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-packaging-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ci-artifacts/skippy/skippy-packaging-runtime.json
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned Laya model for standalone qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: laya_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/skippy-system-one-smoke.json
          model_artifact_id: family-laya-multilingual
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-laya-qualification
      - name: Execute composed Skippy System One and Decisions qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.laya_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.laya_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify laya \
            --product-dir ci-artifacts/skippy/skippy-product-input --model "$MODEL_PATH" \
            --model-sha256 "$MODEL_SHA256" \
            --model-id 'meshllm/laya-multilingual-F16-GGUF:F16' \
            --row-id "$ROW_ID" \
            --evidence-dir ci-artifacts/skippy/skippy-laya-qualification
      - name: Upload standalone Laya qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-laya-qualification-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ci-artifacts/skippy/skippy-laya-qualification/
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned dense model for standalone qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: dense_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: smollm2-q8-inference
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-dense-smoke
      - name: Execute composed Skippy dense qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.dense_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify models \
            --product-dir ci-artifacts/skippy/skippy-product-input --row-id "$ROW_ID" --suite dense \
            --model smollm2-q8-inference "$MODEL_PATH" "$MODEL_SHA256" 'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --availability ci-artifacts/skippy/skippy-availability.json --hardware-evidence ci-artifacts/skippy/skippy-hardware.json \
            --evidence ci-artifacts/skippy/skippy-dense.json
      - name: Restore pinned recurrent model for standalone qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: recurrent_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-hybrid
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-recurrent-smoke
      - name: Execute composed Skippy recurrent qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify models \
            --product-dir ci-artifacts/skippy/skippy-product-input --row-id "$ROW_ID" --suite recurrent \
            --model family-granite-hybrid "$MODEL_PATH" "$MODEL_SHA256" 'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence ci-artifacts/skippy/skippy-recurrent.json
      - name: Restore pinned MoE model for standalone qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: moe_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-moe
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-moe-smoke
      - name: Execute composed Skippy MoE qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.moe_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.moe_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify models \
            --product-dir ci-artifacts/skippy/skippy-product-input --row-id "$ROW_ID" --suite moe \
            --model family-granite-moe "$MODEL_PATH" "$MODEL_SHA256" 'sinatras/granite-moe-1b-split:Q4_K_M' \
            --evidence ci-artifacts/skippy/skippy-moe.json
      - name: Execute composed Skippy KV cache qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          DENSE_PATH: ${{ steps.dense_model.outputs.model_path }}
          DENSE_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          HYBRID_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          HYBRID_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify models \
            --product-dir ci-artifacts/skippy/skippy-product-input --row-id "$ROW_ID" --suite kv-cache \
            --model smollm2-q8-inference "$DENSE_PATH" "$DENSE_SHA256" \
            'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --model family-granite-hybrid "$HYBRID_PATH" "$HYBRID_SHA256" \
            'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence ci-artifacts/skippy/skippy-kv-cache.json
      - name: Upload standalone model qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-model-qualification-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: |
            ci-artifacts/skippy/skippy-dense.json
            ci-artifacts/skippy/skippy-recurrent.json
            ci-artifacts/skippy/skippy-moe.json
            ci-artifacts/skippy/skippy-kv-cache.json
          if-no-files-found: error
          retention-days: 1
      - name: Assemble and validate standalone qualification receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/skippy/skippy-evidence
          cp ci-artifacts/skippy/skippy-packaging-runtime.json ci-artifacts/skippy/skippy-evidence/packaging-runtime.json
          for suite in dense recurrent moe kv-cache; do
            if [[ -f "ci-artifacts/skippy/skippy-$suite.json" ]]; then
              cp "ci-artifacts/skippy/skippy-$suite.json" "ci-artifacts/skippy/skippy-evidence/$suite.json"
            fi
          done
          for suite in system-one decisions; do
            if [[ -f "ci-artifacts/skippy/skippy-laya-qualification/$suite.json" ]]; then
              cp "ci-artifacts/skippy/skippy-laya-qualification/$suite.json" "ci-artifacts/skippy/skippy-evidence/$suite.json"
            fi
          done
          "$MESH_LLM_AUTOMATION_BIN" qualify assemble \
            --product-dir ci-artifacts/skippy/skippy-product-input --availability ci-artifacts/skippy/skippy-availability.json \
            --evidence-dir ci-artifacts/skippy/skippy-evidence --hardware ci-artifacts/skippy/skippy-hardware.json \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID" \
            --output ci-artifacts/skippy/skippy-receipt.json
          "$MESH_LLM_AUTOMATION_BIN" qualify validate \
            --receipt ci-artifacts/skippy/skippy-receipt.json \
            --product-manifest ci-artifacts/skippy/skippy-product-input/product-manifest.json \
            --product-dir ci-artifacts/skippy/skippy-product-input --availability ci-artifacts/skippy/skippy-availability.json \
            --evidence-dir ci-artifacts/skippy/skippy-evidence --source-sha "$SOURCE_SHA" \
            --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID"
      - name: Upload standalone qualification receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-receipt-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ci-artifacts/skippy/skippy-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable standalone product
        id: product_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-product-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: ci-artifacts/skippy/skippy-product-input.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Retain standalone qualification diagnostics
        id: evidence_upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-diagnostics-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: |
            ci-artifacts/skippy/*.json
            ci-artifacts/skippy/skippy-evidence/
            ci-artifacts/skippy/skippy-laya-qualification/
          retention-days: 7
          if-no-files-found: warn
      - name: Clean owned standalone qualification outputs
        if: ${{ success() || failure() || cancelled() }}
        timeout-minutes: 5
        env:
          CLEANUP_ARTIFACT_PATH: ci-artifacts/skippy/skippy-product-input
          CLEANUP_BINARY_PATH: ci-artifacts/skippy/skippy-product-input/skippy
        run: |
          set -euo pipefail
          test "$(sha256sum "$MESH_LLM_AUTOMATION_BIN" | awk '{print $1}')" = "$SKIPPY_CONTROLLER_SHA256"
          "$MESH_LLM_AUTOMATION_BIN" ci-ops runner-cleanup --job smoke --evidence-uploaded false

  macos_product:
    name: Standalone macOS Skippy (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'macos' }}
    runs-on: ${{ needs.runner_policy.outputs.macos }}
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Restore product-source automation
        uses: ./.github/actions/restore-automation
        with:
          source_sha: ${{ inputs.source_sha }}
          artifact_id: ${{ fromJson(inputs.product_automation).artifact_id }}
          binary_sha256: ${{ fromJson(inputs.product_automation).binary_sha256 }}
          producer_os: ${{ fromJson(inputs.product_automation).producer_os }}
          producer_arch: ${{ fromJson(inputs.product_automation).producer_arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-skippy-cli-macos-${{ matrix.runtime.architecture }}
          path: skippy-cli-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-macos-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose exact standalone product
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.runtime.target }}
          BACKEND: ${{ matrix.runtime.backend }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify compose --cli-input skippy-cli-input \
            --runtime-input runtime-input --output skippy-product-input \
            --source-sha "$SOURCE_SHA" --target "$TARGET" --backend "$BACKEND"
      - name: Materialize protected hardware availability
        id: availability
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
          BACKEND: ${{ matrix.runtime.backend }}
          MESH_CUDA_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_CUDA_INFERENCE_RUNNER_ENABLED }}
          MESH_ROCM_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
          MESH_VULKAN_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
        run: |
          set -euo pipefail
          "$MESH_LLM_AUTOMATION_BIN" qualify availability \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" \
