name: CI standalone Skippy product

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event for protected runner policy.
        required: true
        type: string
      plan_digest:
        description: Protected CI plan digest bound into every qualification receipt.
        required: true
        type: string
      platform:
        description: Closed platform selector (linux, macos, windows).
        required: true
        type: string
      runtime_matrix:
        description: Bounded selected runtime rows from the checked CI plan.
        required: true
        type: string
      max_parallel:
        description: Bounded product composition worker budget.
        required: true
        type: number
      fail_fast:
        description: Cancel sibling PR rows on a required failure.
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  runner_policy:
    name: Select standalone product runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.policy.outputs.runner }}
      macos: ${{ steps.policy.outputs.runner_macos }}
      windows: ${{ steps.policy.outputs.runner_windows }}
    steps:
      - name: Validate bounded product rows
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          RUNTIME_ROWS: ${{ inputs.runtime_matrix }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in linux|macos|windows) ;; *) exit 1 ;; esac
          [[ "$MAX_PARALLEL" =~ ^[0-9]+$ ]] && (( MAX_PARALLEL >= 1 && MAX_PARALLEL <= 12 ))
          jq -e --arg platform "$PLATFORM" '
            type == "array" and length > 0 and length <= 4 and
            all(.[]; .platform == $platform and (.id | type == "string") and
              (.architecture | type == "string") and (.backend | type == "string") and
              (.target | type == "string")) and
            ([.[].id] | unique | length) == length
          ' <<<"$RUNTIME_ROWS" >/dev/null
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select protected hosted composition role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: 'false'
          depot_pr_enabled: 'false'
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          force_hosted: true

  linux_product:
    name: Standalone Linux Skippy (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'linux' }}
    runs-on: ${{ needs.runner_policy.outputs.linux }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:f499b79bc52dc7492d57397fdbec9f890c6f6bb1d8c1fcde9c1c97d45c0541a7
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify composition environment
        run: verify-runner-image public cpu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-skippy-cli-linux-${{ matrix.runtime.architecture }}
          path: skippy-cli-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose exact standalone product
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.runtime.target }}
          BACKEND: ${{ matrix.runtime.backend }}
        run: |
          set -euo pipefail
          python3 skippy/scripts/compose-ci-product.py --cli-input skippy-cli-input \
            --runtime-input runtime-input --output skippy-product-input \
            --source-sha "$SOURCE_SHA" --target "$TARGET" --backend "$BACKEND"
      - name: Materialize protected hardware availability
        id: availability
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
          BACKEND: ${{ matrix.runtime.backend }}
          MESH_CUDA_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_CUDA_INFERENCE_RUNNER_ENABLED }}
          MESH_ROCM_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
          MESH_VULKAN_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
        run: |
          python3 skippy/scripts/ci-qualification-availability.py \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" \
            --row-id "$ROW_ID" --output skippy-availability.json
          case "$BACKEND" in
            cpu|cuda|rocm|vulkan|metal) ;;
            *) echo "unknown backend: $BACKEND" >&2; exit 1 ;;
          esac
          state=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["state"])' skippy-availability.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Upload hardware availability
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-availability-${{ matrix.runtime.platform }}-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-availability.json
          if-no-files-found: error
          retention-days: 1
      - name: Qualify exact standalone packaging and runtime
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/qualify-ci-packaging.py \
            --product-dir skippy-product-input --product-archive skippy-product-input.tar.gz \
            --source-sha "$SOURCE_SHA" --row-id "$ROW_ID" \
            --evidence skippy-packaging-runtime.json
      - name: Upload standalone packaging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-packaging-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-packaging-runtime.json
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned Laya model for standalone CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: laya_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/skippy-system-one-smoke.json
          model_artifact_id: family-laya-multilingual
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-laya-qualification
      - name: Execute composed Skippy System One and Decisions qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.laya_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.laya_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-laya-qualification.py \
            --product-dir skippy-product-input --model "$MODEL_PATH" \
            --model-sha256 "$MODEL_SHA256" \
            --model-id 'meshllm/laya-multilingual-F16-GGUF:F16' \
            --row-id "$ROW_ID" \
            --evidence-dir skippy-laya-qualification
      - name: Upload standalone Laya qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-laya-qualification-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-laya-qualification/
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned dense model for standalone CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: dense_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: smollm2-q8-inference
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-dense-smoke
      - name: Execute composed Skippy dense CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.dense_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite dense \
            --model smollm2-q8-inference "$MODEL_PATH" "$MODEL_SHA256" 'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --availability skippy-availability.json --hardware-evidence skippy-hardware.json \
            --evidence skippy-dense.json
      - name: Restore pinned recurrent model for standalone CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: recurrent_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-hybrid
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-recurrent-smoke
      - name: Execute composed Skippy recurrent CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite recurrent \
            --model family-granite-hybrid "$MODEL_PATH" "$MODEL_SHA256" 'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence skippy-recurrent.json
      - name: Restore pinned MoE model for standalone CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: moe_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-moe
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-moe-smoke
      - name: Execute composed Skippy MoE CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          MODEL_PATH: ${{ steps.moe_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.moe_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite moe \
            --model family-granite-moe "$MODEL_PATH" "$MODEL_SHA256" 'sinatras/granite-moe-1b-split:Q4_K_M' \
            --evidence skippy-moe.json
      - name: Execute composed Skippy KV cache CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          DENSE_PATH: ${{ steps.dense_model.outputs.model_path }}
          DENSE_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          HYBRID_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          HYBRID_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite kv-cache \
            --model smollm2-q8-inference "$DENSE_PATH" "$DENSE_SHA256" \
            'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --model family-granite-hybrid "$HYBRID_PATH" "$HYBRID_SHA256" \
            'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence skippy-kv-cache.json
      - name: Upload standalone model qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-model-qualification-linux-${{ matrix.runtime.architecture }}
          path: |
            skippy-dense.json
            skippy-recurrent.json
            skippy-moe.json
            skippy-kv-cache.json
          if-no-files-found: error
          retention-days: 1
      - name: Assemble and validate standalone qualification receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          mkdir -p skippy-evidence
          cp skippy-packaging-runtime.json skippy-evidence/packaging-runtime.json
          for suite in dense recurrent moe kv-cache; do
            [ -f "skippy-$suite.json" ] && cp "skippy-$suite.json" "skippy-evidence/$suite.json"
          done
          for suite in system-one decisions; do
            [ -f "skippy-laya-qualification/$suite.json" ] && \
              cp "skippy-laya-qualification/$suite.json" "skippy-evidence/$suite.json"
          done
          python3 skippy/scripts/assemble-ci-qualification.py \
            --product-dir skippy-product-input --availability skippy-availability.json \
            --evidence-dir skippy-evidence --hardware skippy-hardware.json \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID" \
            --output skippy-receipt.json
          python3 skippy/scripts/validate-ci-qualification.py \
            --receipt skippy-receipt.json \
            --product-manifest skippy-product-input/product-manifest.json \
            --product-dir skippy-product-input --availability skippy-availability.json \
            --evidence-dir skippy-evidence --source-sha "$SOURCE_SHA" \
            --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID"
      - name: Upload standalone qualification receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-receipt-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable standalone product
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-product-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-product-input.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos_product:
    name: Standalone macOS Skippy (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'macos' }}
    runs-on: ${{ needs.runner_policy.outputs.macos }}
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-skippy-cli-macos-${{ matrix.runtime.architecture }}
          path: skippy-cli-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-macos-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose exact standalone product
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.runtime.target }}
          BACKEND: ${{ matrix.runtime.backend }}
        run: |
          set -euo pipefail
          python3 skippy/scripts/compose-ci-product.py --cli-input skippy-cli-input \
            --runtime-input runtime-input --output skippy-product-input \
            --source-sha "$SOURCE_SHA" --target "$TARGET" --backend "$BACKEND"
      - name: Materialize protected hardware availability
        id: availability
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
          BACKEND: ${{ matrix.runtime.backend }}
          MESH_CUDA_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_CUDA_INFERENCE_RUNNER_ENABLED }}
          MESH_ROCM_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
          MESH_VULKAN_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
        run: |
          python3 skippy/scripts/ci-qualification-availability.py \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" \
            --row-id "$ROW_ID" --output skippy-availability.json
          case "$BACKEND" in
            cpu|cuda|rocm|vulkan|metal) ;;
            *) echo "unknown backend: $BACKEND" >&2; exit 1 ;;
          esac
          state=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["state"])' skippy-availability.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Upload hardware availability
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-availability-${{ matrix.runtime.platform }}-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-availability.json
          if-no-files-found: error
          retention-days: 1
      - name: Qualify exact standalone packaging and runtime
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/qualify-ci-packaging.py \
            --product-dir skippy-product-input --product-archive skippy-product-input.tar.gz \
            --source-sha "$SOURCE_SHA" --row-id "$ROW_ID" \
            --evidence skippy-packaging-runtime.json
      - name: Upload standalone packaging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-packaging-macos-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-packaging-runtime.json
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned Laya model for standalone Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: laya_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/skippy-system-one-smoke.json
          model_artifact_id: family-laya-multilingual
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-laya-qualification
      - name: Execute composed Skippy System One and Decisions qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.laya_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.laya_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-laya-qualification.py \
            --product-dir skippy-product-input --model "$MODEL_PATH" \
            --model-sha256 "$MODEL_SHA256" \
            --model-id 'meshllm/laya-multilingual-F16-GGUF:F16' \
            --row-id "$ROW_ID" \
            --evidence-dir skippy-laya-qualification
      - name: Upload standalone Laya qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-laya-qualification-macos-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-laya-qualification/
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned dense model for standalone Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: dense_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: smollm2-q8-inference
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-dense-smoke
      - name: Execute composed Skippy dense Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.dense_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite dense \
            --model smollm2-q8-inference "$MODEL_PATH" "$MODEL_SHA256" 'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --availability skippy-availability.json --hardware-evidence skippy-hardware.json \
            --evidence skippy-dense.json
      - name: Restore pinned recurrent model for standalone Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: recurrent_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-hybrid
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-recurrent-smoke
      - name: Execute composed Skippy recurrent Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite recurrent \
            --model family-granite-hybrid "$MODEL_PATH" "$MODEL_SHA256" 'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence skippy-recurrent.json
      - name: Restore pinned MoE model for standalone Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: moe_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-moe
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-moe-smoke
      - name: Execute composed Skippy MoE Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.moe_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.moe_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite moe \
            --model family-granite-moe "$MODEL_PATH" "$MODEL_SHA256" 'sinatras/granite-moe-1b-split:Q4_K_M' \
            --evidence skippy-moe.json
      - name: Execute composed Skippy KV cache Metal qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          DENSE_PATH: ${{ steps.dense_model.outputs.model_path }}
          DENSE_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          HYBRID_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          HYBRID_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python3 skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite kv-cache \
            --model smollm2-q8-inference "$DENSE_PATH" "$DENSE_SHA256" \
            'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --model family-granite-hybrid "$HYBRID_PATH" "$HYBRID_SHA256" \
            'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence skippy-kv-cache.json
      - name: Upload standalone model qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-model-qualification-macos-${{ matrix.runtime.architecture }}
          path: |
            skippy-dense.json
            skippy-recurrent.json
            skippy-moe.json
            skippy-kv-cache.json
          if-no-files-found: error
          retention-days: 1
      - name: Assemble and validate standalone qualification receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          mkdir -p skippy-evidence
          cp skippy-packaging-runtime.json skippy-evidence/packaging-runtime.json
          for suite in dense recurrent moe kv-cache; do
            [ -f "skippy-$suite.json" ] && cp "skippy-$suite.json" "skippy-evidence/$suite.json"
          done
          for suite in system-one decisions; do
            [ -f "skippy-laya-qualification/$suite.json" ] && \
              cp "skippy-laya-qualification/$suite.json" "skippy-evidence/$suite.json"
          done
          python3 skippy/scripts/assemble-ci-qualification.py \
            --product-dir skippy-product-input --availability skippy-availability.json \
            --evidence-dir skippy-evidence --hardware skippy-hardware.json \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID" \
            --output skippy-receipt.json
          python3 skippy/scripts/validate-ci-qualification.py \
            --receipt skippy-receipt.json \
            --product-manifest skippy-product-input/product-manifest.json \
            --product-dir skippy-product-input --availability skippy-availability.json \
            --evidence-dir skippy-evidence --source-sha "$SOURCE_SHA" \
            --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID"
      - name: Upload standalone qualification receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-receipt-macos-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable standalone product
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-product-macos-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-product-input.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows_product:
    name: Standalone Windows Skippy (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ needs.runner_policy.result == 'success' && inputs.platform == 'windows' }}
    runs-on: ${{ needs.runner_policy.outputs.windows }}
    timeout-minutes: 35
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-skippy-cli-windows-${{ matrix.runtime.architecture }}
          path: skippy-cli-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: runtime-input
      - name: Compose exact standalone product
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.runtime.target }}
          BACKEND: ${{ matrix.runtime.backend }}
        run: |
          set -euo pipefail
          python skippy/scripts/compose-ci-product.py --cli-input skippy-cli-input \
            --runtime-input runtime-input --output skippy-product-input \
            --source-sha "$SOURCE_SHA" --target "$TARGET" --backend "$BACKEND"
      - name: Materialize protected hardware availability
        id: availability
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
          BACKEND: ${{ matrix.runtime.backend }}
          MESH_CUDA_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_CUDA_INFERENCE_RUNNER_ENABLED }}
          MESH_ROCM_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED }}
          MESH_VULKAN_INFERENCE_RUNNER_ENABLED: ${{ vars.MESH_VULKAN_INFERENCE_RUNNER_ENABLED }}
        run: |
          python skippy/scripts/ci-qualification-availability.py \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" \
            --row-id "$ROW_ID" --output skippy-availability.json
          case "$BACKEND" in
            cpu|cuda|rocm|vulkan|metal) ;;
            *) echo "unknown backend: $BACKEND" >&2; exit 1 ;;
          esac
          state=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["state"])' skippy-availability.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Upload hardware availability
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-availability-${{ matrix.runtime.platform }}-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-availability.json
          if-no-files-found: error
          retention-days: 1
      - name: Qualify exact standalone packaging and runtime
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python skippy/scripts/qualify-ci-packaging.py \
            --product-dir skippy-product-input --product-archive skippy-product-input.tar.gz \
            --source-sha "$SOURCE_SHA" --row-id "$ROW_ID" \
            --evidence skippy-packaging-runtime.json
      - name: Upload standalone packaging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-packaging-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-packaging-runtime.json
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned Laya model for standalone Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: laya_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/skippy-system-one-smoke.json
          model_artifact_id: family-laya-multilingual
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-laya-qualification
      - name: Execute composed Skippy System One and Decisions qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.laya_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.laya_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python skippy/scripts/ci-standalone-laya-qualification.py \
            --product-dir skippy-product-input --model "$MODEL_PATH" \
            --model-sha256 "$MODEL_SHA256" \
            --model-id 'meshllm/laya-multilingual-F16-GGUF:F16' \
            --row-id "$ROW_ID" \
            --evidence-dir skippy-laya-qualification
      - name: Upload standalone Laya qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-laya-qualification-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-laya-qualification/
          if-no-files-found: error
          retention-days: 1
      - name: Restore pinned dense model for standalone Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: dense_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: smollm2-q8-inference
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-dense-smoke
      - name: Execute composed Skippy dense Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.dense_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite dense \
            --model smollm2-q8-inference "$MODEL_PATH" "$MODEL_SHA256" 'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --availability skippy-availability.json --hardware-evidence skippy-hardware.json \
            --evidence skippy-dense.json
      - name: Restore pinned recurrent model for standalone Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: recurrent_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-hybrid
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-recurrent-smoke
      - name: Execute composed Skippy recurrent Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite recurrent \
            --model family-granite-hybrid "$MODEL_PATH" "$MODEL_SHA256" 'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence skippy-recurrent.json
      - name: Restore pinned MoE model for standalone Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        id: moe_model
        uses: ./.github/actions/restore-test-model
        with:
          model_manifest: ci/model-artifacts/manifests/product-smoke.json
          model_artifact_id: family-granite-moe
          model_cadence: ${{ inputs.original_event_name == 'pull_request' && 'pull-request' || 'main' }}
          model_cache_scope: standalone-moe-smoke
      - name: Execute composed Skippy MoE Windows CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        shell: bash
        env:
          MODEL_PATH: ${{ steps.moe_model.outputs.model_path }}
          MODEL_SHA256: ${{ steps.moe_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite moe \
            --model family-granite-moe "$MODEL_PATH" "$MODEL_SHA256" 'sinatras/granite-moe-1b-split:Q4_K_M' \
            --evidence skippy-moe.json
      - name: Execute composed Skippy KV cache CPU qualification
        if: ${{ steps.availability.outputs.state == 'available' }}
        env:
          DENSE_PATH: ${{ steps.dense_model.outputs.model_path }}
          DENSE_SHA256: ${{ steps.dense_model.outputs.model_sha256 }}
          HYBRID_PATH: ${{ steps.recurrent_model.outputs.model_path }}
          HYBRID_SHA256: ${{ steps.recurrent_model.outputs.model_sha256 }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          python skippy/scripts/ci-standalone-model-qualification.py \
            --product-dir skippy-product-input --row-id "$ROW_ID" --suite kv-cache \
            --model smollm2-q8-inference "$DENSE_PATH" "$DENSE_SHA256" \
            'unsloth/SmolLM2-135M-Instruct-GGUF:Q8_0' \
            --model family-granite-hybrid "$HYBRID_PATH" "$HYBRID_SHA256" \
            'ibm-granite/granite-4.0-h-350m-GGUF:Q4_K_M' \
            --evidence skippy-kv-cache.json
      - name: Upload standalone model qualification evidence
        if: ${{ steps.availability.outputs.state == 'available' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-model-qualification-windows-${{ matrix.runtime.architecture }}
          path: |
            skippy-dense.json
            skippy-recurrent.json
            skippy-moe.json
            skippy-kv-cache.json
          if-no-files-found: error
          retention-days: 1
      - name: Assemble and validate standalone qualification receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ROW_ID: ${{ matrix.runtime.id }}
        run: |
          set -euo pipefail
          mkdir -p skippy-evidence
          cp skippy-packaging-runtime.json skippy-evidence/packaging-runtime.json
          for suite in dense recurrent moe kv-cache; do
            [ -f "skippy-$suite.json" ] && cp "skippy-$suite.json" "skippy-evidence/$suite.json"
          done
          for suite in system-one decisions; do
            [ -f "skippy-laya-qualification/$suite.json" ] && \
              cp "skippy-laya-qualification/$suite.json" "skippy-evidence/$suite.json"
          done
          python skippy/scripts/assemble-ci-qualification.py \
            --product-dir skippy-product-input --availability skippy-availability.json \
            --evidence-dir skippy-evidence --hardware skippy-hardware.json \
            --source-sha "$SOURCE_SHA" --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID" \
            --output skippy-receipt.json
          python skippy/scripts/validate-ci-qualification.py \
            --receipt skippy-receipt.json \
            --product-manifest skippy-product-input/product-manifest.json \
            --product-dir skippy-product-input --availability skippy-availability.json \
            --evidence-dir skippy-evidence --source-sha "$SOURCE_SHA" \
            --plan-digest "$PLAN_DIGEST" --row-id "$ROW_ID"
      - name: Upload standalone qualification receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-receipt-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable standalone product
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-skippy-product-windows-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: skippy-product-input.tar.gz
          if-no-files-found: error
          retention-days: 1
