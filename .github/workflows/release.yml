name: Release

# One MeshLLM host per platform. Each archive carries that platform's default
# Skippy runtime (Metal on macOS, CPU on Linux and Windows), downloaded from
# the Skippy release this source pins. GPU runtimes are not built or shipped
# here: MeshLLM downloads them from Skippy when a machine needs one.
#
# Dispatch from main:  just release v0.81.0
# Rehearse:            just release v0.81.0 --canary   (builds, packages and
#                      smokes everything; pushes and publishes nothing)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag to build, for example v0.81.0
        required: true
        type: string
      canary:
        description: Dry run. Build, package and smoke everything; push and publish nothing.
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_TERM_COLOR: always
  # Compiled into release binaries by `mesh-llm-analytics`. Unset in forks and
  # in local builds, which then report no usage data at all. See
  # website/src/docs/pages/analytics.md.
  MESH_LLM_POSTHOG_KEY: ${{ secrets.MESH_LLM_POSTHOG_KEY }}

jobs:
  metadata:
    name: Prepare the release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      source_sha: ${{ steps.source.outputs.sha }}
      release_notes_base: ${{ steps.source.outputs.release_notes_base }}
    steps:
      - name: Require the trusted release ref
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from refs/heads/main, not $GITHUB_REF." >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $INPUT_VERSION" >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          {
            echo "tag=v$version"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Reject an existing release tag
        if: ${{ !inputs.canary }}
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$existing" ]]; then
            echo "Release tag already exists and is immutable: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Commit the version update to main
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          CANARY: ${{ inputs.canary }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          if [[ "$CANARY" == "true" ]]; then
            echo "Canary: leaving main unchanged. Each build applies the version locally."
          else
            scripts/release-version.sh "$RELEASE_TAG"
            cargo fmt --all -- --check
            git diff --check
            git add --update
            if ! git diff --quiet; then
              echo "Release version preparation left unstaged tracked changes:" >&2
              git status --short >&2
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "main already contains the complete $RELEASE_TAG version update."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "$RELEASE_TAG: prepare release source"
            fi
            source_sha="$(git rev-parse HEAD)"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$source_sha:refs/heads/main"
          fi
          # Release notes compare against the newest stable tag below this version.
          release_notes_base="$(
            { git tag --list 'v*' | grep -Ev -- '-' || true; echo "$RELEASE_TAG"; } |
              sort -V | awk -v tag="$RELEASE_TAG" '$0 == tag { print previous; exit } { previous = $0 }'
          )"
          {
            echo "sha=$source_sha"
            echo "release_notes_base=$release_notes_base"
          } >> "$GITHUB_OUTPUT"

  # MeshLLM must refuse a downloaded runtime that differs from the catalog
  # entry chosen for the host. The last case is #[ignore]d until the pinned
  # Skippy revision checks it, so this job fails, and nothing is published,
  # until that pin moves.
  runtime_download_gate:
    name: Refuse runtimes that differ from their catalog entry
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo test --locked -p mesh-llm-system --test native_runtime_download -- --include-ignored

  build:
    name: Build and package ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            os: macos-15
            target: aarch64-apple-darwin
            backend: metal
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            backend: cpu
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            backend: cpu
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            backend: cpu
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      MESH_RELEASE_COMMIT: ${{ needs.metadata.outputs.source_sha }}
      MODEL_URL: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/9e6855bc4be717fca1ef21360a1db4b29d5c559a/SmolLM2-135M-Instruct-Q8_0.gguf
      MODEL_SHA256: c4a3dd037301b6ecea31d6da37f5cd793ead920dd5ddfe6d589294628d6ce66a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Release binaries are compiled without the shared compiler cache.
      - name: Set the build environment
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE=$RUNNER_TEMP/mesh-release-attestation-private-key.json"
            echo "MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE=$RUNNER_TEMP/mesh-release-attestation-public-key.json"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      # Already committed for a real release; a canary applies it here.
      - name: Apply the release version
        run: scripts/release-version.sh "$RELEASE_TAG"

      - name: Download the default Skippy runtime for this platform
        id: runtime
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          runtime="$(cargo run --locked --quiet -p mesh-llm-system --example fetch-native-runtime -- "$RUNNER_TEMP/skippy-runtime-cache" | tail -n 1)"
          [[ -f "$runtime/manifest.json" ]] || { echo "no runtime manifest at $runtime" >&2; exit 1; }
          kind="$(jq -r '.runtime.backend.kind' "$runtime/manifest.json")"
          if [[ "$kind" != "$BACKEND" ]]; then
            echo "The installer chose a $kind runtime; this platform ships $BACKEND." >&2
            exit 1
          fi
          echo "MESH_LLM_NATIVE_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Build the host
        run: just release-build

      - name: Write the release signing keys
        env:
          SIGNING_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE }}
          PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
          CANARY: ${{ inputs.canary }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$PUBLIC_KEY" ]]; then
            if [[ "$CANARY" != "true" ]]; then
              echo "A release needs both release signing key secrets." >&2
              exit 1
            fi
            echo "Canary without signing keys: the host is packaged unsigned."
          fi
          printf '%s' "$SIGNING_KEY" > "$MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE"
          printf '%s' "$PUBLIC_KEY" > "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE"

      - name: Sign and package
        run: just release-bundle "$RELEASE_TAG" dist

      - name: Remove the signing key
        if: always()
        run: rm -f "$MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE"

      - name: Unpack the archive that will be published
        id: bundle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir unpacked
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd dist && sha256sum -c "mesh-llm-$RELEASE_TAG-$TARGET.zip.sha256")
            unzip -q "dist/mesh-llm-$RELEASE_TAG-$TARGET.zip" -d unpacked
            echo "host=unpacked/mesh-bundle/mesh-llm.exe" >> "$GITHUB_OUTPUT"
          else
            (cd dist && { sha256sum -c "mesh-llm-$RELEASE_TAG-$TARGET.tar.gz.sha256" 2>/dev/null || shasum -a 256 -c "mesh-llm-$RELEASE_TAG-$TARGET.tar.gz.sha256"; })
            tar -xzf "dist/mesh-llm-$RELEASE_TAG-$TARGET.tar.gz" -C unpacked
            echo "host=unpacked/mesh-bundle/mesh-llm" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the signature of the packaged host
        env:
          HOST: ${{ steps.bundle.outputs.host }}
          CANARY: ${{ inputs.canary }}
        run: |
          set -euo pipefail
          if [[ -s "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE" ]]; then
            status="$(cargo run --locked --quiet -p mesh-llm-release-attestation -- inspect --binary "$HOST" --public-key-file "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE" --json | jq -r .status)"
            expected=valid
          else
            status="$(cargo run --locked --quiet -p mesh-llm-release-attestation -- inspect --binary "$HOST" --json | jq -r .status)"
            expected=missing
          fi
          echo "release attestation: $status"
          [[ "$status" == "$expected" ]] || { echo "expected $expected" >&2; exit 1; }
          [[ "$status" == valid || "$CANARY" == "true" ]] || { echo "a release host must be signed" >&2; exit 1; }

      - name: Check the Linux glibc floor
        if: runner.os == 'Linux'
        env:
          HOST: ${{ steps.bundle.outputs.host }}
        run: |
          set -euo pipefail
          floor="$(grep -v '^#' scripts/linux-glibc-floor.txt | tr -d '[:space:]')"
          needed="$(objdump -T "$HOST" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
          echo "host needs glibc $needed; the declared floor is $floor"
          [[ "$(printf '%s\n%s\n' "$needed" "$floor" | sort -V | tail -n 1)" == "$floor" ]] ||
            { echo "host needs a newer glibc than scripts/linux-glibc-floor.txt allows" >&2; exit 1; }

      - name: Restore the test model
        if: runner.os != 'Windows'
        id: model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: smoke-model.gguf
          key: smoke-model-${{ env.MODEL_SHA256 }}
      - name: Download the test model
        if: runner.os != 'Windows' && steps.model.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 --max-time 600 -o smoke-model.gguf "$MODEL_URL"

      # Real inference from the unpacked archive: its host, its runtime.
      # Windows has no shell smoke yet; its host only has to report its version.
      - name: Run inference from the packaged archive
        if: runner.os != 'Windows'
        env:
          MESH_LLM_BIN: ${{ steps.bundle.outputs.host }}
        run: |
          set -euo pipefail
          echo "$MODEL_SHA256  smoke-model.gguf" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          scripts/ci-smoke-test.sh unpacked/mesh-bundle/native-runtimes smoke-model.gguf

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [metadata, runtime_download_gate, build]
    if: ${{ !inputs.canary }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag_commit: ${{ steps.tag.outputs.commit }}
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - name: Verify every archive against its checksum
        run: |
          set -euo pipefail
          cd release-artifacts
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -s "mesh-llm-$RELEASE_TAG-$target.tar.gz"
            test -s "mesh-llm-$target.tar.gz"
          done
          test -s "mesh-llm-$RELEASE_TAG-x86_64-pc-windows-msvc.zip"
          test -s "mesh-llm-x86_64-pc-windows-msvc.zip"
          for file in *; do
            [[ "$file" == *.sha256 ]] && continue
            test -s "$file.sha256" || { echo "$file has no checksum" >&2; exit 1; }
            sha256sum -c "$file.sha256"
          done
      - name: Push the release tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$existing" ]]; then
            echo "Release tag already exists and cannot be reused: $RELEASE_TAG" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG"
          echo "commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          previous_tag: ${{ needs.metadata.outputs.release_notes_base }}
          overwrite_files: false
          files: release-artifacts/*

  # Mesh-LLM/mesh-packaging publishes the container images, the npm package
  # and the Homebrew assets from a MeshLLM release.
  #
  # OFF until mesh-packaging is updated: its images-release.yml downloads
  # native-runtimes.json from the MeshLLM release and plans GPU images from
  # the GPU archives listed there. MeshLLM no longer publishes either (they
  # are Skippy's), so a dispatch today fails on the mesh-packaging side. Set
  # the repository variable MESH_PACKAGING_DISPATCH=true once it reads the
  # runtime catalog from the Skippy release.
  dispatch_packaging_release:
    name: Dispatch package and image publishing
    needs: [metadata, publish]
    if: ${{ vars.MESH_PACKAGING_DISPATCH == 'true' && needs.metadata.outputs.prerelease != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch the release to mesh-packaging
        env:
          GH_TOKEN: ${{ secrets.MESH_AGENT_IMAGES_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: Mesh-LLM/mesh-packaging
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG_COMMIT: ${{ needs.publish.outputs.tag_commit }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "MESH_AGENT_IMAGES_DISPATCH_TOKEN must grant Contents write access to $TARGET_REPOSITORY" >&2
            exit 1
          }
          [[ "$RELEASE_TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing published tag commit" >&2; exit 1; }
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg expected_mesh_sha "$RELEASE_TAG_COMMIT" \
            --arg correlation_id "mesh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{
              event_type: "mesh-llm-release",
              client_payload: {
                repository: $repository,
                ref: $ref,
                version: $version,
                expected_mesh_sha: $expected_mesh_sha,
                correlation_id: $correlation_id,
                dry_run: false,
                publish_images: true,
                publish_release_assets: true,
                publish_npm: true
              }
            }' |
            gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" --input -
