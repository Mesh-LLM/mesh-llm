name: Prepare CI controller
description: >
  Build only the narrow ci-controller executable on a GitHub-hosted Linux
  runner and export its absolute path as MESH_CI_CONTROLLER_BIN. It owns CI
  planning, lane result admission, and the planner-side repository checks
  (affected-crates, conventional-commits, llama-upstream-pin). It uses the
  pinned stable Rust toolchain and locked Cargo without just or compiler
  caches, restores an exact-key cached release executable, and compiles only
  on a miss; `automation bootstrap` then proves the executable is Cargo's build
  output and that no other workspace crate was compiled into it. The caller
  owns checkout; PR planning must check out protected code, never PR code.
  Jobs that need product, native, replay, canary, or release automation use
  prepare-automation or restore-automation instead.

outputs:
  binary_path:
    description: Absolute path to the built ci-controller executable.
    value: ${{ steps.bootstrap.outputs.binary_path }}

runs:
  using: composite
  steps:
    - name: Validate controller runner
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ENVIRONMENT" = github-hosted

    - name: Install pinned Rust toolchain
      id: rust_toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20

    # Exact key (no restore-keys) over every file compiled or linked into the
    # controller; it is separate from the full xtask executable's identity.
    - name: Restore CI controller binary
      id: controller_binary
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: target/release/ci-controller
        key: ci-controller-hosted-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', '.github/actions/prepare-ci-controller/action.yml', '.github/cache-version.txt', 'tools/ci-controller/**', 'scripts/cargo-linker-linux-*', 'scripts/lib/lld.sh') }}

    - name: Build CI controller
      id: bootstrap
      shell: bash
      env:
        CONTROLLER_CACHE_HIT: ${{ steps.controller_binary.outputs.cache-hit }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/ci-controller-bootstrap.txt"
        # Hosted runners have no sccache; bootstrap also runs Cargo.
        export RUSTC_WRAPPER='' CARGO_BUILD_RUSTC_WRAPPER=''
        if [[ "${CONTROLLER_CACHE_HIT:-}" != true || ! -x target/release/ci-controller ]]; then
          cargo build --locked --release -p ci-controller --bin ci-controller
        fi
        target/release/ci-controller automation bootstrap | tee "$report"
        binary_path="$(sed -n 's/^binary_path=//p' "$report")"
        test -x "$binary_path"
        echo "binary_path=$binary_path" >> "$GITHUB_OUTPUT"
        echo "MESH_CI_CONTROLLER_BIN=$binary_path" >> "$GITHUB_ENV"

    - name: Save CI controller binary
      if: steps.controller_binary.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: target/release/ci-controller
        key: ${{ steps.controller_binary.outputs.cache-primary-key }}
