name: Set up macOS build accelerators
description: >
  Install the required sccache and Homebrew lld tools on a macOS runner,
  then run the repository linker probe. Cargo links keep using the same
  repository driver afterwards.
  Deliberately uncached: mesh-llm's Actions cache is already over the 10GB
  per-repo quota (see gh cache list), so a ~1.9GB lld/llvm/z3 Cellar entry
  here would evict the far more expensive macOS Rust target/ cache for a
  15-30s bottle-pour saving. Revisit only with a measured number and a
  quota plan, not an assumption.

inputs:
  tool-source:
    description: Use preinstalled runner tools or install them through Homebrew.
    required: false
    default: homebrew

runs:
  using: composite
  steps:
    - name: Prepare required build tools
      shell: bash
      env:
        TOOL_SOURCE: ${{ inputs.tool-source }}
      run: |
        set -euo pipefail
        case "$TOOL_SOURCE" in
          homebrew)
            brew install lld
            if ! command -v sccache >/dev/null 2>&1; then
              brew install sccache
            fi
            ;;
          preinstalled)
            for tool in brew sccache; do
              command -v "$tool" >/dev/null 2>&1 || {
                echo "missing preinstalled build prerequisite: $tool; provision the runner before retrying" >&2
                exit 1
              }
            done
            lld_bin="$(brew --prefix lld)/bin"
            test -x "$lld_bin/ld64.lld" || {
              echo "missing preinstalled build prerequisite: ld64.lld; provision the runner before retrying" >&2
              exit 1
            }
            ;;
          *) echo "unsupported macOS tool source: $TOOL_SOURCE" >&2; exit 1 ;;
        esac

    - name: Verify repository build accelerators
      shell: bash
      run: |
        set -euo pipefail
        command -v sccache >/dev/null 2>&1
        sccache --version
        # A short, unique socket avoids both cross-account TCP-port collisions
        # and macOS's Unix-socket path limit in long runner workspaces.
        socket_dir="$(mktemp -d /tmp/mesh-sccache.XXXXXXXX)"
        export SCCACHE_SERVER_UDS="$socket_dir/server.sock"
        echo "SCCACHE_SERVER_UDS=$SCCACHE_SERVER_UDS" >> "$GITHUB_ENV"
        if [[ "${SCCACHE_GHA_ENABLED:-}" == "true" &&
              -z "${ACTIONS_CACHE_URL:-}" &&
              -z "${ACTIONS_RESULTS_URL:-}" ]]; then
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_CHAIN=disk" >> "$GITHUB_ENV"
          export SCCACHE_GHA_ENABLED=false
          export SCCACHE_MULTILEVEL_CHAIN=disk
        fi
        if [[ "${SCCACHE_MULTILEVEL_CHAIN:-}" == "disk" ]]; then
          cache_dir="${SCCACHE_DIR:-$RUNNER_TEMP/mesh-llm-sccache}"
          mkdir -p "$cache_dir"
          echo "SCCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
          export SCCACHE_DIR="$cache_dir"
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
        fi
        # Start the fresh endpoint in remote-cache modes too, before parallel
        # compiler clients can race to bind the same Unix socket.
        sccache --start-server
        lld_bin="$(brew --prefix lld)/bin"
        test -x "$lld_bin/ld64.lld"
        echo "$lld_bin" >> "$GITHUB_PATH"
        PATH="$lld_bin:$PATH" scripts/cargo-linker --mesh-probe >/dev/null
