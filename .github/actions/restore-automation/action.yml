name: Restore immutable repository automation
description: Verify upstream-built automation bytes without invoking a compiler or Cargo.
inputs:
  source_sha:
    description: Immutable automation source commit supplied by the declared producer dependency.
    required: true
runs:
  using: composite
  steps:
    - name: Download automation bytes
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: automation-${{ runner.os }}-${{ runner.arch }}-${{ inputs.source_sha }}
        path: ${{ runner.temp }}/immutable-automation
    - name: Verify and export automation
      shell: bash
      env:
        AUTOMATION_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/immutable-automation"
        binary=xtask
        if [[ "$RUNNER_OS" == Windows ]]; then binary=xtask.exe; fi
        test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum --strict -c SHA256SUMS
        else
          shasum -a 256 -c SHA256SUMS
        fi
        test "$(cat source.txt)" = "$AUTOMATION_SOURCE_SHA"
        test -s "$binary"
        chmod +x "$binary"
        binary_path="$PWD/$binary"
        if command -v cygpath >/dev/null 2>&1; then
          binary_path="$(cygpath -m "$binary_path")"
        fi
        printf 'MESH_LLM_AUTOMATION_BIN=%s\n' "$binary_path" >> "$GITHUB_ENV"
