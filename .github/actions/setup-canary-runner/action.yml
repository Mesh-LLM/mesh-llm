name: Set up canary certification runner
description: Verify preinstalled arm64 tooling for the runner's platform (Metal on macOS, CUDA on Linux); never install tools.
inputs:
  require-agent:
    description: Verify the Goose executable for a changed-pin candidate build.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Configure canary Git identity
    run: |
      git config --local user.name "mesh-llama-canary-bot"
      git config --local user.email "llama-canary-bot@meshllm.invalid"
    shell: bash
  - name: Verify runner toolchain (macOS)
    if: runner.os == 'macOS'
    run: |
      set -euo pipefail
      export RUSTUP_AUTO_INSTALL=0
      echo "RUSTUP_AUTO_INSTALL=0" >> "$GITHUB_ENV"
      source scripts/lib/macos-deployment-target.sh
      echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
      missing=0
      for cmd in cargo rustc just sccache jq python3 uv cmake ninja hf git-lfs lipo brew xcrun; do
        if ! command -v "$cmd" >/dev/null 2>&1; then
          echo "missing on family-certify image: $cmd" >&2
          missing=1
        fi
      done
      # Match scripts/check-skippy-generated-family-patch.sh: prefer the
      # pinned llvm@22, but accept any Homebrew LLVM that provides Clang
      # LibTooling (bin/clang + ClangConfig.cmake) so a runner image whose
      # pinned keg was rotated out does not fail the whole canary.
      llvm_prefix="$(brew --prefix llvm@22 2>/dev/null || true)"
      llvm_ok() {
        [[ -n "$1" && -x "$1/bin/clang" && -f "$1/lib/cmake/clang/ClangConfig.cmake" ]]
      }
      if ! llvm_ok "$llvm_prefix"; then
        echo "pinned llvm@22 missing or incomplete on the family-certify image; falling back to $(brew --prefix llvm 2>/dev/null || echo 'brew llvm')" >&2
        llvm_prefix="$(brew --prefix llvm 2>/dev/null || true)"
      fi
      if ! llvm_ok "$llvm_prefix"; then
        echo "no Homebrew LLVM with Clang LibTooling is installed on the family-certify image" >&2
        missing=1
      else
        echo "SKIPPY_REWRITER_LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
      fi
      git lfs install --force
      if (( missing == 1 )); then
        echo "bake the missing tools into the family-certify runner image; this job installs nothing" >&2
        exit 1
      fi
    shell: bash
  - name: Verify runner toolchain (Linux)
    if: runner.os == 'Linux'
    run: |
      set -euo pipefail
      export RUSTUP_AUTO_INSTALL=0
      echo "RUSTUP_AUTO_INSTALL=0" >> "$GITHUB_ENV"
      missing=0
      for cmd in cargo rustc just sccache jq python3 uv cmake ninja hf git-lfs clang ld.lld pkg-config git; do
        if ! command -v "$cmd" >/dev/null 2>&1; then
          echo "missing on family-certify image: $cmd" >&2
          missing=1
        fi
      done
      # Mirror the macOS policy: prefer the pinned major (llvm-22), then accept
      # any system LLVM that provides Clang LibTooling, newest first.
      llvm_ok() {
        [[ -n "$1" && -x "$1/bin/clang" && -f "$1/lib/cmake/clang/ClangConfig.cmake" ]]
      }
      llvm_prefix=""
      if llvm_ok /usr/lib/llvm-22; then
        llvm_prefix=/usr/lib/llvm-22
      else
        for candidate in $(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V -r); do
          if llvm_ok "$candidate"; then
            llvm_prefix="$candidate"
            break
          fi
        done
      fi
      if [[ -z "$llvm_prefix" ]]; then
        echo "no system LLVM with Clang LibTooling is installed on the family-certify image" >&2
        missing=1
      else
        echo "SKIPPY_REWRITER_LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
      fi
      # The stage backend on Linux is CUDA; the image must carry a working
      # toolkit and driver, and the architecture list feeds the llama.cpp build.
      if ! command -v nvidia-smi >/dev/null 2>&1 || ! nvidia-smi >/dev/null 2>&1; then
        echo "family-certify Linux image has no functional NVIDIA driver" >&2
        missing=1
      fi
      if ! command -v nvcc >/dev/null 2>&1; then
        echo "missing on family-certify image: nvcc" >&2
        missing=1
      elif [[ -z "${SKIPPY_CUDA_ARCHITECTURES:-}" ]]; then
        cuda_arch="$(scripts/detect-cuda-arch.sh)" || {
          echo "could not detect CUDA architectures on the family-certify image" >&2
          missing=1
        }
        if [[ -n "${cuda_arch:-}" ]]; then
          echo "SKIPPY_CUDA_ARCHITECTURES=$cuda_arch" >> "$GITHUB_ENV"
        fi
      fi
      git lfs install --force
      if (( missing == 1 )); then
        echo "bake the missing tools into the family-certify runner image; this job installs nothing" >&2
        exit 1
      fi
    shell: bash
  - name: Verify changed-pin agent executable
    if: ${{ inputs.require-agent == 'true' }}
    run: |
      set -euo pipefail
      goose_dir="$HOME/.local/bin"
      export PATH="$goose_dir:$PATH"
      echo "$goose_dir" >> "$GITHUB_PATH"
      if ! command -v goose >/dev/null 2>&1; then
        echo "missing on family-certify image: goose" >&2
        exit 1
      fi
      goose_status=0
      goose_version="$(goose --version 2>&1)" || goose_status=$?
      if (( goose_status != 0 )); then
        echo "goose failed its executable preflight with status $goose_status; repair the family-certify runner installation" >&2
        exit 1
      fi
      if [[ -z "$goose_version" ]]; then
        echo "goose returned no version; repair the family-certify runner installation" >&2
        exit 1
      fi
      echo "goose version: $goose_version"
    shell: bash
  - name: Isolate compiler cache identity (macOS)
    if: runner.os == 'macOS'
    run: |
      set -euo pipefail
      SCCACHE_DIR="${SCCACHE_DIR:-$HOME/Library/Caches/mesh-llm/sccache/llama-canary-arm64}"
      export SCCACHE_DIR
      echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
      mkdir -p "$SCCACHE_DIR"
      cache_buster="$({
        printf '%s\n' 'platform=macos' 'architecture=arm64' 'backend=metal' 'profile=release' 'cmake-osx-architectures=arm64'
        printf 'macos-deployment-target=%s\n' "$MACOSX_DEPLOYMENT_TARGET"
        rustc -vV
        cc --version
        xcrun --show-sdk-path
        xcrun --show-sdk-build-version
        git -C "${CANARY_SOURCE_ROOT:-$PWD}" ls-files -s -- .cargo/config.toml scripts/build-llama.sh scripts/package-native-runtime.sh skippy/scripts/build-llama.sh skippy/scripts/package-native-runtime.sh skippy/llama_cpp/upstream.txt skippy/llama_cpp/patches
      } | shasum -a 256 | awk '{print $1}')"
      echo "SCCACHE_C_CUSTOM_CACHE_BUSTER=$cache_buster" >> "$GITHUB_ENV"
      # prepare-automation's macOS accelerator setup starts the job-owned
      # cache server before its first compiler probe.
    shell: bash
  - name: Isolate compiler cache identity (Linux)
    if: runner.os == 'Linux'
    run: |
      set -euo pipefail
      SCCACHE_DIR="${SCCACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/mesh-llm/sccache/llama-canary-aarch64}"
      export SCCACHE_DIR
      echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
      mkdir -p "$SCCACHE_DIR"
      cache_buster="$({
        printf '%s\n' 'platform=linux' 'architecture=aarch64' 'backend=cuda' 'profile=release'
        printf 'cuda-architectures=%s\n' "${SKIPPY_CUDA_ARCHITECTURES:-}"
        rustc -vV
        cc --version
        nvcc --version
        git -C "${CANARY_SOURCE_ROOT:-$PWD}" ls-files -s -- .cargo/config.toml scripts/build-llama.sh scripts/package-native-runtime.sh skippy/scripts/build-llama.sh skippy/scripts/package-native-runtime.sh skippy/llama_cpp/upstream.txt skippy/llama_cpp/patches
      } | sha256sum | awk '{print $1}')"
      echo "SCCACHE_C_CUSTOM_CACHE_BUSTER=$cache_buster" >> "$GITHUB_ENV"
    shell: bash
