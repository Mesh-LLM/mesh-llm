name: Restore smoke inputs
description: Restore a built mesh-llm artifact and optional cached smoke model.

inputs:
  artifact_name:
    description: GitHub Actions artifact containing the mesh-llm binary.
    required: true
  artifact_path:
    description: Directory where the artifact is downloaded.
    required: true
  binary_name:
    description: Binary name inside the downloaded artifact.
    required: false
    default: mesh-llm
  staged_binary_path:
    description: Destination path for the executable binary used by smoke scripts.
    required: true
  model_url:
    description: Model URL to download when the model cache misses.
    required: false
    default: ''
  model_file:
    description: Model filename under ~/.models.
    required: false
    default: ''
  model_cache_scope:
    description: Cache scope shared by smoke lanes that can reuse the same model.
    required: false
    default: smoke-model
  cache_key_prefix:
    description: Optional cache key prefix.
    required: false
    default: ''
  save_model_cache:
    description: Whether to save model cache misses.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download built mesh-llm artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_path }}

    - name: Extract and verify composed product
      shell: bash
      run: |
        set -euo pipefail
        artifact_path="${{ inputs.artifact_path }}"
        archive=""
        archive_count=0
        while IFS= read -r candidate; do
          archive="$candidate"
          archive_count=$((archive_count + 1))
        done < <(find "$artifact_path" -mindepth 1 -maxdepth 1 -type f -name '*.tar.gz' -print)
        if [[ "$archive_count" -ne 1 ]]; then
          echo "expected exactly one composed product archive in $artifact_path; found $archive_count" >&2
          exit 1
        fi
        tar -xzf "$archive" -C "$artifact_path"
        rm -f -- "$archive"

        product_manifest="$artifact_path/product-manifest.json"
        test -s "$product_manifest"
        IFS=$'\t' read -r version backend host_path runtime_path < <(
          python3 - "$product_manifest" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            manifest = json.load(handle)
        print(
            manifest["mesh_version"],
            manifest["backend"],
            manifest["host"]["path"],
            manifest["runtime"]["path"],
            sep="\t",
        )
        PY
        )
        scripts/verify-native-runtime-package.sh "$artifact_path/$runtime_path"
        python3 scripts/compose-product-bundle.py \
          --bundle "$artifact_path" \
          --host "$artifact_path/$host_path" \
          --runtime "$artifact_path/$runtime_path" \
          --version "$version" \
          --backend "$backend" \
          --check

    - name: Stage mesh-llm binary
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${{ inputs.staged_binary_path }}")"
        cp "${{ inputs.artifact_path }}/${{ inputs.binary_name }}" "${{ inputs.staged_binary_path }}"
        chmod +x "${{ inputs.staged_binary_path }}"
        test -x "${{ inputs.staged_binary_path }}"

    - name: Stage packaged native runtime
      shell: bash
      run: |
        set -euo pipefail
        source_runtime_root="${{ inputs.artifact_path }}/native-runtimes"
        staged_runtime_root="$(dirname "${{ inputs.staged_binary_path }}")/native-runtimes"
        [[ -d "$source_runtime_root" ]] || {
          echo "artifact does not contain native-runtimes: $source_runtime_root" >&2
          exit 1
        }
        rm -rf "$staged_runtime_root"
        cp -a "$source_runtime_root" "$staged_runtime_root"
        find "$staged_runtime_root" -type f -name manifest.json -print -quit | grep -q . || {
          echo "staged native runtime has no manifest.json: $staged_runtime_root" >&2
          exit 1
        }

    - name: Restore integration model cache
      if: ${{ inputs.model_url != '' && inputs.model_file != '' }}
      id: cache-model
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.models/${{ inputs.model_file }}
        key: ${{ inputs.cache_key_prefix }}mesh-llm-${{ runner.os }}-${{ inputs.model_cache_scope }}-${{ inputs.model_file }}-${{ hashFiles('.github/cache-version.txt') }}
        restore-keys: |
          ${{ inputs.cache_key_prefix }}mesh-llm-${{ runner.os }}-${{ inputs.model_cache_scope }}-${{ inputs.model_file }}-

    - name: Check restored integration model
      if: ${{ inputs.model_url != '' && inputs.model_file != '' }}
      id: model-file
      shell: bash
      run: |
        set -euo pipefail
        model_path="$HOME/.models/${{ inputs.model_file }}"
        if [[ -s "$model_path" ]]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download integration model
      if: ${{ inputs.model_url != '' && inputs.model_file != '' && steps.model-file.outputs.present != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.models
        retry_attempts="${MODEL_DOWNLOAD_RETRY_ATTEMPTS:-12}"
        retry_delay="${MODEL_DOWNLOAD_RETRY_DELAY_SECS:-20}"
        retry_max_time="${MODEL_DOWNLOAD_RETRY_MAX_TIME_SECS:-600}"
        token="${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-}}"
        curl_args=(
          --fail --location --show-error
          --retry "$retry_attempts"
          --retry-delay "$retry_delay"
          --retry-max-time "$retry_max_time"
          --retry-all-errors
        )
        if [[ -n "$token" ]]; then
          curl_args+=(--header "Authorization: Bearer ${token}")
        fi
        output="$HOME/.models/${{ inputs.model_file }}"
        partial="${output}.download"
        rm -f "$partial"
        curl "${curl_args[@]}" \
          "${{ inputs.model_url }}" \
          -o "$partial"
        mv "$partial" "$output"
        ls -lh "$output"

    - name: Save integration model cache
      if: ${{ inputs.model_url != '' && inputs.model_file != '' && inputs.save_model_cache == 'true' && steps.cache-model.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.models/${{ inputs.model_file }}
        key: ${{ steps.cache-model.outputs.cache-primary-key }}
