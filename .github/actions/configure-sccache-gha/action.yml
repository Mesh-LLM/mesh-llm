name: Configure baked sccache remote backend
description: Prefer Depot WebDAV, then Actions cache, with a job-local disk fallback.

inputs:
  allow_depot_remote_cache:
    description: Allow this trusted job to read and write Depot's repository-scoped WebDAV cache.
    required: false
    default: "false"
  allow_native_github_cache:
    description: Allow this job to use GitHub Actions cache as an sccache backend.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Export cache credentials and start sccache
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        INPUT_ALLOW_DEPOT_REMOTE_CACHE: ${{ inputs.allow_depot_remote_cache }}
        INPUT_ALLOW_NATIVE_GITHUB_CACHE: ${{ inputs.allow_native_github_cache }}
        DISPATCH_ORIGINAL_EVENT_NAME: ${{ github.event.inputs.original_event_name || '' }}
      with:
        script: |
          const allowDepotRemoteCache =
            (process.env.INPUT_ALLOW_DEPOT_REMOTE_CACHE || '').toLowerCase();
          if (
            allowDepotRemoteCache !== 'true' &&
            allowDepotRemoteCache !== 'false'
          ) {
            core.setFailed(
              'allow_depot_remote_cache must be the string true or false.',
            );
            return;
          }
          const allowNativeGithubCache =
            (process.env.INPUT_ALLOW_NATIVE_GITHUB_CACHE || '').toLowerCase();
          if (
            allowNativeGithubCache !== 'true' &&
            allowNativeGithubCache !== 'false'
          ) {
            core.setFailed(
              'allow_native_github_cache must be the string true or false.',
            );
            return;
          }

          const eventName = process.env.GITHUB_EVENT_NAME || '';
          const effectiveEventName =
            eventName === 'workflow_dispatch' &&
            process.env.DISPATCH_ORIGINAL_EVENT_NAME
              ? process.env.DISPATCH_ORIGINAL_EVENT_NAME
              : eventName;
          const ghaRemoteMode =
            effectiveEventName === 'pull_request' ||
            effectiveEventName === 'pull_request_target'
              ? 'READ_ONLY'
              : 'READ_WRITE';
          core.exportVariable('SCCACHE_GHA_RW_MODE', ghaRemoteMode);

          const webdavEndpoint = process.env.SCCACHE_WEBDAV_ENDPOINT || '';
          const webdavToken =
            process.env.SCCACHE_WEBDAV_TOKEN ||
            process.env.DEPOT_CACHE_TOKEN ||
            '';
          const diskCacheDirectory =
            process.env.SCCACHE_DIR ||
            (process.env.RUNNER_TEMP
              ? `${process.env.RUNNER_TEMP}/mesh-llm-sccache`
              : '');
          if (!diskCacheDirectory) {
            core.setFailed(
              'SCCACHE_DIR or RUNNER_TEMP is required for the job-local disk cache.',
            );
            return;
          }
          await io.mkdirP(diskCacheDirectory);
          core.exportVariable('SCCACHE_DIR', diskCacheDirectory);
          const diskOnlyEnvironment = () => ({
            ...process.env,
            ACTIONS_CACHE_URL: '',
            ACTIONS_RESULTS_URL: '',
            ACTIONS_RUNTIME_TOKEN: '',
            SCCACHE_WEBDAV_ENDPOINT: '',
            SCCACHE_WEBDAV_TOKEN: '',
            SCCACHE_WEBDAV_USERNAME: '',
            SCCACHE_WEBDAV_PASSWORD: '',
            SCCACHE_DIR: diskCacheDirectory,
          });
          const resetStatistics = async (environment = process.env) => {
            const resetExitCode = await exec.exec(
              'sccache',
              ['--zero-stats'],
              {
                env: environment,
                ignoreReturnCode: true,
              },
            );
            if (resetExitCode !== 0) {
              core.setFailed(
                'Unable to reset sccache statistics after configuring the server.',
              );
              return false;
            }
            return true;
          };

          if (
            allowDepotRemoteCache === 'true' &&
            webdavEndpoint &&
            webdavToken
          ) {
            core.setSecret(webdavToken);
            core.exportVariable('SCCACHE_WEBDAV_ENDPOINT', webdavEndpoint);
            core.exportVariable('SCCACHE_WEBDAV_TOKEN', webdavToken);
            core.exportVariable('SCCACHE_GHA_ENABLED', 'false');
            core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk,webdav');
            core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
            // sccache's ignore/l0 policies dispatch slower-level writes in the
            // background. Ephemeral CI jobs can exit before those uploads
            // finish, leaving a permanently partial remote cache. The all
            // policy waits for every configured level before the compiler
            // request completes; cache failures remain visible in the
            // captured counters.
            core.exportVariable('SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY', 'all');
            await exec.exec('sccache', ['--stop-server'], {
              ignoreReturnCode: true,
            });
            const depotExitCode = await exec.exec('sccache', ['--start-server'], {
              ignoreReturnCode: true,
            });
            if (depotExitCode === 0) {
              if (!(await resetStatistics())) {
                return;
              }
              core.info(
                'Baked sccache is using job-local disk with Depot WebDAV cache.',
              );
              return;
            }
            core.warning(
              'Depot WebDAV cache is unavailable; restarting baked sccache with job-local disk.',
            );
            await exec.exec('sccache', ['--stop-server'], {
              ignoreReturnCode: true,
            });
            core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk');
            const depotFallbackExitCode = await exec.exec(
              'sccache',
              ['--start-server'],
              {
                env: diskOnlyEnvironment(),
                ignoreReturnCode: true,
              },
            );
            if (depotFallbackExitCode !== 0) {
              core.setFailed('Unable to start baked sccache with Depot or job-local storage.');
              return;
            }
            if (!(await resetStatistics(diskOnlyEnvironment()))) {
              return;
            }
            return;
          }

          if (
            allowNativeGithubCache === 'false' ||
            (allowDepotRemoteCache === 'false' &&
              (webdavEndpoint || webdavToken))
          ) {
            core.info(
              allowNativeGithubCache === 'false'
                ? 'Native GitHub and Depot cache disabled for this trust context; using job-local disk only.'
                : 'Depot cache is present but disabled for this trust context; using job-local disk only.',
            );
            core.exportVariable('SCCACHE_WEBDAV_ENDPOINT', '');
            core.exportVariable('SCCACHE_WEBDAV_TOKEN', '');
            core.exportVariable('SCCACHE_WEBDAV_USERNAME', '');
            core.exportVariable('SCCACHE_WEBDAV_PASSWORD', '');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'false');
            core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk');
            core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
            await exec.exec('sccache', ['--stop-server'], {
              ignoreReturnCode: true,
            });
            const untrustedDiskOnlyExitCode = await exec.exec(
              'sccache',
              ['--start-server'],
              {
                env: diskOnlyEnvironment(),
                ignoreReturnCode: true,
              },
            );
            if (untrustedDiskOnlyExitCode !== 0) {
              core.setFailed(
                'Unable to start baked sccache with its trust-isolated disk cache.',
              );
              return;
            }
            if (!(await resetStatistics(diskOnlyEnvironment()))) {
              return;
            }
            return;
          }

          // Honor an explicit job-level opt-out of the GitHub Actions cache
          // backend. Long-running lanes (CUDA/ROCm/Vulkan release builds that
          // exceed the ephemeral Actions cache token lifetime) and high-fanout
          // GitHub-hosted compiler shards set SCCACHE_GHA_ENABLED=false. For
          // long-running lanes, an sccache server started after the token
          // expires probes the gha tier at startup and that storage read fails
          // permanently (HTTP 400), aborting the build before any fail-open
          // policy applies. High-fanout shards avoid a repository-wide storm of
          // duplicate per-object writes while their bulk target caches retain
          // persistent reuse. Clearing the cache URL/token for the server
          // process also prevents residual gha configuration from re-enabling
          // the remote tier. Do not clear them job-wide: later actions/cache
          // consumers still need their credentials.
          if ((process.env.SCCACHE_GHA_ENABLED || '').toLowerCase() === 'false') {
            core.info(
              'SCCACHE_GHA_ENABLED=false is set; using baked sccache with disk-only cache.',
            );
            core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk');
            core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
            await exec.exec('sccache', ['--stop-server'], {
              ignoreReturnCode: true,
            });
            const diskOnlyExitCode = await exec.exec(
              'sccache',
              ['--start-server'],
              {
                env: diskOnlyEnvironment(),
                ignoreReturnCode: true,
              },
            );
            if (diskOnlyExitCode !== 0) {
              core.setFailed('Unable to start baked sccache with its disk-only cache.');
              return;
            }
            if (!(await resetStatistics(diskOnlyEnvironment()))) {
              return;
            }
            return;
          }

          // The runner image's pinned sccache treats a mixed disk,gha chain as
          // wholly read-only when the GHA tier is read-only. Each miss then
          // records a rejected cache write and cannot populate L0. Pull
          // requests therefore use the writable job-local disk tier only.
          // Cross-run PR reuse remains covered by the bulk Rust and exact
          // native actions/cache entries, while trusted main, release, warmer,
          // and authorized dispatch jobs populate the remote compiler cache
          // without exposing a repository-scoped write path to PR code.
          if (ghaRemoteMode === 'READ_ONLY') {
            core.info(
              'Pull-request trust context detected; using baked sccache with job-local disk only.',
            );
            core.exportVariable('SCCACHE_GHA_ENABLED', 'false');
            core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk');
            core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
            await exec.exec('sccache', ['--stop-server'], {
              ignoreReturnCode: true,
            });
            const pullRequestDiskExitCode = await exec.exec(
              'sccache',
              ['--start-server'],
              {
                env: diskOnlyEnvironment(),
                ignoreReturnCode: true,
              },
            );
            if (pullRequestDiskExitCode !== 0) {
              core.setFailed(
                'Unable to start baked sccache with its pull-request-local disk cache.',
              );
              return;
            }
            if (!(await resetStatistics(diskOnlyEnvironment()))) {
              return;
            }
            return;
          }

          const cacheUrl = process.env.ACTIONS_CACHE_URL || '';
          const resultsUrl = process.env.ACTIONS_RESULTS_URL || '';
          const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN || '';

          if (runtimeToken) {
            core.setSecret(runtimeToken);
          }

          core.exportVariable('ACTIONS_CACHE_URL', cacheUrl);
          core.exportVariable('ACTIONS_RESULTS_URL', resultsUrl);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken);
          core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
          core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk,gha');
          // Wait for the GitHub Actions tier to finish each write. With the
          // asynchronous policies, the runner can terminate while L1 uploads
          // are still pending and the next identical run observes avoidable
          // misses.
          core.exportVariable('SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY', 'all');

          await exec.exec('sccache', ['--stop-server'], {
            ignoreReturnCode: true,
          });
          core.exportVariable('SCCACHE_GHA_ENABLED', 'true');

          const remoteExitCode = await exec.exec('sccache', ['--start-server'], {
            ignoreReturnCode: true,
          });
          if (remoteExitCode === 0) {
            if (!(await resetStatistics())) {
              return;
            }
            core.info(
              `Baked sccache is using job-local disk with a ${ghaRemoteMode.toLowerCase()} GitHub Actions cache.`,
            );
            return;
          }

          core.warning(
            'GitHub Actions cache is unavailable; restarting baked sccache with its job-local disk cache.',
          );
          await exec.exec('sccache', ['--stop-server'], {
            ignoreReturnCode: true,
          });
          core.exportVariable('SCCACHE_GHA_ENABLED', 'false');
          core.exportVariable('SCCACHE_MULTILEVEL_CHAIN', 'disk');

          const localExitCode = await exec.exec(
            'sccache',
            ['--start-server'],
            {
              env: diskOnlyEnvironment(),
              ignoreReturnCode: true,
            },
          );
          if (localExitCode !== 0) {
            core.setFailed('Unable to start baked sccache with either remote or job-local storage.');
            return;
          }
          await resetStatistics(diskOnlyEnvironment());
