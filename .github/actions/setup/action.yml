name: Set up the build
description: Rust, sccache, just, and the linkers that .cargo/config.toml expects.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      with:
        components: rustfmt, clippy, llvm-tools-preview
    # sccache 0.17+ expands Cargo's rustc argument file and overflows the
    # Windows command-line limit (mozilla/sccache#2787).
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.16.0
    - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
    - name: Install Linux build packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev mold lld jq lsof
    - name: Install macOS linker
      if: runner.os == 'macOS'
      shell: bash
      run: brew install lld
    - name: Turn on the GitHub sccache backend
      shell: bash
      run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
