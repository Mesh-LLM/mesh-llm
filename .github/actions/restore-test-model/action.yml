name: Restore test model
description: >
  Resolve one immutable test model from a manifest, restore it from cache,
  download it on a miss, and verify its integrity. Extracted from
  restore-smoke-inputs so a lane that needs a model but not a built product
  artifact does not have to reimplement the resolve/cache/download/verify
  sequence -- two copies of it would drift.

inputs:
  model_url:
    description: Model URL to download when the model cache misses.
    required: false
    default: ''
  model_file:
    description: Model filename under ~/.models.
    required: false
    default: ''
  model_manifest:
    description: Generated test-model manifest containing the model artifact.
    required: false
    default: ''
  model_artifact_id:
    description: >
      Artifact id to select when the manifest holds more than one. Omit for a
      single-artifact manifest.
    required: false
    default: ''
  model_cadence:
    description: Registry cadence authorized for this workflow invocation.
    required: false
    default: ''
  model_cache_scope:
    description: Cache scope shared by lanes that can reuse the same model.
    required: false
    default: smoke-model
  cache_key_prefix:
    description: Optional cache key prefix.
    required: false
    default: ''
  save_model_cache:
    description: Whether a cache miss should be saved back.
    required: false
    default: 'false'

outputs:
  model_url:
    description: Immutable model download URL resolved from the manifest.
    value: ${{ steps.resolve-model.outputs.url }}
  model_file:
    description: Immutable model filename resolved from the manifest.
    value: ${{ steps.resolve-model.outputs.file }}
  model_sha256:
    description: Expected model SHA-256, when supplied by the manifest.
    value: ${{ steps.resolve-model.outputs.sha256 }}
  model_size_bytes:
    description: Expected model size, when supplied by the manifest.
    value: ${{ steps.resolve-model.outputs.size_bytes }}
  model_path:
    description: Absolute path to the restored model, empty when none was requested.
    value: ${{ steps.model-path.outputs.path }}

runs:
  using: composite
  steps:
    - name: Resolve immutable test model
      id: resolve-model
      shell: bash
      env:
        MODEL_MANIFEST: ${{ inputs.model_manifest }}
        MODEL_ARTIFACT_ID: ${{ inputs.model_artifact_id }}
        MODEL_CADENCE: ${{ inputs.model_cadence }}
        INPUT_MODEL_URL: ${{ inputs.model_url }}
        INPUT_MODEL_FILE: ${{ inputs.model_file }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_MODEL_URL" || -n "$INPUT_MODEL_FILE" ]]; then
          if [[ -z "$INPUT_MODEL_URL" || -z "$INPUT_MODEL_FILE" ]]; then
            echo "model_url and model_file must be supplied together" >&2
            exit 2
          fi
          if [[ ! "$INPUT_MODEL_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "model_file must be a safe single filename" >&2
            exit 2
          fi
          {
            printf 'url=%s\n' "$INPUT_MODEL_URL"
            printf 'file=%s\n' "$INPUT_MODEL_FILE"
            printf 'sha256=\n'
            printf 'size_bytes=\n'
          } >> "$GITHUB_OUTPUT"
        elif [[ -n "$MODEL_MANIFEST" ]]; then
          if [[ -z "$MODEL_CADENCE" ]]; then
            echo "model_cadence is required with model_manifest" >&2
            exit 2
          fi
          # Only the optional artifact selector goes through an array.
          # `--cadence` stays literal on the invocation: every manifest
          # consumer must declare the cadence it is authorized for, and
          # `scripts/tests/test_model_artifact_registry.py` checks that by
          # reading the call site.
          artifact_args=()
          if [[ -n "$MODEL_ARTIFACT_ID" ]]; then
            artifact_args+=(--artifact-id "$MODEL_ARTIFACT_ID")
          fi
          python3 scripts/resolve-test-model-manifest.py \
            "$MODEL_MANIFEST" \
            --cadence "$MODEL_CADENCE" \
            --require-single-file \
            "${artifact_args[@]+"${artifact_args[@]}"}" \
            --github-output "$GITHUB_OUTPUT"
        else
          {
            printf 'url=\n'
            printf 'file=\n'
            printf 'sha256=\n'
            printf 'size_bytes=\n'
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Restore integration model cache
      if: ${{ steps.resolve-model.outputs.url != '' && steps.resolve-model.outputs.file != '' }}
      id: cache-model
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.models/${{ steps.resolve-model.outputs.file }}
        key: ${{ inputs.cache_key_prefix }}mesh-llm-${{ runner.os }}-${{ inputs.model_cache_scope }}-${{ steps.resolve-model.outputs.file }}-${{ steps.resolve-model.outputs.sha256 || 'unverified' }}-${{ hashFiles('.github/cache-version.txt') }}

    - name: Check restored integration model
      if: ${{ steps.resolve-model.outputs.url != '' && steps.resolve-model.outputs.file != '' }}
      id: model-file
      shell: bash
      env:
        MODEL_FILE: ${{ steps.resolve-model.outputs.file }}
      run: |
        set -euo pipefail
        model_path="$HOME/.models/$MODEL_FILE"
        if [[ -s "$model_path" ]]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download integration model
      if: ${{ steps.resolve-model.outputs.url != '' && steps.resolve-model.outputs.file != '' && steps.model-file.outputs.present != 'true' }}
      shell: bash
      env:
        MODEL_FILE: ${{ steps.resolve-model.outputs.file }}
        MODEL_URL: ${{ steps.resolve-model.outputs.url }}
      run: |
        set -euo pipefail
        mkdir -p ~/.models
        retry_attempts="${MODEL_DOWNLOAD_RETRY_ATTEMPTS:-12}"
        retry_delay="${MODEL_DOWNLOAD_RETRY_DELAY_SECS:-20}"
        retry_max_time="${MODEL_DOWNLOAD_RETRY_MAX_TIME_SECS:-600}"
        token="${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-}}"
        curl_args=(
          --fail --location --show-error
          --retry "$retry_attempts"
          --retry-delay "$retry_delay"
          --retry-max-time "$retry_max_time"
          --retry-all-errors
        )
        if [[ -n "$token" ]]; then
          curl_args+=(--header "Authorization: Bearer ${token}")
        fi
        output="$HOME/.models/$MODEL_FILE"
        partial="${output}.download"
        rm -f "$partial"
        curl "${curl_args[@]}" \
          "$MODEL_URL" \
          -o "$partial"
        mv "$partial" "$output"
        ls -lh "$output"

    - name: Verify integration model integrity
      if: ${{ steps.resolve-model.outputs.sha256 != '' && steps.resolve-model.outputs.file != '' }}
      shell: bash
      env:
        MODEL_ARTIFACT_ID: ${{ inputs.model_artifact_id }}
        MODEL_CADENCE: ${{ inputs.model_cadence }}
        MODEL_FILE: ${{ steps.resolve-model.outputs.file }}
        MODEL_MANIFEST: ${{ inputs.model_manifest }}
        MODEL_URL: ${{ steps.resolve-model.outputs.url }}
      run: |
        set -euo pipefail
        test -n "$MODEL_FILE"
        test -n "$MODEL_URL"
        artifact_args=()
        if [[ -n "$MODEL_ARTIFACT_ID" ]]; then
          artifact_args+=(--artifact-id "$MODEL_ARTIFACT_ID")
        fi
        python3 scripts/resolve-test-model-manifest.py \
          "$MODEL_MANIFEST" \
          --cadence "$MODEL_CADENCE" \
          --require-single-file \
          "${artifact_args[@]+"${artifact_args[@]}"}" \
          --verify-root "$HOME/.models"

    - name: Save integration model cache
      if: ${{ steps.resolve-model.outputs.url != '' && steps.resolve-model.outputs.file != '' && inputs.save_model_cache == 'true' && steps.cache-model.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.models/${{ steps.resolve-model.outputs.file }}
        key: ${{ steps.cache-model.outputs.cache-primary-key }}

    - name: Publish resolved model path
      id: model-path
      shell: bash
      env:
        MODEL_FILE: ${{ steps.resolve-model.outputs.file }}
      run: |
        set -euo pipefail
        if [[ -n "$MODEL_FILE" ]]; then
          printf 'path=%s\n' "$HOME/.models/$MODEL_FILE" >> "$GITHUB_OUTPUT"
        else
          printf 'path=\n' >> "$GITHUB_OUTPUT"
        fi
