name: Audit PR authority with verified protected automation
description: Admit exact protected same-run automation bytes before checking PR runner authority.
inputs:
  source_sha:
    description: Protected producer source commit, never the selected PR source.
    required: true
  artifact_id:
    description: Immutable artifact ID from the declared same-run protected producer.
    required: true
  binary_sha256:
    description: Independent executable digest output by that producer.
    required: true
  producer_os:
    description: Native producer runner OS, Linux, macOS, or Windows.
    required: true
  producer_arch:
    description: Native producer runner architecture, X64 or ARM64.
    required: true
  original_event_name:
    description: Original event used to derive the trust boundary.
    required: false
    default: ''
  depot_selected:
    description: Centralized runner policy's provider selection.
    required: true
  allow_native_github_cache:
    description: Centralized cache policy's native cache permission.
    required: true
  allow_depot_remote_cache:
    description: Centralized cache policy's remote cache permission.
    required: true
runs:
  using: composite
  steps:
    - name: Admit automation download identity
      shell: bash
      env:
        AUTOMATION_SOURCE_SHA: ${{ inputs.source_sha }}
        AUTOMATION_ARTIFACT_ID: ${{ inputs.artifact_id }}
        AUTOMATION_BINARY_SHA256: ${{ inputs.binary_sha256 }}
        AUTOMATION_PRODUCER_OS: ${{ inputs.producer_os }}
        AUTOMATION_PRODUCER_ARCH: ${{ inputs.producer_arch }}
      run: |
        set -euo pipefail
        [[ "$RUNNER_OS" == Linux || "$RUNNER_OS" == macOS || "$RUNNER_OS" == Windows ]] || exit 1
        [[ "$RUNNER_ARCH" == X64 || "$RUNNER_ARCH" == ARM64 ]] || exit 1
        [[ "$AUTOMATION_PRODUCER_OS" == "$RUNNER_OS" ]] || exit 1
        [[ "$AUTOMATION_PRODUCER_ARCH" == "$RUNNER_ARCH" ]] || exit 1
        [[ "$AUTOMATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
        [[ "$AUTOMATION_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
        [[ "$AUTOMATION_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
        mkdir "$RUNNER_TEMP/immutable-automation-restored"
    - name: Download automation bytes
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        merge-multiple: true
        path: ${{ runner.temp }}/immutable-automation-restored
    - name: Verify protected automation without executing it
      shell: bash
      env:
        AUTOMATION_SOURCE_SHA: ${{ inputs.source_sha }}
        AUTOMATION_ARTIFACT_ID: ${{ inputs.artifact_id }}
        AUTOMATION_BINARY_SHA256: ${{ inputs.binary_sha256 }}
        AUTOMATION_PRODUCER_OS: ${{ inputs.producer_os }}
        AUTOMATION_PRODUCER_ARCH: ${{ inputs.producer_arch }}
      run: |
        set -euo pipefail
        [[ "$RUNNER_OS" == Linux || "$RUNNER_OS" == macOS || "$RUNNER_OS" == Windows ]] || exit 1
        [[ "$RUNNER_ARCH" == X64 || "$RUNNER_ARCH" == ARM64 ]] || exit 1
        [[ "$AUTOMATION_PRODUCER_OS" == "$RUNNER_OS" ]] || exit 1
        [[ "$AUTOMATION_PRODUCER_ARCH" == "$RUNNER_ARCH" ]] || exit 1
        [[ "$AUTOMATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
        [[ "$AUTOMATION_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
        [[ "$AUTOMATION_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
        cd "$RUNNER_TEMP/immutable-automation-restored"
        binary=xtask
        if [[ "$RUNNER_OS" == Windows ]]; then binary=xtask.exe; fi
        shopt -s nullglob dotglob
        members=(*)
        [[ ${#members[@]} == 3 ]] || exit 1
        for member in "$binary" source.txt SHA256SUMS; do
          [[ -f "$member" && ! -L "$member" ]] || exit 1
        done
        [[ "$(wc -c < source.txt | tr -d '[:space:]')" == 41 ]] || exit 1
        IFS= read -r source_line < source.txt || exit 1
        [[ "$source_line" == "$AUTOMATION_SOURCE_SHA" ]] || exit 1
        checksum_pattern='^([0-9a-f]{64}) ([ *])([a-zA-Z0-9.]+)$'
        [[ "$(wc -c < SHA256SUMS | tr -d '[:space:]')" -le 256 ]] || exit 1
        seen_binary=0
        seen_source=0
        while IFS= read -r line || [[ -n "$line" ]]; do
          [[ "$line" =~ $checksum_pattern ]] || exit 1
          digest="${BASH_REMATCH[1]}"
          name="${BASH_REMATCH[3]}"
          case "$name" in
            "$binary")
              [[ "$seen_binary" == 0 ]] || exit 1
              seen_binary=1
              [[ "$digest" == "$AUTOMATION_BINARY_SHA256" ]] || exit 1
              ;;
            source.txt) [[ "$seen_source" == 0 ]] || exit 1; seen_source=1 ;;
            *) exit 1 ;;
          esac
        done < SHA256SUMS
        [[ "$seen_binary" == 1 && "$seen_source" == 1 ]] || exit 1
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum --strict -c SHA256SUMS
        else
          shasum -a 256 -c SHA256SUMS
        fi
        test -s "$binary" || exit 1
        chmod +x "$binary"
    - name: Audit PR authority before checkout
      shell: bash
      env:
        INPUT_ORIGINAL_EVENT_NAME: ${{ inputs.original_event_name }}
        INPUT_DEPOT_SELECTED: ${{ inputs.depot_selected }}
        INPUT_ALLOW_NATIVE_GITHUB_CACHE: ${{ inputs.allow_native_github_cache }}
        INPUT_ALLOW_DEPOT_REMOTE_CACHE: ${{ inputs.allow_depot_remote_cache }}
      run: |
        set -euo pipefail
        binary=xtask
        if [[ "$RUNNER_OS" == Windows ]]; then binary=xtask.exe; fi
        "$RUNNER_TEMP/immutable-automation-restored/$binary" ci-ops pr-authority-audit
