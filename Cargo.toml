[workspace]
members = [
    "mesh/crates/mesh-llm",
    "mesh/crates/mesh-llm-analytics",
    "mesh/crates/mesh-llm-cli",
    "mesh/crates/mesh-llm-commands",
    "mesh/crates/mesh-llm-config",
    "mesh/crates/mesh-llm-payments",
    "mesh/crates/mesh-llm-wallet",
    "mesh/crates/mesh-llm-events",
    "mesh/crates/mesh-llm-build-info",
    "mesh/crates/mesh-llm-host-runtime",
    "mesh/crates/mesh-llm-skippy-adapter",
    "mesh/crates/mesh-llm-control-api",
    "mesh/crates/mesh-llm-log-store",
    "mesh/crates/mesh-llm-membership",
    "mesh/crates/mesh-llm-identity",
    "mesh/crates/mesh-llm-protocol",
    "mesh/crates/mesh-llm-release-footer",
    "mesh/crates/mesh-llm-routing",
    "mesh/crates/mesh-llm-runtime-event-contracts",
    "mesh/crates/mesh-llm-sdk",
    "mesh/crates/mesh-llm-system",
    "mesh/crates/mesh-llm-tui",
    "mesh/crates/mesh-llm-types",
    "mesh/crates/mesh-llm-console-server",
    "mesh/crates/mesh-llm-embedded-runtime",
    "mesh/crates/mesh-llm-ui",
    "mesh/crates/mesh-llm-plugin",
    "mesh/crates/mesh-llm-skills",
    "mesh/crates/mesh-llm-plugin-manager",
    "mesh/crates/mesh-native-serving-plugin-api",
    "mesh/crates/mesh-native-serving-plugin-host",
    "mesh/crates/mesh-client",
    "mesh/crates/mesh-llm-transport",
    "mesh/crates/mesh-llm-api-client",
    "mesh/crates/mesh-llm-api-server",
    "mesh/crates/mesh-llm-node",
    "mesh/crates/mesh-llm-ffi",
    "mesh/crates/mesh-llm-nodejs",
    "mesh/crates/mesh-llm-test-harness",
    "mesh/crates/mesh-mixture-of-agents",
    "mesh/crates/mesh-llm-moa-plugin",
]
default-members = [
    "mesh/crates/mesh-llm",
    "mesh/crates/mesh-llm-plugin",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.80.0"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1"
blake3 = "1"
crossbeam-queue = "0.3"
clap = { version = "4", features = ["derive"] }
mesh-llm-analytics = { path = "mesh/crates/mesh-llm-analytics", version = "0.80.0" }
mesh-llm-build-info = { path = "mesh/crates/mesh-llm-build-info", version = "0.80.0" }
mesh-llm-release-footer = { path = "mesh/crates/mesh-llm-release-footer", version = "0.80.0" }
mesh-llm-skills = { path = "mesh/crates/mesh-llm-skills", version = "0.80.0" }
# Skippy is an external project. `.deps/skippy` is a checkout of it; see scripts/skippy-source.sh.
hf_hub = { package = "skippy-hf-hub", path = ".deps/skippy/crates/skippy-hf-hub", version = "0.80.0", default-features = false }
skippy-api = { path = ".deps/skippy/crates/skippy-api", version = "0.80.0" }
skippy-cache = { path = ".deps/skippy/crates/skippy-cache", version = "0.80.0" }
skippy-commands = { path = ".deps/skippy/crates/skippy-commands", version = "0.80.0" }
skippy-config = { path = ".deps/skippy/crates/skippy-config", version = "0.80.0" }
skippy-coordinator = { path = ".deps/skippy/crates/skippy-coordinator", version = "0.80.0" }
skippy-events = { path = ".deps/skippy/crates/skippy-events", version = "0.80.0" }
skippy-ffi = { path = ".deps/skippy/crates/skippy-ffi", version = "0.80.0", default-features = false }
skippy-gpu-bench = { path = ".deps/skippy/crates/skippy-gpu-bench", version = "0.80.0" }
skippy-guardrails = { path = ".deps/skippy/crates/skippy-guardrails", version = "0.80.0" }
skippy-hardware-profile = { path = ".deps/skippy/crates/skippy-hardware-profile", version = "0.80.0" }
skippy-inference-api = { path = ".deps/skippy/crates/skippy-inference-api", version = "0.80.0" }
skippy-model = { path = ".deps/skippy/crates/skippy-model", version = "0.80.0" }
skippy-model-artifact = { path = ".deps/skippy/crates/skippy-model-artifact", version = "0.80.0" }
skippy-model-hf = { path = ".deps/skippy/crates/skippy-model-hf", version = "0.80.0" }
skippy-model-ref = { path = ".deps/skippy/crates/skippy-model-ref", version = "0.80.0" }
skippy-model-resolver = { path = ".deps/skippy/crates/skippy-model-resolver", version = "0.80.0" }
skippy-native-runtime = { path = ".deps/skippy/crates/skippy-native-runtime", version = "0.80.0" }
skippy-package-format = { path = ".deps/skippy/crates/skippy-package-format", version = "0.80.0" }
skippy-protocol = { path = ".deps/skippy/crates/skippy-protocol", version = "0.80.0" }
skippy-runtime = { path = ".deps/skippy/crates/skippy-runtime", version = "0.80.0" }
skippy-runtime-install = { path = ".deps/skippy/crates/skippy-runtime-install", version = "0.80.0" }
skippy-serving = { path = ".deps/skippy/crates/skippy-serving", version = "0.80.0" }
skippy-tokenizer = { path = ".deps/skippy/crates/skippy-tokenizer", version = "0.80.0" }
skippy-topology = { path = ".deps/skippy/crates/skippy-topology", version = "0.80.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }

tokio-tungstenite = "0.29"
[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

# Do not remove this section: direct GGUF debug startup spends most of its time
# hashing the source model via sha2 before native skippy model open, so keep
# that crate near release speed in dev builds.
[profile.dev.package.sha2]
opt-level = 3

# Tightened release profile for shipped binaries.
#
# - `lto = "thin"`: parallel link-time optimization across the crate graph.
#   Roughly 80% of fat-LTO's binary-size and perf benefit at ~30% of the
#   link cost. Fat LTO would shave a few more MB but pushes release link
#   from ~30 s to several minutes on this codebase.
# - `codegen-units = 1`: pairs with thin LTO so the optimizer can inline
#   across the whole crate without re-link boundaries. Trades parallelism
#   in codegen for output quality; cargo still parallelises the dep graph.
# - `strip = "debuginfo"`: drops DWARF from the Mach-O / ELF output. We
#   keep function symbols so backtraces from production nodes remain
#   readable (`nm`, `addr2line` on the symbol table still works). DWARF
#   on macOS arm64 alone is several MB of dead weight in the binary.
# - panic stays at the default ("unwind"). Plugin / MCP error recovery
#   relies on unwinding; the AGENTS.md notes explicitly forbid switching
#   to `abort`.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
