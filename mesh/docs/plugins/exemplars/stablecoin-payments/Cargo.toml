[workspace]
members = ["crates/wallet-contract", "crates/pay-stablecoin", "crates/wallet-ousd-tempo", "crates/wallet-usdt-ethereum", "crates/demo-fixture"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "8d03dea4555cbb1ac7cdfce7b9fe1a284f55fb76" }
rmcp = { version = "3", features = ["server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
wallet-contract = { path = "crates/wallet-contract", package = "mesh-llm-stablecoin-wallet" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
