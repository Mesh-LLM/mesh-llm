[package]
name = "wallet-ousd-tempo"
description = "Non-custodial OUSD wallet provider for Tempo mainnet and Mesh stablecoin payments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
alloy = { version = "=2.1.1", features = ["signer-keystore"] }
tempo-alloy = { git = "https://github.com/tempoxyz/tempo", tag = "tempo-alloy@1.10.1" }
anyhow.workspace = true
clap.workspace = true
fs2 = "0.4"
hex.workspace = true
mesh-llm-plugin.workspace = true
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
wallet-contract.workspace = true
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
tempfile.workspace = true
