[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mesh-llm"
version = "0.76.1"
description = "Python SDK for private MeshLLM inference and embedded nodes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "MeshLLM contributors" }]
keywords = ["llm", "inference", "agents", "mesh", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Documentation = "https://mesh-llm.github.io/docs/pages/sdk-python/"
Repository = "https://github.com/Mesh-LLM/mesh-llm"
Issues = "https://github.com/Mesh-LLM/mesh-llm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/meshllm"]
artifacts = [
  "src/meshllm/_generated/libuniffi.dylib",
  "src/meshllm/_generated/libuniffi.so",
  "src/meshllm/_generated/uniffi.dll",
]
exclude = ["src/meshllm/_generated/.gitignore"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/meshllm", "scripts", "README.md", "pyproject.toml", "hatch_build.py"]
exclude = ["src/meshllm/_generated/.gitignore"]

[tool.pyright]
pythonVersion = "3.10"
include = ["src", "tests"]
