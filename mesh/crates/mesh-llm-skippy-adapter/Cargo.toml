[package]
name = "mesh-llm-skippy-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mesh configuration and preparation adapter for Skippy"
repository = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[features]
default = []
# Host tests must not write advisory hashes to the developer's real cache.
test-support = []
dynamic-native-runtime = ["skippy-api/dynamic-native-runtime", "skippy-runtime/dynamic-native-runtime", "skippy-serving/dynamic-native-runtime"]

[lints]
workspace = true

[dependencies]
hf_hub = { workspace = true, features = ["blocking"] }
mesh-llm-config = { path = "../mesh-llm-config", version = "0.80.0" }
mesh-llm-events = { path = "../mesh-llm-events", version = "0.80.0" }
skippy-config = { workspace = true }
skippy-api = { workspace = true }
skippy-model-artifact = { workspace = true }
skippy-model-hf = { workspace = true }
skippy-inference-api = { workspace = true }
skippy-package-format = { workspace = true }
skippy-protocol = { workspace = true }
skippy-runtime = { workspace = true }
skippy-serving = { workspace = true }
anyhow = "1"
dirs = "6.0.0"
serde_json = "1"
sha2.workspace = true
toml = "1.1"

[dev-dependencies]
skippy-model = { workspace = true }
tempfile = "3"
