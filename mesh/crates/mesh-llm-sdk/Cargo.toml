[package]
name = "mesh-llm-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust SDK facade for Mesh LLM clients and embedded serving"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"
keywords = ["llm", "mesh", "sdk", "inference"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["serving"]
console = ["dep:mesh-llm-console-server", "mesh-llm-embedded-runtime?/web-ui"]
serving = [
    "dep:anyhow",
    "dep:mesh-llm-embedded-runtime",
    "dep:skippy-runtime-install",
    "mesh-llm-embedded-runtime/dynamic-native-runtime",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:mesh-llm-host-runtime",
]
# Opt-in paid inference on top of the serving path: ledger, gates and the
# `wallet.v1` plugin adapter. Off by default: an embedding consumer (e.g. Buzz)
# that enables `serving` alone stays payment-free and does not compile the
# rusqlite/lightning-invoice/bitcoin stack. Enabling it still links no wallet
# SDK. A host with
# `payments` needs an external `wallet.v1` plugin configured to actually pay.
payments = ["serving", "mesh-llm-embedded-runtime/payments", "dep:mesh-llm-payments"]
# Node identity keys on disk (default key path, keystore read/write).
identity = ["dep:mesh-llm-identity"]
# Install plugin archives (e.g. a wallet) into the local plugin store.
plugin-install = ["dep:mesh-llm-plugin-manager"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
mesh-llm-console-server = { path = "../mesh-llm-console-server", version = "0.78.0", optional = true }
mesh-llm-host-runtime = { path = "../mesh-llm-host-runtime", version = "0.78.0", default-features = false, optional = true }
mesh-llm-identity = { path = "../mesh-llm-identity", version = "0.78.0", features = ["host-io"], optional = true }
mesh-llm-payments = { path = "../mesh-llm-payments", version = "0.78.0", optional = true }
mesh-llm-plugin-manager = { path = "../mesh-llm-plugin-manager", version = "0.78.0", optional = true }
mesh-llm-embedded-runtime = { path = "../mesh-llm-embedded-runtime", version = "0.78.0", optional = true }
skippy-runtime-install = { path = "../../../skippy/crates/skippy-runtime-install", version = "0.78.0", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
