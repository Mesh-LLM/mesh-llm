[package]
name = "mesh-llm"
description = "MeshLLM executable and command-dispatch assembly"
version.workspace = true
edition = "2024"

[features]
default = ["web-ui", "dynamic-native-runtime"]
# Embed the React web console into the binary. Default on so the shipped
# binary keeps shipping the console; turn off (`--no-default-features`)
# for a lean variant that drops the embedded UI assets.
web-ui = ["mesh-llm-host-runtime/web-ui"]
dynamic-native-runtime = ["mesh-llm-host-runtime/dynamic-native-runtime"]

[lints]
workspace = true

[dependencies]
skippy-commands = { path = "../../../skippy/crates/skippy-commands", version = "0.78.0" }
anyhow.workspace = true
clap.workspace = true
mesh-llm-cli = { path = "../mesh-llm-cli", version = "0.78.0" }
mesh-llm-commands = { path = "../mesh-llm-commands", version = "0.78.0" }
mesh-llm-events = { path = "../mesh-llm-events", version = "0.78.0" }
mesh-llm-host-runtime = { path = "../mesh-llm-host-runtime", version = "0.78.0", default-features = false }
mesh-llm-plugin = { path = "../mesh-llm-plugin", version = "0.78.0" }
mesh-llm-plugin-manager = { path = "../mesh-llm-plugin-manager", version = "0.78.0" }
mesh-llm-system = { path = "../mesh-llm-system", version = "0.78.0", features = ["skippy-devices"] }
mesh-llm-tui = { path = "../mesh-llm-tui", version = "0.78.0" }
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[dev-dependencies]
axum = "0.8"
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
serial_test = "4"
mesh-client = { package = "mesh-llm-client", path = "../mesh-client" }
serde_json = "1"
tempfile = "3"
