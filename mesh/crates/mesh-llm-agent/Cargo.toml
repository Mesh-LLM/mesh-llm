[package]
name = "mesh-llm-agent"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Minimal one-shot agent for Mesh LLM: goose's unrolled loop with a shell tool and skills"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
dirs = "6"
goose-agent = "=0.1.0-alpha.12"
goose-provider-types = { version = "=0.1.0-alpha.12", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3", default-features = false }
serde_json.workspace = true
tokio = { version = "1", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
