[package]
name = "mesh-llm-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mesh byte-stream interfaces and TCP/QUIC relay"
repository = "https://github.com/Mesh-LLM/mesh-llm"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
iroh = { version = "1.0.3", default-features = false, features = ["metrics", "fast-apple-datapath", "portmapper", "tls-aws-lc-rs"] }
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros"] }
tracing = "0.1"
