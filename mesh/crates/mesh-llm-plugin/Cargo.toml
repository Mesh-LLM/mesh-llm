[package]
name = "mesh-llm-plugin"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Plugin protocol and runtime primitives for mesh-llm"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"

[lints]
workspace = true

[dependencies]
mesh-llm-config = { path = "../mesh-llm-config", version = "0.78.0" }
anyhow = "1"
async-trait = "0.1"
prost = "0.14"
rmcp = { version = "3", features = ["server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
mesh-llm-identity = { path = "../mesh-llm-identity", version = "0.78.0" }
hex = "0.4"
sha2 = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "openai-exchange-observer"
path = "examples/openai-exchange-observer.rs"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
