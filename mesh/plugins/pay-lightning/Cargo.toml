[package]
name = "mesh-pay-lightning"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Out-of-process Lightning admission and settlement spike"

[lints]
workspace = true

[dependencies]
anyhow = "1"
prost = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
async-trait = "0.1"
mesh-llm-plugin = { path = "../../crates/mesh-llm-plugin" }
mesh-llm-payments = { path = "lib/mesh-llm-payments" }
mesh-llm-payments-types = { path = "lib/mesh-llm-payments-types" }
mesh-llm-wallet = { path = "lib/mesh-llm-wallet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

tempfile = "3"

[dev-dependencies]
bitcoin = { version = "0.32", features = ["secp-recovery"] }
lightning-invoice = { version = "0.35.0-rc1", features = ["std"] }
